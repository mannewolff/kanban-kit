services:
  postgres:
    image: postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manban}
      POSTGRES_USER: ${POSTGRES_USER:-manban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manban}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manban} -d ${POSTGRES_DB:-manban}"]
      interval: 5s
      timeout: 5s
      retries: 10

  objektspeicher:
    # SeaweedFS statt MinIO (Plan #1222, E1): Das MinIO-Abbild auf quay.io ist anonym nicht
    # mehr beziehbar — eine Neuinstallation nach docs/betrieb.md kam ohne Konto und Anmeldung an
    # einer Registry nicht mehr hoch. `chrislusf/seaweedfs` liefert sein Manifest anonym aus, ist
    # Apache-2.0 und laeuft als ein Prozess. Der Tag steht fest, aus demselben Grund wie zuvor:
    # Ein beweglicher `latest` ist genau das, was hier ohne Vorwarnung verschwunden ist.
    # Der bisherige Dienst lebt als Rueckweg in docker-compose.altspeicher.yml weiter (E13).
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    # Eigener Einstiegspunkt statt `command:`, weil neben dem Speicher selbst der Anhang-Bucket
    # angelegt werden muss (E16): Die Identitaet der Anwendung traegt nur Read, Write und List,
    # `PutBucket` verlangt in SeaweedFS das Recht Admin — Wurzelrechte fuer einen einmaligen
    # Anlegeschritt waeren eine Verletzung von Prioritaet 1. `weed shell` spricht mit dem Master
    # und geht an der S3-Rechtepruefung vorbei.
    # Der Anlegeschritt laeuft im Hintergrund und der Speicher per `exec` im Vordergrund: So
    # bleibt `weed` PID 1 und bekommt das SIGTERM eines `docker compose down` selbst.
    # Die Schleife prueft das Ergebnis statt den Rueckgabewert und deckt damit beide Faelle ab —
    # erster Start (Bucket fehlt) und Neustart auf vorhandenem Volume (Bucket ist da). Die
    # Ausgabe des Anlegeschritts bleibt im Protokoll: Kommt der Bucket nicht zustande, steht der
    # Grund dort, und der Healthcheck unten schlaegt an, statt dass die Anwendung an einem
    # fehlenden Bucket scheitert.
    entrypoint:
      - sh
      - -c
      - |
        (
          until echo 's3.bucket.list' | weed shell -master=localhost:9333 2>/dev/null \
              | grep -qw '${MANBAN_STORAGE_BUCKET:-manban}'; do
            echo 's3.bucket.create -name ${MANBAN_STORAGE_BUCKET:-manban}' \
              | weed shell -master=localhost:9333 2>&1
            sleep 2
          done
          touch /tmp/bucket-bereit
        ) &
        exec weed server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    configs:
      - source: objektspeicher_identitaeten
        target: /etc/seaweedfs/s3.json
    volumes:
      - objektspeicher_data:/data
    # Zwei Bedingungen, nicht eine: Dass der S3-Dienst antwortet, heisst noch nicht, dass der
    # Anhang-Bucket steht. Ohne die zweite koennte manban-api starten, bevor es ihn gibt.
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8333/status > /dev/null && test -f /tmp/bucket-bereit
      interval: 5s
      timeout: 5s
      retries: 20

  manban-api:
    # Das veroeffentlichte Abbild statt `build: .` (Issue #1265, fachliche Quelle #675): Eine
    # Installation nach docs/betrieb.md soll von der leeren Maschine zur laufenden Instanz kommen,
    # ohne dass etwas uebersetzt wird — Node-, Maven- und JDK-Bauzeit stuenden sonst vor dem ersten
    # Blick auf die Anwendung. Wer selbst bauen will (Entwickler, und der Deploy des Projekts),
    # legt docker-compose.bau.yml darueber; dort steht das `build:`.
    # Volle Fassung statt eines beweglichen Tags: Ein `latest` ist genau das, was dieses Vorhaben
    # abschafft. Das Abbild dieser Nummer steht erst mit ihrem Release in der Registry — die
    # Pruefart `eigen` in scripts/bausteine.json haelt den CI-Job deshalb gruen (Issue #1264).
    image: ghcr.io/mannewolff/kanban-kit:2.21.0
    environment:
      MANBAN_BASE_URL: ${MANBAN_BASE_URL:-https://localhost}
      # Dies ist der lokale Entwicklungs-Stack: Der Schalter erlaubt den Start mit den
      # unsicheren Defaults unten — die Anwendung warnt dabei. Das Produktions-Overlay
      # (docker-compose.prod.yml) setzt ihn fest auf false und erbt diesen Wert nicht.
      MANBAN_DEV_MODE: ${MANBAN_DEV_MODE:-true}
      # Secret zum Signieren der Session-Tokens. Der Default unten gilt nur im
      # Entwicklungsbetrieb (MANBAN_DEV_MODE=true) — die Anwendung warnt dann beim Start.
      # In Produktion verweigert sie ihn; dort zwingend über die .env durch einen
      # zufälligen 32+-Byte-Wert ersetzen.
      MANBAN_SESSION_SECRET: ${MANBAN_SESSION_SECRET:-dev-only-insecure-secret-change-me}
      # Session-Cookie nur über HTTPS ausliefern. Hinter TLS (Prod) true; für reines HTTP-Lokal ggf. false.
      MANBAN_COOKIE_SECURE: ${MANBAN_COOKIE_SECURE:-true}
      # Einmal-Token für den ersten Plattform-Admin (leer = deaktiviert; greift nur ohne Admin).
      MANBAN_BOOTSTRAP_ADMIN_TOKEN: ${MANBAN_BOOTSTRAP_ADMIN_TOKEN:-}
      MANBAN_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-manban}
      MANBAN_DB_USER: ${POSTGRES_USER:-manban}
      MANBAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-manban}
      # Verbindungspool und Server-Threads (Issue #998); Rechnung in application.yml.
      MANBAN_DB_POOL_MAX: ${MANBAN_DB_POOL_MAX:-20}
      MANBAN_DB_POOL_MIN_IDLE: ${MANBAN_DB_POOL_MIN_IDLE:-5}
      MANBAN_DB_CONNECTION_TIMEOUT_MS: ${MANBAN_DB_CONNECTION_TIMEOUT_MS:-5000}
      MANBAN_SERVER_THREADS_MAX: ${MANBAN_SERVER_THREADS_MAX:-600}
      # Durchsatzbremse fuer Zugriffstoken (Issue #1002).
      MANBAN_THROUGHPUT_ENABLED: ${MANBAN_THROUGHPUT_ENABLED:-true}
      MANBAN_THROUGHPUT_PER_MINUTE: ${MANBAN_THROUGHPUT_PER_MINUTE:-60}
      MANBAN_THROUGHPUT_CONCURRENT: ${MANBAN_THROUGHPUT_CONCURRENT:-10}
      MANBAN_THROUGHPUT_MAX_TRACKED_PERSONS: ${MANBAN_THROUGHPUT_MAX_TRACKED_PERSONS:-100000}
      MANBAN_MAIL_ENABLED: ${MANBAN_MAIL_ENABLED:-false}
      MANBAN_MAIL_FROM: ${MANBAN_MAIL_FROM:-no-reply@manban.local}
      MANBAN_SMTP_HOST: ${MANBAN_SMTP_HOST:-}
      MANBAN_SMTP_PORT: ${MANBAN_SMTP_PORT:-1025}
      MANBAN_SMTP_USER: ${MANBAN_SMTP_USER:-}
      MANBAN_SMTP_PASSWORD: ${MANBAN_SMTP_PASSWORD:-}
      MANBAN_SMTP_AUTH: ${MANBAN_SMTP_AUTH:-true}
      MANBAN_SMTP_STARTTLS: ${MANBAN_SMTP_STARTTLS:-true}
      MANBAN_STORAGE_ENDPOINT: http://objektspeicher:8333
      MANBAN_STORAGE_ACCESS_KEY: ${OBJEKTSPEICHER_ROOT_USER:-manban}
      MANBAN_STORAGE_SECRET_KEY: ${OBJEKTSPEICHER_ROOT_PASSWORD:-manban-objektspeicher}
      # Auch der Bucketname steht hier, obwohl sein Standardwert genuegte: Er ist in
      # docs/betrieb.md dokumentiert, und eine dokumentierte Variable ohne Eintrag im
      # environment-Block erreicht den Container nicht — wer sie in der .env setzt, erzielte
      # keine Wirkung. Derselbe Wert speist die Identitaetsdatei und den Anlegeschritt des
      # Speicherdienstes, damit alle drei Stellen denselben Bucket meinen.
      MANBAN_STORAGE_BUCKET: ${MANBAN_STORAGE_BUCKET:-manban}
      # Aufraeum- und Zustell-Automatiken. Sie haengen hier, weil eine Variable, die im
      # environment-Block fehlt, den Container gar nicht erreicht — wer sie nach docs/betrieb.md
      # in der .env abschaltet, erzielte sonst keine Wirkung, ohne dass etwas anschlaegt.
      # Jede mit Default: @ConditionalOnProperty(havingValue = "true") liest einen Leerstring als
      # "nicht true", die Jobs fielen bei der Form ${NAME:-} also stillschweigend weg.
      MANBAN_CLEANUP_ENABLED: ${MANBAN_CLEANUP_ENABLED:-true}
      MANBAN_DONE_RETENTION_DAYS: ${MANBAN_DONE_RETENTION_DAYS:-30}
      MANBAN_OUTBOX_ENABLED: ${MANBAN_OUTBOX_ENABLED:-true}
      MANBAN_OUTBOX_POLL_INTERVAL_MS: ${MANBAN_OUTBOX_POLL_INTERVAL_MS:-5000}
      MANBAN_OUTBOX_MAX_ATTEMPTS: ${MANBAN_OUTBOX_MAX_ATTEMPTS:-8}
      MANBAN_OUTBOX_RETENTION_DAYS: ${MANBAN_OUTBOX_RETENTION_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      objektspeicher:
        condition: service_healthy

  caddy:
    image: caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    ports:
      - "80:80"
      - "443:443"
    environment:
      MANBAN_DOMAIN: ${MANBAN_DOMAIN:-localhost}
      MANBAN_ACME_EMAIL: ${MANBAN_ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - manban-api

volumes:
  postgres_data:
  objektspeicher_data:
  caddy_data:
  caddy_config:

# Die S3-Identitaeten des Speichers als `configs`-Eintrag mit `content:` (Plan #1222, E17):
# Compose interpoliert den Inhalt, eine eingehaengte Repo-Datei dagegen nicht — die Zugangsdaten
# waeren dann eingecheckt. Das setzt Docker Compose >= 2.23 voraus (siehe docs/betrieb.md).
# Die Identitaet traegt ausschliesslich Read, Write und List auf den Anhang-Bucket (E16); der
# Bucket selbst entsteht im Anlegeschritt des Dienstes, nicht durch die Anwendung.
configs:
  objektspeicher_identitaeten:
    content: |
      {
        "identities": [
          {
            "name": "manban-anwendung",
            "credentials": [
              {
                "accessKey": "${OBJEKTSPEICHER_ROOT_USER:-manban}",
                "secretKey": "${OBJEKTSPEICHER_ROOT_PASSWORD:-manban-objektspeicher}"
              }
            ],
            "actions": [
              "Read:${MANBAN_STORAGE_BUCKET:-manban}",
              "Write:${MANBAN_STORAGE_BUCKET:-manban}",
              "List:${MANBAN_STORAGE_BUCKET:-manban}"
            ]
          }
        ]
      }
