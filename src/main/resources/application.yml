spring:
  application:
    name: manban

  datasource:
    url: ${MANBAN_DB_URL:jdbc:postgresql://localhost:5432/manban}
    username: ${MANBAN_DB_USER:manban}
    password: ${MANBAN_DB_PASSWORD:manban}
    # Verbindungspool (Issue #998, Plan #995 E15) — begründete Startwerte, bis der Lastnachweis
    # (perf/, Issue #1006) sie belegt oder korrigiert. Die Rechnung:
    #   Lastprofil: 50 Personen x 60 Befehle/min = 50 Befehle/s über die Compat-API, dazu
    #   10 Sitzungen der Weboberfläche. In der Spitze sind 50 x 10 = 500 Befehle gleichzeitig
    #   unterwegs.
    #   Ein Befehl hält eine Verbindung für wenige kurze Anweisungen, grob 10-20 ms. Im Mittel sind
    #   damit 50/s x 0,02 s = 1 Verbindung belegt; die Spitze von 500 gleichzeitigen Befehlen
    #   arbeiten 20 Verbindungen in 500 / 20 x 20 ms = 0,5 s ab — ein Zehntel der zugesagten
    #   5 Sekunden im schlechtesten Fall.
    #   Mehr Verbindungen beschleunigen nicht: Die Datenbank arbeitet je CPU-Kern nur eine Anweisung
    #   zugleich ab, der Rest wartet dann dort statt hier. 20 lässt einer Postgres-Vorgabe von
    #   max_connections = 100 reichlich Luft.
    #   minimum-idle 5: genug für die Grundlast, der Rest entsteht bei Bedarf und verfällt wieder.
    #   connection-timeout 5 s: Wer länger auf eine Verbindung wartet, hat die Antwortzusage schon
    #   verfehlt; die Vorgabe von 30 s hielte den Aufruf nur weiter fest.
    hikari:
      maximum-pool-size: ${MANBAN_DB_POOL_MAX:20}
      minimum-idle: ${MANBAN_DB_POOL_MIN_IDLE:5}
      connection-timeout: ${MANBAN_DB_CONNECTION_TIMEOUT_MS:5000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # SMTP-Versand (aktiv nur bei manban.mail.enabled=true). Default 587/STARTTLS mit Auth;
  # für 465/SSL bzw. lokale Mailcatcher lassen sich Auth/STARTTLS per Env abschalten.
  mail:
    host: ${MANBAN_SMTP_HOST:localhost}
    port: ${MANBAN_SMTP_PORT:1025}
    username: ${MANBAN_SMTP_USER:}
    password: ${MANBAN_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${MANBAN_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MANBAN_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${MANBAN_SMTP_STARTTLS:true}
      # Versand läuft synchron im Request — harte Timeouts statt hängender Registrierungen.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  forward-headers-strategy: framework  # hinter Caddy (Reverse-Proxy) korrekte Scheme/Host-Auflösung
  # Bearbeiter-Threads (Issue #998, Plan #995 E15) — Startwert, Rechnung wie beim Pool oben:
  # In der Spitze 500 Befehle der Compat-API plus 10 Sitzungen der Weboberfläche gleichzeitig. Mit
  # der Tomcat-Vorgabe von 200 warteten 310 davon ohne Thread, und die Weboberfläche stünde hinter
  # Befehlen an, die ihrerseits nur auf eine Datenbankverbindung warten. 600 gibt jedem Aufruf der
  # Spitze einen Thread und lässt rund 20 Prozent Reserve für Abweisungen der Durchsatzbremse, die
  # schnell beantwortet werden müssen, um ihren Zweck zu erfüllen.
  tomcat:
    threads:
      max: ${MANBAN_SERVER_THREADS_MAX:600}

manban:
  # Ausdrücklicher Entwicklungs-/Testbetrieb. Ohne diesen Schalter gilt jeder Start als
  # Produktivbetrieb: Die Anwendung verweigert dann den Start, wenn Sitzungs-Cookies mit dem
  # mitgelieferten Standardschlüssel signiert würden (Issue #890).
  dev-mode: ${MANBAN_DEV_MODE:false}
  auth:
    base-url: ${MANBAN_BASE_URL:http://localhost:8080}
    verification-ttl: PT24H
    session-secret: ${MANBAN_SESSION_SECRET:dev-only-insecure-secret-change-me}
    session-ttl: P7D
    cookie-secure: ${MANBAN_COOKIE_SECURE:true}
    reset-ttl: PT1H
  mail:
    enabled: ${MANBAN_MAIL_ENABLED:false}
    from: ${MANBAN_MAIL_FROM:no-reply@kanban-kit.local}
    # Sichtbarer Produktname in E-Mail-Betreffs. Interner Codename bleibt "manban" (Property-Ebene),
    # nach außen heißt das Produkt "kanban-kit".
    product-name: ${MANBAN_MAIL_PRODUCT_NAME:kanban-kit}
  project:
    invitation-ttl: P7D
  storage:
    endpoint: ${MANBAN_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MANBAN_MINIO_ACCESS_KEY:manban}
    secret-key: ${MANBAN_MINIO_SECRET_KEY:manban-minio}
    bucket: ${MANBAN_MINIO_BUCKET:manban}
    max-per-card: 20
  # Transaktionale Outbox (Issue #501): Seiteneffekte werden in der Fachtransaktion vorgemerkt und
  # danach von einem Worker zugestellt. Abgeschaltet bleiben Einträge liegen, sie gehen nicht
  # verloren. Aufgeräumt werden nur erledigte Einträge — endgültig gescheiterte bleiben sichtbar.
  outbox:
    enabled: ${MANBAN_OUTBOX_ENABLED:true}
    poll-interval-ms: ${MANBAN_OUTBOX_POLL_INTERVAL_MS:5000}
    batch-size: 50
    max-attempts: ${MANBAN_OUTBOX_MAX_ATTEMPTS:8}
    retry-base-delay: PT10S
    retry-max-delay: PT1H
    completed-retention-days: ${MANBAN_OUTBOX_RETENTION_DAYS:7}
  # Nachtlauf-Auswertung (Issue #722): Ringpuffer je Projekt. Der aelteste Lauf nach started_at
  # wird verdraengt, sobald die Grenze ueberschritten ist.
  # Verwaiste Arbeitspakete (Lauf verdraengt, Issue #964) haben eine eigene Grenze (Issue #966);
  # Pakete eines aufbewahrten Laufs zaehlen nicht mit.
  nightrun:
    max-per-project: 190
    max-items-per-project: 2000
    # Eigenes Grenzenpaar je Gattung (Issue #1011): Interaktive Sitzungen sind haeufiger als
    # Naechte und raeumten unter einer gemeinsamen Grenze die Nachtlauf-Auswertung aus.
    max-interactive-per-project: 400
    max-interactive-items-per-project: 4000
    # Stillefrist (Issue #1091): Ein unfertiger Lauf, der so lange kein Lebenszeichen gibt, gilt
    # als nicht gelungen — sonst bliebe ein abgeschossener Runner fuer immer als "laeuft" stehen.
    stille-frist: PT90M
  cleanup:
    enabled: ${MANBAN_CLEANUP_ENABLED:true}
    done-retention-days: ${MANBAN_DONE_RETENTION_DAYS:30}
    cron: "0 0 * * * *"
  bootstrap:
    # Einmal-Token, um auf einer frischen Instanz den ersten Plattform-Admin zu erzeugen.
    # Leer = deaktiviert. Greift nur, solange kein Admin existiert.
    admin-token: ${MANBAN_BOOTSTRAP_ADMIN_TOKEN:}
  # Zaehlbremse gegen Massenversuche an Anmeldung, Registrierung und Reset-Anforderung
  # (Issue #840). Gezaehlt wird je Herkunft und Vorgang; die Sperre laeuft ab dem ersten
  # tatsaechlich abgewiesenen Versuch und wird durch weitere Versuche nicht verlaengert.
  # trusted-proxy-count ist die Zahl der Proxies VOR der Anwendung: 1 passt zum mitgelieferten
  # Caddy, 0 gilt, wenn die App direkt erreichbar ist. Zu hoch gesetzt liest die Bremse eine vom
  # Client mitgeschickte Adresse — dann waere sie umgehbar.
  ratelimit:
    enabled: ${MANBAN_RATELIMIT_ENABLED:true}
    trusted-proxy-count: ${MANBAN_RATELIMIT_TRUSTED_PROXY_COUNT:1}
    max-tracked-origins: ${MANBAN_RATELIMIT_MAX_TRACKED_ORIGINS:100000}
    login:
      max-attempts: ${MANBAN_RATELIMIT_LOGIN_MAX_ATTEMPTS:10}
      window: ${MANBAN_RATELIMIT_LOGIN_WINDOW:PT15M}
      block-duration: ${MANBAN_RATELIMIT_LOGIN_BLOCK_DURATION:PT15M}
    register:
      max-attempts: ${MANBAN_RATELIMIT_REGISTER_MAX_ATTEMPTS:10}
      window: ${MANBAN_RATELIMIT_REGISTER_WINDOW:PT15M}
      block-duration: ${MANBAN_RATELIMIT_REGISTER_BLOCK_DURATION:PT15M}
    forgot:
      max-attempts: ${MANBAN_RATELIMIT_FORGOT_MAX_ATTEMPTS:10}
      window: ${MANBAN_RATELIMIT_FORGOT_WINDOW:PT15M}
      block-duration: ${MANBAN_RATELIMIT_FORGOT_BLOCK_DURATION:PT15M}
