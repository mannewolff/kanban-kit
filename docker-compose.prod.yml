# Produktions-Overlay: manban hinter dem vorhandenen Traefik des Hostinger-Servers.
#
# Aufruf auf dem Server:
#   docker compose -f docker-compose.yml -f docker-compose.bau.yml -f docker-compose.prod.yml up -d --build
# Das Bau-Overlay muss dabeistehen: Der Basis-Stack zieht seit Issue #1265 das veroeffentlichte
# Abbild, und `--build` allein baut ohne ein `build:` nichts mehr.
#
# Unterschiede zum lokalen Basis-Stack (docker-compose.yml):
#   - manban-api haengt am externen Traefik-Netz "web" und wird ueber Traefik-Labels
#     unter https://kanban.mwolff.org veroeffentlicht (TLS via certresolver "mytlschallenge").
#   - Caddy (lokaler self-signed-Proxy) laeuft NICHT: er ist dem Profil "local-tls"
#     zugeordnet und wird ohne aktives Profil nicht gestartet.
#   - Postgres/Objektspeicher bleiben unveraendert rein intern (keine Host-Ports).
#   - Alle drei Dienste starten nach einem Reboot des Servers von selbst wieder
#     (restart: unless-stopped, siehe unten).
services:
  # Neustart-Regel nur im Overlay, nicht im Basis-Compose: Die Luecke besteht in
  # Produktion — ohne Eintrag startet Docker nach einem Neustart des Servers keinen
  # Container wieder, und kanban.mwolff.org bleibt aus, bis jemand von Hand
  # `docker compose up -d` aufruft. Auf einem Entwicklerrechner soll der lokale Stack
  # dagegen nicht bei jedem Start von Docker Desktop mit hochkommen.
  # `unless-stopped` statt `always`, damit ein bewusstes `docker compose stop` auch
  # ueber einen Reboot hinweg haelt.
  # Setzt voraus, dass der Docker-Dienst selbst beim Booten startet
  # (`systemctl is-enabled docker` → enabled, siehe deployment-spec.md).
  postgres:
    restart: unless-stopped

  objektspeicher:
    restart: unless-stopped

  manban-api:
    restart: unless-stopped
    environment:
      # Fester Wert, bewusst KEINE ${...}-Interpolation: Das Overlay erbt den
      # environment:-Block des Basis-Compose (dort MANBAN_DEV_MODE=true) und ueberschreibt
      # nur die hier genannten Schluessel. Ohne eigenen Eintrag reiste "true" nach
      # Produktion. Kaeme der Wert aus der .env, genuegte ein MANBAN_DEV_MODE=true fuer
      # den lokalen Betrieb, um die Ausnahme auch im Prod-Lauf stillschweigend
      # einzuschalten — dieselbe Luecke mit einem Zwischenschritt.
      MANBAN_DEV_MODE: "false"
      # Prod-kritische Werte MUESSEN aus der Server-.env kommen (kein unsicherer Default).
      MANBAN_SESSION_SECRET: ${MANBAN_SESSION_SECRET:?MANBAN_SESSION_SECRET muss in .env gesetzt sein}
      MANBAN_BASE_URL: ${MANBAN_BASE_URL:?MANBAN_BASE_URL muss in .env gesetzt sein (z. B. https://kanban.mwolff.org)}
      # Auch die Zugangsdaten des Objektspeichers MUESSEN aus der Server-.env kommen (Issue #1227):
      # Das Basis-Compose reicht sie mit `:-`-Vorgabe durch, im Container ist die Variable also nie
      # leer — ein Betreiber, der seine .env nicht anfasst, betriebe seine Anhaenge mit den
      # oeffentlich bekannten Standardzugangsdaten aus diesem Repository, ohne etwas zu merken.
      # Mit `:?` scheitert schon `docker compose config`, also bevor die Anwendung startet. Die
      # Startpruefung ObjectStorageStartupCheck faengt denselben Fall in der Anwendung ab; hier
      # steht die frueheste Stelle, an der er auffallen kann.
      MANBAN_STORAGE_ACCESS_KEY: ${OBJEKTSPEICHER_ROOT_USER:?OBJEKTSPEICHER_ROOT_USER muss in .env gesetzt sein}
      MANBAN_STORAGE_SECRET_KEY: ${OBJEKTSPEICHER_ROOT_PASSWORD:?OBJEKTSPEICHER_ROOT_PASSWORD muss in .env gesetzt sein (starker, eigener Wert)}
      # Uebrige Prod-Envs (MANBAN_COOKIE_SECURE, MANBAN_BOOTSTRAP_ADMIN_TOKEN, MANBAN_MAIL_*,
      # DB- und Objektspeicher-Zugang) werden vom Basis-Compose aus der .env gelesen.
    networks:
      - default
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.manban.rule=Host(`kanban.mwolff.org`)
      - traefik.http.routers.manban.tls=true
      - traefik.http.routers.manban.entrypoints=web,websecure
      - traefik.http.routers.manban.tls.certresolver=mytlschallenge
      - traefik.http.services.manban.loadbalancer.server.port=8080
      # Security-Header (analog n8n-Stack): HSTS, MIME-Sniffing- und XSS-Schutz.
      - traefik.http.routers.manban.middlewares=manban-sec
      - traefik.http.middlewares.manban-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.manban-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.manban-sec.headers.stsPreload=true
      - traefik.http.middlewares.manban-sec.headers.forceSTSHeader=true
      - traefik.http.middlewares.manban-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.manban-sec.headers.browserXssFilter=true

  # Lokaler TLS-Proxy — in Produktion nicht gestartet (Profil ohne Aktivierung).
  # In Prod uebernimmt Traefik die TLS-Terminierung.
  caddy:
    profiles:
      - local-tls

networks:
  web:
    external: true
