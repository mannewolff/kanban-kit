# Zugriffsregeln des Postgres-Dienstes, solange die Sicherung zugeschaltet ist
# (docker-compose.backup.yml, Issue #829).
#
# Warum es diese Datei gibt: `pg_basebackup` oeffnet eine Replikationsverbindung, und in
# pg_hba.conf deckt `all` in der Datenbank-Spalte genau die nicht ab — dafuer braucht es eine
# eigene Zeile mit `replication`. Das offizielle Postgres-Abbild schreibt beim Anlegen des Clusters
# nur `host all all all scram-sha-256`; der Sicherungs-Container waere damit abgewiesen, und zwar
# mit einer Meldung, die nach einem falschen Kennwort aussieht.
#
# Die ersten sechs Zeilen sind die Vorgaben des Abbilds fuer oertliche Verbindungen (Healthcheck,
# Wiederherstellung von innen). Die letzten beiden gelten fuer das Docker-Netz: Fachzugriff der
# Anwendung und Replikationszugriff der Sicherung, beide mit Kennwort.
#
# Wirksam wird die Datei ueber `-c hba_file=...` im command-Override des Postgres-Dienstes. Ohne
# das Overlay liest Postgres weiter seine eigene pg_hba.conf im Datenverzeichnis — eine Instanz
# ohne Sicherung aendert ihr Zugriffsverhalten also nicht (E12).

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
