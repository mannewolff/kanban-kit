"355","name":"sortEpics zählt je Karte höchstens einmal"},{"id":"356","name":"sortEpics entscheidet bei Gleichstand über das Anzeige-Kürzel"},{"id":"357","name":"sortEpics entscheidet bei Gleichstand ohne Kürzel über die Titel-Ableitung"},{"id":"358","name":"sortEpics stellt ein abgeschlossenes Vorhaben hinter die unfertigen"},{"id":"359","name":"sortEpics stellt ein leeres Vorhaben ganz ans Ende"},{"id":"360","name":"sortEpics behandelt ein Vorhaben mit Anforderung, aber ohne Karten nicht als leer"},{"id":"361","name":"sortEpics lässt das Eingabe-Array unverändert"},{"id":"362","name":"visibleEpics liefert bei leerem Ausblende-Zustand alle Vorhaben in unveränderter Reihenfolge"},{"id":"363","name":"visibleEpics lässt ein ausgeblendetes Vorhaben weg und behält die Reihenfolge der übrigen"},{"id":"364","name":"visibleEpics ignoriert eine ausgeblendete ID, zu der es kein Vorhaben gibt"},{"id":"365","name":"visibleEpics liefert eine leere Liste, wenn alle Vorhaben ausgeblendet sind"},{"id":"366","name":"visibleEpics lässt das Eingabe-Array unverändert"},{"id":"367","name":"selectableEpics liefert bei leerem Ausblende-Zustand alle Vorhaben in unveränderter Reihenfolge"},{"id":"368","name":"selectableEpics lässt ein ausgeblendetes Vorhaben weg und behält die Reihenfolge der übrigen"},{"id":"369","name":"selectableEpics ignoriert eine ausgeblendete ID, zu der es kein Vorhaben gibt"},{"id":"370","name":"selectableEpics liefert eine leere Liste, wenn alle Vorhaben ausgeblendet sind"},{"id":"371","name":"selectableEpics lässt das Eingabe-Array unverändert"}],"source":"import { describe, expect, it } from 'vitest'\nimport type { Card } from '../api/cards'\nimport type { Epic } from '../api/epics'\nimport type { Label } from '../api/labels'\nimport { aggregateMarks, countKinds, selectableEpics, sortEpics, visibleEpics } from './epicTiles'\n\nfunction karte(number: number, title: string, labels: number[] = []): Card {\n  return {\n    id: number * 10,\n    boardId: 1,\n    columnId: 2,\n    number,\n    title,\n    description: null,\n    excerpt: null,\n    positionInColumn: 0,\n    archived: false,\n    ideaStored: false,\n    movedToDoneAt: null,\n    dependencies: [],\n    type: 'CARD',\n    parentId: null,\n    shortcode: null,\n    assignees: [],\n    dueDate: null,\n    labels,\n    derivedFrom: null,\n  }\n}\n\nfunction vorhaben(overrides: Partial<"+"Epic> & { id: number }): Epic {\n  return {\n    number: overrides.id,\n    title: `Vorhaben ${overrides.id}`,\n    description: null,\n    shortcode: null,\n    done: 0,\n    total: 0,\n    memberNumbers: [],\n    rootNumbers: [],\n    requirementCardNumber: null,\n    ...overrides,\n  }\n}\n\nfunction label(id: number, name: string, countOnEpicTile: boolean): Label {\n  return { id, boardId: 1, name, color: '#0f0', countOnEpicTile }\n}\n\ndescribe('countKinds', () => {\n  it('zählt fachliche Anforderungen, Pläne und Arbeitspakete getrennt', () => {\n    const cards = [\n      karte(1, '[Fachlich] Kachel zeigt Zustände'),\n      karte(2, '[Plan] Weg dorthin'),\n      karte(3, 'Ganz gewöhnliches Arbeitspaket'),\n    ]\n\n    expect(countKinds(vorhaben({ id: 9, memberNumbers: [1, 2, 3] }), cards)).toEqual({\n      requirements: 1,\n      plans: 1,\n      workItems: 1,\n    })\n  })\n\n  /**\n   * Eine eingeplante Idee ist faktisch ein Arbeitspaket (Entscheidung Manne, 2026-08-31); Ideen\n   * im Pool erscheinen ohnehin nicht, sie tragen `ideaStored`.\n   */\n  it('zählt eine [Idee] als Arbeitspaket', () => {\n    const cards = [karte(1, '[Idee] Labels an allen Karten')]\n\n    expect(countKinds(vorhaben({ id: 9, memberNumbers: [1] }), cards)).toEqual({\n      requirements: 0,\n      plans: 0,\n      workItems: 1,\n    })\n  })\n\n  it('zählt ein Präfix mitten im Titel als Arbeitspaket', () => {\n    const cards = [karte(1, 'Nacharbeit zu [Plan] #657')]\n\n    expect(countKinds(vorhaben({ id: 9, memberNumbers: [1] }), cards)).toEqual({\n      requirements: 0,\n      plans: 0,\n      workItems: 1,\n    })\n  })\n\n  it('liefert für ein leeres Vorhaben überall null', () => {\n    expect(countKinds(vorhaben({ id: 9 }), [])).toEqual({\n      requirements: 0,\n      plans: 0,\n      workItems: 0,\n    })\n  })\n\n  /**\n   * Möglich durch den Done-Retention-Job oder eine Ladelücke. Als Arbeitspaket gezählt zeigte die\n   * Kachel eine Karte an, die niemand öffnen kann.\n   */\n  it('ignoriert eine Mitgliedsnummer ohne zugehörige Karte', () => {\n    const cards = [karte(1, '[Plan] Da')]\n\n    expect(countKinds(vorhaben({ id: 9, memberNumbers: [1, 42] }), cards)).toEqual({\n      requirements: 0,\n      plans: 1,\n      workItems: 0,\n    })\n  })\n})\n\ndescribe('aggregateMarks', () => {\n  const labels = [label(70, 'bereit', true), label(71, 'intern', false), label(80, 'stockt', true)]\n\n  it('zählt eine Karte bei jedem ihrer gezählten Labels', () => {\n    const cards = [karte(1, 'A', [70, 80])]\n\n    expect(aggregateMarks(vorhaben({ id: 9, memberNumbers: [1] }), cards, labels)).toEqual([\n      { name: 'bereit', color: '#0f0', count: 1 },\n      { name: 'stockt', color: '#0f0', count: 1 },\n    ])\n  })\n\n  it('lässt ein Label mit countOnEpicTile === false weg', () => {\n    const cards = [karte(1, 'A', [70, 71])]\n\n    const marks = aggregateMarks(vorhaben({ id: 9, memberNumbers: [1] }), cards, labels)\n\n    expect(marks).toEqual([{ name: 'bereit', color: '#0f0', count: 1 }])\n    expect(marks.map((m) => m.name)).not.toContain('intern')\n  })\n\n  it('summiert über mehrere Karten und lässt ungenutzte Labels weg', () => {\n    const cards = [karte(1, 'A', [70]), karte(2, 'B', [70]), karte(3, 'C', [])]\n\n    expect(aggregateMarks(vorhaben({ id: 9, memberNumbers: [1, 2, 3] }), cards, labels)).toEqual([\n      { name: 'bereit', color: '#0f0', count: 2 },\n    ])\n  })\n\n  it('ignoriert eine Mitgliedsnummer ohne zugehörige Karte', () => {\n    const cards = [karte(1, 'A', [70])]\n\n    expect(aggregateMarks(vorhaben({ id: 9, memberNumbers: [1, 42] }), cards, labels)).toEqual([\n      { name: 'bereit', color: '#0f0', count: 1 },\n    ])\n  })\n})\n\ndescribe('sortEpics', () => {\n  const labels = [label(70, 'stockt', true)]\n\n  it('sortiert absteigend nach Karten mit mindestens einer gezählten Marke', () => {\n    const cards = [karte(1, 'A', [70]), karte(2, 'B', [70]), karte(3, 'C', [])]\n    const wenig = vorhaben({ id: 1, memberNumbers: [3], total: 1 })\n    const viel = vorhaben({ id: 2, memberNumbers: [1, 2], total: 2 })\n\n    expect(sortEpics([wenig, viel], cards, labels).map((e) => e.id)).toEqual([2, 1])\n  })\n\n  /** Mehrere Marken an einer Karte zählen die Karte einmal, nicht zweimal. */\n  it('zählt je Karte höchstens einmal', () => {\n    const zweiLabels = [label(70, 'stockt', true), label(80, 'wartet', true)]\n    const cards = [karte(1, 'A', [70, 80]), karte(2, 'B', [70]), karte(3, 'C', [70])]\n    const eineKarte = vorhaben({ id: 1, memberNumbers: [1], total: 1 })\n    const zweiKarten = vorhaben({ id: 2, memberNumbers: [2, 3], total: 2 })\n\n    expect(sortEpics([eineKarte, zweiKarten], cards, zweiLabels).map((e) => e.id)).toEqual([2, 1])\n  })\n\n  it('entscheidet bei Gleichstand über das Anzeige-Kürzel', () => {\n    const cards = [karte(1, 'A', [70]), karte(2, 'B', [70])]\n    const zeta = vorhaben({ id: 1, shortcode: 'ZET', memberNumbers: [1], total: 1 })\n    const alpha = vorhaben({ id: 2, shortcode: 'ALP', memberNumbers: [2], total: 1 })\n\n    expect(sortEpics([zeta, alpha], cards, labels).map((e) => e.id)).toEqual([2, 1])\n  })\n\n  /** `Epic.shortcode` ist nullable; dann entscheidet die Ableitung aus dem Titel. */\n  it('entscheidet bei Gleichstand ohne Kürzel über die Titel-Ableitung', () => {\n    const cards = [karte(1, 'A', [70]), karte(2, 'B', [70])]\n    const zeta = vorhaben({ id: 1, title: 'Zebra Zaun', memberNumbers: [1], total: 1 })\n    const alpha = vorhaben({ id: 2, title: 'Alpha Anker', memberNumbers: [2], total: 1 })\n\n    // ZZ vor AA -> die Ableitung, nicht die Reihenfolge der Eingabe, entscheidet.\n    expect(sortEpics([zeta, alpha], cards, labels).map((e) => e.id)).toEqual([2, 1])\n  })\n\n  it('stellt ein abgeschlossenes Vorhaben hinter die unfertigen', () => {\n    const cards = [karte(1, 'A', [70]), karte(2, 'B', [70])]\n    const fertig = vorhaben({ id: 1, memberNumbers: [1, 2], done: 2, total: 2 })\n    const offen = vorhaben({ id: 2, memberNumbers: [1], done: 0, total: 1 })\n\n    expect(sortEpics([fertig, offen], cards, labels).map((e) => e.id)).toEqual([2, 1])\n  })\n\n  it('stellt ein leeres Vorhaben ganz ans Ende', () => {\n    const cards = [karte(1, 'A', [])]\n    const leer = vorhaben({ id: 1, total: 0, requirementCardNumber: null })\n    const fertig = vorhaben({ id: 2, memberNumbers: [1], done: 1, total: 1 })\n    const offen = vorhaben({ id: 3, memberNumbers: [1], done: 0, total: 1 })\n\n    expect(sortEpics([leer, fertig, offen], cards, labels).map((e) => e.id)).toEqual([3, 2, 1])\n  })\n\n  /**\n   * Leer heißt `total === 0` **und** ohne Anforderung: Ein Vorhaben, das eine Anforderung trägt,\n   * aber noch keine Karten hat, ist eröffnet und nicht leer.\n   */\n  it('behandelt ein Vorhaben mit Anforderung, aber ohne Karten nicht als leer', () => {\n    const leer = vorhaben({ id: 1, total: 0, requirementCardNumber: null })\n    const eroeffnet = vorhaben({ id: 2, total: 0, requirementCardNumber: 7 })\n\n    expect(sortEpics([leer, eroeffnet], [], labels).map((e) => e.id)).toEqual([2, 1])\n  })\n\n  it('lässt das Eingabe-Array unverändert', () => {\n    const cards = [karte(1, 'A', [70])]\n    const eingabe = [vorhaben({ id: 1, total: 0 }), vorhaben({ id: 2, memberNumbers: [1], total: 1 })]\n\n    sortEpics(eingabe, cards, labels)\n\n    expect(eingabe.map((e) => e.id)).toEqual([1, 2])\n  })\n})\n\ndescribe('visibleEpics', () => {\n  const drei = [vorhaben({ id: 1 }), vorhaben({ id: 2 }), vorhaben({ id: 3 })]\n\n  it('liefert bei leerem Ausblende-Zustand alle Vorhaben in unveränderter Reihenfolge', () => {\n    expect(visibleEpics(drei, new Set()).map((e) => e.id)).toEqual([1, 2, 3])\n  })\n\n  it('lässt ein ausgeblendetes Vorhaben weg und behält die Reihenfolge der übrigen', () => {\n    expect(visibleEpics(drei, new Set([2])).map((e) => e.id)).toEqual([1, 3])\n  })\n\n  /**\n   * Der `localStorage`-Zustand überlebt das Löschen eines Vorhabens — eine ID ohne Vorhaben ist\n   * daher der Regelfall, kein Fehler.\n   */\n  it('ignoriert eine ausgeblendete ID, zu der es kein Vorhaben gibt', () => {\n    expect(visibleEpics(drei, new Set([42])).map((e) => e.id)).toEqual([1, 2, 3])\n  })\n\n  it('liefert eine leere Liste, wenn alle Vorhaben ausgeblendet sind', () => {\n    expect(visibleEpics(drei, new Set([1, 2, 3]))).toEqual([])\n  })\n\n  it('lässt das Eingabe-Array unverändert', () => {\n    const eingabe = [vorhaben({ id: 1 }), vorhaben({ id: 2 })]\n\n    const ergebnis = visibleEpics(eingabe, new Set([1]))\n\n    expect(ergebnis).not.toBe(eingabe)\n    expect(eingabe.map((e) => e.id)).toEqual([1, 2])\n  })\n})\n\ndescribe('selectableEpics', () => {\n  const drei = [vorhaben({ id: 1 }), vorhaben({ id: 2 }), vorhaben({ id: 3 })]\n\n  it('liefert bei leerem Ausblende-Zustand alle Vorhaben in unveränderter Reihenfolge', () => {\n    expect(selectableEpics(drei, new Set()).map((e) => e.id)).toEqual([1, 2, 3])\n  })\n\n  it('lässt ein ausgeblendetes Vorhaben weg und behält die Reihenfolge der übrigen', () => {\n    expect(selectableEpics(drei, new Set([2])).map((e) => e.id)).toEqual([1, 3])\n  })\n\n  /**\n   * Der `localStorage`-Zustand überlebt das Löschen eines Vorhabens — eine ID ohne Vorhaben ist\n   * daher der Regelfall, kein Fehler.\n   */\n  it('ignoriert eine ausgeblendete ID, zu der es kein Vorhaben gibt', () => {\n    expect(selectableEpics(drei, new Set([42])).map((e) => e.id)).toEqual([1, 2, 3])\n  })\n\n  it('liefert eine leere Liste, wenn alle Vorhaben ausgeblendet sind', () => {\n    expect(selectableEpics(drei, new Set([1, 2, 3]))).toEqual([])\n  })\n\n  it('lässt das Eingabe-Array unverändert', () => {\n    const eingabe = [vorhaben({ id: 1 }), vorhaben({ id: 2 })]\n\n    const ergebnis = selectableEpics(eingabe, new Set([1]))\n\n    expect(ergebnis).not.toBe(eingabe)\n    expect(eingabe.map((e) => e.id)).toEqual([1, 2])\n  })\n})\n"},"src/lib/nightRunHandoff.test.ts":{"tests":[{"id":"372","name":"buildHandoffText — gelbe und rote Arbeitspakete nennt zu einem roten Arbeitspaket Kartennummer, Zustand, Fehlerklasse und Auszug"},{"id":"373","name":"buildHandoffText — gelbe und rote Arbeitspakete nennt zu einem gelben Arbeitspaket Kartennummer, Zustand, Fehlerklasse und Auszug"},{"id":"374","name":"buildHandoffText — gelbe und rote Arbeitspakete nennt die Karte ohne nachlaufendes Leerzeichen, wenn das Protokoll keinen Titel trug"},{"id":"375","name":"buildHandoffText — kein Befund, kein Text erzeugt zu einem gruenen Arbeitspaket keinen Text"},{"id":"376","name":"buildHandoffText — kein Befund, kein Text erzeugt zu einem grauen Arbeitspaket keinen Text"},{"id":"377","name":"buildHandoffText — fehlende Angaben erzeugt den Text auch ohne Auszug, ohne `undefined` und ohne leeren Block"},{"id":"378","name":"buildHandoffText — fehlende Angaben laesst die Fehlerklasse weg, wenn der Lauf keine nennt"},{"id":"379","name":"buildHandoffText — Rohprotokoll haengt an ein rotes Arbeitspaket den Abschnitt samt Rohzeilen an"},{"id":"380","name":"buildHandoffText — Rohprotokoll haengt den Abschnitt auch an ein gelbes Arbeitspaket an"},{"id":"381","name":"buildHandoffText — Rohprotokoll setzt den Abschnitt ohne Leerzeile hinter die letzte bisherige Zeile ans Ende"},{"id":"382","name":"buildHandoffText — Rohprotokoll uebernimmt die Rohzeilen woertlich, ohne Trim und ohne Filterung"},{"id":"383","name":"buildHandoffText — Rohprotokoll erzeugt keinen Abschnitt, wenn die Rohzeilen leer sind"},{"id":"384","name":"buildHandoffText — Rohprotokoll erzeugt keinen Abschnitt, wenn das Arbeitspaket keine Rohzeilen traegt"},{"id":"385","name":"buildHandoffText — Rohprotokoll liefert zu einem gruenen Arbeitspaket auch mit Rohzeilen keinen Text"},{"id":"386","name":"buildHandoffText — Rohprotokoll liefert zu einem grauen Arbeitspaket auch mit Rohzeilen keinen Text"},{"id":"387","name":"nightRunZustandsText — Zeitbudget (Issue #856) nennt am gelben Vorgang das Zeitbudget als Grund statt „Erfolg, Prüfung rot\""},{"id":"388","name":"nightRunZustandsText — Zeitbudget (Issue #856) nennt am roten Vorgang das Zeitbudget und das fehlende Ergebnis"},{"id":"389","name":"nightRunZustandsText — Zeitbudget (Issue #856) traegt den Zeitbudget-Zustandstext in den Uebernahmetext eines gelben Vorgangs"},{"id":"390","name":"nightRunZustandsText — Zeitbudget (Issue #856) traegt den Zeitbudget-Zustandstext in den Uebernahmetext eines roten Vorgangs"},{"id":"391","name":"nightRunZustandsText — Rueckfall wertgleich (AK 9 aus #842) liefert ohne Fehlerklasse den Text der Zustandstabelle"},{"id":"392","name":"nightRunZustandsText — Rueckfall wertgleich (AK 9 aus #842) liefert fuer jede bestehende Kombination denselben Text wie die Zustandstabelle"},{"id":"393","name":"nightRunZustandsText — Rueckfall wertgleich (AK 9 aus #842) laesst den gruenen und den grauen Zeitbudget-Fall auf die Zustandstabelle fallen"},{"id":"394","name":"buildHandoffText — Reinheit liefert zu gleicher Eingabe denselben Text"},{"id":"395","name":"buildHandoffText — Reinheit greift weder auf das Datum noch auf den Zufall zu"}],"source":"import { describe, expect, it, vi } from 'vitest'\nimport { NIGHT_RUN_ERROR_CLASSES, type NightRunState } from './nightRunLog'\nimport {\n  buildHandoffText,\n  nightRunZustandsText,\n  NIGHT_RUN_STATE_TEXT,\n  type NightRunHandoffItem,\n} from './nightRunHandoff'\n\n/**\n * Tests des Uebernahmetexts (Issue #727). Sie kommen ohne Oberflaeche aus — genau dafuer ist die\n * Erzeugung eine reine Funktion und keine Methode der Seite.\n *\n * Fixtures anonymisiert wie in `nightRunLog.test.ts`: Titel nach dem Schema `Paket N`, keine Pfade,\n * keine Sitzungs-IDs.\n */\n\nconst AUSZUG_ROT = '  HARTER STOPP: erfolgreiche Runde zu Issue #700 hinterlaesst einen dirty Tree'\nconst AUSZUG_GELB = '  Issue #700: gelaufen: npm test -> rot (Frontend) | ausgelassen: keine'\n\n/**\n * Rohzeilen wie der Parser sie liefert (`lib/nightRunLog.ts`): mit Zeitstempel-Praefix, mit\n * Einrueckung, dazwischen eine Zeile ohne Zeitstempel. Genau so muessen sie im Text stehen.\n */\nconst ROHZEILEN = [\n  '[00:01:12] Session 1/5: Issue #700 — Paket A',\n  '[00:03:40]   gelaufen: npm test -> rot (Frontend) | ausgelassen: keine',\n  '      Fortsetzung ohne Zeitstempel, bewusst eingerueckt',\n  `[00:05:02] ${AUSZUG_ROT.trim()}`,\n]\n\nconst paket = (partial: Partial<"+"NightRunHandoffItem> = {}): NightRunHandoffItem => ({\n  cardNumber: 700,\n  title: 'Paket A',\n  state: 'RED',\n  errorClass: 'HARD_ABORT',\n  excerpt: AUSZUG_ROT,\n  ...partial,\n})\n\ndescribe('buildHandoffText — gelbe und rote Arbeitspakete', () => {\n  it('nennt zu einem roten Arbeitspaket Kartennummer, Zustand, Fehlerklasse und Auszug', () => {\n    const text = buildHandoffText(paket())\n\n    expect(text).toContain('#700')\n    expect(text).toContain('Paket A')\n    expect(text).toContain('gescheitert')\n    expect(text).toContain('Harter Abbruch')\n    expect(text).toContain(AUSZUG_ROT)\n  })\n\n  it('nennt zu einem gelben Arbeitspaket Kartennummer, Zustand, Fehlerklasse und Auszug', () => {\n    const text = buildHandoffText(\n      paket({ state: 'YELLOW', errorClass: 'CHECKS_RED', excerpt: AUSZUG_GELB }),\n    )\n\n    expect(text).toContain('#700')\n    expect(text).toContain('Erfolg, Prüfung rot')\n    expect(text).toContain('Prüfungen rot')\n    expect(text).toContain(AUSZUG_GELB)\n  })\n\n  it('nennt die Karte ohne nachlaufendes Leerzeichen, wenn das Protokoll keinen Titel trug', () => {\n    // Der Parser setzt `title: ''`, wenn die Zeile den Titel nicht nennt (`lib/nightRunLog.ts`).\n    // Geprueft wird die Kopfzeile, nicht der ganze Text: Der Auszug nennt die Nummer ebenfalls.\n    const text = buildHandoffText(paket({ title: '' }))\n\n    expect(text?.split('\\n')[0]).toMatch(/#700$/)\n  })\n})\n\ndescribe('buildHandoffText — kein Befund, kein Text', () => {\n  it('erzeugt zu einem gruenen Arbeitspaket keinen Text', () => {\n    expect(buildHandoffText(paket({ state: 'GREEN', errorClass: undefined }))).toBeNull()\n  })\n\n  it('erzeugt zu einem grauen Arbeitspaket keinen Text', () => {\n    // Grau traegt eine Fehlerklasse (offene Abhaengigkeit) und ist trotzdem kein Befund.\n    expect(buildHandoffText(paket({ state: 'GREY', errorClass: 'DEPENDENCY_UNMET' }))).toBeNull()\n  })\n})\n\ndescribe('buildHandoffText — fehlende Angaben', () => {\n  it('erzeugt den Text auch ohne Auszug, ohne `undefined` und ohne leeren Block', () => {\n    const text = buildHandoffText(paket({ excerpt: undefined }))\n\n    expect(text).toContain('#700')\n    expect(text).toContain('gescheitert')\n    expect(text).toContain('Harter Abbruch')\n    expect(text).not.toContain('undefined')\n    expect(text?.split('\\n').filter((zeile) => zeile.trim() === '')).toHaveLength(0)\n  })\n\n  it('laesst die Fehlerklasse weg, wenn der Lauf keine nennt', () => {\n    const text = buildHandoffText(paket({ errorClass: undefined }))\n\n    expect(text).toContain('gescheitert')\n    expect(text).not.toContain('Fehlerklasse')\n    expect(text).not.toContain('undefined')\n  })\n})\n\ndescribe('buildHandoffText — Rohprotokoll', () => {\n  it('haengt an ein rotes Arbeitspaket den Abschnitt samt Rohzeilen an', () => {\n    const text = buildHandoffText(paket({ rawLines: ROHZEILEN }))\n\n    expect(text).toContain('Rohprotokoll:')\n    for (const roh of ROHZEILEN) {\n      expect(text).toContain(roh)\n    }\n  })\n\n  it('haengt den Abschnitt auch an ein gelbes Arbeitspaket an', () => {\n    const text = buildHandoffText(\n      paket({ state: 'YELLOW', errorClass: 'CHECKS_RED', excerpt: AUSZUG_GELB, rawLines: ROHZEILEN }),\n    )\n\n    expect(text).toContain('Rohprotokoll:')\n    expect(text).toContain(ROHZEILEN[0])\n  })\n\n  it('setzt den Abschnitt ohne Leerzeile hinter die letzte bisherige Zeile ans Ende', () => {\n    const ohne = buildHandoffText(paket())\n    const zeilen = buildHandoffText(paket({ rawLines: ROHZEILEN }))?.split('\\n') ?? []\n    const grenze = ohne?.split('\\n').length ?? 0\n\n    expect(zeilen.slice(0, grenze)).toEqual(ohne?.split('\\n'))\n    expect(zeilen[grenze]).toBe('Rohprotokoll:')\n    expect(zeilen.slice(grenze + 1)).toEqual(ROHZEILEN)\n  })\n\n  it('uebernimmt die Rohzeilen woertlich, ohne Trim und ohne Filterung', () => {\n    const roh = ['      eingerueckt und ungetrimmt', '', '   noch eine Zeile   ']\n\n    const zeilen = buildHandoffText(paket({ rawLines: roh }))?.split('\\n') ?? []\n\n    expect(zeilen.slice(zeilen.indexOf('Rohprotokoll:') + 1)).toEqual(roh)\n  })\n\n  it('erzeugt keinen Abschnitt, wenn die Rohzeilen leer sind', () => {\n    expect(buildHandoffText(paket({ rawLines: [] }))).toBe(buildHandoffText(paket()))\n  })\n\n  it('erzeugt keinen Abschnitt, wenn das Arbeitspaket keine Rohzeilen traegt', () => {\n    expect(buildHandoffText(paket({ rawLines: undefined }))).not.toContain('Rohprotokoll:')\n  })\n\n  it('liefert zu einem gruenen Arbeitspaket auch mit Rohzeilen keinen Text', () => {\n    expect(\n      buildHandoffText(paket({ state: 'GREEN', errorClass: undefined, rawLines: ROHZEILEN })),\n    ).toBeNull()\n  })\n\n  it('liefert zu einem grauen Arbeitspaket auch mit Rohzeilen keinen Text', () => {\n    expect(\n      buildHandoffText(paket({ state: 'GREY', errorClass: 'DEPENDENCY_UNMET', rawLines: ROHZEILEN })),\n    ).toBeNull()\n  })\n})\n\ndescribe('nightRunZustandsText — Zeitbudget (Issue #856)', () => {\n  const GRUND_ZEITBUDGET = 'Zeitbudget review: die Session wurde nach 15.0 min am Limit beendet'\n\n  it('nennt am gelben Vorgang das Zeitbudget als Grund statt „Erfolg, Prüfung rot\"', () => {\n    expect(nightRunZustandsText('YELLOW', 'TIME_BUDGET_EXCEEDED')).toBe(\n      'Am Zeitbudget beendet, Ergebnis liegt vor',\n    )\n    expect(nightRunZustandsText('YELLOW', 'TIME_BUDGET_EXCEEDED')).not.toContain('Prüfung rot')\n  })\n\n  it('nennt am roten Vorgang das Zeitbudget und das fehlende Ergebnis', () => {\n    expect(nightRunZustandsText('RED', 'TIME_BUDGET_EXCEEDED')).toBe(\n      'Am Zeitbudget beendet, ohne Ergebnis',\n    )\n  })\n\n  it('traegt den Zeitbudget-Zustandstext in den Uebernahmetext eines gelben Vorgangs', () => {\n    const text = buildHandoffText(\n      paket({ state: 'YELLOW', errorClass: 'TIME_BUDGET_EXCEEDED', excerpt: GRUND_ZEITBUDGET }),\n    )\n\n    expect(text).toContain('Zustand: Am Zeitbudget beendet, Ergebnis liegt vor')\n    expect(text).toContain('Fehlerklasse: Zeitbudget erschöpft')\n    expect(text).not.toContain('Prüfungen nicht gelaufen')\n    expect(text).not.toContain('Erfolg, Prüfung rot')\n  })\n\n  it('traegt den Zeitbudget-Zustandstext in den Uebernahmetext eines roten Vorgangs', () => {\n    const text = buildHandoffText(\n      paket({ state: 'RED', errorClass: 'TIME_BUDGET_EXCEEDED', excerpt: GRUND_ZEITBUDGET }),\n    )\n\n    expect(text).toContain('Zustand: Am Zeitbudget beendet, ohne Ergebnis')\n    expect(text).toContain('Fehlerklasse: Zeitbudget erschöpft')\n    expect(text).not.toContain('Prüfungen nicht gelaufen')\n  })\n})\n\ndescribe('nightRunZustandsText — Rueckfall wertgleich (AK 9 aus #842)', () => {\n  const ZUSTAENDE: readonly NightRunState[] = ['GREEN', 'YELLOW', 'RED', 'GREY']\n\n  it('liefert ohne Fehlerklasse den Text der Zustandstabelle', () => {\n    for (const state of ZUSTAENDE) {\n      expect(nightRunZustandsText(state, undefined)).toBe(NIGHT_RUN_STATE_TEXT[state])\n    }\n  })\n\n  it('liefert fuer jede bestehende Kombination denselben Text wie die Zustandstabelle', () => {\n    // Genau ein Paar ist neu; jede andere der 32 Kombinationen muss unveraendert bleiben — sonst\n    // saehe ein Bestandslauf nach dieser Aenderung anders aus als vorher.\n    for (const state of ZUSTAENDE) {\n      for (const errorClass of NIGHT_RUN_ERROR_CLASSES) {\n        const neu =\n          errorClass === 'TIME_BUDGET_EXCEEDED' && (state === 'YELLOW' || state === 'RED')\n        if (neu) continue\n        expect(nightRunZustandsText(state, errorClass)).toBe(NIGHT_RUN_STATE_TEXT[state])\n      }\n    }\n  })\n\n  it('laesst den gruenen und den grauen Zeitbudget-Fall auf die Zustandstabelle fallen', () => {\n    // Die neue Tabelle traegt nur Gelb und Rot: Ein Vorgang, der am Zeitbudget endete, ist nie\n    // gruen, und grau ist er nur als uebergangener Kandidat — dort sagt „nicht bearbeitet\" mehr.\n    expect(nightRunZustandsText('GREEN', 'TIME_BUDGET_EXCEEDED')).toBe('Erfolg')\n    expect(nightRunZustandsText('GREY', 'TIME_BUDGET_EXCEEDED')).toBe('nicht bearbeitet')\n  })\n})\n\ndescribe('buildHandoffText — Reinheit', () => {\n  it('liefert zu gleicher Eingabe denselben Text', () => {\n    expect(buildHandoffText(paket())).toBe(buildHandoffText(paket()))\n  })\n\n  it('greift weder auf das Datum noch auf den Zufall zu', () => {\n    const jetzt = vi.spyOn(Date, 'now')\n    const zufall = vi.spyOn(Math, 'random')\n\n    buildHandoffText(paket())\n\n    expect(jetzt).not.toHaveBeenCalled()\n    expect(zufall).not.toHaveBeenCalled()\n    jetzt.mockRestore()\n    zufall.mockRestore()\n  })\n})\n"},"src/lib/listSort.test.ts":{"tests":[{"id":"396","name":"nextSortState startet auf einer neuen Spalte aufsteigend"},{"id":"397","name":"nextSortState schaltet auf derselben Spalte von asc auf desc"},{"id":"398","name":"nextSortState schaltet auf derselben Spalte von desc auf keine Sortierung"},{"id":"399","name":"nextSortState startet beim Wechsel auf eine andere Spalte wieder aufsteigend, auch aus desc heraus"},{"id":"400","name":"sortCards — ohne Sortierung gibt eine Kopie in unveränderter Reihenfolge zurück"},{"id":"401","name":"sortCards — Nummer sortiert numerisch aufsteigend"},{"id":"402","name":"sortCards — Nummer sortiert numerisch absteigend"},{"id":"403","name":"sortCards — Nummer verändert das übergebene Array nicht"},{"id":"404","name":"sortCards — Status sortiert nach Spaltenposition, nicht alphabetisch"},{"id":"405","name":"sortCards — Status kehrt die Spaltenposition bei desc um"},{"id":"406","name":"sortCards — Status setzt eine Karte ohne existierende Spalte auf Position 0"},{"id":"407","name":"sortCards — Status stellt archivierte Karten in beiden Richtungen ans Ende"},{"id":"408","name":"sortCards — Status ordnet mehrere archivierte Karten nach der Grundordnung, in beiden Richtungen gleich"},{"id":"409","name":"sortCards — Vorhaben sortiert nach dem Kürzel aufsteigend, Karten ohne Vorhaben ans Ende"},{"id":"410","name":"sortCards — Vorhaben lässt Karten ohne Vorhaben auch absteigend am Ende"},{"id":"411","name":"sortCards — Vorhaben sortiert nach dem abgeleiteten Kürzel, wenn kein Kürzel gesetzt ist"},{"id":"412","name":"sortCards — Titel sortiert alphabetisch aufsteigend"},{"id":"413","name":"sortCards — Titel sortiert alphabetisch absteigend"},{"id":"414","name":"sortCards — Beschreibung sortiert nach dem gestrippten Text, nicht nach den Markdown-Zeichen"},{"id":"415","name":"sortCards — Beschreibung behandelt eine Beschreibung, die nur aus Markdown-Zeichen besteht, als leer"},{"id":"416","name":"sortCards — Beschreibung stellt eine fehlende Beschreibung (null) in beiden Richtungen ans Ende"},{"id":"417","name":"sortCards — Beschreibung stellt eine leere Beschreibung (\"\") in beiden Richtungen ans Ende"},{"id":"418","name":"sortCards — Gleichstand fällt auf Spaltenposition und positionInColumn zurück, in beiden Richtungen gleich"},{"id":"419","name":"sortCards — Gleichstand behandelt eine Karte ohne existierende Spalte auch im Gleichstand wie Position 0"}],"source":"import { describe, expect, it } from 'vitest'\nimport { nextSortState, sortCards, type SortState } from './listSort'\nimport type { BoardColumn } from '../api/boards'\nimport type { Card } from '../api/cards'\nimport type { Epic } from '../api/epics'\n\nfunction card(number: number, over: Partial<"+"Card> = {}): Card {\n  return {\n    id: number * 100,\n    boardId: 1,\n    columnId: 1,\n    number,\n    title: `Karte ${number}`,\n    description: null,\n    excerpt: null,\n    positionInColumn: 0,\n    archived: false,\n    ideaStored: false,\n    movedToDoneAt: null,\n    dependencies: [],\n    type: 'CARD',\n    parentId: null,\n    shortcode: null,\n    assignees: [],\n    dueDate: null,\n    labels: [],\n    derivedFrom: null,\n    ...over,\n  }\n}\n\nfunction column(id: number, name: string, position: number): BoardColumn {\n  return { id, name, position, wipLimit: null }\n}\n\nfunction epic(number: number, memberNumbers: number[], shortcode: string | null): Epic {\n  return {\n    id: number * 10,\n    number,\n    title: `Vorhaben ${number}`,\n    description: null,\n    shortcode,\n    done: 0,\n    total: memberNumbers.length,\n    memberNumbers,\n    rootNumbers: [],\n    requirementCardNumber: null,\n  }\n}\n\nfunction ctxVon(columns: readonly BoardColumn[] = [], epics: readonly Epic[] = []) {\n  return { columnById: new Map(columns.map((c) => [c.id, c])), epics }\n}\n\n/** Kurzform für die Prüfung: welche Karten in welcher Reihenfolge herauskommen. */\nfunction nummern(cards: readonly Card[]): number[] {\n  return cards.map((c) => c.number)\n}\n\ndescribe('nextSortState', () => {\n  it('startet auf einer neuen Spalte aufsteigend', () => {\n    expect(nextSortState(null, 'title')).toEqual({ key: 'title', dir: 'asc' })\n  })\n\n  it('schaltet auf derselben Spalte von asc auf desc', () => {\n    expect(nextSortState({ key: 'title', dir: 'asc' }, 'title')).toEqual({ key: 'title', dir: 'desc' })\n  })\n\n  it('schaltet auf derselben Spalte von desc auf keine Sortierung', () => {\n    expect(nextSortState({ key: 'title', dir: 'desc' }, 'title')).toBeNull()\n  })\n\n  it('startet beim Wechsel auf eine andere Spalte wieder aufsteigend, auch aus desc heraus', () => {\n    expect(nextSortState({ key: 'title', dir: 'desc' }, 'number')).toEqual({ key: 'number', dir: 'asc' })\n  })\n})\n\ndescribe('sortCards — ohne Sortierung', () => {\n  it('gibt eine Kopie in unveränderter Reihenfolge zurück', () => {\n    const cards = [card(3), card(1), card(2)]\n    const sortiert = sortCards(cards, null, ctxVon())\n    expect(nummern(sortiert)).toEqual([3, 1, 2])\n    expect(sortiert).not.toBe(cards)\n  })\n})\n\ndescribe('sortCards — Nummer', () => {\n  const cards = [card(10), card(2), card(33)]\n\n  it('sortiert numerisch aufsteigend', () => {\n    expect(nummern(sortCards(cards, { key: 'number', dir: 'asc' }, ctxVon()))).toEqual([2, 10, 33])\n  })\n\n  it('sortiert numerisch absteigend', () => {\n    expect(nummern(sortCards(cards, { key: 'number', dir: 'desc' }, ctxVon()))).toEqual([33, 10, 2])\n  })\n\n  it('verändert das übergebene Array nicht', () => {\n    sortCards(cards, { key: 'number', dir: 'asc' }, ctxVon())\n    expect(nummern(cards)).toEqual([10, 2, 33])\n  })\n})\n\ndescribe('sortCards — Status', () => {\n  // „Backlog\" steht auf Position 0, „Aufgaben\" auf Position 1: fachliche und alphabetische\n  // Ordnung fallen auseinander, nur so belegt der Test die Spaltenposition als Vergleichswert.\n  const columns = [column(1, 'Backlog', 0), column(2, 'Aufgaben', 1)]\n  const cards = [card(1, { columnId: 2 }), card(2, { columnId: 1 })]\n\n  it('sortiert nach Spaltenposition, nicht alphabetisch', () => {\n    expect(nummern(sortCards(cards, { key: 'status', dir: 'asc' }, ctxVon(columns)))).toEqual([2, 1])\n  })\n\n  it('kehrt die Spaltenposition bei desc um', () => {\n    expect(nummern(sortCards(cards, { key: 'status', dir: 'desc' }, ctxVon(columns)))).toEqual([1, 2])\n  })\n\n  it('setzt eine Karte ohne existierende Spalte auf Position 0', () => {\n    const mitWaise = [card(1, { columnId: 2 }), card(2, { columnId: 99 }), card(3, { columnId: 1 })]\n    expect(nummern(sortCards(mitWaise, { key: 'status', dir: 'asc' }, ctxVon(columns)))).toEqual([2, 3, 1])\n  })\n\n  it('stellt archivierte Karten in beiden Richtungen ans Ende', () => {\n    const mitArchiv = [card(1, { columnId: 1, archived: true }), card(2, { columnId: 2 }), card(3, { columnId: 1 })]\n    const ctx = ctxVon(columns)\n    expect(nummern(sortCards(mitArchiv, { key: 'status', dir: 'asc' }, ctx))).toEqual([3, 2, 1])\n    expect(nummern(sortCards(mitArchiv, { key: 'status', dir: 'desc' }, ctx))).toEqual([2, 3, 1])\n  })\n\n  it('ordnet mehrere archivierte Karten nach der Grundordnung, in beiden Richtungen gleich', () => {\n    const archiv = [\n      card(1, { columnId: 2, archived: true, positionInColumn: 0 }),\n      card(2, { columnId: 1, archived: true, positionInColumn: 7 }),\n      card(3, { columnId: 1, archived: true, positionInColumn: 2 }),\n    ]\n    const ctx = ctxVon(columns)\n    expect(nummern(sortCards(archiv, { key: 'status', dir: 'asc' }, ctx))).toEqual([3, 2, 1])\n    expect(nummern(sortCards(archiv, { key: 'status', dir: 'desc' }, ctx))).toEqual([3, 2, 1])\n  })\n})\n\ndescribe('sortCards — Vorhaben', () => {\n  // Zugeordnet wird über `memberNumbers` — dieselbe Regel, nach der die Zelle ihr Kürzel zeigt.\n  const epics = [epic(70, [1], 'ZZ'), epic(80, [2], 'AA')]\n  const cards = [card(1), card(2), card(3)]\n\n  it('sortiert nach dem Kürzel aufsteigend, Karten ohne Vorhaben ans Ende', () => {\n    expect(nummern(sortCards(cards, { key: 'epic', dir: 'asc' }, ctxVon([], epics)))).toEqual([2, 1, 3])\n  })\n\n  it('lässt Karten ohne Vorhaben auch absteigend am Ende', () => {\n    expect(nummern(sortCards(cards, { key: 'epic', dir: 'desc' }, ctxVon([], epics)))).toEqual([1, 2, 3])\n  })\n\n  it('sortiert nach dem abgeleiteten Kürzel, wenn kein Kürzel gesetzt ist', () => {\n    // Ohne Kürzel bildet `epicShortcode` die Initialen des Titels — „Vorhaben 70\" wird zu „V7\".\n    const ohneKuerzel = [epic(70, [1], null), epic(80, [2], 'AA')]\n    expect(nummern(sortCards([card(1), card(2)], { key: 'epic', dir: 'asc' }, ctxVon([], ohneKuerzel)))).toEqual([2, 1])\n  })\n})\n\ndescribe('sortCards — Titel', () => {\n  const cards = [card(1, { title: 'Zebra' }), card(2, { title: 'Alpha' })]\n\n  it('sortiert alphabetisch aufsteigend', () => {\n    expect(nummern(sortCards(cards, { key: 'title', dir: 'asc' }, ctxVon()))).toEqual([2, 1])\n  })\n\n  it('sortiert alphabetisch absteigend', () => {\n    expect(nummern(sortCards(cards, { key: 'title', dir: 'desc' }, ctxVon()))).toEqual([1, 2])\n  })\n})\n\ndescribe('sortCards — Beschreibung', () => {\n  // Sortiert wird über den Auszug, nicht über `description`: In der Board-Liste ist die volle\n  // Beschreibung gar nicht mehr dabei (Issue #771).\n  it('sortiert nach dem gestrippten Text, nicht nach den Markdown-Zeichen', () => {\n    const cards = [card(1, { excerpt: '## Zebra' }), card(2, { excerpt: 'Alpha' })]\n    expect(nummern(sortCards(cards, { key: 'excerpt', dir: 'asc' }, ctxVon()))).toEqual([2, 1])\n  })\n\n  it('behandelt eine Beschreibung, die nur aus Markdown-Zeichen besteht, als leer', () => {\n    // Belegt den gestrippten Text als Vergleichswert: roh ist „## \" nicht leer, die Zelle zeigt\n    // aber nichts — die Karte gehört ans Ende.\n    const cards = [card(1, { excerpt: '## ' }), card(2, { excerpt: 'Alpha' })]\n    expect(nummern(sortCards(cards, { key: 'excerpt', dir: 'asc' }, ctxVon()))).toEqual([2, 1])\n  })\n\n  it('stellt eine fehlende Beschreibung (null) in beiden Richtungen ans Ende', () => {\n    const cards = [card(1, { excerpt: null }), card(2, { excerpt: 'Zebra' }), card(3, { excerpt: 'Alpha' })]\n    expect(nummern(sortCards(cards, { key: 'excerpt', dir: 'asc' }, ctxVon()))).toEqual([3, 2, 1])\n    expect(nummern(sortCards(cards, { key: 'excerpt', dir: 'desc' }, ctxVon()))).toEqual([2, 3, 1])\n  })\n\n  it('stellt eine leere Beschreibung (\"\") in beiden Richtungen ans Ende', () => {\n    const cards = [card(1, { excerpt: '' }), card(2, { excerpt: 'Zebra' }), card(3, { excerpt: 'Alpha' })]\n    expect(nummern(sortCards(cards, { key: 'excerpt', dir: 'asc' }, ctxVon()))).toEqual([3, 2, 1])\n    expect(nummern(sortCards(cards, { key: 'excerpt', dir: 'desc' }, ctxVon()))).toEqual([2, 3, 1])\n  })\n})\n\ndescribe('sortCards — Gleichstand', () => {\n  const columns = [column(1, 'Backlog', 0), column(2, 'Aufgaben', 1)]\n  const cards = [\n    card(1, { title: 'Gleich', columnId: 2, positionInColumn: 0 }),\n    card(2, { title: 'Gleich', columnId: 1, positionInColumn: 7 }),\n    card(3, { title: 'Gleich', columnId: 1, positionInColumn: 2 }),\n  ]\n\n  it('fällt auf Spaltenposition und positionInColumn zurück, in beiden Richtungen gleich', () => {\n    const ctx = ctxVon(columns)\n    const asc: SortState = { key: 'title', dir: 'asc' }\n    const desc: SortState = { key: 'title', dir: 'desc' }\n    expect(nummern(sortCards(cards, asc, ctx))).toEqual([3, 2, 1])\n    expect(nummern(sortCards(cards, desc, ctx))).toEqual([3, 2, 1])\n  })\n\n  it('behandelt eine Karte ohne existierende Spalte auch im Gleichstand wie Position 0', () => {\n    const mitWaise = [\n      card(1, { title: 'Gleich', columnId: 2, positionInColumn: 0 }),\n      card(2, { title: 'Gleich', columnId: 99, positionInColumn: 3 }),\n    ]\n    expect(nummern(sortCards(mitWaise, { key: 'title', dir: 'asc' }, ctxVon(columns)))).toEqual([2, 1])\n  })\n})\n"},"src/lib/specImport.test.ts":{"tests":[{"id":"420","name":"splitSpecIntoSections macht aus jeder H2-Überschrift eine Karte mit Titel und Beschreibung"},{"id":"421","name":"splitSpecIntoSections deutet eine #-Zeile in einem Code-Block nicht als Überschrift"},{"id":"422","name":"splitSpecIntoSections schützt auch Tilde-Fences und schließt nur mit demselben Zeichen"},{"id":"423","name":"splitSpecIntoSections schließt einen Fence nicht mit einer kürzeren Markierung oder mit Info-String"},{"id":"424","name":"splitSpecIntoSections erkennt eingerückte Fences und schließt trotz Leerraum hinter der Markierung"},{"id":"425","name":"splitSpecIntoSections lässt einen nicht geschlossenen Code-Block bis zum Dateiende offen"},{"id":"426","name":"splitSpecIntoSections wechselt die Auflösung mit der gewählten Überschriftenebene"},{"id":"427","name":"splitSpecIntoSections verwirft den Vorspann vor der ersten passenden Überschrift"},{"id":"428","name":"splitSpecIntoSections behält tiefere Überschriften als Teil der Beschreibung"},{"id":"429","name":"splitSpecIntoSections liefert für eine leere Datei nichts"},{"id":"430","name":"splitSpecIntoSections liefert nichts, wenn die Datei keine Überschrift der gewählten Ebene hat"},{"id":"431","name":"splitSpecIntoSections erlaubt einen Abschnitt ohne Text unter der Überschrift"},{"id":"432","name":"splitSpecIntoSections kürzt einen zu langen Titel und meldet die Kürzung"},{"id":"433","name":"splitSpecIntoSections kürzt eine zu lange Beschreibung und meldet die Kürzung"},{"id":"434","name":"splitSpecIntoSections verarbeitet Windows-Zeilenenden ohne Wagenrücklauf im Ergebnis"},{"id":"435","name":"splitSpecIntoSections entfernt die abschließende Rautenfolge einer Überschrift"},{"id":"436","name":"splitSpecIntoSections entfernt die abschließende Rautenfolge samt Leerraum davor und dahinter"},{"id":"437","name":"splitSpecIntoSections behält eine Rautenfolge ohne trennenden Leerraum im Titel"},{"id":"438","name":"splitSpecIntoSections behält Rauten mitten im Titel"},{"id":"439","name":"splitSpecIntoSections startet keine Karte für eine Überschrift ohne Text"},{"id":"440","name":"splitSpecIntoSections ignoriert eine Überschrift ohne Text auch vor der ersten echten Überschrift"},{"id":"441","name":"splitSpecIntoSections rechnet den Titel hinter dem gesamten Rautenblock inklusive Trennzeichen ab"},{"id":"442","name":"splitSpecIntoSections erkennt nur echte ATX-Überschriften (Leerzeichen nötig, höchstens drei Einrückungen)"},{"id":"443","name":"splitSpecIntoSections hält die Obergrenze als Konstante bereit (Grenze des Batch-Endpoints)"}],"source":"import { describe, expect, it } from 'vitest'\nimport {\n  MAX_DESCRIPTION_LENGTH,\n  MAX_IDEAS_PER_IMPORT,\n  MAX_TITLE_LENGTH,\n  splitSpecIntoSections,\n} from './specImport'\n\ndescribe('splitSpecIntoSections', () => {\n  it('macht aus jeder H2-Überschrift eine Karte mit Titel und Beschreibung', () => {\n    const md = [\n      '## Anmeldung',\n      'Nutzer meldet sich mit E-Mail an.',\n      '',\n      '## Registrierung',\n      'Neue Nutzer legen ein Konto an.',\n      '',\n      '## Passwort vergessen',\n      'Zurücksetzen per Mail.',\n    ].join('\\n')\n\n    expect(splitSpecIntoSections(md, 2)).toEqual([\n      {\n        title: 'Anmeldung',\n        description: 'Nutzer meldet sich mit E-Mail an.',\n        titleTruncated: false,\n        descriptionTruncated: false,\n      },\n      {\n        title: 'Registrierung',\n        description: 'Neue Nutzer legen ein Konto an.',\n        titleTruncated: false,\n        descriptionTruncated: false,\n      },\n      {\n        title: 'Passwort vergessen',\n        description: 'Zurücksetzen per Mail.',\n        titleTruncated: false,\n        descriptionTruncated: false,\n      },\n    ])\n  })\n\n  it('deutet eine #-Zeile in einem Code-Block nicht als Überschrift', () => {\n    const md = [\n      '## Installation',\n      'Vorbereiten:',\n      '```bash',\n      '# Abhängigkeiten holen',\n      'npm install',\n      '```',\n      'Fertig.',\n    ].join('\\n')\n\n    const sections = splitSpecIntoSections(md, 1)\n    expect(sections).toEqual([])\n\n    const level2 = splitSpecIntoSections(md, 2)\n    expect(level2).toHaveLength(1)\n    expect(level2[0].description).toContain('# Abhängigkeiten holen')\n  })\n\n  it('schützt auch Tilde-Fences und schließt nur mit demselben Zeichen', () => {\n    const md = ['## A', '~~~', '## Kein Titel', '```', '## Auch nicht', '~~~', '## B', 'Text'].join(\n      '\\n',\n    )\n\n    const sections = splitSpecIntoSections(md, 2)\n    expect(sections.map((s) => s.title)).toEqual(['A', 'B'])\n    expect(sections[0].description).toContain('## Kein Titel')\n  })\n\n  it('schließt einen Fence nicht mit einer kürzeren Markierung oder mit Info-String', () => {\n    const md = ['## A', '````', '```', '## Kein Titel', '``` js', '````', '## B'].join('\\n')\n\n    expect(splitSpecIntoSections(md, 2).map((s) => s.title)).toEqual(['A', 'B'])\n  })\n\n  it('erkennt eingerückte Fences und schließt trotz Leerraum hinter der Markierung', () => {\n    const md = ['## A', '  ```js', '## Kein Titel', '  ``` ', '## B'].join('\\n')\n\n    const sections = splitSpecIntoSections(md, 2)\n    expect(sections.map((s) => s.title)).toEqual(['A', 'B'])\n    expect(sections[0].description).toContain('## Kein Titel')\n  })\n\n  it('lässt einen nicht geschlossenen Code-Block bis zum Dateiende offen', () => {\n    const md = ['## A', '```', '## Kein Titel'].join('\\n')\n\n    const sections = splitSpecIntoSections(md, 2)\n    expect(sections.map((s) => s.title)).toEqual(['A'])\n    expect(sections[0].description).toContain('## Kein Titel')\n  })\n\n  it('wechselt die Auflösung mit der gewählten Überschriftenebene', () => {\n    const md = ['# Kapitel', 'Vorwort.', '## Erstes', 'A', '## Zweites', 'B'].join('\\n')\n\n    expect(splitSpecIntoSections(md, 1).map((s) => s.title)).toEqual(['Kapitel'])\n    expect(splitSpecIntoSections(md, 2).map((s) => s.title)).toEqual(['Erstes', 'Zweites'])\n  })\n\n  it('verwirft den Vorspann vor der ersten passenden Überschrift', () => {\n    const md = ['Inhaltsverzeichnis', '- Erstes', '', '## Erstes', 'Der Text.'].join('\\n')\n\n    expect(splitSpecIntoSections(md, 2)).toEqual([\n      {\n        title: 'Erstes',\n        description: 'Der Text.',\n        titleTruncated: false,\n        descriptionTruncated: false,\n      },\n    ])\n  })\n\n  it('behält tiefere Überschriften als Teil der Beschreibung', () => {\n    const md = ['## Erstes', 'Rahmen.', '### Detail', 'Feinheit.', '## Zweites', 'B'].join('\\n')\n\n    const sections = splitSpecIntoSections(md, 2)\n    expect(sections.map((s) => s.title)).toEqual(['Erstes', 'Zweites'])\n    expect(sections[0].description).toBe('Rahmen.\\n### Detail\\nFeinheit.')\n  })\n\n  it('liefert für eine leere Datei nichts', () => {\n    expect(splitSpecIntoSections('', 2)).toEqual([])\n    expect(splitSpecIntoSections('   \\n\\n', 2)).toEqual([])\n  })\n\n  it('liefert nichts, wenn die Datei keine Überschrift der gewählten Ebene hat', () => {\n    expect(splitSpecIntoSections('Nur Fließtext ohne Struktur.', 2)).toEqual([])\n  })\n\n  it('erlaubt einen Abschnitt ohne Text unter der Überschrift', () => {\n    const sections = splitSpecIntoSections(['## Leer', '', '## Voll', 'Text'].join('\\n'), 2)\n\n    expect(sections[0]).toEqual({\n      title: 'Leer',\n      description: '',\n      titleTruncated: false,\n      descriptionTruncated: false,\n    })\n  })\n\n  it('kürzt einen zu langen Titel und meldet die Kürzung', () => {\n    const long = 'T'.repeat(MAX_TITLE_LENGTH + 5)\n\n    const [section] = splitSpecIntoSections(`## ${long}\\nText`, 2)\n\n    expect(section.title).toHaveLength(MAX_TITLE_LENGTH)\n    expect(section.titleTruncated).toBe(true)\n  })\n\n  it('kürzt eine zu lange Beschreibung und meldet die Kürzung', () => {\n    const long = 'B'.repeat(MAX_DESCRIPTION_LENGTH + 5)\n\n    const [section] = splitSpecIntoSections(`## Titel\\n${long}`, 2)\n\n    expect(section.description).toHaveLength(MAX_DESCRIPTION_LENGTH)\n    expect(section.descriptionTruncated).toBe(true)\n  })\n\n  it('verarbeitet Windows-Zeilenenden ohne Wagenrücklauf im Ergebnis', () => {\n    const sections = splitSpecIntoSections('## Titel\\r\\nText\\r\\n', 2)\n\n    expect(sections).toEqual([\n      { title: 'Titel', description: 'Text', titleTruncated: false, descriptionTruncated: false },\n    ])\n  })\n\n  it('entfernt die abschließende Rautenfolge einer Überschrift', () => {\n    expect(splitSpecIntoSections('## Titel ##\\nText', 2)[0].title).toBe('Titel')\n  })\n\n  it('entfernt die abschließende Rautenfolge samt Leerraum davor und dahinter', () => {\n    expect(splitSpecIntoSections('## Titel \\t##  \\nText', 2)[0].title).toBe('Titel')\n  })\n\n  it('behält eine Rautenfolge ohne trennenden Leerraum im Titel', () => {\n    expect(splitSpecIntoSections('## Titel###\\nText', 2)[0].title).toBe('Titel###')\n  })\n\n  it('behält Rauten mitten im Titel', () => {\n    expect(splitSpecIntoSections('## Titel ## Rest\\nText', 2)[0].title).toBe('Titel ## Rest')\n  })\n\n  it('startet keine Karte für eine Überschrift ohne Text', () => {\n    const md = ['## Erstes', 'A', '##', 'B', '## ', 'C'].join('\\n')\n\n    const sections = splitSpecIntoSections(md, 2)\n    expect(sections.map((s) => s.title)).toEqual(['Erstes'])\n    expect(sections[0].description).toBe('A\\n##\\nB\\n## \\nC')\n  })\n\n  it('ignoriert eine Überschrift ohne Text auch vor der ersten echten Überschrift', () => {\n    expect(splitSpecIntoSections('##\\n## Erstes\\nA', 2).map((s) => s.title)).toEqual(['Erstes'])\n  })\n\n  it('rechnet den Titel hinter dem gesamten Rautenblock inklusive Trennzeichen ab', () => {\n    const md = ['## ##', 'Text', '###### Tief genug', 'Mehr'].join('\\n')\n\n    const sections = splitSpecIntoSections(md, 2)\n    expect(sections.map((s) => s.title)).toEqual(['##'])\n    expect(sections[0].description).toBe('Text\\n###### Tief genug\\nMehr')\n  })\n\n  it('erkennt nur echte ATX-Überschriften (Leerzeichen nötig, höchstens drei Einrückungen)', () => {\n    const md = ['## Erstes', '##kein Titel', '    ## eingerückt', '   ## Zweites'].join('\\n')\n\n    const sections = splitSpecIntoSections(md, 2)\n    expect(sections.map((s) => s.title)).toEqual(['Erstes', 'Zweites'])\n    expect(sections[0].description).toBe('##kein Titel\\n    ## eingerückt')\n  })\n\n  it('hält die Obergrenze als Konstante bereit (Grenze des Batch-Endpoints)', () => {\n    expect(MAX_IDEAS_PER_IMPORT).toBe(200)\n  })\n})\n"},"src/lib/designGuard.test.ts":{"tests":[{"id":"444","name":"scanSource: was gemeldet wird meldet Hex-Farben, positive elevation und numerischen boxShadow"},{"id":"445","name":"scanSource: was gemeldet wird meldet eine Hex-Farbe auch in einem mehrzeiligen sx-Block"},{"id":"446","name":"scanSource: was gemeldet wird meldet Hex-Farben in benannten Style-Konstanten"},{"id":"447","name":"scanSource: was gemeldet wird meldet eine elevation aus einer Variablen ebenso wie aus einer Zahl"},{"id":"448","name":"scanSource: was gemeldet wird meldet einen schwarzen Schatten auch als Zeichenkette"},{"id":"449","name":"scanSource: was nicht gemeldet wird haelt die Kartennummer #345 und Issue-Anker in Kommentaren heraus"},{"id":"450","name":"scanSource: was nicht gemeldet wird endet mit dem sx-Ausdruck und nicht erst am Zeilenende"},{"id":"451","name":"scanSource: was nicht gemeldet wird laesst sich von // und /* innerhalb von Zeichenketten nicht taeuschen"},{"id":"452","name":"scanSource: was nicht gemeldet wird liest ueber maskierte Anfuehrungszeichen hinweg"},{"id":"453","name":"scanSource: was nicht gemeldet wird meldet Hex-Werte ausserhalb jedes Style-Kontexts nicht"},{"id":"454","name":"Ausnahmeliste laesst genau die gedeckten Verstoesse durch"},{"id":"455","name":"Ausnahmeliste meldet einen Eintrag, der keinen Verstoss mehr deckt"},{"id":"456","name":"Ausnahmeliste kommt mit einer leeren Liste in beide Richtungen zurecht"}],"source":"import { describe, expect, it } from 'vitest'\nimport { deadAllowlistEntries, scanSource, unmatchedViolations, type DesignAllowance } from './designGuard'\n\nconst regeln = (source: string) => scanSource('components/Fixture.tsx', source).map((v) => v.rule)\n\ndescribe('scanSource: was gemeldet wird', () => {\n  it('meldet Hex-Farben, positive elevation und numerischen boxShadow', () => {\n    const fixture = [\n      \"<"+"Paper elevation={2} sx={{ color: '#fff' }}>\",\n      '  <"+"Box sx={{ boxShadow: 3 }} />',\n      '<"+"/Paper>',\n    ].join('\\n')\n\n    expect(regeln(fixture).sort()).toEqual(['boxShadow', 'elevation', 'hex'])\n  })\n\n  it('meldet eine Hex-Farbe auch in einem mehrzeiligen sx-Block', () => {\n    expect(regeln(['<"+"Box\\n  sx={{', \"    color: '#123456',\", '  }}\\n/>'].join('\\n'))).toEqual(['hex'])\n  })\n\n  // Befund 3 des Reviews: Genau die Objekte, in die dieses Redesign die Styles zentralisiert hat,\n  // waren fuer die Leitplanke kein Style-Kontext.\n  it('meldet Hex-Farben in benannten Style-Konstanten', () => {\n    expect(regeln(\"const cardSx = {\\n  color: '#ff0000',\\n}\")).toEqual(['hex'])\n    expect(regeln(\"export const dialogTitleSx = { borderBottom: '1px solid #D8ECEE' }\")).toEqual(['hex'])\n    expect(regeln(\"const markdownBodySx = {\\n  '& code': { backgroundColor: '#f4f5f7' },\\n}\")).toEqual(['hex'])\n  })\n\n  // Befund 3: nur Zahlenliterale wurden erkannt.\n  it('meldet eine elevation aus einer Variablen ebenso wie aus einer Zahl', () => {\n    expect(regeln('<"+"Paper elevation={depth} />')).toEqual(['elevation'])\n    expect(regeln('<"+"Paper elevation={6} />')).toEqual(['elevation'])\n    expect(regeln('<"+"Paper elevation={0} />')).toEqual([])\n  })\n\n  // Befund 3: ein schwarzer Schatten als String kam an der Regel vorbei.\n  it('meldet einen schwarzen Schatten auch als Zeichenkette', () => {\n    expect(regeln(\"<"+"Box sx={{ boxShadow: '0 2px 8px rgba(0,0,0,0.4)' }} />\")).toEqual(['boxShadow'])\n    // Der Hex-Schatten verletzt beide Regeln zugleich; die Meldung nennt deshalb auch beide.\n    expect(regeln(\"<"+"Box sx={{ boxShadow: '0 1px 2px #000' }} />\").sort()).toEqual(['boxShadow', 'hex'])\n    expect(regeln('<"+"Box sx={{ boxShadow: SURFACE_HOVER_SHADOW }} />')).toEqual([])\n  })\n})\n\ndescribe('scanSource: was nicht gemeldet wird', () => {\n  it('haelt die Kartennummer #345 und Issue-Anker in Kommentaren heraus', () => {\n    const fixture = [\n      '// Toleranz gegenueber #611 im Kommentar',\n      '/* Blockkommentar zu #612 */',\n      '<"+"TextField placeholder=\"#345\" />',\n      \"const DEFAULT_COLOR = '#1976d2'\",\n      '<"+"Paper elevation={0} sx={{ boxShadow: 0 }} />',\n    ].join('\\n')\n\n    expect(scanSource('components/Fixture.tsx', fixture)).toEqual([])\n  })\n\n  // Befund 4 des Reviews: verifizierter Falschtreffer. Die Klammerbilanz lief ueber den\n  // sx-Ausdruck hinaus und erklaerte den ganzen Handler-Rumpf zum Style-Kontext.\n  it('endet mit dem sx-Ausdruck und nicht erst am Zeilenende', () => {\n    const fixture = ['<"+"Box sx={{ p: 1 }} onClick={() => {', \"  track('#deadbeef')\", '}} />'].join('\\n')\n\n    expect(scanSource('components/Fixture.tsx', fixture)).toEqual([])\n  })\n\n  // Befund 3, zwei Detailfehler in stripComments.\n  it('laesst sich von // und /* innerhalb von Zeichenketten nicht taeuschen', () => {\n    expect(regeln(\"<"+"Box sx={{ backgroundImage: 'url(//cdn/x.png)', color: '#ff0000' }} />\")).toEqual(['hex'])\n    expect(regeln(\"const s = '/*'\\n<"+"Box sx={{ color: '#ff0000' }} />\\nconst t = '*/'\")).toEqual(['hex'])\n  })\n\n  it('liest ueber maskierte Anfuehrungszeichen hinweg', () => {\n    // Ohne Escape-Behandlung endete die Zeichenkette am maskierten Apostroph, und alles danach\n    // gaelte wieder als Quelltext — inklusive eines `//`, das dann den Zeilenrest verschluckt.\n    expect(regeln(\"const s = 'a\\\\'b' // '#ff0000'\\n<"+"Box sx={{ color: '#123456' }} />\")).toEqual(['hex'])\n  })\n\n  it('meldet Hex-Werte ausserhalb jedes Style-Kontexts nicht', () => {\n    expect(regeln(\"const EPIC_PALETTE = ['#534AB7', '#1D9E75']\")).toEqual([])\n  })\n})\n\ndescribe('Ausnahmeliste', () => {\n  const violations = [\n    { file: 'components/Alt.tsx', line: 5, rule: 'hex' as const, text: \"color: '#fff'\" },\n    { file: 'components/Neu.tsx', line: 9, rule: 'elevation' as const, text: 'elevation={2}' },\n  ]\n\n  it('laesst genau die gedeckten Verstoesse durch', () => {\n    const allowlist: DesignAllowance[] = [{ file: 'components/Alt.tsx', rule: 'hex', resolvedIn: 'Paket X' }]\n\n    expect(unmatchedViolations(violations, allowlist)).toEqual([violations[1]])\n  })\n\n  it('meldet einen Eintrag, der keinen Verstoss mehr deckt', () => {\n    const allowlist: DesignAllowance[] = [\n      { file: 'components/Alt.tsx', rule: 'hex', resolvedIn: 'Paket X' },\n      { file: 'components/Weg.tsx', rule: 'boxShadow', resolvedIn: 'Paket Y' },\n    ]\n\n    expect(deadAllowlistEntries(violations, allowlist)).toEqual([allowlist[1]])\n  })\n\n  it('kommt mit einer leeren Liste in beide Richtungen zurecht', () => {\n    expect(unmatchedViolations(violations, [])).toEqual(violations)\n    expect(deadAllowlistEntries(violations, [])).toEqual([])\n  })\n})\n"},"src/lib/markdownTasks.test.ts":{"tests":[{"id":"457","name":"normalizeTaskLists wandelt nackte [ ] am Zeilenanfang in Task-Items um"},{"id":"458","name":"normalizeTaskLists behält Marker ohne nachfolgenden Text ohne angehängtes Leerzeichen"},{"id":"459","name":"normalizeTaskLists lässt bereits vorhandene Listenmarker unverändert"},{"id":"460","name":"normalizeTaskLists erhält die Einrückung"},{"id":"461","name":"normalizeTaskLists lässt [ ] mitten im Fließtext unangetastet"},{"id":"462","name":"normalizeTaskLists rührt Marker in Code-Fences nicht an"},{"id":"463","name":"normalizeTaskLists kanonisiert Marker mit abweichender Leerzeichen-Zahl bei Listen-Items"},{"id":"464","name":"normalizeTaskLists kanonisiert auch nackte Marker mit Varianten"},{"id":"465","name":"normalizeTaskLists rendert benachbarte Zeilen mit unterschiedlicher Leerzeichen-Zahl beide als Task"},{"id":"466","name":"normalizeTaskLists lässt nackte Klammern ohne folgenden Whitespace (Fließtext) unangetastet"},{"id":"467","name":"normalizeTaskLists verarbeitet pathologische Marker-Eingaben ohne katastrophales Backtracking"},{"id":"468","name":"toggleTaskAt schaltet die n-te Checkbox um"},{"id":"469","name":"toggleTaskAt schaltet [x] zurück auf [ ]"},{"id":"470","name":"toggleTaskAt zählt gemischte Marker (mit/ohne Liste) in Dokumentreihenfolge"},{"id":"471","name":"toggleTaskAt flippt nur die Checkbox, nicht Klammern im Task-Text"},{"id":"472","name":"toggleTaskAt überspringt Checkboxen in Code-Fences"},{"id":"473","name":"toggleTaskAt lässt den Text bei ungültigem Index unverändert"},{"id":"474","name":"toggleTaskAt zählt und flippt Marker mit abweichender Leerzeichen-Zahl konsistent zum Rendern"},{"id":"475","name":"toggleTaskAt flippt leere und umrahmte Marker kanonisch"}],"source":"import { describe, expect, it } from 'vitest'\nimport { normalizeTaskLists, toggleTaskAt } from './markdownTasks'\n\ndescribe('normalizeTaskLists', () => {\n  it('wandelt nackte [ ] am Zeilenanfang in Task-Items um', () => {\n    expect(normalizeTaskLists('[ ] Aufgabe eins')).toBe('- [ ] Aufgabe eins')\n    expect(normalizeTaskLists('[x] erledigt')).toBe('- [x] erledigt')\n  })\n\n  it('behält Marker ohne nachfolgenden Text ohne angehängtes Leerzeichen', () => {\n    // Leerer Body -> Suffix '' (kein „- [ ] \" mit Trailing-Space).\n    expect(normalizeTaskLists('- [x]')).toBe('- [x]')\n    // NAKED verlangt Whitespace nach dem Marker; leerer Body danach -> normalisiert ohne Trailing.\n    expect(normalizeTaskLists('[ ] ')).toBe('- [ ]')\n  })\n\n  it('lässt bereits vorhandene Listenmarker unverändert', () => {\n    expect(normalizeTaskLists('- [ ] schon Liste')).toBe('- [ ] schon Liste')\n    expect(normalizeTaskLists('1. [ ] nummeriert')).toBe('1. [ ] nummeriert')\n  })\n\n  it('erhält die Einrückung', () => {\n    expect(normalizeTaskLists('  [ ] eingerückt')).toBe('  - [ ] eingerückt')\n  })\n\n  it('lässt [ ] mitten im Fließtext unangetastet', () => {\n    expect(normalizeTaskLists('Text mit [ ] darin')).toBe('Text mit [ ] darin')\n  })\n\n  it('rührt Marker in Code-Fences nicht an', () => {\n    const md = '```\\n[ ] kein Task\\n```'\n    expect(normalizeTaskLists(md)).toBe(md)\n  })\n\n  it('kanonisiert Marker mit abweichender Leerzeichen-Zahl bei Listen-Items', () => {\n    expect(normalizeTaskLists('- [  ] doppelt')).toBe('- [ ] doppelt')\n    expect(normalizeTaskLists('- [] leer')).toBe('- [ ] leer')\n    expect(normalizeTaskLists('- [ x ] umrahmt')).toBe('- [x] umrahmt')\n    expect(normalizeTaskLists('- [X] gross')).toBe('- [x] gross')\n    expect(normalizeTaskLists('- [X]y')).toBe('- [x] y')\n  })\n\n  it('kanonisiert auch nackte Marker mit Varianten', () => {\n    expect(normalizeTaskLists('[  ] doppelt')).toBe('- [ ] doppelt')\n    expect(normalizeTaskLists('[] leer')).toBe('- [ ] leer')\n  })\n\n  it('rendert benachbarte Zeilen mit unterschiedlicher Leerzeichen-Zahl beide als Task', () => {\n    expect(normalizeTaskLists('- [ ] a\\n- [  ] b')).toBe('- [ ] a\\n- [ ] b')\n  })\n\n  it('lässt nackte Klammern ohne folgenden Whitespace (Fließtext) unangetastet', () => {\n    expect(normalizeTaskLists('[x]foo bar')).toBe('[x]foo bar')\n  })\n\n  // Regression S8786: `[` + sehr viele Leerzeichen ohne schließendes `]` löste beim alten\n  // Marker-Muster `\\[\\s*[xX]?\\s*\\]` super-lineares Backtracking aus (zwei benachbarte `\\s*`).\n  // Mit dem verankerten Muster `\\[\\s*(?:[xX]\\s*)?\\]` läuft es linear; die Zeile bleibt (kein\n  // gültiger Marker) unverändert. Timeout des Tests wäre der Regressionsindikator.\n  it('verarbeitet pathologische Marker-Eingaben ohne katastrophales Backtracking', () => {\n    const nakedish = `[${' '.repeat(50_000)}`\n    expect(normalizeTaskLists(nakedish)).toBe(nakedish)\n\n    const listedish = `-  [${' '.repeat(50_000)}`\n    expect(normalizeTaskLists(listedish)).toBe(listedish)\n\n    // Gegenprobe: ein gültiger Marker mit vielen Leerzeichen wird weiterhin korrekt kanonisiert.\n    expect(normalizeTaskLists(`[${' '.repeat(500)}] tief eingerückt`)).toBe('- [ ] tief eingerückt')\n  })\n})\n\ndescribe('toggleTaskAt', () => {\n  it('schaltet die n-te Checkbox um', () => {\n    const md = '[ ] eins\\n[ ] zwei'\n    expect(toggleTaskAt(md, 0)).toBe('[x] eins\\n[ ] zwei')\n    expect(toggleTaskAt(md, 1)).toBe('[ ] eins\\n[x] zwei')\n  })\n\n  it('schaltet [x] zurück auf [ ]', () => {\n    expect(toggleTaskAt('- [x] fertig', 0)).toBe('- [ ] fertig')\n  })\n\n  it('zählt gemischte Marker (mit/ohne Liste) in Dokumentreihenfolge', () => {\n    const md = '- [ ] a\\n1. [ ] b\\n[ ] c'\n    expect(toggleTaskAt(md, 2)).toBe('- [ ] a\\n1. [ ] b\\n[x] c')\n  })\n\n  it('flippt nur die Checkbox, nicht Klammern im Task-Text', () => {\n    expect(toggleTaskAt('- [ ] siehe [x] oben', 0)).toBe('- [x] siehe [x] oben')\n  })\n\n  it('überspringt Checkboxen in Code-Fences', () => {\n    const md = '```\\n[ ] ignoriert\\n```\\n[ ] echt'\n    expect(toggleTaskAt(md, 0)).toBe('```\\n[ ] ignoriert\\n```\\n[x] echt')\n  })\n\n  it('lässt den Text bei ungültigem Index unverändert', () => {\n    expect(toggleTaskAt('[ ] eins', 5)).toBe('[ ] eins')\n  })\n\n  it('zählt und flippt Marker mit abweichender Leerzeichen-Zahl konsistent zum Rendern', () => {\n    // Gerendert (normalizeTaskLists) sind beides Checkboxen an Index 0 und 1; ein Klick auf die\n    // zweite (Index 1) muss genau die zweite Zeile treffen, obwohl sie zwei Leerzeichen hat.\n    const md = '- [ ] a\\n- [  ] b'\n    expect(toggleTaskAt(md, 1)).toBe('- [ ] a\\n- [x] b')\n  })\n\n  it('flippt leere und umrahmte Marker kanonisch', () => {\n    expect(toggleTaskAt('- [] x', 0)).toBe('- [x] x')\n    expect(toggleTaskAt('- [ x ] y', 0)).toBe('- [ ] y')\n  })\n})\n"},"src/lib/useKeyboardShortcut.test.ts":{"tests":[{"id":"476","name":"useKeyboardShortcut ruft den Handler bei der gebundenen Taste auf"},{"id":"477","name":"useKeyboardShortcut unterdrückt die Standardwirkung der Taste, wenn das Kürzel greift"},{"id":"478","name":"useKeyboardShortcut lässt die Standardwirkung unangetastet, wenn das Kürzel nicht greift"},{"id":"479","name":"useKeyboardShortcut ignoriert eine andere Taste"},{"id":"480","name":"useKeyboardShortcut ignoriert die Taste mit Modifikator { ctrlKey: true }"},{"id":"481","name":"useKeyboardShortcut ignoriert die Taste mit Modifikator { altKey: true }"},{"id":"482","name":"useKeyboardShortcut ignoriert die Taste mit Modifikator { metaKey: true }"},{"id":"483","name":"useKeyboardShortcut greift nicht im input"},{"id":"484","name":"useKeyboardShortcut greift nicht im textarea"},{"id":"485","name":"useKeyboardShortcut greift nicht im select"},{"id":"486","name":"useKeyboardShortcut greift nicht in editierbarem Inhalt, auch nicht in dessen Kindelementen"},{"id":"487","name":"useKeyboardShortcut greift bei einem Ziel, das kein Element ist"},{"id":"488","name":"useKeyboardShortcut greift nicht, solange ein Dialog offen ist"},{"id":"489","name":"useKeyboardShortcut meldet nichts an, solange das Kürzel nicht freigeschaltet ist"},{"id":"490","name":"useKeyboardShortcut meldet den Listener beim Unmount wieder ab"},{"id":"491","name":"useKeyboardShortcut nutzt die aktuelle Handler-Referenz ohne neu anzumelden"}],"source":"import { fireEvent, renderHook } from '@testing-library/react'\nimport { afterEach, describe, expect, it, vi } from 'vitest'\nimport { useKeyboardShortcut } from './useKeyboardShortcut'\n\n/** Hängt ein Element an den Body und gibt es fokussiert zurück (Aufräumen über afterEach). */\nfunction mount<"+"K extends keyof HTMLElementTagNameMap>(tag: K): HTMLElementTagNameMap[K] {\n  const el = document.createElement(tag)\n  document.body.appendChild(el)\n  return el\n}\n\ndescribe('useKeyboardShortcut', () => {\n  afterEach(() => {\n    document.body.innerHTML = ''\n  })\n\n  it('ruft den Handler bei der gebundenen Taste auf', () => {\n    const onTrigger = vi.fn()\n    renderHook(() => useKeyboardShortcut('+', true, onTrigger))\n\n    fireEvent.keyDown(document.body, { key: '+' })\n\n    expect(onTrigger).toHaveBeenCalledTimes(1)\n  })\n\n  it('unterdrückt die Standardwirkung der Taste, wenn das Kürzel greift', () => {\n    renderHook(() => useKeyboardShortcut('/', true, vi.fn()))\n\n    const handled = fireEvent.keyDown(document.body, { key: '/', cancelable: true })\n\n    // `fireEvent` liefert false, wenn preventDefault gerufen wurde — sonst tippte der Browser das\n    // Zeichen in das Feld, das der Handler gerade fokussiert hat.\n    expect(handled).toBe(false)\n  })\n\n  it('lässt die Standardwirkung unangetastet, wenn das Kürzel nicht greift', () => {\n    renderHook(() => useKeyboardShortcut('/', true, vi.fn()))\n\n    expect(fireEvent.keyDown(mount('input'), { key: '/', cancelable: true })).toBe(true)\n  })\n\n  it('ignoriert eine andere Taste', () => {\n    const onTrigger = vi.fn()\n    renderHook(() => useKeyboardShortcut('+', true, onTrigger))\n\n    fireEvent.keyDown(document.body, { key: 'a' })\n\n    expect(onTrigger).not.toHaveBeenCalled()\n  })\n\n  it.each([{ ctrlKey: true }, { altKey: true }, { metaKey: true }])(\n    'ignoriert die Taste mit Modifikator %o',\n    (modifier) => {\n      const onTrigger = vi.fn()\n      renderHook(() => useKeyboardShortcut('+', true, onTrigger))\n\n      fireEvent.keyDown(document.body, { key: '+', ...modifier })\n\n      expect(onTrigger).not.toHaveBeenCalled()\n    },\n  )\n\n  it.each(['input', 'textarea', 'select'] as const)('greift nicht im %s', (tag) => {\n    const onTrigger = vi.fn()\n    renderHook(() => useKeyboardShortcut('+', true, onTrigger))\n\n    fireEvent.keyDown(mount(tag), { key: '+' })\n\n    expect(onTrigger).not.toHaveBeenCalled()\n  })\n\n  it('greift nicht in editierbarem Inhalt, auch nicht in dessen Kindelementen', () => {\n    const onTrigger = vi.fn()\n    renderHook(() => useKeyboardShortcut('+', true, onTrigger))\n    const editable = mount('div')\n    editable.setAttribute('contenteditable', 'true')\n    const line = document.createElement('p')\n    editable.appendChild(line)\n\n    fireEvent.keyDown(line, { key: '+' })\n\n    expect(onTrigger).not.toHaveBeenCalled()\n  })\n\n  it('greift bei einem Ziel, das kein Element ist', () => {\n    const onTrigger = vi.fn()\n    renderHook(() => useKeyboardShortcut('+', true, onTrigger))\n\n    fireEvent.keyDown(document, { key: '+' })\n\n    expect(onTrigger).toHaveBeenCalledTimes(1)\n  })\n\n  it('greift nicht, solange ein Dialog offen ist', () => {\n    const onTrigger = vi.fn()\n    renderHook(() => useKeyboardShortcut('+', true, onTrigger))\n    mount('div').setAttribute('role', 'dialog')\n\n    fireEvent.keyDown(document.body, { key: '+' })\n\n    expect(onTrigger).not.toHaveBeenCalled()\n  })\n\n  it('meldet nichts an, solange das Kürzel nicht freigeschaltet ist', () => {\n    const onTrigger = vi.fn()\n    const { rerender } = renderHook(({ on }) => useKeyboardShortcut('+', on, onTrigger), {\n      initialProps: { on: false },\n    })\n\n    fireEvent.keyDown(document.body, { key: '+' })\n    expect(onTrigger).not.toHaveBeenCalled()\n\n    rerender({ on: true })\n    fireEvent.keyDown(document.body, { key: '+' })\n    expect(onTrigger).toHaveBeenCalledTimes(1)\n  })\n\n  it('meldet den Listener beim Unmount wieder ab', () => {\n    const onTrigger = vi.fn()\n    const { unmount } = renderHook(() => useKeyboardShortcut('+', true, onTrigger))\n\n    unmount()\n    fireEvent.keyDown(document.body, { key: '+' })\n\n    expect(onTrigger).not.toHaveBeenCalled()\n  })\n\n  it('nutzt die aktuelle Handler-Referenz ohne neu anzumelden', () => {\n    const first = vi.fn()\n    const second = vi.fn()\n    const { rerender } = renderHook(({ cb }) => useKeyboardShortcut('+', true, cb), {\n      initialProps: { cb: first },\n    })\n\n    rerender({ cb: second })\n    fireEvent.keyDown(document.body, { key: '+' })\n\n    expect(second).toHaveBeenCalledTimes(1)\n    expect(first).not.toHaveBeenCalled()\n  })\n})\n"},"src/lib/useProjectRole.test.ts":{"tests":[{"id":"492","name":"useProjectRole nutzt die Mitgliedschaft aus dem Auth-Context, ohne die Projektliste zu laden"},{"id":"493","name":"useProjectRole lädt die Rolle nach, wenn keine Mitgliedschaft bekannt ist"},{"id":"494","name":"useProjectRole fällt auf VIEWER zurück, wenn das Projekt nicht in der Liste steht"},{"id":"495","name":"useProjectRole ergibt bei einem Ladefehler VIEWER, ohne zu werfen"},{"id":"496","name":"useProjectRole fällt beim Projektwechsel sofort auf VIEWER zurück, bis die neue Rolle feststeht"},{"id":"497","name":"useProjectRole ignoriert die verspätet eintreffende Antwort des vorigen Projekts"},{"id":"498","name":"useProjectRole liefert ohne Projekt VIEWER, ohne die Projektliste zu laden"},{"id":"499","name":"useProjectRole gibt einem Plattform-Admin ohne Mitgliedschaft volle Rechte"}],"source":"import { act, renderHook, waitFor } from '@testing-library/react'\nimport { beforeEach, describe, expect, it, vi } from 'vitest'\nimport type { Project } from '../api/projects'\nimport { projectsApi } from '../api/projects'\nimport { useProjectRole } from './useProjectRole'\n\nconst authUser = vi.hoisted(() => ({ value: null as unknown }))\nvi.mock('../auth/AuthContext', () => ({ useAuth: () => ({ user: authUser.value }) }))\nvi.mock('../api/projects', () => ({ projectsApi: { list: vi.fn() } }))\nconst mList = projectsApi.list as unknown as ReturnType<"+"typeof vi.fn>\n\nconst project = (id: number, role: string): Project => ({ id, name: `P${id}`, role, createdAt: '' })\n\ndescribe('useProjectRole', () => {\n  beforeEach(() => {\n    mList.mockReset()\n    mList.mockResolvedValue([])\n    authUser.value = { platformRole: 'USER', memberships: [] }\n  })\n\n  it('nutzt die Mitgliedschaft aus dem Auth-Context, ohne die Projektliste zu laden', () => {\n    authUser.value = { platformRole: 'USER', memberships: [{ projectId: 5, role: 'MEMBER' }] }\n    const { result } = renderHook(() => useProjectRole(5))\n    expect(result.current.effectiveRole).toBe('MEMBER')\n    expect(result.current.canEdit).toBe(true)\n    expect(result.current.canModerate).toBe(false)\n    expect(mList).not.toHaveBeenCalled()\n  })\n\n  it('lädt die Rolle nach, wenn keine Mitgliedschaft bekannt ist', async () => {\n    mList.mockResolvedValue([project(5, 'ADMIN')])\n    const { result } = renderHook(() => useProjectRole(5))\n    await waitFor(() => expect(result.current.effectiveRole).toBe('ADMIN'))\n    expect(result.current.canEdit).toBe(true)\n    expect(result.current.canModerate).toBe(true)\n  })\n\n  it('fällt auf VIEWER zurück, wenn das Projekt nicht in der Liste steht', async () => {\n    mList.mockResolvedValue([project(999, 'OWNER')])\n    const { result } = renderHook(() => useProjectRole(5))\n    await waitFor(() => expect(mList).toHaveBeenCalled())\n    expect(result.current.effectiveRole).toBe('VIEWER')\n    expect(result.current.canEdit).toBe(false)\n  })\n\n  it('ergibt bei einem Ladefehler VIEWER, ohne zu werfen', async () => {\n    mList.mockRejectedValue(new Error('Netzwerkfehler'))\n    const { result } = renderHook(() => useProjectRole(5))\n    await waitFor(() => expect(mList).toHaveBeenCalled())\n    expect(result.current.effectiveRole).toBe('VIEWER')\n    expect(result.current.canEdit).toBe(false)\n  })\n\n  it('fällt beim Projektwechsel sofort auf VIEWER zurück, bis die neue Rolle feststeht', async () => {\n    mList.mockResolvedValueOnce([project(5, 'OWNER')])\n    const { result, rerender } = renderHook(({ id }: { id: number | null }) => useProjectRole(id), {\n      initialProps: { id: 5 as number | null },\n    })\n    await waitFor(() => expect(result.current.effectiveRole).toBe('OWNER'))\n\n    // Antwort für das neue Projekt steht noch aus: die alte Rolle darf nicht weiterwirken.\n    mList.mockImplementation(() => new Promise<"+"Project[]>(() => {}))\n    rerender({ id: 6 })\n    expect(result.current.effectiveRole).toBe('VIEWER')\n    expect(result.current.canEdit).toBe(false)\n  })\n\n  it('ignoriert die verspätet eintreffende Antwort des vorigen Projekts', async () => {\n    let resolveFirst: (projects: Project[]) => void = () => {}\n    mList.mockImplementationOnce(() => new Promise<"+"Project[]>((resolve) => { resolveFirst = resolve }))\n    mList.mockResolvedValue([project(6, 'VIEWER')])\n    const { result, rerender } = renderHook(({ id }: { id: number | null }) => useProjectRole(id), {\n      initialProps: { id: 5 as number | null },\n    })\n    rerender({ id: 6 })\n    await waitFor(() => expect(mList).toHaveBeenCalledTimes(2))\n\n    await act(async () => { resolveFirst([project(5, 'OWNER')]) })\n\n    expect(result.current.effectiveRole).toBe('VIEWER')\n    expect(result.current.canEdit).toBe(false)\n  })\n\n  it('liefert ohne Projekt VIEWER, ohne die Projektliste zu laden', () => {\n    const { result } = renderHook(() => useProjectRole(null))\n    expect(mList).not.toHaveBeenCalled()\n    expect(result.current.effectiveRole).toBe('VIEWER')\n    expect(result.current.canEdit).toBe(false)\n    expect(result.current.canModerate).toBe(false)\n  })\n\n  it('gibt einem Plattform-Admin ohne Mitgliedschaft volle Rechte', () => {\n    authUser.value = { platformRole: 'ADMIN', memberships: [] }\n    const { result } = renderHook(() => useProjectRole(null))\n    expect(result.current.canEdit).toBe(true)\n    expect(result.current.canModerate).toBe(true)\n  })\n})\n"},"src/lib/columnMeta.test.ts":{"tests":[{"id":"500","name":"isDoneColumn erkennt Done als done=true"},{"id":"501","name":"isDoneColumn erkennt done als done=true"},{"id":"502","name":"isDoneColumn erkennt Erledigt/DONE als done=true"},{"id":"503","name":"isDoneColumn erkennt In Progress als done=false"},{"id":"504","name":"isDoneColumn erkennt  als done=false"},{"id":"505","name":"neighbourColumns liefert für eine mittlere Spalte beide Nachbarn"},{"id":"506","name":"neighbourColumns liefert für die erste Spalte keinen linken Nachbarn"},{"id":"507","name":"neighbourColumns liefert für die letzte Spalte keinen rechten Nachbarn"},{"id":"508","name":"neighbourColumns liefert bei einer einzigen Spalte gar keinen Nachbarn"},{"id":"509","name":"neighbourColumns liefert für eine unbekannte Spalte keinen Nachbarn"},{"id":"510","name":"canonicalColumnKey bildet Backlog auf BACKLOG ab"},{"id":"511","name":"canonicalColumnKey bildet Ready auf READY ab"},{"id":"512","name":"canonicalColumnKey bildet In Progress auf IN_PROGRESS ab"},{"id":"513","name":"canonicalColumnKey bildet In Review auf IN_REVIEW ab"},{"id":"514","name":"canonicalColumnKey bildet Done auf DONE ab"},{"id":"515","name":"canonicalColumnKey bildet   done   auf DONE ab"},{"id":"516","name":"canonicalColumnKey bildet In-Progress auf IN_PROGRESS ab"},{"id":"517","name":"canonicalColumnKey liefert für  undefined"},{"id":"518","name":"canonicalColumnKey liefert für Unbekannt undefined"},{"id":"519","name":"canonicalColumnKey liefert für Todo undefined"},{"id":"520","name":"canonicalColumnKey liefert für 123 undefined"},{"id":"521","name":"canonicalColumnKey liefert für QA undefined"},{"id":"522","name":"otherCanonicalColumns schließt die aktuelle Spalte aus"},{"id":"523","name":"otherCanonicalColumns schließt nicht-kanonische Spalten aus"},{"id":"524","name":"otherCanonicalColumns sortiert unabhängig von der Eingabereihenfolge nach position"},{"id":"525","name":"otherCanonicalColumns liefert auf einem Board ohne In Review die übrigen kanonischen Spalten in Positionsreihenfolge"},{"id":"526","name":"otherCanonicalColumns liefert mehrere Spalten mit demselben kanonischen Zustand alle"},{"id":"527","name":"otherCanonicalColumns liefert bei unbekannter currentColumnId alle kanonischen Spalten"},{"id":"528","name":"otherCanonicalColumns liefert bei nicht-kanonischer aktueller Spalte alle kanonischen Spalten"},{"id":"529","name":"otherCanonicalColumns lässt das übergebene columns-Array unverändert"}],"source":"import { describe, expect, it } from 'vitest'\nimport type { BoardColumn } from '../api/boards'\nimport {\n  canonicalColumnKey,\n  isDoneColumn,\n  neighbourColumns,\n  otherCanonicalColumns,\n} from './columnMeta'\n\ndescribe('isDoneColumn', () => {\n  it.each([\n    ['Done', true],\n    ['done', true],\n    ['Erledigt/DONE', true],\n    ['In Progress', false],\n    ['', false],\n  ])('erkennt %s als done=%s', (name, expected) => {\n    expect(isDoneColumn(name)).toBe(expected)\n  })\n})\n\ndescribe('neighbourColumns', () => {\n  const col = (id: number, position: number): BoardColumn => ({\n    id,\n    name: `Spalte ${id}`,\n    position,\n    wipLimit: null,\n  })\n  const columns = [col(10, 0), col(20, 1), col(30, 2)]\n\n  it('liefert für eine mittlere Spalte beide Nachbarn', () => {\n    expect(neighbourColumns(columns, 20)).toEqual({ left: columns[0], right: columns[2] })\n  })\n\n  it('liefert für die erste Spalte keinen linken Nachbarn', () => {\n    expect(neighbourColumns(columns, 10)).toEqual({ left: null, right: columns[1] })\n  })\n\n  it('liefert für die letzte Spalte keinen rechten Nachbarn', () => {\n    expect(neighbourColumns(columns, 30)).toEqual({ left: columns[1], right: null })\n  })\n\n  it('liefert bei einer einzigen Spalte gar keinen Nachbarn', () => {\n    expect(neighbourColumns([columns[0]], 10)).toEqual({ left: null, right: null })\n  })\n\n  it('liefert für eine unbekannte Spalte keinen Nachbarn', () => {\n    expect(neighbourColumns(columns, 999)).toEqual({ left: null, right: null })\n  })\n})\n\ndescribe('canonicalColumnKey', () => {\n  it.each([\n    ['Backlog', 'BACKLOG'],\n    ['Ready', 'READY'],\n    ['In Progress', 'IN_PROGRESS'],\n    ['In Review', 'IN_REVIEW'],\n    ['Done', 'DONE'],\n    ['  done  ', 'DONE'],\n    ['In-Progress', 'IN_PROGRESS'],\n  ])('bildet %s auf %s ab', (name, expected) => {\n    expect(canonicalColumnKey(name)).toBe(expected)\n  })\n\n  it.each([[''], ['Unbekannt'], ['Todo'], ['123'], ['QA']])(\n    'liefert für %s undefined',\n    (name) => {\n      expect(canonicalColumnKey(name)).toBeUndefined()\n    },\n  )\n})\n\ndescribe('otherCanonicalColumns', () => {\n  const col = (id: number, name: string, position: number): BoardColumn => ({\n    id,\n    name,\n    position,\n    wipLimit: null,\n  })\n\n  it('schließt die aktuelle Spalte aus', () => {\n    const columns = [col(1, 'Backlog', 0), col(2, 'Ready', 1), col(3, 'Done', 2)]\n    expect(otherCanonicalColumns(columns, 2).map((c) => c.id)).toEqual([1, 3])\n  })\n\n  it('schließt nicht-kanonische Spalten aus', () => {\n    const columns = [col(1, 'Backlog', 0), col(2, 'QA', 1), col(3, 'Done', 2)]\n    expect(otherCanonicalColumns(columns, 1).map((c) => c.name)).toEqual(['Done'])\n  })\n\n  it('sortiert unabhängig von der Eingabereihenfolge nach position', () => {\n    const columns = [col(3, 'Done', 2), col(1, 'Backlog', 0), col(2, 'Ready', 1)]\n    expect(otherCanonicalColumns(columns, 99).map((c) => c.name)).toEqual([\n      'Backlog',\n      'Ready',\n      'Done',\n    ])\n  })\n\n  it('liefert auf einem Board ohne In Review die übrigen kanonischen Spalten in Positionsreihenfolge', () => {\n    const columns = [\n      col(1, 'Backlog', 0),\n      col(2, 'Ready', 1),\n      col(3, 'In Progress', 2),\n      col(4, 'Done', 3),\n    ]\n    expect(otherCanonicalColumns(columns, 1).map((c) => c.name)).toEqual([\n      'Ready',\n      'In Progress',\n      'Done',\n    ])\n  })\n\n  it('liefert mehrere Spalten mit demselben kanonischen Zustand alle', () => {\n    const columns = [col(1, 'Backlog', 0), col(2, 'Done', 1), col(3, 'done!', 2)]\n    expect(otherCanonicalColumns(columns, 1).map((c) => c.id)).toEqual([2, 3])\n  })\n\n  it('liefert bei unbekannter currentColumnId alle kanonischen Spalten', () => {\n    const columns = [col(1, 'Backlog', 0), col(2, 'Ready', 1)]\n    expect(otherCanonicalColumns(columns, 999).map((c) => c.id)).toEqual([1, 2])\n  })\n\n  it('liefert bei nicht-kanonischer aktueller Spalte alle kanonischen Spalten', () => {\n    const columns = [col(1, 'QA', 0), col(2, 'Backlog', 1), col(3, 'Ready', 2)]\n    expect(otherCanonicalColumns(columns, 1).map((c) => c.id)).toEqual([2, 3])\n  })\n\n  it('lässt das übergebene columns-Array unverändert', () => {\n    const columns = [col(3, 'Done', 2), col(1, 'Backlog', 0), col(2, 'Ready', 1)]\n    otherCanonicalColumns(columns, 1)\n    expect(columns.map((c) => c.id)).toEqual([3, 1, 2])\n  })\n})\n"},"src/lib/useProjectIdeaEvents.test.tsx":{"tests":[{"id":"530","name":"useProjectIdeaEvents öffnet
