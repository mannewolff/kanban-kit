den SSE-Stream für den Ideen-Pool des Projekts"},{"id":"531","name":"useProjectIdeaEvents ruft onChange debounced bei einem Event (mehrere Events → ein Refetch)"},{"id":"532","name":"useProjectIdeaEvents schließt den Stream beim Unmount und feuert danach nicht mehr"},{"id":"533","name":"useProjectIdeaEvents schließt den alten und öffnet einen neuen Stream bei Projektwechsel"},{"id":"534","name":"useProjectIdeaEvents öffnet keinen Stream bei ungültiger Projekt-ID"},{"id":"535","name":"useProjectIdeaEvents nutzt die aktuelle onChange-Referenz ohne den Stream neu zu öffnen"}],"source":"import { act, renderHook } from '@testing-library/react'\nimport { afterEach, beforeEach, describe, expect, it, vi } from 'vitest'\nimport { useProjectIdeaEvents } from './useProjectIdeaEvents'\n\nclass MockEventSource {\n  static instances: MockEventSource[] = []\n  url: string\n  closed = false\n  private readonly listeners = new Map<"+"string, Set<"+"(e: Event) => void>>()\n  constructor(url: string) {\n    this.url = url\n    MockEventSource.instances.push(this)\n  }\n  addEventListener(type: string, cb: (e: Event) => void): void {\n    const set = this.listeners.get(type) ?? new Set()\n    set.add(cb)\n    this.listeners.set(type, set)\n  }\n  removeEventListener(type: string, cb: (e: Event) => void): void {\n    this.listeners.get(type)?.delete(cb)\n  }\n  close(): void {\n    this.closed = true\n  }\n  emit(type: string): void {\n    this.listeners.get(type)?.forEach((cb) => cb(new Event(type)))\n  }\n}\n\ndescribe('useProjectIdeaEvents', () => {\n  beforeEach(() => {\n    MockEventSource.instances = []\n    vi.stubGlobal('EventSource', MockEventSource)\n    vi.useFakeTimers()\n  })\n  afterEach(() => {\n    vi.useRealTimers()\n    vi.unstubAllGlobals()\n  })\n\n  it('öffnet den SSE-Stream für den Ideen-Pool des Projekts', () => {\n    renderHook(() => useProjectIdeaEvents(7, vi.fn()))\n    expect(MockEventSource.instances).toHaveLength(1)\n    expect(MockEventSource.instances[0].url).toBe('/api/projects/7/ideas/events')\n  })\n\n  it('ruft onChange debounced bei einem Event (mehrere Events → ein Refetch)', () => {\n    const onChange = vi.fn()\n    renderHook(() => useProjectIdeaEvents(7, onChange))\n    const es = MockEventSource.instances[0]\n\n    act(() => {\n      es.emit('project-ideas-changed')\n      es.emit('project-ideas-changed')\n    })\n    expect(onChange).not.toHaveBeenCalled() // erst nach Ablauf des Debounce\n\n    act(() => vi.advanceTimersByTime(250))\n    expect(onChange).toHaveBeenCalledTimes(1)\n  })\n\n  it('schließt den Stream beim Unmount und feuert danach nicht mehr', () => {\n    const onChange = vi.fn()\n    const { unmount } = renderHook(() => useProjectIdeaEvents(7, onChange))\n    const es = MockEventSource.instances[0]\n\n    act(() => es.emit('project-ideas-changed')) // Debounce-Timer läuft\n    unmount()\n\n    expect(es.closed).toBe(true)\n    act(() => vi.advanceTimersByTime(250))\n    expect(onChange).not.toHaveBeenCalled() // Timer beim Teardown verworfen\n  })\n\n  it('schließt den alten und öffnet einen neuen Stream bei Projektwechsel', () => {\n    const { rerender } = renderHook(({ id }) => useProjectIdeaEvents(id, vi.fn()), {\n      initialProps: { id: 7 },\n    })\n    const first = MockEventSource.instances[0]\n\n    rerender({ id: 8 })\n\n    expect(first.closed).toBe(true)\n    expect(MockEventSource.instances).toHaveLength(2)\n    expect(MockEventSource.instances[1].url).toBe('/api/projects/8/ideas/events')\n  })\n\n  it('öffnet keinen Stream bei ungültiger Projekt-ID', () => {\n    renderHook(() => useProjectIdeaEvents(Number.NaN, vi.fn()))\n    renderHook(() => useProjectIdeaEvents(0, vi.fn()))\n    expect(MockEventSource.instances).toHaveLength(0)\n  })\n\n  it('nutzt die aktuelle onChange-Referenz ohne den Stream neu zu öffnen', () => {\n    const first = vi.fn()\n    const second = vi.fn()\n    const { rerender } = renderHook(({ cb }) => useProjectIdeaEvents(7, cb), {\n      initialProps: { cb: first },\n    })\n\n    rerender({ cb: second })\n    expect(MockEventSource.instances).toHaveLength(1) // kein neuer Stream\n\n    const es = MockEventSource.instances[0]\n    act(() => {\n      es.emit('project-ideas-changed')\n      vi.advanceTimersByTime(250)\n    })\n    expect(second).toHaveBeenCalledTimes(1)\n    expect(first).not.toHaveBeenCalled()\n  })\n})\n"},"src/lib/boardHiddenEpics.test.ts":{"tests":[{"id":"536","name":"hiddenEpicsStorageKey bildet den Schlüssel je Board im bestehenden manban-Namensraum"},{"id":"537","name":"hiddenEpicsStorageKey trennt die Boards voneinander"},{"id":"538","name":"leseAusgeblendet liefert ohne Eintrag die leere Menge"},{"id":"539","name":"leseAusgeblendet liest die gespeicherten IDs des eigenen Boards"},{"id":"540","name":"leseAusgeblendet liefert die leere Menge, wenn localStorage nicht verfügbar ist"},{"id":"541","name":"leseAusgeblendet liefert bei ungültigem JSON die leere Menge statt zu scheitern"},{"id":"542","name":"schreibeAusgeblendet schreibt eine nicht-leere Menge als JSON-Array"},{"id":"543","name":"schreibeAusgeblendet löscht den Schlüssel bei leerer Menge, statt ein leeres Array zu hinterlassen"},{"id":"544","name":"schreibeAusgeblendet schluckt ein scheiterndes setItem"},{"id":"545","name":"schreibeAusgeblendet schluckt ein scheiterndes removeItem"}],"source":"import { afterEach, describe, expect, it, vi } from 'vitest'\nimport { hiddenEpicsStorageKey, leseAusgeblendet, schreibeAusgeblendet } from './boardHiddenEpics'\n\ndescribe('hiddenEpicsStorageKey', () => {\n  it('bildet den Schlüssel je Board im bestehenden manban-Namensraum', () => {\n    expect(hiddenEpicsStorageKey(1)).toBe('manban.boardHiddenEpics.1')\n  })\n\n  it('trennt die Boards voneinander', () => {\n    expect(hiddenEpicsStorageKey(7)).not.toBe(hiddenEpicsStorageKey(1))\n  })\n})\n\n/**\n * localStorage-Stub über eine echte Map — vorbelegbar und nach dem Test wieder auslesbar. Nötig\n * statt des nativen `localStorage`: Unter Node 26 ist es deaktiviert (siehe `src/test/setup.ts`),\n * ein Test gegen das globale Objekt wäre „grün lokal, rot in CI\".\n */\nconst stubStore = (entries: [string, string][]) => {\n  const store = new Map<"+"string, string>(entries)\n  vi.stubGlobal('localStorage', {\n    getItem: (k: string) => store.get(k) ?? null,\n    setItem: (k: string, v: string) => { store.set(k, v) },\n    removeItem: (k: string) => { store.delete(k) },\n    clear: () => store.clear(), key: () => null, length: 0,\n  })\n  return store\n}\n\nafterEach(() => vi.unstubAllGlobals())\n\ndescribe('leseAusgeblendet', () => {\n  it('liefert ohne Eintrag die leere Menge', () => {\n    stubStore([])\n    expect([...leseAusgeblendet(1)]).toEqual([])\n  })\n\n  it('liest die gespeicherten IDs des eigenen Boards', () => {\n    stubStore([[hiddenEpicsStorageKey(1), JSON.stringify([9, 8])]])\n    expect([...leseAusgeblendet(1)].sort()).toEqual([8, 9])\n  })\n\n  it('liefert die leere Menge, wenn localStorage nicht verfügbar ist', () => {\n    vi.stubGlobal('localStorage', {\n      getItem: () => { throw new Error('storage disabled') },\n      setItem: () => { throw new Error('storage disabled') },\n      removeItem: () => { throw new Error('storage disabled') },\n      clear: () => {}, key: () => null, length: 0,\n    })\n    expect([...leseAusgeblendet(1)]).toEqual([])\n  })\n\n  it('liefert bei ungültigem JSON die leere Menge statt zu scheitern', () => {\n    stubStore([[hiddenEpicsStorageKey(1), 'kein json']])\n    expect([...leseAusgeblendet(1)]).toEqual([])\n  })\n})\n\ndescribe('schreibeAusgeblendet', () => {\n  it('schreibt eine nicht-leere Menge als JSON-Array', () => {\n    const store = stubStore([])\n    schreibeAusgeblendet(1, new Set([9, 8]))\n    expect(JSON.parse(store.get(hiddenEpicsStorageKey(1)) ?? '[]')).toEqual([9, 8])\n  })\n\n  it('löscht den Schlüssel bei leerer Menge, statt ein leeres Array zu hinterlassen', () => {\n    // Ein zurückbleibendes `[]` wäre kein Fehler beim Lesen, aber ein Eintrag ohne Aussage: Er\n    // stünde für „nichts ausgeblendet\" — genau das, was auch ein fehlender Schlüssel bedeutet.\n    const store = stubStore([[hiddenEpicsStorageKey(1), JSON.stringify([9])]])\n    schreibeAusgeblendet(1, new Set())\n    expect(store.has(hiddenEpicsStorageKey(1))).toBe(false)\n  })\n\n  it('schluckt ein scheiterndes setItem', () => {\n    vi.stubGlobal('localStorage', {\n      getItem: () => null,\n      setItem: () => { throw new Error('storage disabled') },\n      removeItem: () => { throw new Error('storage disabled') },\n      clear: () => {}, key: () => null, length: 0,\n    })\n    expect(() => schreibeAusgeblendet(1, new Set([9]))).not.toThrow()\n  })\n\n  it('schluckt ein scheiterndes removeItem', () => {\n    vi.stubGlobal('localStorage', {\n      getItem: () => null,\n      setItem: () => { throw new Error('storage disabled') },\n      removeItem: () => { throw new Error('storage disabled') },\n      clear: () => {}, key: () => null, length: 0,\n    })\n    expect(() => schreibeAusgeblendet(1, new Set())).not.toThrow()\n  })\n})\n"},"src/lib/useBoardEvents.test.tsx":{"tests":[{"id":"546","name":"useBoardEvents öffnet den SSE-Stream für das Board"},{"id":"547","name":"useBoardEvents ruft onChange debounced bei einem Event (mehrere Events → ein Refetch)"},{"id":"548","name":"useBoardEvents schließt den Stream beim Unmount und feuert danach nicht mehr"},{"id":"549","name":"useBoardEvents schließt den alten und öffnet einen neuen Stream bei Board-Wechsel"},{"id":"550","name":"useBoardEvents öffnet keinen Stream bei ungültiger Board-ID"},{"id":"551","name":"useBoardEvents nutzt die aktuelle onChange-Referenz ohne den Stream neu zu öffnen"}],"source":"import { act, renderHook } from '@testing-library/react'\nimport { afterEach, beforeEach, describe, expect, it, vi } from 'vitest'\nimport { useBoardEvents } from './useBoardEvents'\n\nclass MockEventSource {\n  static instances: MockEventSource[] = []\n  url: string\n  closed = false\n  private readonly listeners = new Map<"+"string, Set<"+"(e: Event) => void>>()\n  constructor(url: string) {\n    this.url = url\n    MockEventSource.instances.push(this)\n  }\n  addEventListener(type: string, cb: (e: Event) => void): void {\n    const set = this.listeners.get(type) ?? new Set()\n    set.add(cb)\n    this.listeners.set(type, set)\n  }\n  removeEventListener(type: string, cb: (e: Event) => void): void {\n    this.listeners.get(type)?.delete(cb)\n  }\n  close(): void {\n    this.closed = true\n  }\n  emit(type: string): void {\n    this.listeners.get(type)?.forEach((cb) => cb(new Event(type)))\n  }\n}\n\ndescribe('useBoardEvents', () => {\n  beforeEach(() => {\n    MockEventSource.instances = []\n    vi.stubGlobal('EventSource', MockEventSource)\n    vi.useFakeTimers()\n  })\n  afterEach(() => {\n    vi.useRealTimers()\n    vi.unstubAllGlobals()\n  })\n\n  it('öffnet den SSE-Stream für das Board', () => {\n    renderHook(() => useBoardEvents(7, vi.fn()))\n    expect(MockEventSource.instances).toHaveLength(1)\n    expect(MockEventSource.instances[0].url).toBe('/api/boards/7/events')\n  })\n\n  it('ruft onChange debounced bei einem Event (mehrere Events → ein Refetch)', () => {\n    const onChange = vi.fn()\n    renderHook(() => useBoardEvents(7, onChange))\n    const es = MockEventSource.instances[0]\n\n    act(() => {\n      es.emit('board-changed')\n      es.emit('board-changed')\n    })\n    expect(onChange).not.toHaveBeenCalled() // erst nach Ablauf des Debounce\n\n    act(() => vi.advanceTimersByTime(250))\n    expect(onChange).toHaveBeenCalledTimes(1)\n  })\n\n  it('schließt den Stream beim Unmount und feuert danach nicht mehr', () => {\n    const onChange = vi.fn()\n    const { unmount } = renderHook(() => useBoardEvents(7, onChange))\n    const es = MockEventSource.instances[0]\n\n    act(() => es.emit('board-changed')) // Debounce-Timer läuft\n    unmount()\n\n    expect(es.closed).toBe(true)\n    act(() => vi.advanceTimersByTime(250))\n    expect(onChange).not.toHaveBeenCalled() // Timer beim Teardown verworfen\n  })\n\n  it('schließt den alten und öffnet einen neuen Stream bei Board-Wechsel', () => {\n    const { rerender } = renderHook(({ id }) => useBoardEvents(id, vi.fn()), {\n      initialProps: { id: 7 },\n    })\n    const first = MockEventSource.instances[0]\n\n    rerender({ id: 8 })\n\n    expect(first.closed).toBe(true)\n    expect(MockEventSource.instances).toHaveLength(2)\n    expect(MockEventSource.instances[1].url).toBe('/api/boards/8/events')\n  })\n\n  it('öffnet keinen Stream bei ungültiger Board-ID', () => {\n    renderHook(() => useBoardEvents(Number.NaN, vi.fn()))\n    renderHook(() => useBoardEvents(0, vi.fn()))\n    expect(MockEventSource.instances).toHaveLength(0)\n  })\n\n  it('nutzt die aktuelle onChange-Referenz ohne den Stream neu zu öffnen', () => {\n    const first = vi.fn()\n    const second = vi.fn()\n    const { rerender } = renderHook(({ cb }) => useBoardEvents(7, cb), {\n      initialProps: { cb: first },\n    })\n\n    rerender({ cb: second })\n    expect(MockEventSource.instances).toHaveLength(1) // kein neuer Stream\n\n    const es = MockEventSource.instances[0]\n    act(() => {\n      es.emit('board-changed')\n      vi.advanceTimersByTime(250)\n    })\n    expect(second).toHaveBeenCalledTimes(1)\n    expect(first).not.toHaveBeenCalled()\n  })\n})\n"},"src/lib/variablenAufloesen.test.ts":{"tests":[{"id":"552","name":"variablenAufloesen ersetzt einen Verweis durch den hinterlegten Wert"},{"id":"553","name":"variablenAufloesen ersetzt ihn auch mit Rückfallwert und bevorzugt den hinterlegten Wert"},{"id":"554","name":"variablenAufloesen ersetzt Verweise mitten in einer Zeichenkette, auch mehrere"},{"id":"555","name":"variablenAufloesen liest einen Rückfallwert mit eigenen Klammern vollständig"},{"id":"556","name":"variablenAufloesen überliest Klammern des Rückfallwerts auch dann, wenn der hinterlegte Wert gewinnt"},{"id":"557","name":"variablenAufloesen nimmt ohne hinterlegten Wert den Rückfallwert"},{"id":"558","name":"variablenAufloesen lässt einen Verweis ohne hinterlegten Wert und ohne Rückfall stehen"},{"id":"559","name":"variablenAufloesen lässt Zeichenketten ohne Verweis unverändert"},{"id":"560","name":"variablenAufloesen endet bei einem Verweis ohne schließende Klammer und lässt ihn unverändert stehen"},{"id":"561","name":"variablenAufloesen endet auch, wenn im Rückfallwert eine Klammer offen bleibt"},{"id":"562","name":"variablenAufloesen löst verschachtelte Objekte und Listen auf, ohne das Original zu verändern"},{"id":"563","name":"variablenAufloesen lässt Funktionen unverändert durch"},{"id":"564","name":"variablenAufloesen verträgt undefined"}],"source":"import { describe, expect, it } from 'vitest'\nimport { variablenAufloesen } from './variablenAufloesen'\n\nconst WERTE = { '--mb-a': '#AAAAAA', '--mb-b': 'rgba(1,2,3,0.5)' }\n\ndescribe('variablenAufloesen', () => {\n  it('ersetzt einen Verweis durch den hinterlegten Wert', () => {\n    expect(variablenAufloesen('var(--mb-a)', WERTE)).toBe('#AAAAAA')\n  })\n\n  it('ersetzt ihn auch mit Rückfallwert und bevorzugt den hinterlegten Wert', () => {\n    expect(variablenAufloesen('var(--mb-a, #000000)', WERTE)).toBe('#AAAAAA')\n  })\n\n  it('ersetzt Verweise mitten in einer Zeichenkette, auch mehrere', () => {\n    expect(variablenAufloesen('1px solid var(--mb-a), 0 0 0 var(--mb-b)', WERTE)).toBe(\n      '1px solid #AAAAAA, 0 0 0 rgba(1,2,3,0.5)',\n    )\n  })\n\n  it('liest einen Rückfallwert mit eigenen Klammern vollständig', () => {\n    // MUI hängt an jede Variable ihren hellen Wert an; Schatten tragen darin `rgba(…)`.\n    expect(variablenAufloesen('var(--mb-x, 0 1px rgba(4,5,6,0.1)) x', WERTE)).toBe('0 1px rgba(4,5,6,0.1) x')\n  })\n\n  it('überliest Klammern des Rückfallwerts auch dann, wenn der hinterlegte Wert gewinnt', () => {\n    // Zählte die öffnende Klammer von `rgba(` nicht mit, endete der Verweis an deren schließender\n    // Klammer — die zweite bliebe als `)` hinter dem eingesetzten Wert stehen.\n    expect(variablenAufloesen('var(--mb-a, rgba(1,2,3,0.5)) x', WERTE)).toBe('#AAAAAA x')\n  })\n\n  it('nimmt ohne hinterlegten Wert den Rückfallwert', () => {\n    expect(variablenAufloesen('var(--mb-x, #123456)', WERTE)).toBe('#123456')\n  })\n\n  it('lässt einen Verweis ohne hinterlegten Wert und ohne Rückfall stehen', () => {\n    expect(variablenAufloesen('var(--mb-x)', WERTE)).toBe('var(--mb-x)')\n  })\n\n  it('lässt Zeichenketten ohne Verweis unverändert', () => {\n    expect(variablenAufloesen('2px solid red', WERTE)).toBe('2px solid red')\n  })\n\n  it('endet bei einem Verweis ohne schließende Klammer und lässt ihn unverändert stehen', () => {\n    // Ohne Abbruch am Textende zählte die Klammertiefe nie herunter (#977): ein Tippfehler im Theme\n    // fröre die Seite beim Modulimport ein, statt nur diesen einen Wert stehen zu lassen.\n    expect(variablenAufloesen('1px solid var(--mb-a', WERTE)).toBe('1px solid var(--mb-a')\n  })\n\n  it('endet auch, wenn im Rückfallwert eine Klammer offen bleibt', () => {\n    expect(variablenAufloesen('var(--mb-a, rgba(1,2', WERTE)).toBe('var(--mb-a, rgba(1,2')\n  })\n\n  it('löst verschachtelte Objekte und Listen auf, ohne das Original zu verändern', () => {\n    const original = { a: { b: 'var(--mb-a)', c: [1, 'var(--mb-b)'] }, d: 4, e: null, f: true }\n    const aufgeloest = variablenAufloesen(original, WERTE)\n\n    expect(aufgeloest).toEqual({ a: { b: '#AAAAAA', c: [1, 'rgba(1,2,3,0.5)'] }, d: 4, e: null, f: true })\n    expect(original.a.b).toBe('var(--mb-a)')\n  })\n\n  it('lässt Funktionen unverändert durch', () => {\n    const funktion = () => 'var(--mb-a)'\n    expect(variablenAufloesen({ root: funktion }, WERTE).root).toBe(funktion)\n  })\n\n  it('verträgt undefined', () => {\n    expect(variablenAufloesen(undefined, WERTE)).toBeUndefined()\n  })\n})\n"},"src/lib/cardEpic.test.ts":{"tests":[{"id":"565","name":"epicOfCard findet das Vorhaben, zu dem die Karte über die Herkunft gehört"},{"id":"566","name":"epicOfCard findet das Vorhaben, dem die Karte ausdrücklich zugeordnet ist"},{"id":"567","name":"epicOfCard gibt der Herkunft den Vorrang vor der ausdrücklichen Zuordnung"},{"id":"568","name":"epicOfCard liefert undefined, wenn die Karte in keinem Vorhaben steht"},{"id":"569","name":"epicOfCard liefert undefined ohne jedes Vorhaben"},{"id":"570","name":"epicOfCard wählt bei zwei über die Herkunft erreichten Vorhaben die kleinere Nummer"},{"id":"571","name":"epicOfCard wählt bei zwei ausdrücklichen Zuordnungen die kleinere Nummer"},{"id":"572","name":"epicOfCard liefert undefined für eine Karte mit parentId, die in keinem memberNumbers steht"}],"source":"import { describe, expect, it } from 'vitest'\nimport { epicOfCard } from './cardEpic'\nimport type { Card } from '../api/cards'\nimport type { Epic } from '../api/epics'\n\nfunction card(number: number, parentId: number | null = null): Card {\n  return {\n    id: number * 100,\n    boardId: 1,\n    columnId: 1,\n    number,\n    title: `Karte ${number}`,\n    description: null,\n    excerpt: null,\n    positionInColumn: 0,\n    archived: false,\n    ideaStored: false,\n    movedToDoneAt: null,\n    dependencies: [],\n    type: 'CARD',\n    parentId,\n    shortcode: null,\n    assignees: [],\n    dueDate: null,\n    labels: [],\n    derivedFrom: null,\n  }\n}\n\nfunction epic(number: number, memberNumbers: number[], rootNumbers: number[]): Epic {\n  return {\n    id: number * 10,\n    number,\n    title: `Vorhaben ${number}`,\n    description: null,\n    shortcode: `V${number}`,\n    done: 0,\n    total: memberNumbers.length,\n    memberNumbers,\n    rootNumbers,\n    requirementCardNumber: null,\n  }\n}\n\ndescribe('epicOfCard', () => {\n  it('findet das Vorhaben, zu dem die Karte über die Herkunft gehört', () => {\n    const treffer = epicOfCard(card(5), [epic(70, [5], [])])\n    expect(treffer?.number).toBe(70)\n  })\n\n  it('findet das Vorhaben, dem die Karte ausdrücklich zugeordnet ist', () => {\n    const treffer = epicOfCard(card(5, 700), [epic(70, [5], [5])])\n    expect(treffer?.number).toBe(70)\n  })\n\n  it('gibt der Herkunft den Vorrang vor der ausdrücklichen Zuordnung', () => {\n    const ausdruecklich = epic(70, [5], [5])\n    const ueberHerkunft = epic(80, [5], [])\n    expect(epicOfCard(card(5, 700), [ausdruecklich, ueberHerkunft])?.number).toBe(80)\n    // Reihenfolge der Vorhaben-Liste darf das Ergebnis nicht drehen.\n    expect(epicOfCard(card(5, 700), [ueberHerkunft, ausdruecklich])?.number).toBe(80)\n  })\n\n  it('liefert undefined, wenn die Karte in keinem Vorhaben steht', () => {\n    expect(epicOfCard(card(5), [epic(70, [1, 2], [1])])).toBeUndefined()\n  })\n\n  it('liefert undefined ohne jedes Vorhaben', () => {\n    expect(epicOfCard(card(5), [])).toBeUndefined()\n  })\n\n  it('wählt bei zwei über die Herkunft erreichten Vorhaben die kleinere Nummer', () => {\n    const treffer = epicOfCard(card(5), [epic(80, [5], []), epic(70, [5], [])])\n    expect(treffer?.number).toBe(70)\n  })\n\n  it('wählt bei zwei ausdrücklichen Zuordnungen die kleinere Nummer', () => {\n    const treffer = epicOfCard(card(5, 800), [epic(80, [5], [5]), epic(70, [5], [5])])\n    expect(treffer?.number).toBe(70)\n  })\n\n  it('liefert undefined für eine Karte mit parentId, die in keinem memberNumbers steht', () => {\n    // Der Fall der archivierten Karte: Der Server filtert `archived` und `ideaStored` aus der\n    // Zugehörigkeit (`EpicMembership.zaehlt()`), die Anzeige folgt ihm. Der alte\n    // `parentId`-Lookup hätte hier noch ein Vorhaben gezeigt — der Unterschied ist gewollt\n    // (Entscheidung Manne, 2026-09-01).\n    const archiviert = { ...card(5, 700), archived: true }\n    expect(epicOfCard(archiviert, [epic(70, [], [])])).toBeUndefined()\n  })\n})\n"},"src/lib/hiddenCards.test.ts":{"tests":[{"id":"573","name":"hiddenCardNumbers blendet alle memberNumbers eines ausgeblendeten Vorhabens aus"},{"id":"574","name":"hiddenCardNumbers blendet zwei gleichzeitig ausgeblendete Vorhaben aus"},{"id":"575","name":"hiddenCardNumbers zählt eine Karte in zwei ausgeblendeten Vorhaben nur einmal"},{"id":"576","name":"hiddenCardNumbers liefert für ein ausgeblendetes, aber gelöschtes Vorhaben einen leeren Beitrag"},{"id":"577","name":"hiddenCardNumbers blendet für ein Vorhaben mit leerem memberNumbers nichts aus"},{"id":"578","name":"hiddenCardNumbers verdeckt eine Karte ohne Vorhaben bei epicFilter == null nie"},{"id":"579","name":"hiddenCardNumbers rechnet die Filter-Achse über parentId, nicht über memberNumbers"},{"id":"580","name":"hiddenCardNumbers vereinigt beide Achsen: Ausblenden unterläuft den Filter nicht"}],"source":"import { describe, expect, it } from 'vitest'\nimport { hiddenCardNumbers } from './hiddenCards'\n\nfunction card(number: number, parentId: number | null = null) {\n  return { number, parentId }\n}\n\nfunction epic(id: number, memberNumbers: number[]) {\n  return { id, memberNumbers }\n}\n\ndescribe('hiddenCardNumbers', () => {\n  it('blendet alle memberNumbers eines ausgeblendeten Vorhabens aus', () => {\n    const cards = [card(1, 10), card(2, 10), card(3)]\n    const epics = [epic(10, [1, 2])]\n    const hidden = hiddenCardNumbers(cards, epics, new Set([10]), null)\n    expect([...hidden].sort()).toEqual([1, 2])\n  })\n\n  it('blendet zwei gleichzeitig ausgeblendete Vorhaben aus', () => {\n    const cards = [card(1, 10), card(2, 20), card(3)]\n    const epics = [epic(10, [1]), epic(20, [2])]\n    const hidden = hiddenCardNumbers(cards, epics, new Set([10, 20]), null)\n    expect([...hidden].sort()).toEqual([1, 2])\n  })\n\n  it('zählt eine Karte in zwei ausgeblendeten Vorhaben nur einmal', () => {\n    const cards = [card(1, 10)]\n    const epics = [epic(10, [1]), epic(20, [1])]\n    const hidden = hiddenCardNumbers(cards, epics, new Set([10, 20]), null)\n    expect([...hidden]).toEqual([1])\n  })\n\n  it('liefert für ein ausgeblendetes, aber gelöschtes Vorhaben einen leeren Beitrag', () => {\n    const cards = [card(1, 10)]\n    const epics = [epic(10, [1])]\n    const hidden = hiddenCardNumbers(cards, epics, new Set([99]), null)\n    expect([...hidden]).toEqual([])\n  })\n\n  it('blendet für ein Vorhaben mit leerem memberNumbers nichts aus', () => {\n    const cards = [card(1, 10)]\n    const epics = [epic(10, [])]\n    const hidden = hiddenCardNumbers(cards, epics, new Set([10]), null)\n    expect([...hidden]).toEqual([])\n  })\n\n  it('verdeckt eine Karte ohne Vorhaben bei epicFilter == null nie', () => {\n    const cards = [card(1), card(2, 10)]\n    const epics = [epic(10, [2])]\n    const hidden = hiddenCardNumbers(cards, epics, new Set([10]), null)\n    expect(hidden.has(1)).toBe(false)\n  })\n\n  it('rechnet die Filter-Achse über parentId, nicht über memberNumbers', () => {\n    // Karte 2 gehört über die Herkunft zu Vorhaben 10 (steht in memberNumbers),\n    // hängt aber an Vorhaben 20 — bei Filter auf 10 bleibt sie verborgen.\n    const cards = [card(1, 10), card(2, 20)]\n    const epics = [epic(10, [1, 2]), epic(20, [2])]\n    const hidden = hiddenCardNumbers(cards, epics, new Set(), 10)\n    expect(hidden.has(2)).toBe(true)\n    expect(hidden.has(1)).toBe(false)\n  })\n\n  it('vereinigt beide Achsen: Ausblenden unterläuft den Filter nicht', () => {\n    const cards = [card(1, 10), card(2, 10), card(3, 20)]\n    const epics = [epic(10, [1, 2]), epic(20, [2, 3])]\n    const hidden = hiddenCardNumbers(cards, epics, new Set([20]), 10)\n    // Karte 2 passt zum Filter (parentId 10), steckt aber im ausgeblendeten Vorhaben 20.\n    expect([...hidden].sort()).toEqual([2, 3])\n  })\n})\n"},"src/lib/statusColors.test.ts":{"tests":[{"id":"581","name":"statusColors leitet je Spaltennamen den Verweis auf das passende Farbset ab"},{"id":"582","name":"statusColors liefert Fläche, Text und Punkt desselben Sets"},{"id":"583","name":"statusColors fällt für unbekannte Spalten auf Neutral zurück"},{"id":"584","name":"statusColors führt archivierte Karten in ihrem eigenen Set"},{"id":"585","name":"statusColors setzt die Punkte hell auf die Melder des Entwurfs"},{"id":"586","name":"statusColors führt in beiden Erscheinungsbildern dieselben Sets mit Hexwerten"},{"id":"587","name":"statusColors exportiert keine Nicht-Status-Tokens"}],"source":"import { describe, expect, it } from 'vitest'\nimport * as statusColorsModule from './statusColors'\nimport { ARCHIVED_STATUS_COLOR, STATUS_FARBWERTE, statusColors } from './statusColors'\n\ndescribe('statusColors', () => {\n  // Seit #952 liefert das Modul Variablen-Verweise statt Hexwerten: Die Signatur bleibt\n  // „Zeichenkette rein, Zeichenkette raus\", und das Erscheinungsbild entscheidet die Media-Query.\n  // Die Werte dahinter prüft `theme.test.ts` je Erscheinungsbild.\n  it('leitet je Spaltennamen den Verweis auf das passende Farbset ab', () => {\n    expect(statusColors('Backlog').dot).toBe('var(--mb-palette-status-backlog-dot)')\n    expect(statusColors('Ready').dot).toBe('var(--mb-palette-status-ready-dot)')\n    expect(statusColors('In Progress').dot).toBe('var(--mb-palette-status-progress-dot)')\n    expect(statusColors('In Review').dot).toBe('var(--mb-palette-status-review-dot)')\n    expect(statusColors('Done').dot).toBe('var(--mb-palette-status-done-dot)')\n  })\n\n  it('liefert Fläche, Text und Punkt desselben Sets', () => {\n    expect(statusColors('Done')).toEqual({\n      bg: 'var(--mb-palette-status-done-bg)',\n      text: 'var(--mb-palette-status-done-text)',\n      dot: 'var(--mb-palette-status-done-dot)',\n    })\n  })\n\n  it('fällt für unbekannte Spalten auf Neutral zurück', () => {\n    expect(statusColors('Irgendwas').dot).toBe('var(--mb-palette-status-neutral-dot)')\n  })\n\n  it('führt archivierte Karten in ihrem eigenen Set', () => {\n    expect(ARCHIVED_STATUS_COLOR.dot).toBe('var(--mb-palette-status-archived-dot)')\n  })\n\n  it('setzt die Punkte hell auf die Melder des Entwurfs', () => {\n    expect(STATUS_FARBWERTE.light.done.dot).toBe('#2E8B4C')\n    expect(STATUS_FARBWERTE.light.review.dot).toBe('#A17113')\n    expect(STATUS_FARBWERTE.light.progress.dot).toBe('#2F6FC9')\n    for (const set of ['ready', 'backlog', 'neutral', 'archived'] as const) {\n      expect(STATUS_FARBWERTE.light[set].dot).toBe('#757B86')\n    }\n  })\n\n  it('führt in beiden Erscheinungsbildern dieselben Sets mit Hexwerten', () => {\n    expect(Object.keys(STATUS_FARBWERTE.dark)).toEqual(Object.keys(STATUS_FARBWERTE.light))\n    for (const erscheinungsbild of [STATUS_FARBWERTE.light, STATUS_FARBWERTE.dark]) {\n      for (const set of Object.values(erscheinungsbild)) {\n        expect(Object.values(set).every((wert) => /^#[0-9A-F]{6}$/.test(wert))).toBe(true)\n      }\n    }\n  })\n\n  // Regressionsschutz gegen die Rückkehr der zweiten Farbquelle (#648, E1/E2): Das Modul trägt\n  // ausschließlich Status-Farben. Jedes weitere Token gehört ins Theme, sonst laufen zwei\n  // Farbquellen auseinander, ohne dass ein Test es merkt.\n  it('exportiert keine Nicht-Status-Tokens', () => {\n    expect(Object.keys(statusColorsModule).sort()).toEqual(['ARCHIVED_STATUS_COLOR', 'STATUS_FARBWERTE', 'statusColors'])\n  })\n})\n"},"src/lib/epicMeta.test.ts":{"tests":[{"id":"588","name":"epicShortcode nutzt ein explizit gesetztes Kürzel"},{"id":"589","name":"epicShortcode leitet Initialen aus dem Titel ab (max. 3)"},{"id":"590","name":"epicColor ist stabil pro Epic-ID"},{"id":"591","name":"epicColor liefert einen Verweis auf den Farbton eines Palettenplatzes"},{"id":"592","name":"epicColor verteilt verschiedene Vorhaben auf verschiedene Plätze"},{"id":"593","name":"epicTint liefert für dieselbe ID den Tint-Verweis desselben Palettenplatzes"},{"id":"594","name":"epicTint hängt kein Alpha-Suffix an einen Farbwert"},{"id":"595","name":"EPIC_FARBWERTE führt in beiden Erscheinungsbildern die vier Schild-Töne des Entwurfs mit Farbton und Tint"},{"id":"596","name":"EPIC_FARBWERTE folgt der Reihenfolge des Entwurfs: Kupfer, Stahl, Grün, Bernstein (Z. 787–790)"},{"id":"597","name":"EPIC_FARBWERTE bildet den Tint wie das Schild des Entwurfs: der Farbton zu 13 %"}],"source":"import { describe, expect, it } from 'vitest'\nimport { EPIC_FARBWERTE, epicColor, epicShortcode, epicTint } from './epicMeta'\n\ndescribe('epicShortcode', () => {\n  it('nutzt ein explizit gesetztes Kürzel', () => {\n    expect(epicShortcode('Irgendein Titel', 'AUTH')).toBe('AUTH')\n  })\n\n  it('leitet Initialen aus dem Titel ab (max. 3)', () => {\n    expect(epicShortcode('Zehn Tage Workshop IT')).toBe('ZTW')\n    expect(epicShortcode('   ', null)).toBe('VORH')\n  })\n})\n\ndescribe('epicColor', () => {\n  it('ist stabil pro Epic-ID', () => {\n    expect(epicColor(7)).toBe(epicColor(7))\n  })\n\n  // Seit #952 ein Variablen-Verweis: Die Farbe schaltet mit dem Erscheinungsbild, die Signatur\n  // bleibt dieselbe. Welcher Wert dahinter liegt, prüft `theme.test.ts`.\n  it('liefert einen Verweis auf den Farbton eines Palettenplatzes', () => {\n    expect(epicColor(7)).toMatch(/^var\\(--mb-palette-epic-[0-3]-hue\\)$/)\n  })\n\n  it('verteilt verschiedene Vorhaben auf verschiedene Plätze', () => {\n    const plaetze = new Set(Array.from({ length: 40 }, (_, i) => epicColor(i)))\n    expect(plaetze.size).toBe(EPIC_FARBWERTE.light.length)\n  })\n})\n\ndescribe('epicTint', () => {\n  // Bis #952 rechnete `EpicBadge` die getönte Fläche als `${hue}22` — Hexwert plus Alpha-Suffix.\n  // Auf einem Variablen-Verweis ergibt das ungültiges CSS, und die Fläche verschwindet still.\n  it('liefert für dieselbe ID den Tint-Verweis desselben Palettenplatzes', () => {\n    for (const id of [1, 7, 42, 1234]) {\n      expect(epicTint(id)).toBe(epicColor(id).replace('-hue)', '-tint)'))\n    }\n  })\n\n  it('hängt kein Alpha-Suffix an einen Farbwert', () => {\n    expect(epicTint(7)).toMatch(/^var\\(--mb-palette-epic-[0-3]-tint\\)$/)\n  })\n})\n\ndescribe('EPIC_FARBWERTE', () => {\n  it('führt in beiden Erscheinungsbildern die vier Schild-Töne des Entwurfs mit Farbton und Tint', () => {\n    for (const plaetze of [EPIC_FARBWERTE.light, EPIC_FARBWERTE.dark]) {\n      expect(plaetze).toHaveLength(4)\n      for (const platz of plaetze) {\n        expect(platz.hue).toMatch(/^#[0-9A-F]{6}$/)\n        expect(platz.tint).toMatch(/^rgba\\(\\d+,\\d+,\\d+,0\\.\\d+\\)$/)\n      }\n    }\n  })\n\n  it('folgt der Reihenfolge des Entwurfs: Kupfer, Stahl, Grün, Bernstein (Z. 787–790)', () => {\n    // Hell nachgedunkelt, damit das Kürzel auf seiner Tönung 4,5:1 hält (theme.test.ts rechnet nach).\n    expect(EPIC_FARBWERTE.light.map((p) => p.hue)).toEqual(['#935327', '#2A63B3', '#25713E', '#835C10'])\n    expect(EPIC_FARBWERTE.dark.map((p) => p.hue)).toEqual(['#D08A52', '#629BF1', '#46C46F', '#E0AE49'])\n  })\n\n  it('bildet den Tint wie das Schild des Entwurfs: der Farbton zu 13 %', () => {\n    expect(EPIC_FARBWERTE.light[0].tint).toBe('rgba(147,83,39,0.13)')\n    expect(EPIC_FARBWERTE.dark[0].tint).toBe('rgba(208,138,82,0.13)')\n  })\n})\n"},"src/lib/boardOps.test.ts":{"tests":[{"id":"598","name":"boardOps activeCardsInColumn filtert archivierte und sortiert nach Position"},{"id":"599","name":"boardOps activeCardsInColumn filtert Ideen (ideaStored) aus der Spaltenansicht"},{"id":"600","name":"boardOps applyMove verschiebt die Karte ans Ende der Zielspalte"},{"id":"601","name":"boardOps applyMove in dieselbe Spalte liefert unveränderte Referenz"},{"id":"602","name":"boardOps spaltenAuswahl meldet alle, einige und keine"},{"id":"603","name":"boardOps spaltenAuswahl meldet für eine leere Spalte keine"},{"id":"604","name":"boardOps spaltenAuswahlUmschalten ergänzt die fehlenden Karten der Spalte"},{"id":"605","name":"boardOps spaltenAuswahlUmschalten nimmt bei voller Spalte nur deren Karten heraus"}],"source":"import { describe, expect, it } from 'vitest'\nimport type { Card } from '../api/cards'\nimport { activeCardsInColumn, applyMove, spaltenAuswahl, spaltenAuswahlUmschalten } from './boardOps'\n\nfunction card(\n  id: number,\n  columnId: number,\n  position: number,\n  archived = false,\n  ideaStored = false,\n): Card {\n  return {\n    id, boardId: 1, columnId, number: id, title: `#${id}`, description: null, excerpt: null,\n    positionInColumn: position, archived, ideaStored, movedToDoneAt: null, dependencies: [],\n    type: 'CARD', parentId: null, shortcode: null, assignees: [], dueDate: null, labels: [],\n    derivedFrom: null,\n  }\n}\n\ndescribe('boardOps', () => {\n  it('activeCardsInColumn filtert archivierte und sortiert nach Position', () => {\n    const cards = [card(1, 10, 1), card(2, 10, 0), card(3, 10, 2, true), card(4, 20, 0)]\n    const result = activeCardsInColumn(cards, 10).map((c) => c.id)\n    expect(result).toEqual([2, 1])\n  })\n\n  it('activeCardsInColumn filtert Ideen (ideaStored) aus der Spaltenansicht', () => {\n    const idea = card(5, 10, 3, false, true)\n    const cards = [card(1, 10, 1), idea, card(2, 10, 0)]\n    const result = activeCardsInColumn(cards, 10).map((c) => c.id)\n    expect(result).toEqual([2, 1])\n  })\n\n  it('applyMove verschiebt die Karte ans Ende der Zielspalte', () => {\n    const cards = [card(1, 10, 0), card(2, 20, 0)]\n    const moved = applyMove(cards, 1, 20)\n    const card1 = moved.find((c) => c.id === 1)!\n    expect(card1.columnId).toBe(20)\n    expect(card1.positionInColumn).toBe(1) // hinter der bestehenden Karte in Spalte 20\n    expect(cards[0].columnId).toBe(10) // Original unverändert\n  })\n\n  it('applyMove in dieselbe Spalte liefert unveränderte Referenz', () => {\n    const cards = [card(1, 10, 0)]\n    expect(applyMove(cards, 1, 10)).toBe(cards)\n  })\n\n  it('spaltenAuswahl meldet alle, einige und keine', () => {\n    const ids = [1, 2, 3]\n    expect(spaltenAuswahl(ids, new Set([1, 2, 3]))).toBe('alle')\n    expect(spaltenAuswahl(ids, new Set([2]))).toBe('einige')\n    expect(spaltenAuswahl(ids, new Set([9]))).toBe('keine')\n  })\n\n  it('spaltenAuswahl meldet für eine leere Spalte keine', () => {\n    expect(spaltenAuswahl([], new Set([1]))).toBe('keine')\n  })\n\n  it('spaltenAuswahlUmschalten ergänzt die fehlenden Karten der Spalte', () => {\n    const auswahl = new Set([1, 9])\n    expect([...spaltenAuswahlUmschalten([1, 2], auswahl)]).toEqual([1, 9, 2])\n    expect([...auswahl]).toEqual([1, 9]) // Eingabe unverändert\n  })\n\n  it('spaltenAuswahlUmschalten nimmt bei voller Spalte nur deren Karten heraus', () => {\n    const auswahl = new Set([1, 2, 9])\n    expect([...spaltenAuswahlUmschalten([1, 2], auswahl)]).toEqual([9])\n  })\n})\n"},"src/lib/kontrast.test.ts":{"tests":[{"id":"606","name":"leuchtdichte liegt für Schwarz bei 0 und für Weiß bei 1"},{"id":"607","name":"leuchtdichte nimmt Groß- und Kleinschreibung gleich an"},{"id":"608","name":"leuchtdichte liest die Kurzform #abc als #aabbcc"},{"id":"609","name":"leuchtdichte weist den unbrauchbaren Wert \"\" ab, statt still zu rechnen"},{"id":"610","name":"leuchtdichte weist den unbrauchbaren Wert \"2F8C97\" ab, statt still zu rechnen"},{"id":"611","name":"leuchtdichte weist den unbrauchbaren Wert \"#2F8C9\" ab, statt still zu rechnen"},{"id":"612","name":"leuchtdichte weist den unbrauchbaren Wert \"#2F8C977\" ab, statt still zu rechnen"},{"id":"613","name":"leuchtdichte weist den unbrauchbaren Wert \"#GGGGGG\" ab, statt still zu rechnen"},{"id":"614","name":"leuchtdichte weist den unbrauchbaren Wert \"#abcd\" ab, statt still zu rechnen"},{"id":"615","name":"leuchtdichte weist den unbrauchbaren Wert \"rgb(0,0,0)\" ab, statt still zu rechnen"},{"id":"616","name":"leuchtdichte weist den unbrauchbaren Wert \"var(--x)\" ab, statt still zu rechnen"},{"id":"617","name":"kontrast ergibt für Schwarz gegen Weiß 21:1"},{"id":"618","name":"kontrast ergibt für eine Farbe gegen sich selbst 1:1"},{"id":"619","name":"kontrast hängt nicht von der Reihenfolge der Argumente ab"},{"id":"620","name":"kontrast weist einen unbrauchbaren Wert auf jeder Seite ab"},{"id":"621","name":"kontrast Schwelle 4,5:1 für Fließtext hält sie mit der gedämpften Statusschrift auf Weiß (statusColors, rund 4,59)"},{"id":"622","name":"kontrast Schwelle 4,5:1 für Fließtext verfehlt sie mit dem dritten Nachtlauf-Grau auf dem dunklen Grund (nachtlaufDesign, rund 4,49)"},{"id":"623","name":"kontrast Schwelle 3:1 für große Schrift und Flächen hält sie mit dem Status-Grün auf Eis (rund 3,02)"},{"id":"624","name":"kontrast Schwelle 3:1 für große Schrift und Flächen verfehlt sie mit demselben Grün auf dem hellen Nachtlauf-Grau (rund 2,90)"}],"source":"import { describe, expect, it } from 'vitest'\nimport { kontrast, leuchtdichte } from './kontrast'\n\ndescribe('leuchtdichte', () => {\n  it('liegt für Schwarz bei 0 und für Weiß bei 1', () => {\n    expect(leuchtdichte('#000000')).toBe(0)\n    expect(leuchtdichte('#FFFFFF')).toBe(1)\n  })\n\n  it('nimmt Groß- und Kleinschreibung gleich an', () => {\n    expect(leuchtdichte('#2f8c97')).toBe(leuchtdichte('#2F8C97'))\n  })\n\n  it('liest die Kurzform #abc als #aabbcc', () => {\n    expect(leuchtdichte('#abc')).toBe(leuchtdichte('#AABBCC'))\n  })\n\n  it.each(['', '2F8C97', '#2F8C9', '#2F8C977', '#GGGGGG', '#abcd', 'rgb(0,0,0)', 'var(--x)'])(\n    'weist den unbrauchbaren Wert %j ab, statt still zu rechnen',\n    (wert) => {\n      expect(() => leuchtdichte(wert)).toThrow(/Hexwert/)\n    },\n  )\n})\n\ndescribe('kontrast', () => {\n  it('ergibt für Schwarz gegen Weiß 21:1', () => {\n    expect(kontrast('#000000', '#FFFFFF')).toBe(21)\n  })\n\n  it('ergibt für eine Farbe gegen sich selbst 1:1', () => {\n    expect(kontrast('#2F8C97', '#2F8C97')).toBe(1)\n  })\n\n  it('hängt nicht von der Reihenfolge der Argumente ab', () => {\n    expect(kontrast('#243539', '#5BABB5')).toBe(kontrast('#5BABB5', '#243539'))\n  })\n\n  it('weist einen unbrauchbaren Wert auf jeder Seite ab', () => {\n    expect(() => kontrast('#zzz', '#FFFFFF')).toThrow(/Hexwert/)\n    expect(() => kontrast('#FFFFFF', 'weiss')).toThrow(/Hexwert/)\n  })\n\n  // Grenzfälle aus dem Bestand: je ein Paar knapp über und knapp unter der Schwelle, damit ein\n  // Rundungs- oder Formelfehler an genau der Stelle auffällt, an der er ein Urteil kippen würde.\n  describe('Schwelle 4,5:1 für Fließtext', () => {\n    it('hält sie mit der gedämpften Statusschrift auf Weiß (statusColors, rund 4,59)', () => {\n      expect(kontrast('#5F7A7F', '#FFFFFF')).toBeGreaterThanOrEqual(4.5)\n      expect(kontrast('#5F7A7F', '#FFFFFF')).toBeLessThan(4.6)\n    })\n\n    it('verfehlt sie mit dem dritten Nachtlauf-Grau auf dem dunklen Grund (nachtlaufDesign, rund 4,49)', () => {\n      expect(kontrast('#767D89', '#0F1319')).toBeLessThan(4.5)\n      expect(kontrast('#767D89', '#0F1319')).toBeGreaterThan(4.4)\n    })\n  })\n\n  describe('Schwelle 3:1 für große Schrift und Flächen', () => {\n    it('hält sie mit dem Status-Grün auf Eis (rund 3,02)', () => {\n      expect(kontrast('#2E9E7A', '#EDF5F6')).toBeGreaterThanOrEqual(3)\n      expect(kontrast('#2E9E7A', '#EDF5F6')).toBeLessThan(3.1)\n    })\n\n    it('verfehlt sie mit demselben Grün auf dem hellen Nachtlauf-Grau (rund 2,90)', () => {\n      expect(kontrast('#2E9E7A', '#EDEFF3')).toBeLessThan(3)\n      expect(kontrast('#2E9E7A', '#EDEFF3')).toBeGreaterThan(2.8)\n    })\n  })\n})\n"},"src/lib/useBoardRole.test.ts":{"tests":[{"id":"625","name":"useBoardRole nutzt die eigene Mitgliedschaft, ohne die Projektliste zu laden"},{"id":"626","name":"useBoardRole lädt die Rolle nach, wenn keine Mitgliedschaft bekannt ist (ADMIN → volle Rechte)"},{"id":"627","name":"useBoardRole fällt auf VIEWER zurück, wenn das Projekt nicht gefunden wird"},{"id":"628","name":"useBoardRole lädt nichts ohne Board und liefert VIEWER"},{"id":"629","name":"useBoardRole gibt einem Plattform-Admin volle Rechte, unabhängig von der Projektrolle"}],"source":"import { renderHook, waitFor } from '@testing-library/react'\nimport { beforeEach, describe, expect, it, vi } from 'vitest'\nimport type { Board } from '../api/boards'\nimport { projectsApi } from '../api/projects'\nimport { useBoardRole } from './useBoardRole'\n\nconst authUser = vi.hoisted(() => ({ value: null as unknown }))\nvi.mock('../auth/AuthContext', () => ({ useAuth: () => ({ user: authUser.value }) }))\nvi.mock('../api/projects', () => ({ projectsApi: { list: vi.fn() } }))\nconst mList = projectsApi.list as unknown as ReturnType<"+"typeof vi.fn>\n\nconst board: Board = { id: 1, projectId: 5, name: 'B', createdAt: '', columns: [] }\n\ndescribe('useBoardRole', () => {\n  beforeEach(() => {\n    mList.mockReset()\n    mList.mockResolvedValue([])\n    authUser.value = { platformRole: 'USER', memberships: [] }\n  })\n\n  it('nutzt die eigene Mitgliedschaft, ohne die Projektliste zu laden', () => {\n    authUser.value = { platformRole: 'USER', memberships: [{ projectId: 5, role: 'MEMBER' }] }\n    const { result } = renderHook(() => useBoardRole(board))\n    expect(result.current.effectiveRole).toBe('MEMBER')\n    expect(result.current.canEdit).toBe(true)\n    expect(result.current.canModerate).toBe(false)\n    expect(mList).not.toHaveBeenCalled()\n  })\n\n  it('lädt die Rolle nach, wenn keine Mitgliedschaft bekannt ist (ADMIN → volle Rechte)', async () => {\n    mList.mockResolvedValue([{ id: 5, name: 'B', role: 'ADMIN', createdAt: '' }])\n    const { result } = renderHook(() => useBoardRole(board))\n    await waitFor(() => expect(result.current.canModerate).toBe(true))\n    expect(result.current.effectiveRole).toBe('ADMIN')\n    expect(result.current.canEdit).toBe(true)\n  })\n\n  it('fällt auf VIEWER zurück, wenn das Projekt nicht gefunden wird', async () => {\n    mList.mockResolvedValue([])\n    const { result } = renderHook(() => useBoardRole(board))\n    await waitFor(() => expect(mList).toHaveBeenCalled())\n    expect(result.current.effectiveRole).toBe('VIEWER')\n    expect(result.current.canEdit).toBe(false)\n  })\n\n  it('lädt nichts ohne Board und liefert VIEWER', () => {\n    const { result } = renderHook(() => useBoardRole(null))\n    expect(mList).not.toHaveBeenCalled()\n    expect(result.current.effectiveRole).toBe('VIEWER')\n    expect(result.current.canEdit).toBe(false)\n  })\n\n  it('gibt einem Plattform-Admin volle Rechte, unabhängig von der Projektrolle', () => {\n    authUser.value = { platformRole: 'ADMIN', memberships: [] }\n    const { result } = renderHook(() => useBoardRole(null))\n    expect(result.current.canEdit).toBe(true)\n    expect(result.current.canModerate).toBe(true)\n  })\n})\n"},"src/lib/cardLocation.test.ts":{"tests":[{"id":"630","name":"cardLocationCrumbs nennt Projekt, Board und Spalte und verlinkt Projekt und Board"},{"id":"631","name":"cardLocationCrumbs nennt eine board-lose Pool-Idee als Ideen des Projekts"},{"id":"632","name":"cardLocationCrumbs kennzeichnet ein archiviertes Board und verlinkt es nicht"},{"id":"633","name":"cardLocationCrumbs lässt das Spaltensegment weg, wenn der Spaltenname nicht aufgelöst ist"},{"id":"634","name":"cardLocationCrumbs fällt auf „Projekt“ zurück, solange der Projektname nicht geladen ist"},{"id":"635","name":"cardLocationLabel fügt dieselben Segmente zu einer Zeile zusammen"},{"id":"636","name":"cardLocationLabel nennt die Pool-Idee einzeilig als Ideen des Projekts"}],"source":"import { describe, expect, it } from 'vitest'\nimport { cardLocationCrumbs, cardLocationLabel, type CardLocation } from './cardLocation'\n\nconst board = { id: 2, name: 'Entwicklung', columnName: 'In Progress' }\nconst onBoard: CardLocation = { projectId: 9, projectName: 'IT-Bildungshaus', board }\nconst poolIdea: CardLocation = { projectId: 9, projectName: 'IT-Bildungshaus', board: null }\n\ndescribe('cardLocationCrumbs', () => {\n  it('nennt Projekt, Board und Spalte und verlinkt Projekt und Board', () => {\n    expect(cardLocationCrumbs(onBoard)).toEqual([\n      { label: 'IT-Bildungshaus', to: '/projects/9' },\n      { label: 'Entwicklung', to: '/boards/2' },\n      { label: 'In Progress' },\n    ])\n  })\n\n  it('nennt eine board-lose Pool-Idee als Ideen des Projekts', () => {\n    expect(cardLocationCrumbs(poolIdea)).toEqual([\n      { label: 'IT-Bildungshaus', to: '/projects/9' },\n      { label: 'Ideen', to: '/projects/9/ideas' },\n    ])\n  })\n\n  it('kennzeichnet ein archiviertes Board und verlinkt es nicht', () => {\n    expect(cardLocationCrumbs({ ...onBoard, board: { ...board, archived: true } })).toEqual([\n      { label: 'IT-Bildungshaus', to: '/projects/9' },\n      { label: 'Entwicklung (archiviert)' },\n      { label: 'In Progress' },\n    ])\n  })\n\n  it('lässt das Spaltensegment weg, wenn der Spaltenname nicht aufgelöst ist', () => {\n    expect(cardLocationCrumbs({ ...onBoard, board: { ...board, columnName: null } })).toEqual([\n      { label: 'IT-Bildungshaus', to: '/projects/9' },\n      { label: 'Entwicklung', to: '/boards/2' },\n    ])\n  })\n\n  it('fällt auf „Projekt“ zurück, solange der Projektname nicht geladen ist', () => {\n    expect(cardLocationCrumbs({ ...onBoard, projectName: null })[0]).toEqual({\n      label: 'Projekt',\n      to: '/projects/9',\n    })\n  })\n})\n\ndescribe('cardLocationLabel', () => {\n  it('fügt dieselben Segmente zu einer Zeile zusammen', () => {\n    expect(cardLocationLabel(onBoard)).toBe('IT-Bildungshaus / Entwicklung / In Progress')\n  })\n\n  it('nennt die Pool-Idee einzeilig als Ideen des Projekts', () => {\n    expect(cardLocationLabel(poolIdea)).toBe('IT-Bildungshaus / Ideen')\n  })\n})\n"},"src/lib/markdownShortcuts.test.ts":{"tests":[{"id":"637","name":"expandCheckboxShortcut ersetzt Slash plus Leerzeichen am Zeilenanfang durch eine leere Checkbox"},{"id":"638","name":"expandCheckboxShortcut ersetzt /x plus Leerzeichen durch eine abgehakte Checkbox"},{"id":"639","name":"expandCheckboxShortcut behandelt großes X wie kleines x"},{"id":"640","name":"expandCheckboxShortcut erhält die Einrückung"},{"id":"641","name":"expandCheckboxShortcut greift auch in einer späteren Zeile und lässt die vorigen Zeilen unberührt"},{"id":"642","name":"expandCheckboxShortcut erhält den Text hinter dem Cursor"},{"id":"643","name":"expandCheckboxShortcut greift nicht ohne folgendes Leerzeichen"},{"id":"644","name":"expandCheckboxShortcut greift nicht bei einem Pfad am Zeilenanfang"},{"id":"645","name":"expandCheckboxShortcut greift nicht mitten in der Zeile"},{"id":"646","name":"expandCheckboxShortcut greift nicht bei zwei Leerzeichen hinter dem Slash"},{"id":"647","name":"expandCheckboxShortcut greift nicht bei Cursor an Position 0"},{"id":"648","name":"expandCheckboxShortcut greift nicht bei leerem Text"},{"id":"649","name":"expandCheckboxShortcut greift nicht, wenn die Cursor-Position unbekannt ist"},{"id":"650","name":"expandCheckboxShortcut greift nicht, wenn der Cursor vor dem Leerzeichen steht"}],"source":"import { describe, expect, it } from 'vitest'\nimport { expandCheckboxShortcut } from './markdownShortcuts'\n\ndescribe('expandCheckboxShortcut', () => {\n  it('ersetzt Slash plus Leerzeichen am Zeilenanfang durch eine leere Checkbox', () => {\n    expect(expandCheckboxShortcut('/ ', 2)).toEqual({ value: '- [ ] ', caret: 6, from: 2 })\n  })\n\n  it('ersetzt /x plus Leerzeichen durch eine abgehakte Checkbox', () => {\n    expect(expandCheckboxShortcut('/x ', 3)).toEqual({ value: '- [x] ', caret: 6, from: 3 })\n  })\n\n  it('behandelt großes X wie kleines x', () => {\n    expect(expandCheckboxShortcut('/X ', 3)).toEqual({ value: '- [x] ', caret: 6, from: 3 })\n  })\n\n  it('erhält die Einrückung', () => {\n    expect(expandCheckboxShortcut('  / ', 4)).toEqual({ value: '  - [ ] ', caret: 8, from: 4 })\n  })\n\n  it('greift auch in einer späteren Zeile und lässt die vorigen Zeilen unberührt', () => {\n    expect(expandCheckboxShortcut('Text\\n/ ', 7)).toEqual({ value: 'Text\\n- [ ] ', caret: 11, from: 7 })\n  })\n\n  it('erhält den Text hinter dem Cursor', () => {\n    expect(expandCheckboxShortcut('/ Rest', 2)).toEqual({ value: '- [ ] Rest', caret: 6, from: 2 })\n  })\n\n  it('greift nicht ohne folgendes Leerzeichen', () => {\n    expect(expandCheckboxShortcut('/xyz', 4)).toBeNull()\n  })\n\n  it('greift nicht bei einem Pfad am Zeilenanfang', () => {\n    expect(expandCheckboxShortcut('/api/cards ', 11)).toBeNull()\n  })\n\n  it('greift nicht mitten in der Zeile', () => {\n    expect(expandCheckboxShortcut('und / ', 6)).toBeNull()\n  })\n\n  it('greift nicht bei zwei Leerzeichen hinter dem Slash', () => {\n    expect(expandCheckboxShortcut('/  ', 3)).toBeNull()\n  })\n\n  it('greift nicht bei Cursor an Position 0', () => {\n    expect(expandCheckboxShortcut('/ ', 0)).toBeNull()\n  })\n\n  it('greift nicht bei leerem Text', () => {\n    expect(expandCheckboxShortcut('', 0)).toBeNull()\n  })\n\n  it('greift nicht, wenn die Cursor-Position unbekannt ist', () => {\n    expect(expandCheckboxShortcut('/ ', null)).toBeNull()\n  })\n\n  it('greift nicht, wenn der Cursor vor dem Leerzeichen steht', () => {\n    expect(expandCheckboxShortcut('/ ', 1)).toBeNull()\n  })\n})\n"},"src/lib/EditModeContext.test.tsx":{"tests":[{"id":"651","name":"EditModeContext ist standardmäßig aus"},{"id":"652","name":"EditModeContext toggleEditMode kippt den Wert"},{"id":"653","name":"EditModeContext setEditMode setzt den Wert explizit"},{"id":"654","name":"EditModeContext liefert ohne Provider einen No-op-Default (editMode false, kein Fehler)"}],"source":"import { render, screen } from '@testing-library/react'\nimport userEvent from '@testing-library/user-event'\nimport { describe, expect, it } from 'vitest'\nimport { EditModeProvider, useEditMode } from './EditModeContext'\n\nfunction Probe() {\n  const { editMode, setEditMode, toggleEditMode } = useEditMode()\n  return (\n    <"+"div>\n      <"+"span data-testid=\"mode\">{String(editMode)}<"+"/span>\n      <"+"button onClick={toggleEditMode}>toggle<"+"/button>\n      <"+"button onClick={() => setEditMode(true)}>on<"+"/button>\n      <"+"button onClick={() => setEditMode(false)}>off<"+"/button>\n    <"+"/div>\n  )\n}\n\ndescribe('EditModeContext', () => {\n  it('ist standardmäßig aus', () => {\n    render(\n      <"+"EditModeProvider>\n        <"+"Probe />\n      <"+"/EditModeProvider>,\n    )\n    expect(screen.getByTestId('mode')).toHaveTextContent('false')\n  })\n\n  it('toggleEditMode kippt den Wert', async () => {\n    render(\n      <"+"EditModeProvider>\n        <"+"Probe />\n      <"+"/EditModeProvider>,\n    )\n    await userEvent.click(screen.getByRole('button', { name: 'toggle' }))\n    expect(screen.getByTestId('mode')).toHaveTextContent('true')\n    await userEvent.click(screen.getByRole('button', { name: 'toggle' }))\n    expect(screen.getByTestId('mode')).toHaveTextContent('false')\n  })\n\n  it('setEditMode setzt den Wert explizit', async () => {\n    render(\n      <"+"EditModeProvider>\n        <"+"Probe />\n      <"+"/EditModeProvider>,\n    )\n    await userEvent.click(screen.getByRole('button', { name: 'on' }))\n    expect(screen.getByTestId('mode')).toHaveTextContent('true')\n    await userEvent.click(screen.getByRole('button', { name: 'off' }))\n    expect(screen.getByTestId('mode')).toHaveTextContent('false')\n  })\n\n  it('liefert ohne Provider einen No-op-Default (editMode false, kein Fehler)', async () => {\n    render(<"+"Probe />)\n    expect(screen.getByTestId('mode')).toHaveTextContent('false')\n    // No-op-Setter dürfen nicht werfen und ändern nichts.\n    await userEvent.click(screen.getByRole('button', { name: 'toggle' }))\n    await userEvent.click(screen.getByRole('button', { name: 'on' }))\n    expect(screen.getByTestId('mode')).toHaveTextContent('false')\n  })\n})\n"},"src/lib/nachtlaufFormat.test.ts":{"tests":[{"id":"655","name":"nachtlaufFormat betrag schreibt US-Dollar in deutscher Schreibweise und sagt, wenn nichts angegeben ist"},{"id":"656","name":"nachtlaufFormat kosten nennt eine fehlende Angabe „nicht gemessen\", eine gemessene Null bleibt ein Betrag"},{"id":"657","name":"nachtlaufFormat menge nennt ihre Einheit"},{"id":"658","name":"nachtlaufFormat ohneNull macht aus `null` ein `undefined` und lässt jede Zahl stehen — auch die 0"}],"source":"import { describe, expect, it } from 'vitest'\nimport { betrag, kosten, menge, ohneNull } from './nachtlaufFormat'\n\n/**\n * Die drei Formatierer der Nachtlauf-Anzeigen (Issue #968). Sie stehen an einer Stelle, weil\n * Auswertung und Karten-Detail dieselben Wörter führen — ein zweites Paar liefe auseinander.\n */\n/** `Intl` setzt vor das Währungszeichen ein geschütztes Leerzeichen; verglichen wird der Wortlaut. */\nconst lesbar = (text: string) => text.replaceAll('\\u00a0', ' ')\n\ndescribe('nachtlaufFormat', () => {\n  it('betrag schreibt US-Dollar in deutscher Schreibweise und sagt, wenn nichts angegeben ist', () => {\n    expect(lesbar(betrag(25.983293))).toBe('25,98 $')\n    expect(betrag(undefined)).toBe('nicht angegeben')\n  })\n\n  it('kosten nennt eine fehlende Angabe „nicht gemessen\", eine gemessene Null bleibt ein Betrag', () => {\n    expect(lesbar(kosten(0.94))).toBe('0,94 $')\n    expect(lesbar(kosten(0))).toBe('0,00 $')\n    expect(kosten(undefined)).toBe('nicht gemessen')\n  })\n\n  it('menge nennt ihre Einheit', () => {\n    expect(menge(8_883_160)).toBe('8.883.160 Token')\n    expect(menge(0)).toBe('0 Token')\n    expect(menge(undefined)).toBe('nicht gemessen')\n  })\n\n  it('ohneNull macht aus `null` ein `undefined` und lässt jede Zahl stehen — auch die 0', () => {\n    expect(ohneNull(null)).toBeUndefined()\n    expect(ohneNull(0)).toBe(0)\n    expect(ohneNull(25.98)).toBe(25.98)\n  })\n})\n"},"src/lib/markdownUrls.test.ts":{"tests":[{"id":"659","name":"safeLinkHref laesst https und mailto durch"},{"id":"660","name":"safeLinkHref blockiert javascript, data und http"},{"id":"661","name":"safeLinkHref blockiert relative, leere und nicht parsebare URLs"},{"id":"662","name":"safeImageSrc laesst nur https durch"}],"source":"import { describe, expect, it } from 'vitest'\nimport { safeImageSrc, safeLinkHref } from './markdownUrls'\n\ndescribe('safeLinkHref', () => {\n  it('laesst https und mailto durch', () => {\n    expect(safeLinkHref('https://example.org/a?b=1')).toBe('https://example.org/a?b=1')\n    expect(safeLinkHref('mailto:a@b.c')).toBe('mailto:a@b.c')\n  })\n\n  it('blockiert javascript, data und http', () => {\n    expect(safeLinkHref('javascript:alert(1)')).toBeUndefined()\n    expect(safeLinkHref('data:text/html,<"+"script>alert(1)<"+"/script>')).toBeUndefined()\n    expect(safeLinkHref('http://example.org')).toBeUndefined()\n  })\n\n  it('blockiert relative, leere und nicht parsebare URLs', () => {\n    expect(safeLinkHref('/admin')).toBeUndefined()\n    expect(safeLinkHref('')).toBeUndefined()\n    expect(safeLinkHref(undefined)).toBeUndefined()\n    expect(safeLinkHref('https://')).toBeUndefined()\n  })\n})\n\ndescribe('safeImageSrc', () => {\n  it('laesst nur https durch', () => {\n    expect(safeImageSrc('https://example.org/b.png')).toBe('https://example.org/b.png')\n    expect(safeImageSrc('mailto:a@b.c')).toBeUndefined()\n    expect(safeImageSrc('javascript:alert(1)')).toBeUndefined()\n    expect(safeImageSrc('data:image/svg+xml,<"+"svg onload=\"alert(1)\"/>')).toBeUndefined()\n    expect(safeImageSrc('/logo.png')).toBeUndefined()\n    expect(safeImageSrc(undefined)).toBeUndefined()\n  })\n})\n"},"src/lib/useRefetchOnFocus.test.ts":{"tests":[{"id":"663","name":"useRefetchOnFocus ruft den Callback bei Fensterfokus und beim Sichtbarwerden"},{"id":"664","name":"useRefetchOnFocus nutzt stets die aktuelle Callback-Referenz"},{"id":"665","name":"useRefetchOnFocus meldet die Listener beim Unmount ab"}],"source":"import { act, renderHook } from '@testing-library/react'\nimport { describe, expect, it, vi } from 'vitest'\nimport { useRefetchOnFocus } from './useRefetchOnFocus'\n\ndescribe('useRefetchOnFocus', () => {\n  it('ruft den Callback bei Fensterfokus und beim Sichtbarwerden', () => {\n    const cb = vi.fn()\n    renderHook(() => useRefetchOnFocus(cb))\n\n    act(() => window.dispatchEvent(new Event('focus')))\n    expect(cb).toHaveBeenCalledTimes(1)\n\n    // jsdom meldet document.visibilityState standardmäßig als 'visible'.\n    act(() => document.dispatchEvent(new Event('visibilitychange')))\n    expect(cb).toHaveBeenCalledTimes(2)\n  })\n\n  it('nutzt stets die aktuelle Callback-Referenz', () => {\n    const first = vi.fn()\n    const second = vi.fn()\n    const { rerender } = renderHook(({ cb }) => useRefetchOnFocus(cb), {\n      initialProps: { cb: first },\n    })\n    rerender({ cb: second })\n\n    act(() => window.dispatchEvent(new Event('focus')))\n    expect(first).not.toHaveBeenCalled()\n    expect(second).toHaveBeenCalledTimes(1)\n  })\n\n  it('meldet die Listener beim Unmount ab', () => {\n    const cb = vi.fn()\n    const { unmount } = renderHook(() => useRefetchOnFocus(cb))\n    unmount()\n    act(() => window.dispatchEvent(new Event('focus')))\n    expect(cb).not.toHaveBeenCalled()\n  })\n})\n"},"src/lib/epicToCard.test.ts":{"tests":[{"id":"666","name":"epicToCard uebernimmt Titel, Nummer und ID des Vorhabens"},{"id":"667","name":"epicToCard traegt die uebergebene boardId"},{"id":"668","name":"epicToCard laesst die Zustaendigen leer"},{"id":"669","name":"epicToCard setzt die Herkunft auf null, weil Vorhaben keine tragen (Issue #607)"},{"id":"670","name":"epicToCard erzeugt eine Karte vom Typ Vorhaben"}],"source":"import { describe, expect, it } from 'vitest'\nimport { epicToCard } from './epicToCard'\nimport type { Epic } from '../api/epics'\n\nconst vorhaben: Epic = {\n  id: 700,\n  number: 71,\n  title: 'Vorhaben Kuerzel',\n  description: 'Beschreibung des Vorhabens',\n  shortcode: 'VK',\n  done: 2,\n  total: 5,\n  memberNumbers: [1, 2, 3, 4, 5],\n  rootNumbers: [1],\n  requirementCardNumber: 9,\n}\n\ndescribe('epicToCard', () => {\n  it('uebernimmt Titel, Nummer und ID des Vorhabens', () => {\n    const karte = epicToCard(vorhaben, 12)\n    expect(karte.title).toBe('Vorhaben Kuerzel')\n    expect(karte.number).toBe(71)\n    expect(karte.id).toBe(700)\n  })\n\n  it('traegt die uebergebene boardId', () => {\n    expect(epicToCard(vorhaben, 12).boardId).toBe(12)\n    // Nicht aus dem Vorhaben abgeleitet: dasselbe Vorhaben, ein anderes Board.\n    expect(epicToCard(vorhaben, 34).boardId).toBe(34)\n  })\n\n  it('laesst die Zustaendigen leer', () => {\n    expect(epicToCard(vorhaben, 12).assignees).toEqual([])\n  })\n\n  it('setzt die Herkunft auf null, weil Vorhaben keine tragen (Issue #607)', () => {\n    expect(epicToCard(vorhaben, 12).derivedFrom).toBeNull()\n  })\n\n  it('erzeugt eine Karte vom Typ Vorhaben', () => {\n    expect(epicToCard(vorhaben, 12).type).toBe('EPIC')\n  })\n})\n"},"src/lib/useProjectName.test.ts":{"tests":[{"id":"671","name":"useProjectName liefert den Namen des passenden Projekts"},{"id":"672","name":"useProjectName liefert null für ein unbekanntes Projekt"},{"id":"673","name":"useProjectName ruft keine API auf, wenn keine Projekt-ID vorliegt"}],"source":"import { renderHook, waitFor } from '@testing-library/react'\nimport { describe, expect, it, vi } from 'vitest'\nimport { projectsApi } from '../api/projects'\nimport { useProjectName } from './useProjectName'\n\nvi.mock('../api/projects', () => ({ projectsApi: { list: vi.fn() } }))\nconst mockedList = projectsApi.list as unknown as ReturnType<"+"typeof vi.fn>\n\ndescribe('useProjectName', () => {\n  it('liefert den Namen des passenden Projekts', async () => {\n    mockedList.mockResolvedValue([{ id: 5, name: 'Team', role: 'OWNER', createdAt: '' }])\n    const { result } = renderHook(() => useProjectName(5))\n    await waitFor(() => expect(result.current).toBe('Team'))\n  })\n\n  it('liefert null für ein unbekanntes Projekt', async () => {\n    mockedList.mockResolvedValue([{ id: 5, name: 'Team', role: 'OWNER', createdAt: '' }])\n    const { result } = renderHook(() => useProjectName(99))\n    await waitFor(() => expect(mockedList).toHaveBeenCalled())\n    expect(result.current).toBeNull()\n  })\n\n  it('ruft keine API auf, wenn keine Projekt-ID vorliegt', () => {\n    mockedList.mockClear()\n    renderHook(() => useProjectName(null))\n    expect(mockedList).not.toHaveBeenCalled()\n  })\n})\n"},"src/lib/dueDate.test.ts":{"tests":[{"id":"674","name":"isOverdue ist true bei Datum in der Vergangenheit und nicht Done"},{"id":"675","name":"isOverdue ist false bei Done-Spalte trotz Vergangenheit"},{"id":"676","name":"isOverdue ist false ohne Datum"},{"id":"677","name":"isOverdue ist false bei Datum in der Zukunft"},{"id":"678","name":"formatDueDate formatiert als deutsches Datum"},{"id":"679","name":"dueInputToIso wandelt YYYY-MM-DD in Mitternacht-UTC-ISO"},{"id":"680","name":"dueInputToIso liefert null bei leerer Eingabe"}],"source":"import { describe, expect, it } from 'vitest'\nimport { dueInputToIso, formatDueDate, isOverdue } from './dueDate'\n\nconst NOW = Date.parse('2026-07-14T12:00:00Z')\n\ndescribe('isOverdue', () => {\n  it('ist true bei Datum in der Vergangenheit und nicht Done', () => {\n    expect(isOverdue('2026-07-01T00:00:00Z', false, NOW)).toBe(true)\n  })\n  it('ist false bei Done-Spalte trotz Vergangenheit', () => {\n    expect(isOverdue('2026-07-01T00:00:00Z', true, NOW)).toBe(false)\n  })\n  it('ist false ohne Datum', () => {\n    expect(isOverdue(null, false, NOW)).toBe(false)\n  })\n  it('ist false bei Datum in der Zukunft', () => {\n    expect(isOverdue('2026-08-01T00:00:00Z', false, NOW)).toBe(false)\n  })\n})\n\ndescribe('formatDueDate', () => {\n  it('formatiert als deutsches Datum', () => {\n    expect(formatDueDate('2026-08-01T00:00:00Z')).toBe('1.8.2026')\n  })\n})\n\ndescribe('dueInputToIso', () => {\n  it('wandelt YYYY-MM-DD in Mitternacht-UTC-ISO', () => {\n    expect(dueInputToIso('2026-08-01')).toBe('2026-08-01T00:00:00Z')\n  })\n  it('liefert null bei leerer Eingabe', () => {\n    expect(dueInputToIso('')).toBeNull()\n  })\n})\n"},"src/lib/cleanupCountdown.test.ts":{"tests":[{"id":"681","name":"cleanupDaysRemaining rechnet die verbleibenden Tage bis zur Archivierung"},{"id":"682","name":"cleanupDaysRemaining gibt nie negative Werte zurück"},{"id":"683","name":"cleanupCountdownLabel formatiert heute/morgen/Tage"}],"source":"import { describe, expect, it } from 'vitest'\nimport { cleanupCountdownLabel, cleanupDaysRemaining } from './cleanupCountdown'\n\nconst DAY = 86_400_000\nconst now = Date.parse('2026-07-09T12:00:00Z')\n\ndescribe('cleanupDaysRemaining', () => {\n  it('rechnet die verbleibenden Tage bis zur Archivierung', () => {\n    const moved = new Date(now - 2 * DAY).toISOString()\n    expect(cleanupDaysRemaining(moved, 30, now)).toBe(28)\n  })\n\n  it('gibt nie negative Werte zurück', () => {\n    const moved = new Date(now - 40 * DAY).toISOString()\n    expect(cleanupDaysRemaining(moved, 30, now)).toBe(0)\n  })\n})\n\ndescribe('cleanupCountdownLabel', () => {\n  it('formatiert heute/morgen/Tage', () => {\n    expect(cleanupCountdownLabel(0)).toBe('wird heute archiviert')\n    expect(cleanupCountdownLabel(1)).toBe('wird morgen archiviert')\n    expect(cleanupCountdownLabel(5)).toBe('wird in 5 Tagen archiviert')\n  })\n})\n"},"src/lib/roles.test.ts":{"tests":[{"id":"684","name":"roles gibt einem Plattform-Admin Vollzugriff"},{"id":"685","name":"roles richtet sich sonst nach der Projektrolle"},{"id":"686","name":"roles isPlatformAdmin liest platformRole"}],"source":"import { describe, expect, it } from 'vitest'\nimport { canEditCards, canManageBoards, canManageProject, isPlatformAdmin } from './roles'\n\ndescribe('roles', () => {\n  it('gibt einem Plattform-Admin Vollzugriff', () => {\n    expect(canEditCards('VIEWER', true)).toBe(true)\n    expect(canManageProject('VIEWER', true)).toBe(true)\n    expect(canManageBoards('VIEWER', true)).toBe(true)\n  })\n\n  it('richtet sich sonst nach der Projektrolle', () => {\n    expect(canEditCards('VIEWER')).toBe(false)\n    expect(canEditCards('MEMBER')).toBe(true)\n    expect(canManageProject('OWNER')).toBe(true)\n    expect(canManageProject('ADMIN')).toBe(false)\n  })\n\n  it('isPlatformAdmin liest platformRole', () => {\n    expect(isPlatformAdmin({ platformRole: 'ADMIN' })).toBe(true)\n    expect(isPlatformAdmin({ platformRole: 'USER' })).toBe(false)\n    expect(isPlatformAdmin(null)).toBe(false)\n  })\n})\n"},"src/lib/readTextFile.test.ts":{"tests":[{"id":"687","name":"readTextFile liefert den Textinhalt der Datei"},{"id":"688","name":"readTextFile bricht mit einem Fehler ab, wenn die Datei nicht lesbar ist"}],"source":"import { afterEach, describe, expect, it, vi } from 'vitest'\nimport { readTextFile } from './readTextFile'\n\nafterEach(() => vi.unstubAllGlobals())\n\ndescribe('readTextFile', () => {\n  it('liefert den Textinhalt der Datei', async () => {\n    const file = new File(['## Titel\\nText'], 'spec.md', { type: 'text/markdown' })\n\n    await expect(readTextFile(file)).resolves.toBe('## Titel\\nText')\n  })\n\n  it('bricht mit einem Fehler ab, wenn die Datei nicht lesbar ist', async () => {\n    class FailingReader {\n      onload: (() => void) | null = null\n      onerror: (() => void) | null = null\n      result: string | null = null\n      readAsText(): void {\n        this.onerror?.()\n      }\n    }\n    vi.stubGlobal('FileReader', FailingReader)\n\n    await expect(readTextFile(new Blob(['x']))).rejects.toThrow('Datei konnte nicht gelesen werden.')\n  })\n})\n"},"src/lib/listExcerpt.test.ts":{"tests":[{"id":"689","name":"clampExcerptWidth klemmt in den erlaubten Bereich"},{"id":"690","name":"clampExcerptWidth fällt bei NaN auf den Default"},{"id":"691","name":"stripMarkdown macht aus Markdown eine einzeilige Vorschau"},{"id":"692","name":"stripMarkdown kollabiert Whitespace und trimmt"}],"source":"import { describe, expect, it } from 'vitest'\nimport { clampExcerptWidth, EXCERPT_DEFAULT_PCT, EXCERPT_MAX_PCT, EXCERPT_MIN_PCT, stripMarkdown } from './listExcerpt'\n\ndescribe('clampExcerptWidth', () => {\n  it('klemmt in den erlaubten Bereich', () => {\n    expect(clampExcerptWidth(5)).toBe(EXCERPT_MIN_PCT)\n    expect(clampExcerptWidth(90)).toBe(EXCERPT_MAX_PCT)\n    expect(clampExcerptWidth(40)).toBe(40)\n  })\n  it('fällt bei NaN auf den Default', () => {\n    expect(clampExcerptWidth(Number.NaN)).toBe(EXCERPT_DEFAULT_PCT)\n  })\n})\n\ndescribe('stripMarkdown', () => {\n  it('macht aus Markdown eine einzeilige Vorschau', () => {\n    expect(stripMarkdown('# Titel\\nText **fett** und `code`')).toBe('Titel Text fett und code')\n  })\n\n  it('kollabiert Whitespace und trimmt', () => {\n    expect(stripMarkdown('  a\\n\\n  b  ')).toBe('a b')\n  })\n})\n"},"src/lib/textLimits.test.ts":{"tests":[{"id":"693","name":"textLimits meldet erst oberhalb der Grenze zu lang"},{"id":"694","name":"textLimits zählt ein Nicht-BMP-Zeichen als zwei Einheiten — wie @Size im Backend"},{"id":"695","name":"textLimits formatiert den Fehlertext als Ist/Grenze mit Tausenderpunkten"}],"source":"import { describe, expect, it } from 'vitest'\nimport { MAX_TEXT_LENGTH, isTooLong, tooLongMessage } from './textLimits'\n\ndescribe('textLimits', () => {\n  it('meldet erst oberhalb der Grenze zu lang', () => {\n    expect(isTooLong('a'.repeat(MAX_TEXT_LENGTH))).toBe(false)\n    expect(isTooLong('a'.repeat(MAX_TEXT_LENGTH + 1))).toBe(true)\n  })\n\n  it('zählt ein Nicht-BMP-Zeichen als zwei Einheiten — wie @Size im Backend', () => {\n    // Die Zählweise ist Vertrag: Java und JavaScript zählen UTF-16-Codeeinheiten, PostgreSQL nicht.\n    expect(isTooLong('😀'.repeat(MAX_TEXT_LENGTH / 2))).toBe(false)\n    expect(isTooLong('😀'.repeat(MAX_TEXT_LENGTH / 2) + '😀')).toBe(true)\n  })\n\n  it('formatiert den Fehlertext als Ist/Grenze mit Tausenderpunkten', () => {\n    expect(tooLongMessage(60_000)).toBe('60.000 / 50.000 Zeichen')\n  })\n})\n"},"src/lib/formatDuration.test.ts":{"tests":[{"id":"696","name":"formatDuration gibt „n. v.\" für null zurück"},{"id":"697","name":"formatDuration zeigt Sekunden unter einer Minute"},{"id":"698","name":"formatDuration zeigt Minuten unter einer Stunde"},{"id":"699","name":"formatDuration zeigt Stunden und Minuten unter einem Tag"},{"id":"700","name":"formatDuration zeigt Tage und Stunden ab einem Tag"},{"id":"701","name":"formatDuration rundet Sekunden-Bruchteile"}],"source":"import { describe, expect, it } from 'vitest'\nimport { formatDuration } from './formatDuration'\n\ndescribe('formatDuration', () => {\n  it('gibt „n. v.\" für null zurück', () => {\n    expect(formatDuration(null)).toBe('n. v.')\n  })\n\n  it('zeigt Sekunden unter einer Minute', () => {\n    expect(formatDuration(45)).toBe('45 s')\n  })\n\n  it('zeigt Minuten unter einer Stunde', () => {\n    expect(formatDuration(150)).toBe('2 Min')\n  })\n\n  it('zeigt Stunden und Minuten unter einem Tag', () => {\n    expect(formatDuration(3 * 3600 + 25 * 60)).toBe('3 Std 25 Min')\n  })\n\n  it('zeigt Tage und Stunden ab einem Tag', () => {\n    expect(formatDuration(2 * 86_400 + 5 * 3600)).toBe('2 T 5 Std')\n  })\n\n  it('rundet Sekunden-Bruchteile', () => {\n    expect(formatDuration(44.6)).toBe('45 s')\n  })\n})\n"}},"projectRoot":"/Users/manfredwolff/ki-projects/kanban-kit/frontend","config":{"$schema":"./node_modules/@stryker-mutator/core/schema/stryker-schema.json","testRunner":"vitest","plugins":["@stryker-mutator/vitest-runner"],"vitest":{"dir":"src/lib"},"mutate":["src/lib/leitstand.ts"],"reporters":["html","clear-text","progress"],"concurrency":4,"thresholds":{"high":100,"low":90,"break":null},"allowConsoleColors":true,"checkers":[],"checkerNodeArgs":[],"commandRunner":{"command":"npm test"},"coverageAnalysis":"perTest","clearTextReporter":{"allowColor":true,"allowEmojis":false,"logTests":true,"maxTestsToLog":3,"reportTests":true,"reportMutants":true,"reportScoreTable":true,"skipFull":false},"dashboard":{"baseUrl":"https://dashboard.stryker-mutator.io/api/reports","reportType":"full"},"dryRunOnly":false,"eventReporter":{"baseDir":"reports/mutation/events"},"ignorePatterns":[],"ignoreStatic":false,"incremental":false,"incrementalFile":"reports/stryker-incremental.json","force":false,"fileLogLevel":"off","inPlace":false,"logLevel":"info","maxConcurrentTestRunner
