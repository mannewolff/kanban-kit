an echten Protokollen gefundene Muster deutet jede Gate-Ablehnung, nicht nur den Review-Marker-Fall"},{"id":"240","name":"parseNightRunLog — an echten Protokollen gefundene Muster deutet die Reviewer-Zeile auch mit Bindestrich in der Umgebung"},{"id":"241","name":"parseNightRunLog — an echten Protokollen gefundene Muster deutet beide Praepositionen der Label-Zeile"},{"id":"242","name":"parseNightRunLog — was als ungedeutet zaehlt zaehlt Sitzungsstrom-Zeilen ohne Praefix nicht"},{"id":"243","name":"parseNightRunLog — was als ungedeutet zaehlt zaehlt das Sitzungsecho nicht"},{"id":"244","name":"parseNightRunLog — was als ungedeutet zaehlt zaehlt eine Runner-Zeile mit Praefix ohne passendes Muster und liefert einen Auszug"},{"id":"245","name":"parseNightRunLog — was als ungedeutet zaehlt nimmt hoechstens fuenf Zeilen in den Auszug auf, zaehlt aber alle"},{"id":"246","name":"parseNightRunLog — Zaehlungen zaehlt bearbeitete und uebergangene Arbeitspakete getrennt"},{"id":"247","name":"parseNightRunLog — Rohprotokoll je Arbeitspaket nimmt die Session-Oeffnungszeile mit Zeitstempel-Praefix als erste Zeile auf"},{"id":"248","name":"parseNightRunLog — Rohprotokoll je Arbeitspaket trennt die Rohprotokolle mehrerer Arbeitspakete"},{"id":"249","name":"parseNightRunLog — Rohprotokoll je Arbeitspaket haelt Sitzungsecho und Salvage-Zwischenzeilen beim selben Arbeitspaket"},{"id":"250","name":"parseNightRunLog — Rohprotokoll je Arbeitspaket ordnet eine Pruefblock-Zeile dem per Nummer referenzierten Paket zu, nicht dem zuletzt offenen"},{"id":"251","name":"parseNightRunLog — Rohprotokoll je Arbeitspaket verwirft eine Pruefzeile zu einer unbekannten Nummer"},{"id":"252","name":"parseNightRunLog — Rohprotokoll je Arbeitspaket nimmt Pruefblock-Kopf, Summe und Abschlusszeile in kein Rohprotokoll auf"},{"id":"253","name":"parseNightRunLog — Rohprotokoll je Arbeitspaket laesst das Rohprotokoll uebergangener Arbeitspakete leer"},{"id":"254","name":"parseNightRunLog — Rohprotokoll je Arbeitspaket nimmt eine Gate-Zeile des naechsten Kandidaten nicht ins Rohprotokoll des vorigen Pakets"},{"id":"255","name":"parseNightRunLog — Rohprotokoll je Arbeitspaket schliesst das Paket auch bei einer stummen Gate-Zeile mit fremder Nummer"},{"id":"256","name":"parseNightRunLog — Rohprotokoll je Arbeitspaket behaelt bei fehlender Abschlusszeile alle Zeilen bis zum Dateiende, inklusive Sitzungsstrom"},{"id":"257","name":"parseNightRunLog — Rohprotokoll je Arbeitspaket haengt die praefixlose Fehler-Zeile noch an und schliesst das Paket danach"},{"id":"258","name":"parseNightRunLog — Rohprotokoll je Arbeitspaket entfernt nur das Wagenruecklauf-Zeichen am Zeilenende"},{"id":"259","name":"parseNightRunLog — Fixture \"vollstaendiger Lauf\" deutet jede Runner-Zeile — unparsedCount ist 0"},{"id":"260","name":"parseNightRunLog — Fixture \"vollstaendiger Lauf\" findet alle Arbeitspakete des Laufs"},{"id":"261","name":"parseNightRunLog — Fixture \"vollstaendiger Lauf\" setzt weder die Lauf-Angaben noch die Kennzahlen eines Ergebnisstands"}],"source":"import { describe, expect, it } from 'vitest'\nimport { NIGHT_RUN_ERROR_CLASSES, parseNightRunLog } from './nightRunLog'\n\n/**\n * Fixtures sind **anonymisiert** (Issue #720): Pfade als `<"+"PFAD>`, keine Sitzungs-IDs,\n * Titel nach dem Schema `Paket N`. Zeilenmuster und Struktur bleiben erhalten — echte\n * Ausschnitte einzuchecken widerspraeche Entscheidung A1 des Plans #718 und landete\n * dauerhaft in der Historie eines Repos, das oeffentlich werden soll.\n */\n\n/** Runner-Zeile mit Zeitstempel-Praefix, wie `log()` in `night.mjs` sie schreibt. */\nconst z = (minute: number, text: string) =>\n  `[2026-09-01T22:${String(minute).padStart(2, '0')}:00.000Z] ${text}`\n\nconst START = (minute: number, modus = 'Implementierung') =>\n  z(minute, `Nacht-Runner startet (Modus ${modus}, max 5 Sessions, Modell claude-opus-5, Label none)`)\n\nconst ENDE = (minute: number) =>\n  z(minute, 'Nacht-Runner beendet: 1 erfolgreich, 0 zurueckgestellt, 1 Session(s) gestartet.')\n\ndescribe('NIGHT_RUN_ERROR_CLASSES', () => {\n  it('ist zur Laufzeit ein Array mit genau acht Eintraegen', () => {\n    expect(Array.isArray(NIGHT_RUN_ERROR_CLASSES)).toBe(true)\n    expect(NIGHT_RUN_ERROR_CLASSES).toHaveLength(8)\n  })\n\n  it('nennt die sieben Klassen aus Plan #718 und die achte aus #842', () => {\n    expect([...NIGHT_RUN_ERROR_CLASSES]).toEqual([\n      'CHECKS_RED',\n      'CHECKS_NOT_STARTED',\n      'DEPENDENCY_UNMET',\n      'UNEXPECTED_STATE',\n      'HARD_ABORT',\n      'AWAITING_DECISION',\n      'REVIEWER_FAILED',\n      'TIME_BUDGET_EXCEEDED',\n    ])\n  })\n})\n\ndescribe('parseNightRunLog — Zerlegung in Laeufe', () => {\n  it('liefert bei leerem Text keine Laeufe', () => {\n    expect(parseNightRunLog('')).toEqual({ runs: [], dryRunCount: 0 })\n  })\n\n  it('ignoriert Text vor der ersten Startzeile', () => {\n    const text = ['irgendwas', '{\"type\":\"assistant\"}', START(0), ENDE(5)].join('\\n')\n    const { runs } = parseNightRunLog(text)\n    expect(runs).toHaveLength(1)\n    expect(runs[0].startedAt).toBe('2026-09-01T22:00:00.000Z')\n  })\n\n  it('ignoriert auch eine Runner-Zeile mit Praefix vor dem ersten Start', () => {\n    // Sie gehoert zu keinem Lauf — sie darf weder einen eroeffnen noch als ungedeutet\n    // in einem spaeteren Lauf auftauchen.\n    const text = [z(0, 'Voellig unbekannte Zeile vor dem Start'), START(1), ENDE(5)].join('\\n')\n    const { runs } = parseNightRunLog(text)\n    expect(runs).toHaveLength(1)\n    expect(runs[0].unparsedCount).toBe(0)\n  })\n\n  it('trennt mehrere Laeufe einer Datei am jeweiligen Start', () => {\n    const text = [START(0), ENDE(5), START(10), ENDE(20)].join('\\n')\n    const { runs } = parseNightRunLog(text)\n    expect(runs.map((r) => r.startedAt)).toEqual([\n      '2026-09-01T22:00:00.000Z',\n      '2026-09-01T22:10:00.000Z',\n    ])\n  })\n\n  it('rechnet die Laufdauer aus Start- und Abschlusszeitstempel', () => {\n    const { runs } = parseNightRunLog([START(0), ENDE(5)].join('\\n'))\n    expect(runs[0].durationMs).toBe(5 * 60_000)\n    expect(runs[0].incomplete).toBe(false)\n  })\n\n  it('erkennt einen Start nur am Zeilenanfang, nicht als Teilzeichenkette', () => {\n    // Ein Sitzungsecho koennte den Text tragen — es darf keinen Lauf eroeffnen.\n    const text = [START(0), z(1, '  #10 > Bash: Nacht-Runner startet steht hier nur als Text'), ENDE(5)].join('\\n')\n    expect(parseNightRunLog(text).runs).toHaveLength(1)\n  })\n})\n\ndescribe('parseNightRunLog — Probelaeufe und Laeufe ohne Session', () => {\n  it('verwirft einen Probelauf und zaehlt ihn', () => {\n    const text = [\n      START(0, 'Implementierung'),\n      z(1, 'Dry-Run beendet: 2 Session(s) wuerden starten.'),\n      START(10),\n      ENDE(20),\n    ].join('\\n')\n    const { runs, dryRunCount } = parseNightRunLog(text)\n    expect(dryRunCount).toBe(1)\n    expect(runs).toHaveLength(1)\n    expect(runs[0].startedAt).toBe('2026-09-01T22:10:00.000Z')\n  })\n\n  it('bewahrt einen echten Lauf ohne Session bei leerem Ready', () => {\n    const text = [START(0), z(1, 'Ready ist leer — nichts zu tun.'), ENDE(2)].join('\\n')\n    const { runs, dryRunCount } = parseNightRunLog(text)\n    expect(dryRunCount).toBe(0)\n    expect(runs).toHaveLength(1)\n    expect(runs[0].items).toHaveLength(0)\n  })\n\n  it('bewahrt einen echten Lauf nach einem Label-Tippfehler', () => {\n    const text = [\n      START(0),\n      z(1, \"WARNUNG: kein Ready-Issue traegt das Label 'no' — es wird nichts verarbeitet.\"),\n      ENDE(2),\n    ].join('\\n')\n    const { runs } = parseNightRunLog(text)\n    expect(runs).toHaveLength(1)\n    expect(runs[0].items).toHaveLength(0)\n  })\n})\n\ndescribe('parseNightRunLog — unvollstaendige Laeufe und harter Abbruch', () => {\n  it('markiert einen Lauf ohne Abschlusszeile als incomplete', () => {\n    const text = [START(0), z(1, 'Session 1/5: Issue #100 — Paket 1')].join('\\n')\n    const { runs } = parseNightRunLog(text)\n    expect(runs[0].incomplete).toBe(true)\n  })\n\n  it('macht ein angefangenes Arbeitspaket ohne Ausgang rot mit HARD_ABORT', () => {\n    const text = [START(0), z(1, 'Session 1/5: Issue #100 — Paket 1')].join('\\n')\n    const { runs } = parseNightRunLog(text)\n    expect(runs[0].items).toHaveLength(1)\n    expect(runs[0].items[0]).toMatchObject({ cardNumber: 100, state: 'RED', errorClass: 'HARD_ABORT' })\n  })\n\n  it('deutet eine praefixlose Fehler-Zeile als harten Abbruch auf Lauf-Ebene, ohne sie als ungedeutet zu zaehlen', () => {\n    const text = [START(0), 'Fehler: Working Tree ist nicht sauber.'].join('\\n')\n    const { runs } = parseNightRunLog(text)\n    expect(runs).toHaveLength(1)\n    expect(runs[0].unparsedCount).toBe(0)\n    expect(runs[0].items).toHaveLength(0)\n    expect(runs[0].runState).toBe('RED')\n    expect(runs[0].runErrorClass).toBe('HARD_ABORT')\n    expect(runs[0].runExcerpt).toBe('Fehler: Working Tree ist nicht sauber.')\n  })\n})\n\ndescribe('parseNightRunLog — Zustandszuordnung je Arbeitspaket', () => {\n  const mitPruefung = (pruefzeile: string) =>\n    [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(8, '  Erfolg nach 7 min, Commit a1b2c3d, Issue #100 in In review.'),\n      z(9, 'Pruefungen der Sessions:'),\n      z(9, pruefzeile),\n      z(9, '  Summe: 1 Session(s) — 1 mit Pruefung, 0 ohne Aenderung, 0 ungeprueft; 1 Pruefung(en) gelaufen (davon 0 rot), 0 ausgelassen.'),\n      ENDE(10),\n    ].join('\\n')\n\n  it('macht Erfolg mit gruenen Pruefungen gruen', () => {\n    const { runs } = parseNightRunLog(\n      mitPruefung('  Issue #100: gelaufen: mvn verify -> gruen (Backend) | ausgelassen: keine'),\n    )\n    expect(runs[0].items[0]).toMatchObject({ state: 'GREEN', commit: 'a1b2c3d', durationMs: 7 * 60_000 })\n    expect(runs[0].items[0].errorClass).toBeUndefined()\n  })\n\n  it('macht Erfolg mit roter Pruefung gelb, nicht gruen', () => {\n    const { runs } = parseNightRunLog(\n      mitPruefung('  Issue #100: gelaufen: mvn verify -> rot (Backend) | ausgelassen: keine'),\n    )\n    expect(runs[0].items[0]).toMatchObject({ state: 'YELLOW', errorClass: 'CHECKS_RED' })\n  })\n\n  it('macht Erfolg ohne gefahrene Pruefung gelb mit CHECKS_NOT_STARTED', () => {\n    const { runs } = parseNightRunLog(\n      mitPruefung('  Issue #100: ungeprueft — die Session hat keine Pruefung gefahren.'),\n    )\n    expect(runs[0].items[0]).toMatchObject({ state: 'YELLOW', errorClass: 'CHECKS_NOT_STARTED' })\n  })\n\n  it('behandelt ein leeres Paket als geprueft und damit gruen', () => {\n    const { runs } = parseNightRunLog(\n      mitPruefung('  Issue #100: leeres Paket — keine Pruefung, weil nichts veraendert wurde.'),\n    )\n    expect(runs[0].items[0].state).toBe('GREEN')\n  })\n\n  it('macht einen Fehlschlag bei sauberem Tree rot', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(6, '  Fehlschlag nach 5 min: Issue #100 nicht in In review, Tree sauber — Issue ins Backlog, weiter.'),\n      ENDE(7),\n    ].join('\\n')\n    const { runs } = parseNightRunLog(text)\n    expect(runs[0].items[0]).toMatchObject({ state: 'RED', errorClass: 'UNEXPECTED_STATE' })\n  })\n\n  it('macht einen Infrastruktur-Fehlschlag rot mit HARD_ABORT', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(3, '  INFRASTRUKTUR-FEHLSCHLAG nach 2 min (Exit 1): Session-Start gescheitert — harter Stopp, Issue #100 bleibt unangetastet.'),\n      ENDE(4),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].items[0]).toMatchObject({ state: 'RED', errorClass: 'HARD_ABORT' })\n  })\n\n  it('macht einen Fehlschlag mit dirtyem Tree rot mit HARD_ABORT', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(6, '  FEHLSCHLAG nach 5 min: Issue #100 nicht in In review UND Working Tree dirty — harter Stopp.'),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].items[0]).toMatchObject({\n      state: 'RED',\n      errorClass: 'HARD_ABORT',\n      durationMs: 5 * 60_000,\n    })\n  })\n\n  it('macht unkommittete Reste nach einer erfolgreichen Runde rot mit HARD_ABORT', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(6, '  HARTER STOPP: erfolgreiche Runde zu Issue #100 hat unkommittete Reste hinterlassen — bitte morgens sichten und aufraeumen.'),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].items[0]).toMatchObject({ state: 'RED', errorClass: 'HARD_ABORT' })\n  })\n\n  it('macht einen gescheiterten Salvage-Versuch rot mit HARD_ABORT', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(6, '  SALVAGE-VERSUCH gescheitert — harter Stopp. Issue #100 weiterhin nicht in In review.'),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].items[0]).toMatchObject({ state: 'RED', errorClass: 'HARD_ABORT' })\n  })\n\n  it('macht ein uebersprungenes Arbeitspaket grau und haelt den Grund fest', () => {\n    const text = [\n      START(0),\n      z(1, '  #100 Paket 1 -> uebersprungen (ungeprueft (kein Issue-Review-Marker im Body))'),\n      ENDE(2),\n    ].join('\\n')\n    const item = parseNightRunLog(text).runs[0].items[0]\n    expect(item.state).toBe('GREY')\n    expect(item.excerpt).toContain('ungeprueft (kein Issue-Review-Marker im Body)')\n  })\n\n  it('macht ein wegen unerfuellter Abhaengigkeit zurueckgestelltes Paket grau mit DEPENDENCY_UNMET', () => {\n    const text = [\n      START(0),\n      z(1, '#100 zurueckgestellt: Abhaengigkeit #99 nicht erfuellt.'),\n      ENDE(2),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].items[0]).toMatchObject({\n      state: 'GREY',\n      errorClass: 'DEPENDENCY_UNMET',\n    })\n  })\n\n  it('macht ein Paket mit kit:klaeren rot mit AWAITING_DECISION', () => {\n    const text = [\n      START(0),\n      z(1, '  #100 Paket 1 -> uebersprungen (kit:klaeren, offene Entscheidung)'),\n      ENDE(2),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].items[0]).toMatchObject({\n      state: 'RED',\n      errorClass: 'AWAITING_DECISION',\n    })\n  })\n})\n\ndescribe('parseNightRunLog — Pruef-Lauf', () => {\n  const review = (ausgang: string) =>\n    [\n      START(0, 'Review'),\n      z(1, 'Review-Session 1/5: Issue #200 — Paket 2'),\n      z(4, ausgang),\n      z(5, 'Nacht-Review beendet (Stufe issue): 1 ohne Befund, 0 mit Befund, 0 Schaerfung fehlt.'),\n    ].join('\\n')\n\n  it('erkennt den Modus und die Stufe', () => {\n    const { runs } = parseNightRunLog(review('  Erfolg nach 3 min: Issue #200 geprueft ohne Befund, Marker gesetzt.'))\n    expect(runs[0].mode).toBe('REVIEW')\n    expect(runs[0].stage).toBe('issue')\n  })\n\n  it('macht \"geprueft ohne Befund\" gruen', () => {\n    const { runs } = parseNightRunLog(review('  Erfolg nach 3 min: Issue #200 geprueft ohne Befund, Marker gesetzt.'))\n    expect(runs[0].items[0].state).toBe('GREEN')\n  })\n\n  it('macht \"geprueft mit Befund\" gruen', () => {\n    const { runs } = parseNightRunLog(\n      review('  Erfolg nach 3 min: Issue #200 geprueft mit Befund — kein Marker, wartet auf dich.'),\n    )\n    expect(runs[0].items[0].state).toBe('GREEN')\n  })\n\n  it('macht \"Schaerfung fehlt\" gelb', () => {\n    const { runs } = parseNightRunLog(\n      review('  Nach 3 min: Issue #200 — Befunde vorhanden, aber kein Body-Vorschlag — Schaerfung fehlt.'),\n    )\n    expect(runs[0].items[0].state).toBe('YELLOW')\n  })\n\n  it('macht \"Synthese ohne Beleg\" rot mit AWAITING_DECISION', () => {\n    // Das Kit setzt in diesem Fall `kit:klaeren` — eine offene Entscheidung wartet auf\n    // einen Menschen, und der Ergebnisstand-Parser benennt sie genauso (Issue #816).\n    const { runs } = parseNightRunLog(\n      review(\n        '  Nach 3.2 min: Issue #200 — Synthese ohne Beleg: 2 als uebernommen bezeichnete Funde stehen nicht im Body-Vorschlag.',\n      ),\n    )\n    expect(runs[0].items[0]).toMatchObject({\n      cardNumber: 200,\n      state: 'RED',\n      errorClass: 'AWAITING_DECISION',\n      durationMs: 192_000,\n    })\n  })\n\n  it('macht \"die Session hat nichts hinterlassen\" rot mit CHECKS_NOT_STARTED', () => {\n    const { runs } = parseNightRunLog(\n      review('  Fehlschlag nach 3 min: Issue #200 — die Session hat nichts hinterlassen, weiter mit dem naechsten.'),\n    )\n    expect(runs[0].items[0]).toMatchObject({ state: 'RED', errorClass: 'CHECKS_NOT_STARTED' })\n  })\n\n  it('macht einen Infrastruktur-Fehlschlag im Pruef-Lauf rot mit HARD_ABORT', () => {\n    const { runs } = parseNightRunLog(\n      review('  INFRASTRUKTUR-FEHLSCHLAG nach 3 min (Exit 1): Session-Start gescheitert — harter Stopp, Issue #200 bleibt unangetastet.'),\n    )\n    expect(runs[0].items[0]).toMatchObject({ state: 'RED', errorClass: 'HARD_ABORT' })\n  })\n\n  it('macht ein Paket mit bereits gesetztem Marker grau', () => {\n    const text = [\n      START(0, 'Review'),\n      z(1, '#200 uebersprungen: traegt bereits einen Issue-Review-Marker.'),\n      z(2, 'Nacht-Review beendet (Stufe issue): 0 ohne Befund, 0 mit Befund, 0 Schaerfung fehlt.'),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].items[0].state).toBe('GREY')\n  })\n})\n\n/**\n * Diese vier Faelle stammen aus der manuellen Pruefung des Issues: zehn echte Protokolle\n * (August bis September, sieben Runner-Fassungen, rund 30 MB) durch den Parser gegeben.\n * Alle vier waren mit den urspruenglichen Fixtures unsichtbar — sie pruefen die Musterliste\n * gegen die Wirklichkeit statt gegen sich selbst.\n */\ndescribe('parseNightRunLog — an echten Protokollen gefundene Muster', () => {\n  it('versteht Minutenangaben mit Nachkommastelle', () => {\n    // Der Runner schreibt `nach 8.8 min`, nicht `nach 8 min`. Ohne diesen Fall blieb\n    // jedes erfolgreiche Arbeitspaket im Eroeffnungszustand — 19 gruene Pakete eines\n    // echten Laufs erschienen als RED/HARD_ABORT.\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(10, '  Erfolg nach 8.8 min, Commit a1b2c3d, Issue #100 in In review.'),\n      ENDE(11),\n    ].join('\\n')\n    const run = parseNightRunLog(text).runs[0]\n    expect(run.unparsedCount).toBe(0)\n    expect(run.items[0]).toMatchObject({ state: 'GREEN', durationMs: 528_000 })\n  })\n\n  it('deutet jede Gate-Ablehnung, nicht nur den Review-Marker-Fall', () => {\n    const text = [\n      START(0),\n      z(1, '#411 uebersprungen: Idee ([Idee]), wird nicht implementiert.'),\n      z(1, '#431 uebersprungen: fachliches Issue ([Fachlich]), wird nicht implementiert.'),\n      z(2, '#269 uebersprungen: ungeprueft (kein Issue-Review-Marker im Body).'),\n      ENDE(3),\n    ].join('\\n')\n    const run = parseNightRunLog(text).runs[0]\n    expect(run.unparsedCount).toBe(0)\n    expect(run.items.map((i) => i.state)).toEqual(['GREY', 'GREY', 'GREY'])\n  })\n\n  it('deutet die Reviewer-Zeile auch mit Bindestrich in der Umgebung', () => {\n    const text = [\n      START(0, 'Review'),\n      z(1, '  Reviewer opus (claude) in review-session: verfuegbar'),\n      z(1, '  Reviewer codex (command) in review-session: NICHT verfuegbar — Befehl benoetigte Genehmigung'),\n      z(1, '  Reviewer fable (claude): verfuegbar'),\n      z(2, 'Nacht-Review beendet (Stufe issue): 0 ohne Befund, 0 mit Befund, 0 Schaerfung fehlt.'),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].unparsedCount).toBe(0)\n  })\n\n  it('deutet beide Praepositionen der Label-Zeile', () => {\n    // Der Runner schreibt „In Ready\", aber „Im Backlog\".\n    const text = [\n      START(0),\n      z(1, '  In Ready vorhandene Labels: keine'),\n      z(1, '  Im Backlog vorhandene Labels: Aktuell, review:offen'),\n      ENDE(2),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].unparsedCount).toBe(0)\n  })\n})\n\ndescribe('parseNightRunLog — was als ungedeutet zaehlt', () => {\n  it('zaehlt Sitzungsstrom-Zeilen ohne Praefix nicht', () => {\n    const text = [\n      START(0),\n      '{\"type\":\"assistant\",\"message\":{\"role\":\"assistant\"}}',\n      '{\"type\":\"user\"}',\n      ENDE(2),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].unparsedCount).toBe(0)\n  })\n\n  it('zaehlt das Sitzungsecho nicht', () => {\n    const text = [START(0), z(1, '  #100 > Bash: npm test'), ENDE(2)].join('\\n')\n    expect(parseNightRunLog(text).runs[0].unparsedCount).toBe(0)\n  })\n\n  it('zaehlt eine Runner-Zeile mit Praefix ohne passendes Muster und liefert einen Auszug', () => {\n    const text = [START(0), z(1, 'Voellig unbekannte Runner-Zeile aus einer aelteren Fassung'), ENDE(2)].join('\\n')\n    const run = parseNightRunLog(text).runs[0]\n    expect(run.unparsedCount).toBe(1)\n    expect(run.unparsedSample).toEqual(['Voellig unbekannte Runner-Zeile aus einer aelteren Fassung'])\n  })\n\n  it('nimmt hoechstens fuenf Zeilen in den Auszug auf, zaehlt aber alle', () => {\n    const zeilen = Array.from({ length: 8 }, (_, i) => z(i + 1, `Unbekannte Zeile ${i}`))\n    const { runs } = parseNightRunLog([START(0), ...zeilen, ENDE(20)].join('\\n'))\n    expect(runs[0].unparsedCount).toBe(8)\n    expect(runs[0].unparsedSample).toHaveLength(5)\n  })\n})\n\ndescribe('parseNightRunLog — Zaehlungen', () => {\n  it('zaehlt bearbeitete und uebergangene Arbeitspakete getrennt', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(6, '  Erfolg nach 5 min, Commit a1b2c3d, Issue #100 in In review.'),\n      z(7, '  #101 Paket 2 -> uebersprungen (ungeprueft (kein Issue-Review-Marker im Body))'),\n      ENDE(8),\n    ].join('\\n')\n    const run = parseNightRunLog(text).runs[0]\n    expect(run.processedCount).toBe(1)\n    expect(run.skippedCount).toBe(1)\n    expect(run.items.map((i) => i.position)).toEqual([0, 1])\n  })\n})\n\n/**\n * Das Rohprotokoll je Arbeitspaket (Issue #746, Plan #744 A1–A3). Es traegt den\n * Sitzungsstrom und bleibt damit im Browser — `zurEinlieferung` pickt seine Felder\n * einzeln, `rawLines` ist nicht darunter (Plan #718, A1).\n */\ndescribe('parseNightRunLog — Rohprotokoll je Arbeitspaket', () => {\n  it('nimmt die Session-Oeffnungszeile mit Zeitstempel-Praefix als erste Zeile auf', () => {\n    const text = [START(0), z(1, 'Session 1/5: Issue #100 — Paket 1'), ENDE(2)].join('\\n')\n    const item = parseNightRunLog(text).runs[0].items[0]\n    expect(item.rawLines[0]).toBe(z(1, 'Session 1/5: Issue #100 — Paket 1'))\n  })\n\n  it('trennt die Rohprotokolle mehrerer Arbeitspakete', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(6, '  Erfolg nach 5 min, Commit a1b2c3d, Issue #100 in In review.'),\n      z(7, 'Session 2/5: Issue #101 — Paket 2'),\n      z(9, '  Fehlschlag nach 2 min: Issue #101 nicht in In review, Tree sauber — Issue ins Backlog, weiter.'),\n      ENDE(10),\n    ].join('\\n')\n    const [erstes, zweites] = parseNightRunLog(text).runs[0].items\n    expect(erstes.rawLines).toEqual([\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(6, '  Erfolg nach 5 min, Commit a1b2c3d, Issue #100 in In review.'),\n    ])\n    expect(zweites.rawLines).toEqual([\n      z(7, 'Session 2/5: Issue #101 — Paket 2'),\n      z(9, '  Fehlschlag nach 2 min: Issue #101 nicht in In review, Tree sauber — Issue ins Backlog, weiter.'),\n    ])\n  })\n\n  it('haelt Sitzungsecho und Salvage-Zwischenzeilen beim selben Arbeitspaket', () => {\n    // Alle drei Zeilen nennen #106 oder gar keine Nummer — keine schliesst das Paket.\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #106 — Paket 6'),\n      z(2, '  #106 > Bash: npm test'),\n      z(3, '  SALVAGE-VERSUCH gestartet (Checks extern verifiziert gruen): Issue #106 — Zwischenstand wird gegen das Issue geprueft.'),\n      z(4, '  Salvage erfolgreich, Commit d4e5f6a, Issue #106 in In review.'),\n      ENDE(5),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].items[0].rawLines).toHaveLength(4)\n  })\n\n  it('ordnet eine Pruefblock-Zeile dem per Nummer referenzierten Paket zu, nicht dem zuletzt offenen', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(6, '  Erfolg nach 5 min, Commit a1b2c3d, Issue #100 in In review.'),\n      z(7, 'Session 2/5: Issue #101 — Paket 2'),\n      z(8, '  Issue #100: gelaufen: npm test -> gruen (Frontend) | ausgelassen: keine'),\n    ].join('\\n')\n    const [erstes, zweites] = parseNightRunLog(text).runs[0].items\n    expect(erstes.rawLines).toContain(\n      z(8, '  Issue #100: gelaufen: npm test -> gruen (Frontend) | ausgelassen: keine'),\n    )\n    expect(zweites.rawLines).toEqual([z(7, 'Session 2/5: Issue #101 — Paket 2')])\n  })\n\n  it('verwirft eine Pruefzeile zu einer unbekannten Nummer', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(9, 'Pruefungen der Sessions:'),\n      z(9, '  Issue #999: gelaufen: npm test -> gruen (Frontend) | ausgelassen: keine'),\n      z(9, '  Issue #998: ungeprueft — die Session hat keine Pruefung gefahren.'),\n      z(9, '  Issue #997: leeres Paket — keine Pruefung, weil nichts veraendert wurde.'),\n      ENDE(10),\n    ].join('\\n')\n    const run = parseNightRunLog(text).runs[0]\n    expect(run.unparsedCount).toBe(0)\n    expect(run.items).toHaveLength(1)\n    expect(run.items[0].rawLines).toEqual([z(1, 'Session 1/5: Issue #100 — Paket 1')])\n  })\n\n  it('nimmt Pruefblock-Kopf, Summe und Abschlusszeile in kein Rohprotokoll auf', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(6, '  Erfolg nach 5 min, Commit a1b2c3d, Issue #100 in In review.'),\n      z(9, 'Pruefungen der Sessions:'),\n      z(9, '  Issue #100: gelaufen: npm test -> gruen (Frontend) | ausgelassen: keine'),\n      z(9, '  Summe: 1 Session(s) — 1 mit Pruefung, 0 ohne Aenderung, 0 ungeprueft; 1 Pruefung(en) gelaufen (davon 0 rot), 0 ausgelassen.'),\n      ENDE(10),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].items[0].rawLines).toEqual([\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(6, '  Erfolg nach 5 min, Commit a1b2c3d, Issue #100 in In review.'),\n      z(9, '  Issue #100: gelaufen: npm test -> gruen (Frontend) | ausgelassen: keine'),\n    ])\n  })\n\n  it('laesst das Rohprotokoll uebergangener Arbeitspakete leer', () => {\n    // Sie durchlaufen keine Session-Oeffnungszeile (A3).\n    const text = [\n      START(0),\n      z(1, '  #100 Paket 1 -> uebersprungen (ungeprueft (kein Issue-Review-Marker im Body))'),\n      z(2, '#101 zurueckgestellt: Abhaengigkeit #99 nicht erfuellt.'),\n      ENDE(3),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].items.map((i) => i.rawLines)).toEqual([[], []])\n  })\n\n  it('nimmt eine Gate-Zeile des naechsten Kandidaten nicht ins Rohprotokoll des vorigen Pakets', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(6, '  Erfolg nach 5 min, Commit a1b2c3d, Issue #100 in In review.'),\n      z(7, '#102 uebersprungen: Idee ([Idee]), wird nicht implementiert.'),\n      ENDE(8),\n    ].join('\\n')\n    const [erstes, zweites] = parseNightRunLog(text).runs[0].items\n    expect(erstes.rawLines).toHaveLength(2)\n    expect(zweites.rawLines).toEqual([])\n  })\n\n  it('schliesst das Paket auch bei einer stummen Gate-Zeile mit fremder Nummer', () => {\n    // `#104 bewusst ohne Pruefung freigegeben …` traegt keinen Zustand, aber eine\n    // fremde Nummer — sie gehoert zum naechsten Kandidaten, nicht zu #100.\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      z(6, '  Erfolg nach 5 min, Commit a1b2c3d, Issue #100 in In review.'),\n      z(7, '#104 bewusst ohne Pruefung freigegeben (Pruefung: Verzicht), wird implementiert.'),\n      z(8, 'Morgen-Ritual: /review -> Test -> push main. Protokoll: <"+"PFAD>'),\n      ENDE(9),\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].items[0].rawLines).toHaveLength(2)\n  })\n\n  it('behaelt bei fehlender Abschlusszeile alle Zeilen bis zum Dateiende, inklusive Sitzungsstrom', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      '{\"type\":\"assistant\",\"message\":{\"role\":\"assistant\"}}',\n      z(2, '  #100 > Bash: npm test'),\n      '{\"type\":\"user\"}',\n    ].join('\\n')\n    const run = parseNightRunLog(text).runs[0]\n    expect(run.incomplete).toBe(true)\n    expect(run.items[0].rawLines).toEqual([\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      '{\"type\":\"assistant\",\"message\":{\"role\":\"assistant\"}}',\n      z(2, '  #100 > Bash: npm test'),\n      '{\"type\":\"user\"}',\n    ])\n  })\n\n  it('haengt die praefixlose Fehler-Zeile noch an und schliesst das Paket danach', () => {\n    const text = [\n      START(0),\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      'Fehler: Working Tree ist nicht sauber.',\n      '{\"type\":\"user\"}',\n    ].join('\\n')\n    expect(parseNightRunLog(text).runs[0].items[0].rawLines).toEqual([\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n      'Fehler: Working Tree ist nicht sauber.',\n    ])\n  })\n\n  it('entfernt nur das Wagenruecklauf-Zeichen am Zeilenende', () => {\n    const text = [START(0), z(1, 'Session 1/5: Issue #100 — Paket 1'), ENDE(2)].join('\\r\\n')\n    expect(parseNightRunLog(text).runs[0].items[0].rawLines).toEqual([\n      z(1, 'Session 1/5: Issue #100 — Paket 1'),\n    ])\n  })\n})\n\ndescribe('parseNightRunLog — Fixture \"vollstaendiger Lauf\"', () => {\n  /**\n   * Je eine anonymisierte Zeile pro `log(`-Aufruf der heutigen `night.mjs`. Daran wird\n   * die Vollzaehligkeit der Musterliste zum Testergebnis statt zur Absichtserklaerung\n   * (Issue #720).\n   */\n  const vollstaendig = [\n    START(0),\n    z(1, '  Vorflug-Session startet (Modell claude-sonnet-5, Tracker-Probe an).'),\n    z(2, '  Reviewer fable (claude) in runner: verfuegbar'),\n    z(2, '  Tracker (runner): erreichbar'),\n    z(3, 'Session 1/5: Issue #100 — Paket 1'),\n    z(3, '  #100 > Bash: npm test'),\n    z(4, '  buildChecks rot — einmaliger Format-Fix wird angewendet: npm run format'),\n    z(4, '  FORMAT-FIX angewendet, buildChecks jetzt gruen — der Lauf geht weiter.'),\n    z(9, '  Erfolg nach 5 min, Commit a1b2c3d, Issue #100 in In review.'),\n    z(10, 'Session 2/5: Issue #101 — Paket 2'),\n    z(12, '  Fehlschlag nach 2 min: Issue #101 nicht in In review, Tree sauber — Issue ins Backlog, weiter.'),\n    z(13, '  #102 Paket 3 -> uebersprungen (ungeprueft (kein Issue-Review-Marker im Body))'),\n    z(13, '#103 zurueckgestellt: Abhaengigkeit #99 nicht erfuellt.'),\n    z(14, '#104 bewusst ohne Pruefung freigegeben (Pruefung: Verzicht), wird implementiert.'),\n    z(14, '  #105 Paket 5 -> ueber --max 5, bleibt liegen.'),\n    z(15, '  SALVAGE-VERSUCH gestartet (Checks extern verifiziert gruen): Issue #106 — Zwischenstand wird gegen das Issue geprueft.'),\n    z(16, '  Salvage erfolgreich, Commit d4e5f6a, Issue #106 in In review.'),\n    z(17, 'Pruefungen der Sessions:'),\n    z(17, '  Issue #100: gelaufen: npm test -> gruen (Frontend) | ausgelassen: keine'),\n    z(17, '  Issue #101: ungeprueft — die Session hat keine Pruefung gefahren.'),\n    z(17, '  Summe: 2 Session(s) — 1 mit Pruefung, 0 ohne Aenderung, 1 ungeprueft; 1 Pruefung(en) gelaufen (davon 0 rot), 0 ausgelassen.'),\n    z(18, 'Morgen-Ritual: /review -> Test -> push main. Protokoll: <"+"PFAD>'),\n    ENDE(19),\n  ].join('\\n')\n\n  it('deutet jede Runner-Zeile — unparsedCount ist 0', () => {\n    expect(parseNightRunLog(vollstaendig).runs[0].unparsedCount).toBe(0)\n  })\n\n  it('findet alle Arbeitspakete des Laufs', () => {\n    const run = parseNightRunLog(vollstaendig).runs[0]\n    expect(run.items.map((i) => i.cardNumber)).toEqual([100, 101, 102, 103, 105, 106])\n  })\n\n  /**\n   * Die Grenze zwischen den beiden Parsern (Issue #865): `stand`, `kennzahlen` und\n   * `kettenStufen` stammen ausschliesslich aus einem Ergebnisstand. Der Test belegt\n   * heute, dass Code, der nichts setzt, nichts setzt — er sichert aber die Grenze, und\n   * genau die ist beim naechsten Umbau der gefaehrdete Punkt (Plan #863, abgelehnter\n   * Hinweis 15 des Reviews).\n   */\n  it('setzt weder die Lauf-Angaben noch die Kennzahlen eines Ergebnisstands', () => {\n    const run = parseNightRunLog(vollstaendig).runs[0]\n    expect(run).not.toHaveProperty('stand')\n    for (const item of run.items) {\n      expect(item).not.toHaveProperty('kennzahlen')\n      expect(item).not.toHaveProperty('kettenStufen')\n    }\n  })\n})\n"},"src/lib/verbrauchZeitraum.test.ts":{"tests":[{"id":"262","name":"zeitraumBeschriftung benennt eine Nacht mit ihrem Beginn und ihrem Folgetag"},{"id":"263","name":"zeitraumBeschriftung benennt die Nacht ueber den Monatswechsel richtig"},{"id":"264","name":"zeitraumBeschriftung benennt eine Woche mit ihren Naechten von Montag bis Sonntag"},{"id":"265","name":"zeitraumBeschriftung benennt einen Monat mit Name und Jahr"},{"id":"266","name":"vorzeitraumName nennt je Art den Vorzeitraum beim Namen"},{"id":"267","name":"laeufeText, sitzungenText und kartenText setzt den Einzahl- und den Mehrzahlfall"},{"id":"268","name":"nachtKurz nennt Wochentag, Beginn und Folgetag ohne Jahr"},{"id":"269","name":"nachtKurz zaehlt ueber den Monatswechsel richtig weiter"},{"id":"270","name":"vergleichMitVorzeitraum nennt teurer mit dem Unterschied, ohne dass der Leser rechnet"},{"id":"271","name":"vergleichMitVorzeitraum nennt billiger mit dem Unterschied"},{"id":"272","name":"vergleichMitVorzeitraum unterscheidet unveraendert davon"},{"id":"273","name":"vergleichMitVorzeitraum haelt Rundungsreste aus der Gleitkommarechnung fuer unveraendert"},{"id":"274","name":"vergleichMitVorzeitraum nennt nicht vergleichbar, wenn eine der beiden Angaben fehlt — in beiden Richtungen"},{"id":"275","name":"vergleichMitVorzeitraum vergleicht eine gemessene Null als Wert"},{"id":"276","name":"zwischenspeicherAnteil schreibt den Prozentwert mit einer Nachkommastelle"},{"id":"277","name":"zwischenspeicherAnteil ist ohne Eingabemenge nicht bestimmt"},{"id":"278","name":"zwischenspeicherAnteil nennt einen gemessenen Anteil von null Prozent als Wert"},{"id":"279","name":"zeitraumFall und zeitraumHinweis unterscheidet die vier Faelle"},{"id":"280","name":"zeitraumFall und zeitraumHinweis liefert vier verschiedene Texte"},{"id":"281","name":"zeitraumFall und zeitraumHinweis sagt beim Zeitraum ohne Lauf und ohne Sitzung den Satz aus #926 AK 9"},{"id":"282","name":"zeitraumFall und zeitraumHinweis haelt einen Zeitraum ohne Nachtlauf, aber mit Sitzungen, fuer voll besetzt"},{"id":"283","name":"zeitraumFall und zeitraumHinweis nennt in keinem Hinweis das Wort aus dem Kartenblatt"},{"id":"284","name":"zeitraumFall und zeitraumHinweis sagt ganz vor dem aeltesten aufbewahrten Lauf NICHT den Satz aus AK 9"},{"id":"285","name":"zeitraumFall und zeitraumHinweis nennt eine Teilabdeckung neben den Zahlen, auch ohne Lauf in der aufbewahrten Zeit"},{"id":"286","name":"zeitraumFall und zeitraumHinweis hat ohne Besonderheit keinen Hinweis"},{"id":"287","name":"erfassungsstand nennt einen Zeitraum ganz vor dem Beginn nicht erfasst"},{"id":"288","name":"erfassungsstand zaehlt einen Beginn genau am Ende des Zeitraums noch als davor"},{"id":"289","name":"erfassungsstand nennt einen Zeitraum, der den Beginn schneidet, teilweise erfasst"},{"id":"290","name":"erfassungsstand nennt einen Zeitraum ganz nach dem Beginn erfasst — auch wenn er genau dort anfaengt"},{"id":"291","name":"erfassungsstand nennt ein Projekt ohne gemeldete Sitzung nicht erfasst"},{"id":"292","name":"erfassungsstand schreibt die beiden Aussagen aus, ohne 0 zu sagen"},{"id":"293","name":"zeitraumHinweis mit Erfassungsluecke erklaert einen Zeitraum ganz vor dem Erfassungsbeginn mit dessen Datum"},{"id":"294","name":"zeitraumHinweis mit Erfassungsluecke erklaert einen angeschnittenen Erfassungsbeginn eigens"},{"id":"295","name":"zeitraumHinweis mit Erfassungsluecke stellt den Erfassungs-Hinweis vor den Abdeckungs-Hinweis"},{"id":"296","name":"zeitraumHinweis mit Erfassungsluecke schweigt, solange das Projekt keine Sitzung gemeldet hat"},{"id":"297","name":"zeitraumHinweis mit Erfassungsluecke schweigt, wenn der Zeitraum ganz nach dem Erfassungsbeginn liegt"}],"source":"import { describe, expect, it } from 'vitest'\nimport type { VerbrauchAngaben, VerbrauchKennzahlen } from '../api/nightRunUsage'\nimport {\n  KEIN_LAUF_TEXT,\n  NICHT_ERFASST_TEXT,\n  TEILWEISE_ERFASST_TEXT,\n  erfassungsstand,\n  kartenText,\n  laeufeText,\n  nachtKurz,\n  sitzungenText,\n  vergleichMitVorzeitraum,\n  vorzeitraumName,\n  zeitraumBeschriftung,\n  zeitraumFall,\n  zeitraumHinweis,\n  zwischenspeicherAnteil,\n} from './verbrauchZeitraum'\n\n/** Textrechnung der Verbrauchs-Auswertung (Issue #940, Plan #933). */\n\n/** `Intl` setzt vor Einheiten ein geschütztes Leerzeichen; verglichen wird der Wortlaut. */\nconst lesbar = (text: string | null) => text?.replaceAll(' ', ' ') ?? null\n\nconst nichts: VerbrauchAngaben = {\n  costUsd: null,\n  inputTokens: null,\n  outputTokens: null,\n  cachedInputTokens: null,\n  cachedInputSharePercent: null,\n}\n\nconst kosten = (costUsd: number | null): VerbrauchAngaben => ({ ...nichts, costUsd })\n\nconst kennzahlen = (werte: Partial<"+"VerbrauchKennzahlen>): VerbrauchKennzahlen => ({\n  type: 'MONTH',\n  firstDay: '2026-08-01',\n  lastDay: '2026-08-31',\n  from: '2026-08-01T10:00:00Z',\n  to: '2026-09-01T10:00:00Z',\n  coverage: 'COMPLETE',\n  noRuns: false,\n  runCount: 3,\n  nightRunCount: 3,\n  interactiveRunCount: 0,\n  durationMs: 1000,\n  cardCount: 2,\n  usage: { total: kosten(4), cardShare: kosten(3), remainder: kosten(1) },\n  // Die Textrechnung urteilt über die Gesamtsumme — sie dient Leitstand und Nachtlauf-Seite\n  // gleichermaßen. Der Gattungs-Split steht daneben und bleibt hier ohne Einfluss (Issue #1016).\n  usageByKind: {\n    night: { total: kosten(4), cardShare: kosten(3), remainder: kosten(1) },\n    interactive: { total: nichts, cardShare: nichts, remainder: nichts },\n  },\n  interactiveUsageSince: null,\n  ...werte,\n})\n\ndescribe('zeitraumBeschriftung', () => {\n  it('benennt eine Nacht mit ihrem Beginn und ihrem Folgetag', () => {\n    expect(\n      zeitraumBeschriftung(kennzahlen({ type: 'DAY', firstDay: '2026-09-15', lastDay: '2026-09-15' })),\n    ).toBe('Nacht vom 15.09.2026 auf den 16.09.2026')\n  })\n\n  it('benennt die Nacht ueber den Monatswechsel richtig', () => {\n    expect(\n      zeitraumBeschriftung(kennzahlen({ type: 'DAY', firstDay: '2026-08-31', lastDay: '2026-08-31' })),\n    ).toBe('Nacht vom 31.08.2026 auf den 01.09.2026')\n  })\n\n  it('benennt eine Woche mit ihren Naechten von Montag bis Sonntag', () => {\n    expect(\n      zeitraumBeschriftung(\n        kennzahlen({ type: 'WEEK', firstDay: '2026-09-07', lastDay: '2026-09-13' }),\n      ),\n    ).toBe('Woche vom 07.09.2026 bis 13.09.2026')\n  })\n\n  it('benennt einen Monat mit Name und Jahr', () => {\n    expect(zeitraumBeschriftung(kennzahlen({ type: 'MONTH', firstDay: '2026-08-01' }))).toBe(\n      'August 2026',\n    )\n  })\n})\n\ndescribe('vorzeitraumName', () => {\n  it('nennt je Art den Vorzeitraum beim Namen', () => {\n    expect(vorzeitraumName(kennzahlen({ type: 'DAY' }))).toBe('Vornacht')\n    expect(vorzeitraumName(kennzahlen({ type: 'WEEK' }))).toBe('Vorwoche')\n    expect(vorzeitraumName(kennzahlen({ type: 'MONTH' }))).toBe('Vormonat')\n  })\n})\n\ndescribe('laeufeText, sitzungenText und kartenText', () => {\n  it('setzt den Einzahl- und den Mehrzahlfall', () => {\n    expect(laeufeText(1)).toBe('1 Lauf')\n    expect(laeufeText(0)).toBe('0 Läufe')\n    expect(laeufeText(7)).toBe('7 Läufe')\n    expect(sitzungenText(1)).toBe('1 Sitzung')\n    expect(sitzungenText(0)).toBe('0 Sitzungen')\n    expect(sitzungenText(4)).toBe('4 Sitzungen')\n    expect(kartenText(1)).toBe('1 Karte')\n    expect(kartenText(0)).toBe('0 Karten')\n    expect(kartenText(54)).toBe('54 Karten')\n  })\n})\n\ndescribe('nachtKurz', () => {\n  it('nennt Wochentag, Beginn und Folgetag ohne Jahr', () => {\n    expect(nachtKurz('2026-09-08')).toBe('Di 08.09. → 09.09.')\n  })\n\n  it('zaehlt ueber den Monatswechsel richtig weiter', () => {\n    expect(nachtKurz('2026-08-31')).toBe('Mo 31.08. → 01.09.')\n  })\n})\n\ndescribe('vergleichMitVorzeitraum', () => {\n  it('nennt teurer mit dem Unterschied, ohne dass der Leser rechnet', () => {\n    const vergleich = vergleichMitVorzeitraum(kosten(6.5), kosten(4))\n\n    expect(vergleich.richtung).toBe('teurer')\n    expect(lesbar(vergleich.text)).toBe('2,50 $ teurer als im Vorzeitraum')\n  })\n\n  it('nennt billiger mit dem Unterschied', () => {\n    const vergleich = vergleichMitVorzeitraum(kosten(1), kosten(4))\n\n    expect(vergleich.richtung).toBe('billiger')\n    expect(lesbar(vergleich.text)).toBe('3,00 $ billiger als im Vorzeitraum')\n  })\n\n  it('unterscheidet unveraendert davon', () => {\n    const vergleich = vergleichMitVorzeitraum(kosten(4), kosten(4))\n\n    expect(vergleich.richtung).toBe('unveraendert')\n    expect(vergleich.text).toBe('genauso teuer wie im Vorzeitraum')\n  })\n\n  /** 0,1 + 0,2 ist in Gleitkomma nicht 0,3 — auf den Mikrodollar gleich gilt als unveraendert. */\n  it('haelt Rundungsreste aus der Gleitkommarechnung fuer unveraendert', () => {\n    expect(vergleichMitVorzeitraum(kosten(0.1 + 0.2), kosten(0.3)).richtung).toBe('unveraendert')\n  })\n\n  it('nennt nicht vergleichbar, wenn eine der beiden Angaben fehlt — in beiden Richtungen', () => {\n    for (const [jetzt, vorher] of [\n      [kosten(null), kosten(4)],\n      [kosten(4), kosten(null)],\n      [kosten(null), kosten(null)],\n    ]) {\n      const vergleich = vergleichMitVorzeitraum(jetzt, vorher)\n      expect(vergleich.richtung).toBe('nicht-vergleichbar')\n      expect(vergleich.text).toBe('nicht vergleichbar — eine der beiden Kostenangaben fehlt')\n    }\n  })\n\n  it('vergleicht eine gemessene Null als Wert', () => {\n    expect(vergleichMitVorzeitraum(kosten(0), kosten(2)).richtung).toBe('billiger')\n  })\n})\n\ndescribe('zwischenspeicherAnteil', () => {\n  it('schreibt den Prozentwert mit einer Nachkommastelle', () => {\n    expect(\n      lesbar(zwischenspeicherAnteil({ ...nichts, inputTokens: 200, cachedInputSharePercent: 25 })),\n    ).toBe('25,0 %')\n  })\n\n  it('ist ohne Eingabemenge nicht bestimmt', () => {\n    expect(\n      zwischenspeicherAnteil({ ...nichts, cachedInputTokens: 50, cachedInputSharePercent: null }),\n    ).toBe('nicht bestimmt')\n  })\n\n  it('nennt einen gemessenen Anteil von null Prozent als Wert', () => {\n    expect(\n      lesbar(zwischenspeicherAnteil({ ...nichts, inputTokens: 200, cachedInputSharePercent: 0 })),\n    ).toBe('0,0 %')\n  })\n})\n\ndescribe('zeitraumFall und zeitraumHinweis', () => {\n  const leer = { noRuns: true, runCount: 0, nightRunCount: 0, interactiveRunCount: 0 } as const\n  const faelle = {\n    keinLauf: kennzahlen({ ...leer, usage: { total: nichts, cardShare: nichts, remainder: nichts } }),\n    vorAufbewahrung: kennzahlen({\n      coverage: 'BEFORE_RETENTION',\n      ...leer,\n      usage: { total: nichts, cardShare: nichts, remainder: nichts },\n    }),\n    teilweise: kennzahlen({ coverage: 'PARTIAL' }),\n    nichtGemessen: kennzahlen({ usage: { total: nichts, cardShare: nichts, remainder: nichts } }),\n  }\n\n  it('unterscheidet die vier Faelle', () => {\n    expect(zeitraumFall(faelle.keinLauf)).toBe('kein-lauf')\n    expect(zeitraumFall(faelle.vorAufbewahrung)).toBe('vor-aufbewahrung')\n    expect(zeitraumFall(faelle.teilweise)).toBe('teilweise')\n    expect(zeitraumFall(faelle.nichtGemessen)).toBe('nicht-gemessen')\n  })\n\n  it('liefert vier verschiedene Texte', () => {\n    const texte = Object.values(faelle).map((f) => zeitraumHinweis(f))\n\n    expect(new Set(texte).size).toBe(4)\n    expect(texte).not.toContain(null)\n  })\n\n  it('sagt beim Zeitraum ohne Lauf und ohne Sitzung den Satz aus #926 AK 9', () => {\n    expect(zeitraumHinweis(faelle.keinLauf)).toBe(KEIN_LAUF_TEXT)\n    expect(KEIN_LAUF_TEXT).toBe(\n      'In diesem Zeitraum hat weder ein Lauf noch eine Sitzung stattgefunden.',\n    )\n  })\n\n  /**\n   * Ein Tag ohne Nachtlauf, aber mit Sitzungen, ist nicht leer (#984 AK 1) — die Zahlen der\n   * Sitzungen stehen dort, wo bisher „kein Lauf\" stand.\n   */\n  it('haelt einen Zeitraum ohne Nachtlauf, aber mit Sitzungen, fuer voll besetzt', () => {\n    const nurSitzungen = kennzahlen({\n      noRuns: false,\n      runCount: 2,\n      nightRunCount: 0,\n      interactiveRunCount: 2,\n      usageByKind: {\n        night: { total: nichts, cardShare: nichts, remainder: nichts },\n        interactive: { total: kosten(4), cardShare: kosten(3), remainder: kosten(1) },\n      },\n    })\n\n    expect(zeitraumFall(nurSitzungen)).toBe('vollstaendig')\n    expect(zeitraumHinweis(nurSitzungen)).not.toBe(KEIN_LAUF_TEXT)\n  })\n\n  /** Der Text des Kartenblatts bleibt dem Kartenblatt (#984 AK 6). */\n  it('nennt in keinem Hinweis das Wort aus dem Kartenblatt', () => {\n    for (const fall of Object.values(faelle)) {\n      expect(zeitraumHinweis(fall)).not.toContain('nicht gemessen')\n    }\n  })\n\n  it('sagt ganz vor dem aeltesten aufbewahrten Lauf NICHT den Satz aus AK 9', () => {\n    expect(zeitraumHinweis(faelle.vorAufbewahrung)).not.toBe(KEIN_LAUF_TEXT)\n    expect(zeitraumHinweis(faelle.vorAufbewahrung)).toContain('ältesten aufbewahrten Lauf')\n  })\n\n  it('nennt eine Teilabdeckung neben den Zahlen, auch ohne Lauf in der aufbewahrten Zeit', () => {\n    expect(zeitraumHinweis(faelle.teilweise)).toContain('nur teilweise')\n    expect(\n      zeitraumFall(kennzahlen({ coverage: 'PARTIAL', noRuns: true, runCount: 0 })),\n    ).toBe('teilweise')\n  })\n\n  it('hat ohne Besonderheit keinen Hinweis', () => {\n    expect(zeitraumFall(kennzahlen({}))).toBe('vollstaendig')\n    expect(zeitraumHinweis(kennzahlen({}))).toBeNull()\n  })\n})\n\n/**\n * Der Erfassungsbeginn der interaktiven Sitzungen (#984 AK 6). Er entscheidet, ob eine fehlende\n * Zahl „noch nicht erfasst\" heißt oder eine gemessene Null ist — 0 ist nie die Antwort auf\n * „nicht erfasst\".\n */\ndescribe('erfassungsstand', () => {\n  /** August 2026; der Erfassungsbeginn liegt mitten darin. */\n  const august = (interactiveUsageSince: string | null) =>\n    kennzahlen({\n      from: '2026-08-01T10:00:00Z',\n      to: '2026-09-01T10:00:00Z',\n      interactiveUsageSince,\n    })\n\n  it('nennt einen Zeitraum ganz vor dem Beginn nicht erfasst', () => {\n    expect(erfassungsstand(august('2026-09-05T08:00:00Z'))).toBe('nicht-erfasst')\n  })\n\n  /** `to` ist ausschliesslich: Beginnt die Erfassung genau am Ende, liegt der Zeitraum davor. */\n  it('zaehlt einen Beginn genau am Ende des Zeitraums noch als davor', () => {\n    expect(erfassungsstand(august('2026-09-01T10:00:00Z'))).toBe('nicht-erfasst')\n  })\n\n  it('nennt einen Zeitraum, der den Beginn schneidet, teilweise erfasst', () => {\n    expect(erfassungsstand(august('2026-08-14T07:00:00Z'))).toBe('teilweise-erfasst')\n  })\n\n  it('nennt einen Zeitraum ganz nach dem Beginn erfasst — auch wenn er genau dort anfaengt', () => {\n    expect(erfassungsstand(august('2026-07-01T00:00:00Z'))).toBe('erfasst')\n    expect(erfassungsstand(august('2026-08-01T10:00:00Z'))).toBe('erfasst')\n  })\n\n  /** Ohne je gemeldete Sitzung gibt es keinen Beginn — und damit keine gemessene Null. */\n  it('nennt ein Projekt ohne gemeldete Sitzung nicht erfasst', () => {\n    expect(erfassungsstand(august(null))).toBe('nicht-erfasst')\n  })\n\n  it('schreibt die beiden Aussagen aus, ohne 0 zu sagen', () => {\n    expect(NICHT_ERFASST_TEXT).toBe('nicht erfasst')\n    expect(TEILWEISE_ERFASST_TEXT).toBe('teilweise erfasst')\n  })\n})\n\ndescribe('zeitraumHinweis mit Erfassungsluecke', () => {\n  const august = (extra: Partial<"+"VerbrauchKennzahlen>) =>\n    kennzahlen({ from: '2026-08-01T10:00:00Z', to: '2026-09-01T10:00:00Z', ...extra })\n\n  it('erklaert einen Zeitraum ganz vor dem Erfassungsbeginn mit dessen Datum', () => {\n    const hinweis = zeitraumHinweis(august({ interactiveUsageSince: '2026-09-05T08:00:00Z' }))\n\n    expect(hinweis).toContain('05.09.2026')\n    expect(hinweis).toContain('ganz davor')\n  })\n\n  it('erklaert einen angeschnittenen Erfassungsbeginn eigens', () => {\n    const hinweis = zeitraumHinweis(august({ interactiveUsageSince: '2026-08-14T07:00:00Z' }))\n\n    expect(hinweis).toContain('14.08.2026')\n    expect(hinweis).toContain('beginnt davor')\n  })\n\n  /** Der Erfassungs-Hinweis erklaert die groessere Luecke und steht deshalb vorn. */\n  it('stellt den Erfassungs-Hinweis vor den Abdeckungs-Hinweis', () => {\n    const hinweis = zeitraumHinweis(\n      august({ coverage: 'PARTIAL', interactiveUsageSince: '2026-08-14T07:00:00Z' }),\n    )\n\n    expect(hinweis).not.toBeNull()\n    expect(hinweis!.indexOf('Interaktive Sitzungen')).toBeLessThan(\n      hinweis!.indexOf('nur teilweise abgedeckt'),\n    )\n  })\n\n  /**\n   * Ohne je gemeldete Sitzung gibt es keinen Zeitraum-Befund: Das ist ein Zustand des Projekts,\n   * und die Nachtlauf-Seite (Issue #1016) bekaeme sonst einen Hinweis zu etwas, das sie nicht zeigt.\n   */\n  it('schweigt, solange das Projekt keine Sitzung gemeldet hat', () => {\n    expect(zeitraumHinweis(august({ interactiveUsageSince: null }))).toBeNull()\n  })\n\n  it('schweigt, wenn der Zeitraum ganz nach dem Erfassungsbeginn liegt', () => {\n    expect(zeitraumHinweis(august({ interactiveUsageSince: '2026-07-01T00:00:00Z' }))).toBeNull()\n  })\n})\n"},"src/lib/leitstand.test.ts":{"tests":[{"id":"298","name":"leitstand Laufband (#979) nennt einen laufenden Lauf mit Vorgang n von m, gezählt ohne graue Pakete"},{"id":"299","name":"leitstand Laufband (#979) nennt einen laufenden Lauf ohne gemeldeten Vorgang schlicht als laufend"},{"id":"300","name":"leitstand Laufband (#979) nennt einen abgeschlossenen Lauf mit Zahl der Vorgänge, Dauer in Minuten und Kosten"},{"id":"301","name":"leitstand Laufband (#979) lässt nicht gemessene Kosten weg, statt 0 zu zeigen"},{"id":"302","name":"leitstand Laufband (#979) setzt den Melder eines abgeschlossenen Laufs auf den schlechtesten Zustand"},{"id":"303","name":"leitstand Laufband (#979) liest den jüngsten Lauf nach Startzeit, gleich wo er in der Antwort steht"},{"id":"304","name":"leitstand Laufband (#979) benennt die Betriebsarten und die Zahl der Vorgänge"},{"id":"305","name":"leitstand Laufband (#979) benennt jede Betriebsart, die der Server kennt — auch die interaktive Sitzung"},{"id":"306","name":"leitstand Letzter Lauf formatiert Paketdauern wie der Entwurf"},{"id":"307","name":"leitstand Letzter Lauf formatiert Laufdauern und die Notiz im Plattenkopf"},{"id":"308","name":"leitstand Letzter Lauf zählt rote und gelbe Pakete als Abbruch, grüne und graue nicht"},{"id":"309","name":"leitstand Letzter Lauf kürzt den Commit-Hash und liest die erste Zeile eines Auszugs"},{"id":"310","name":"leitstand Kennzahl-Kacheln zeigt den Durchsatz der letzten Woche mit Verlauf und Delta zur Vorwoche in Prozent"},{"id":"311","name":"leitstand Kennzahl-Kacheln nennt einen Rückgang als schlecht, Gleichstand als neutral und eine einzelne Karte im Singular"},{"id":"312","name":"leitstand Kennzahl-Kacheln rechnet ohne Vorwochenwert kein Prozent, sondern nennt die Zahl"},{"id":"313","name":"leitstand Kennzahl-Kacheln zeigt zwölf leere Wochen als Leerwert statt einer Null"},{"id":"314","name":"leitstand Kennzahl-Kacheln zeigt Durchlaufzeit in Tagen und Implementierungszeit in Stunden mit ihrer Datenbasis"},{"id":"315","name":"leitstand Kennzahl-Kacheln zeigt die Implementierungszeit unter einer Stunde in Minuten"},{"id":"316","name":"leitstand Kennzahl-Kacheln rechnet den grünen Anteil über alle aufbewahrten Läufe ohne graue Pakete"},{"id":"317","name":"leitstand Kennzahl-Kacheln legt die Sparkline in den Rahmen des Entwurfs"},{"id":"318","name":"leitstand Platten nennt die ISO-Kalenderwoche eines Wochenbeginns, auch über den Jahreswechsel"},{"id":"319","name":"leitstand Platten setzt Balkenhöhen relativ zum höchsten Wert"},{"id":"320","name":"leitstand Platten sortiert Abbruchgründe nach Häufigkeit und färbt sie nach Art"},{"id":"321","name":"leitstand Platten nennt Token-Mengen in der Einheit des Entwurfs"},{"id":"322","name":"leitstand Instrumente eines Laufs (#988) nennt den Beginn eines Laufs als Tag und Uhrzeit — dieselbe Form wie die Notiz"},{"id":"323","name":"leitstand Instrumente eines Laufs (#988) teilt die Laufdauer in Wert und Einheit — ab einer Stunde als h:mm"},{"id":"324","name":"leitstand Instrumente eines Laufs (#988) zählt die Pakete eines Laufs nach Zustand; graue zählen nicht mit"},{"id":"325","name":"leitstand Instrumente eines Laufs (#988) rechnet den Anteil aus Zwischenspeicher, bleibt aber ohne Bezugsgröße bei null"},{"id":"326","name":"leitstand Instrumente eines Laufs (#988) rechnet den Paket-Anteil des Leitstands über dieselbe Zählung"}],"source":"import { describe, expect, it } from 'vitest'\nimport type { NightRunItemView, NightRunServerMode, NightRunView } from '../api/nightRuns'\nimport {\n  abbruchgruende,\n  balkenHoehen,\n  cacheQuote,\n  durchlaufKachel,\n  durchsatzKachel,\n  ersteZeile,\n  funkenPunkte,\n  gruenAnteil,\n  implementierungKachel,\n  istAbbruch,\n  juengsterLauf,\n  kalenderwoche,\n  kostenText,\n  kurzHash,\n  laufband,\n  laufDauer,\n  laufDauerGeteilt,\n  laufMelder,\n  laufNotiz,\n  modusName,\n  paketDauer,\n  paketZaehlung,\n  tagZeit,\n  tokenMenge,\n  tokenText,\n  vorgaenge,\n} from './leitstand'\n\nconst paket = (nummer: number, state: NightRunItemView['state'], extra: Partial<"+"NightRunItemView> = {}): NightRunItemView => ({\n  id: nummer,\n  cardNumber: nummer,\n  title: `Paket ${nummer}`,\n  state,\n  errorClass: null,\n  durationMs: null,\n  commitHash: null,\n  excerpt: null,\n  usage: null,\n  ...extra,\n})\n\nconst lauf = (extra: Partial<"+"NightRunView> = {}): NightRunView => ({\n  id: 1,\n  startedAt: '2026-09-14T21:10:00Z',\n  mode: 'CHAIN',\n  durationMs: 15_120_000,\n  processedCount: 0,\n  skippedCount: 0,\n  unparsedCount: 0,\n  unparsedSample: null,\n  createdAt: '2026-09-15T01:22:00Z',\n  origin: 'TOKEN',\n  tokenName: 'kette',\n  complete: true,\n  updatedAt: null,\n  usage: null,\n  items: [],\n  ...extra,\n})\n\nconst woche = (tag: number, doneCount: number) => ({\n  weekStart: new Date(Date.UTC(2026, 5, 1 + 7 * tag, 9)).toISOString(),\n  doneCount,\n})\n\ndescribe('leitstand Laufband (#979)', () => {\n  it('nennt einen laufenden Lauf mit Vorgang n von m, gezählt ohne graue Pakete', () => {\n    const band = laufband(lauf({ complete: false, items: [paket(940, 'GREEN'), paket(941, 'GREEN'), paket(942, 'GREY')] }))\n    expect(band.titel).toBe('Kette läuft — Vorgang 2 von 3')\n    expect(band.melder).toBe('stahl')\n    expect(band.laeuft).toBe(true)\n    expect(band.vorgang).toEqual({ nummer: 942, titel: 'Paket 942' })\n    expect(band.zeitpunkt).toMatch(/^seit \\d\\d:\\d\\d$/)\n  })\n\n  it('nennt einen laufenden Lauf ohne gemeldeten Vorgang schlicht als laufend', () => {\n    const band = laufband(lauf({ complete: false, mode: 'IMPLEMENTATION' }))\n    expect(band.titel).toBe('Umsetzung läuft')\n    expect(band.vorgang).toBeNull()\n  })\n\n  it('nennt einen abgeschlossenen Lauf mit Zahl der Vorgänge, Dauer in Minuten und Kosten', () => {\n    const band = laufband(lauf({ mode: 'REVIEW', items: [paket(1, 'GREEN')], usage: { costUsd: 12.4, inputTokens: null, outputTokens: null, cachedInputTokens: null } }))\n    expect(band.titel).toBe('Review abgeschlossen — 1 Vorgang')\n    expect(band.zeitpunkt).toMatch(/^Beginn \\d\\d\\.\\d\\d\\., \\d\\d:\\d\\d$/)\n    expect(band.minuten).toBe(252)\n    expect(band.kosten).toBe('12,40')\n  })\n\n  it('lässt nicht gemessene Kosten weg, statt 0 zu zeigen', () => {\n    expect(laufband(lauf()).kosten).toBeNull()\n    expect(kostenText(null)).toBeNull()\n    expect(kostenText(0)).toBe('0,00 $')\n  })\n\n  it('setzt den Melder eines abgeschlossenen Laufs auf den schlechtesten Zustand', () => {\n    expect(laufMelder(lauf({ items: [paket(1, 'GREEN'), paket(2, 'RED'), paket(3, 'YELLOW')] }))).toBe('zinnob')\n    expect(laufMelder(lauf({ items: [paket(1, 'GREEN'), paket(3, 'YELLOW')] }))).toBe('bernst')\n    expect(laufMelder(lauf({ items: [paket(1, 'GREEN'), paket(2, 'GREY')] }))).toBe('gruen')\n  })\n\n  it('liest den jüngsten Lauf nach Startzeit, gleich wo er in der Antwort steht', () => {\n    const alt = lauf({ id: 1, startedAt: '2026-09-10T21:00:00Z' })\n    const neu = lauf({ id: 2, startedAt: '2026-09-14T21:00:00Z' })\n    expect(juengsterLauf([alt, neu])?.id).toBe(2)\n    expect(juengsterLauf([neu, alt])?.id).toBe(2)\n    expect(juengsterLauf([])).toBeNull()\n  })\n\n  it('benennt die Betriebsarten und die Zahl der Vorgänge', () => {\n    expect(modusName('CHAIN')).toBe('Kette')\n    expect(vorgaenge(1)).toBe('1 Vorgang')\n    expect(vorgaenge(9)).toBe('9 Vorgänge')\n  })\n\n  /**\n   * Die Tabelle ist ein `Record` über `NightRunServerMode` — ein neuer Modus ohne Eintrag bricht\n   * `tsc`. Dieser Test hält fest, dass jeder Modus auch tatsächlich ein Wort bekommt, statt einen\n   * leeren String (Issue #1016).\n   */\n  it('benennt jede Betriebsart, die der Server kennt — auch die interaktive Sitzung', () => {\n    const alle: Record<"+"NightRunServerMode, true> = {\n      IMPLEMENTATION: true,\n      REVIEW: true,\n      CHAIN: true,\n      INTERACTIVE: true,\n    }\n    for (const modus of Object.keys(alle) as NightRunServerMode[]) {\n      expect(modusName(modus)).not.toBe('')\n    }\n    expect(modusName('INTERACTIVE')).toBe('Sitzung')\n  })\n})\n\ndescribe('leitstand Letzter Lauf', () => {\n  it('formatiert Paketdauern wie der Entwurf', () => {\n    expect(paketDauer(null)).toBe('—')\n    expect(paketDauer(391_000)).toBe('06:31')\n    expect(paketDauer(3_735_000)).toBe('1:02:15')\n  })\n\n  it('formatiert Laufdauern und die Notiz im Plattenkopf', () => {\n    expect(laufDauer(720_000)).toBe('12 min')\n    expect(laufDauer(15_120_000)).toBe('4 h 12 min')\n    expect(laufNotiz(lauf({ items: [paket(1, 'GREEN')] }))).toMatch(/^\\d\\d\\.\\d\\d\\., \\d\\d:\\d\\d · 4 h 12 min · 1 Paket$/)\n    expect(laufNotiz(lauf({ items: [paket(1, 'GREEN'), paket(2, 'RED')] }))).toMatch(/ · 2 Pakete$/)\n  })\n\n  it('zählt rote und gelbe Pakete als Abbruch, grüne und graue nicht', () => {\n    expect(['GREEN', 'YELLOW', 'RED', 'GREY'].map((s) => istAbbruch(paket(1, s as NightRunItemView['state'])))).toEqual([\n      false,\n      true,\n      true,\n      false,\n    ])\n  })\n\n  it('kürzt den Commit-Hash und liest die erste Zeile eines Auszugs', () => {\n    expect(kurzHash('9489421abcdef')).toBe('9489421')\n    expect(kurzHash(null)).toBeNull()\n    expect(ersteZeile('\\n  2 Tests rot  \\nmehr')).toBe('2 Tests rot')\n    expect(ersteZeile('  \\n ')).toBeNull()\n    expect(ersteZeile(null)).toBeNull()\n  })\n})\n\ndescribe('leitstand Kennzahl-Kacheln', () => {\n  it('zeigt den Durchsatz der letzten Woche mit Verlauf und Delta zur Vorwoche in Prozent', () => {\n    const kachel = durchsatzKachel([woche(0, 4), woche(1, 10), woche(2, 12)])\n    expect(kachel).toMatchObject({ wert: '12', einheit: 'Karten', basis: '3 Wochen', verlauf: [4, 10, 12] })\n    expect(kachel.delta).toEqual({ text: '▲ 20 %', art: 'gut' })\n  })\n\n  it('nennt einen Rückgang als schlecht, Gleichstand als neutral und eine einzelne Karte im Singular', () => {\n    expect(durchsatzKachel([woche(0, 10), woche(1, 8)]).delta).toEqual({ text: '▼ 20 %', art: 'schlecht' })\n    expect(durchsatzKachel([woche(0, 3), woche(1, 3)]).delta).toEqual({ text: '± 0', art: 'neutral' })\n    expect(durchsatzKachel([woche(0, 2), woche(1, 1)]).einheit).toBe('Karte')\n  })\n\n  it('rechnet ohne Vorwochenwert kein Prozent, sondern nennt die Zahl', () => {\n    expect(durchsatzKachel([woche(0, 0), woche(1, 5)]).delta).toEqual({ text: '▲ 5 zur Vorwoche', art: 'gut' })\n    expect(durchsatzKachel([woche(0, 5)]).delta).toEqual({ text: '▲ 5 zur Vorwoche', art: 'gut' })\n  })\n\n  it('zeigt zwölf leere Wochen als Leerwert statt einer Null', () => {\n    const kachel = durchsatzKachel(Array.from({ length: 12 }, (_, i) => woche(i, 0)))\n    expect(kachel).toEqual({ wert: null, einheit: 'Karten', basis: '12 Wochen', verlauf: null, delta: null })\n  })\n\n  it('zeigt Durchlaufzeit in Tagen und Implementierungszeit in Stunden mit ihrer Datenbasis', () => {\n    expect(durchlaufKachel(276_480, 86)).toEqual({ wert: '3,2', einheit: 'Tage', basis: '86 Karten', verlauf: null, delta: null })\n    expect(durchlaufKachel(null, 0).wert).toBeNull()\n    expect(durchlaufKachel(86_400, 1).basis).toBe('1 Karte')\n    expect(implementierungKachel(53_280, 61)).toMatchObject({ wert: '14,8', einheit: 'Stunden', basis: '61 Karten' })\n    expect(implementierungKachel(3600, 0).wert).toBeNull()\n    expect(implementierungKachel(null, 3).wert).toBeNull()\n    expect(implementierungKachel(3600, 1).basis).toBe('1 Karte')\n  })\n\n  it('zeigt die Implementierungszeit unter einer Stunde in Minuten', () => {\n    expect(implementierungKachel(1080, 4)).toMatchObject({ wert: '18', einheit: 'Minuten' })\n    expect(implementierungKachel(3540, 4)).toMatchObject({ wert: '59', einheit: 'Minuten' })\n    // Ab 60 gerundeten Minuten kippt die Einheit — „60 Minuten\" stünde sonst neben „1,0 Stunden\".\n    expect(implementierungKachel(3570, 4)).toMatchObject({ wert: '1,0', einheit: 'Stunden' })\n    expect(implementierungKachel(7200, 4)).toMatchObject({ wert: '2,0', einheit: 'Stunden' })\n  })\n\n  it('rechnet den grünen Anteil über alle aufbewahrten Läufe ohne graue Pakete', () => {\n    const anteil = gruenAnteil([\n      lauf({ items: [paket(1, 'GREEN'), paket(2, 'GREEN'), paket(3, 'GREY')] }),\n      lauf({ items: [paket(4, 'YELLOW'), paket(5, 'RED'), paket(6, 'GREEN')] }),\n    ])\n    expect(anteil).toEqual({ prozent: 60, gruen: 3, gelb: 1, rot: 1, gesamt: 5 })\n    expect(gruenAnteil([lauf({ items: [paket(1, 'GREY')] })]).prozent).toBeNull()\n  })\n\n  it('legt die Sparkline in den Rahmen des Entwurfs', () => {\n    expect(funkenPunkte([0, 10, 5])).toEqual([\n      { x: 2, y: 30 },\n      { x: 62, y: 4 },\n      { x: 122, y: 17 },\n    ])\n    expect(funkenPunkte([3, 3])).toEqual([\n      { x: 2, y: 17 },\n      { x: 122, y: 17 },\n    ])\n    expect(funkenPunkte([7])).toEqual([{ x: 2, y: 17 }])\n  })\n})\n\ndescribe('leitstand Platten', () => {\n  it('nennt die ISO-Kalenderwoche eines Wochenbeginns, auch über den Jahreswechsel', () => {\n    expect(kalenderwoche('2026-06-01T09:00:00Z')).toBe(23)\n    expect(kalenderwoche('2026-01-01T00:00:00Z')).toBe(1)\n    expect(kalenderwoche('2027-01-03T12:00:00Z')).toBe(53)\n  })\n\n  it('setzt Balkenhöhen relativ zum höchsten Wert', () => {\n    expect(balkenHoehen([6, 12, 3])).toEqual([50, 100, 25])\n    expect(balkenHoehen([0, 0])).toEqual([0, 0])\n  })\n\n  it('sortiert Abbruchgründe nach Häufigkeit und färbt sie nach Art', () => {\n    expect(abbruchgruende({ REVIEWER_FAILED: 2, CHECKS_RED: 11, AWAITING_DECISION: 7, HARD_ABORT: 0, DEPENDENCY_UNMET: 7 })).toEqual([\n      { klasse: 'CHECKS_RED', zahl: 11, breite: 100, melder: 'zinnob' },\n      { klasse: 'AWAITING_DECISION', zahl: 7, breite: 64, melder: 'bernst' },\n      { klasse: 'DEPENDENCY_UNMET', zahl: 7, breite: 64, melder: 'bernst' },\n      { klasse: 'REVIEWER_FAILED', zahl: 2, breite: 18, melder: 'grau' },\n    ])\n    expect(abbruchgruende({})).toEqual([])\n  })\n\n  it('nennt Token-Mengen in der Einheit des Entwurfs', () => {\n    expect(tokenMenge(4_820_000)).toEqual({ wert: '4,82', einheit: 'Mio' })\n    expect(tokenMenge(186_400)).toEqual({ wert: '186', einheit: 'Tsd' })\n    expect(tokenMenge(420)).toEqual({ wert: '420', einheit: 'Token' })\n    expect(tokenMenge(null)).toBeNull()\n    expect(tokenText(3_660_000)).toBe('3,66 Mio')\n  })\n})\n\ndescribe('leitstand Instrumente eines Laufs (#988)', () => {\n  it('nennt den Beginn eines Laufs als Tag und Uhrzeit — dieselbe Form wie die Notiz', () => {\n    // Dieselbe Rechenstelle wie `laufNotiz` und `laufband`: Zwei Formatierer für denselben\n    // Zeitpunkt liefen beim nächsten Wortwechsel auseinander.\n    expect(tagZeit('2026-09-14T21:10:00Z')).toBe(laufNotiz(lauf()).split(' · ')[0])\n  })\n\n  it('teilt die Laufdauer in Wert und Einheit — ab einer Stunde als h:mm', () => {\n    expect(laufDauerGeteilt(15_120_000)).toEqual({ wert: '4:12', einheit: 'h' })\n    expect(laufDauerGeteilt(3_600_000)).toEqual({ wert: '1:00', einheit: 'h' })\n    expect(laufDauerGeteilt(2_535_000)).toEqual({ wert: '42', einheit: 'min' })\n    expect(laufDauerGeteilt(0)).toEqual({ wert: '0', einheit: 'min' })\n  })\n\n  it('zählt die Pakete eines Laufs nach Zustand; graue zählen nicht mit', () => {\n    const gezaehlt = paketZaehlung([\n      { state: 'GREEN' },\n      { state: 'GREEN' },\n      { state: 'YELLOW' },\n      { state: 'RED' },\n      { state: 'GREY' },\n    ])\n    expect(gezaehlt).toEqual({ gruen: 2, gelb: 1, rot: 1, gesamt: 4 })\n    expect(paketZaehlung([])).toEqual({ gruen: 0, gelb: 0, rot: 0, gesamt: 0 })\n  })\n\n  it('rechnet den Anteil aus Zwischenspeicher, bleibt aber ohne Bezugsgröße bei null', () => {\n    expect(cacheQuote(760_000, 1_000_000)).toBe(76)\n    expect(cacheQuote(0, 1_000_000)).toBe(0)\n    // Ohne Eingabe gibt es kein Verhältnis: „0 %\" behauptete eine Messung, „100 %\" eine zweite.\n    expect(cacheQuote(760_000, 0)).toBeNull()\n    expect(cacheQuote(760_000, null)).toBeNull()\n    expect(cacheQuote(null, 1_000_000)).toBeNull()\n  })\n\n  it('rechnet den Paket-Anteil des Leitstands über dieselbe Zählung', () => {\n    // Gegenprobe zur Wiederverwendung: `gruenAnteil` zählt nicht mehr selbst.\n    const laeufe = [lauf({ items: [paket(1, 'GREEN'), paket(2, 'RED'), paket(3, 'GREY')] })]\n    const { gruen, gelb, rot, gesamt } = gruenAnteil(laeufe)\n    expect({ gruen, gelb, rot, gesamt }).toEqual(\n      paketZaehlung(laeufe.flatMap((l) => l.items)),\n    )\n  })\n})\n"},"src/lib/useBoardHistory.test.ts":{"tests":[{"id":"327","name":"useBoardHistory stellt ein besuchtes Board vorne ein und holt es bei erneutem Besuch nach vorne"},{"id":"328","name":"useBoardHistory laedt denselben Verlauf nach Unmount und erneutem Mount aus localStorage"},{"id":"329","name":"useBoardHistory speichert unter dem nutzerspezifischen Schluessel nur id, name, projectId und projectName"},{"id":"330","name":"useBoardHistory zeigt beim Kontowechsel ohne Unmount in keinem Render den fremden Verlauf"},{"id":"331","name":"useBoardHistory greift bei loading oder ohne Nutzer weder lesend noch schreibend auf den Storage zu"},{"id":"332","name":"useBoardHistory ergibt bei ungueltigem JSON einen leeren Verlauf"},{"id":"333","name":"useBoardHistory ergibt bei einem Objekt statt einer Liste einen leeren Verlauf"},{"id":"334","name":"useBoardHistory verwirft ungueltige Eintraege und behaelt bei doppelter ID das erste Vorkommen"},{"id":"335","name":"useBoardHistory verwirft gespeicherte Eintraege ohne projectId, statt sie zu migrieren"},{"id":"336","name":"useBoardHistory uebernimmt beim erneuten Besuch die neuen Namen"},{"id":"337","name":"useBoardHistory waechst nicht ueber acht Eintraege"},{"id":"338","name":"useBoardHistory begrenzt auch einen ueberlangen gespeicherten Verlauf auf acht Eintraege"},{"id":"339","name":"useBoardHistory entfernt einen Eintrag und laesst die Reihenfolge der uebrigen unveraendert"},{"id":"340","name":"useBoardHistory aendert bei remove mit unbekannter ID nichts und wirft nicht"},{"id":"341","name":"useBoardHistory ergibt bei einem Lesefehler zunaechst einen leeren Verlauf"},{"id":"342","name":"useBoardHistory aktualisiert den Verlauf trotz Schreibfehler innerhalb der Hook-Instanz"},{"id":"343","name":"lastBoardOfProject liefert den vordersten — also zuletzt besuchten — Eintrag des Projekts"},{"id":"344","name":"lastBoardOfProject liefert undefined, wenn das Projekt im Verlauf nicht vorkommt"}],"source":"import { act, renderHook } from '@testing-library/react'\nimport { afterEach, beforeEach, describe, expect, it, vi } from 'vitest'\nimport type { Me } from '../api/auth'\nimport { lastBoardOfProject, useBoardHistory, type BoardHistoryEntry } from './useBoardHistory'\n\nconst auth = vi.hoisted(() => ({ value: { user: null as Me | null, loading: false } }))\nvi.mock('../auth/AuthContext', () => ({ useAuth: () => auth.value }))\n\nconst me = (userId: number): Me => ({\n  userId,\n  email: `u${userId}@example.org`,\n  displayName: `U${userId}`,\n  platformRole: 'USER',\n  memberships: [],\n})\n\nconst key = (userId: number): string => `manban.boardHistory.v1.${userId}`\nconst entry = (\n  id: number,\n  name = `B${id}`,\n  projectName = `P${id}`,\n  projectId = id,\n): BoardHistoryEntry => ({\n  id,\n  name,\n  projectId,\n  projectName,\n})\nconst stored = (userId: number): unknown => JSON.parse(localStorage.getItem(key(userId)) ?? 'null')\n\n// Node 26 deaktiviert natives localStorage — wie in DataTable.test/AppShell.test ein\n// funktionierendes Fake stubben, damit die Persistenz beobachtbar ist.\nfunction fakeStorage(): Storage {\n  const map = new Map<"+"string, string>()\n  return {\n    getItem: (k) => map.get(k) ?? null,\n    setItem: (k, v) => void map.set(k, String(v)),\n    removeItem: (k) => void map.delete(k),\n    clear: () => map.clear(),\n    key: (i) => [...map.keys()][i] ?? null,\n    get length() {\n      return map.size\n    },\n  }\n}\n\ndescribe('useBoardHistory', () => {\n  beforeEach(() => {\n    vi.stubGlobal('localStorage', fakeStorage())\n    auth.value = { user: me(42), loading: false }\n  })\n\n  afterEach(() => {\n    vi.unstubAllGlobals()\n    vi.restoreAllMocks()\n  })\n\n  it('stellt ein besuchtes Board vorne ein und holt es bei erneutem Besuch nach vorne', () => {\n    const { result } = renderHook(() => useBoardHistory())\n\n    act(() => result.current.recordVisit(entry(1)))\n    act(() => result.current.recordVisit(entry(2)))\n    expect(result.current.history).toEqual([entry(2), entry(1)])\n\n    act(() => result.current.recordVisit(entry(1)))\n    expect(result.current.history).toEqual([entry(1), entry(2)])\n  })\n\n  it('laedt denselben Verlauf nach Unmount und erneutem Mount aus localStorage', () => {\n    const { result, unmount } = renderHook(() => useBoardHistory())\n    act(() => {\n      result.current.recordVisit(entry(1))\n      result.current.recordVisit(entry(2))\n      result.current.recordVisit(entry(3))\n    })\n    expect(result.current.history).toEqual([entry(3), entry(2), entry(1)])\n    unmount()\n\n    const { result: remounted } = renderHook(() => useBoardHistory())\n    expect(remounted.current.history).toEqual([entry(3), entry(2), entry(1)])\n  })\n\n  it('speichert unter dem nutzerspezifischen Schluessel nur id, name, projectId und projectName', () => {\n    const withExtra: BoardHistoryEntry & { columns: never[] } = {\n      id: 7,\n      name: 'B7',\n      projectId: 3,\n      projectName: 'P7',\n      columns: [],\n    }\n    const { result } = renderHook(() => useBoardHistory())\n\n    act(() => result.current.recordVisit(withExtra))\n\n    expect(localStorage.getItem(key(42))).not.toBeNull()\n    expect(stored(42)).toEqual([{ id: 7, name: 'B7', projectId: 3, projectName: 'P7' }])\n  })\n\n  it('zeigt beim Kontowechsel ohne Unmount in keinem Render den fremden Verlauf', () => {\n    localStorage.setItem(key(1), JSON.stringify([entry(11)]))\n    localStorage.setItem(key(2), JSON.stringify([entry(22)]))\n    auth.value = { user: me(1), loading: false }\n    const renders: Array<"+"{ userId: number | null; history: readonly BoardHistoryEntry[] }> = []\n    const { result, rerender } = renderHook(() => {\n      const history = useBoardHistory()\n      renders.push({ userId: auth.value.user?.userId ?? null, history: history.history })\n      return history\n    })\n    expect(result.current.history).toEqual([entry(11)])\n\n    auth.value = { user: null, loading: true }\n    rerender()\n    expect(result.current.history).toEqual([])\n\n    auth.value = { user: me(2), loading: false }\n    rerender()\n    expect(result.current.history).toEqual([entry(22)])\n\n    auth.value = { user: me(1), loading: false }\n    rerender()\n    expect(result.current.history).toEqual([entry(11)])\n\n    expect(renders.filter((r) => r.userId !== 1 && r.history.some((e) => e.id === 11))).toEqual([])\n    expect(renders.filter((r) => r.userId !== 2 && r.history.some((e) => e.id === 22))).toEqual([])\n  })\n\n  it('greift bei loading oder ohne Nutzer weder lesend noch schreibend auf den Storage zu', () => {\n    const getItem = vi.spyOn(localStorage, 'getItem')\n    const setItem = vi.spyOn(localStorage, 'setItem')\n\n    auth.value = { user: null, loading: true }\n    const { result: whileLoading, unmount } = renderHook(() => useBoardHistory())\n    act(() => whileLoading.current.recordVisit(entry(1)))\n    act(() => whileLoading.current.remove(1))\n    expect(whileLoading.current.history).toEqual([])\n    unmount()\n\n    auth.value = { user: null, loading: false }\n    const { result: anonymous } = renderHook(() => useBoardHistory())\n    act(() => anonymous.current.recordVisit(entry(1)))\n    expect(anonymous.current.history).toEqual([])\n\n    expect(getItem).not.toHaveBeenCalled()\n    expect(setItem).not.toHaveBeenCalled()\n  })\n\n  it('ergibt bei ungueltigem JSON einen leeren Verlauf', () => {\n    localStorage.setItem(key(42), '{kaputt')\n\n    const { result } = renderHook(() => useBoardHistory())\n\n    expect(result.current.history).toEqual([])\n  })\n\n  it('ergibt bei einem Objekt statt einer Liste einen leeren Verlauf', () => {\n    localStorage.setItem(key(42), JSON.stringify({ id: 1, name: 'B1', projectName: 'P1' }))\n\n    const { result } = renderHook(() => useBoardHistory())\n\n    expect(result.current.history).toEqual([])\n  })\n\n  it('verwirft ungueltige Eintraege und behaelt bei doppelter ID das erste Vorkommen', () => {\n    localStorage.setItem(\n      key(42),\n      JSON.stringify([\n        'kein Objekt',\n        null,\n        { id: '3', name: 'B3', projectId: 3, projectName: 'P3' },\n        { id: 0, name: 'B0', projectId: 0, projectName: 'P0' },\n        { id: 4.5, name: 'B4', projectId: 4, projectName: 'P4' },\n        { id: 5 },\n        { id: 6, name: 'B6', projectId: 6 },\n        { id: 7, name: 'B7', projectId: 7, projectName: 'P7' },\n        { id: 7, name: 'B7 veraltet', projectId: 7, projectName: 'P7 veraltet' },\n        { id: 8, name: 'B8', projectId: 8, projectName: 'P8' },\n      ]),\n    )\n\n    const { result } = renderHook(() => useBoardHistory())\n\n    expect(result.current.history).toEqual([entry(7), entry(8)])\n  })\n\n  it('verwirft gespeicherte Eintraege ohne projectId, statt sie zu migrieren', () => {\n    localStorage.setItem(\n      key(42),\n      JSON.stringify([\n        { id: 1, name: 'B1', projectName: 'P1' },\n        { id: 2, name: 'B2', projectId: '2', projectName: 'P2' },\n        { id: 3, name: 'B3', projectId: 0, projectName: 'P3' },\n        { id: 4, name: 'B4', projectId: 4.5, projectName: 'P4' },\n        { id: 5, name: 'B5', projectId: 5, projectName: 'P5' },\n      ]),\n    )\n\n    const { result } = renderHook(() => useBoardHistory())\n\n    expect(result.current.history).toEqual([entry(5)])\n  })\n\n  it('uebernimmt beim erneuten Besuch die neuen Namen', () => {\n    const { result } = renderHook(() => useBoardHistory())\n\n    act(() => result.current.recordVisit(entry(3, 'Board alt', 'Projekt alt')))\n    act(() => result.current.recordVisit(entry(9)))\n    act(() => result.current.recordVisit(entry(3, 'Board neu', 'Projekt neu')))\n\n    expect(result.current.history).toEqual([entry(3, 'Board neu', 'Projekt neu'), entry(9)])\n  })\n\n  it('waechst nicht ueber acht Eintraege', () => {\n    const { result } = renderHook(() => useBoardHistory())\n\n    act(() => {\n      for (let id = 1; id <"+"= 9; id++) {\n        result.current.recordVisit(entry(id))\n      }\n    })\n\n    expect(result.current.history.map((e) => e.id)).toEqual([9, 8, 7, 6, 5, 4, 3, 2])\n  })\n\n  it('begrenzt auch einen ueberlangen gespeicherten Verlauf auf acht Eintraege', () => {\n    localStorage.setItem(key(42), JSON.stringify(Array.from({ length: 10 }, (_, i) => entry(i + 1))))\n\n    const { result } = renderHook(() => useBoardHistory())\n\n    expect(result.current.history.map((e) => e.id)).toEqual([1, 2, 3, 4, 5, 6, 7, 8])\n  })\n\n  it('entfernt einen Eintrag und laesst die Reihenfolge der uebrigen unveraendert', () => {\n    const { result } = renderHook(() => useBoardHistory())\n    act(() => {\n      result.current.recordVisit(entry(1))\n      result.current.recordVisit(entry(2))\n      result.current.recordVisit(entry(3))\n    })\n\n    act(() => result.current.remove(2))\n\n    expect(result.current.history).toEqual([entry(3), entry(1)])\n    expect(stored(42)).toEqual([entry(3), entry(1)])\n  })\n\n  it('aendert bei remove mit unbekannter ID nichts und wirft nicht', () => {\n    const { result } = renderHook(() => useBoardHistory())\n    act(() => {\n      result.current.recordVisit(entry(1))\n      result.current.recordVisit(entry(2))\n    })\n\n    expect(() => act(() => result.current.remove(99))).not.toThrow()\n    expect(result.current.history).toEqual([entry(2), entry(1)])\n  })\n\n  it('ergibt bei einem Lesefehler zunaechst einen leeren Verlauf', () => {\n    localStorage.setItem(key(42), JSON.stringify([entry(1)]))\n    vi.spyOn(localStorage, 'getItem').mockImplementation(() => {\n      throw new Error('Storage gesperrt')\n    })\n\n    const { result } = renderHook(() => useBoardHistory())\n\n    expect(result.current.history).toEqual([])\n  })\n\n  it('aktualisiert den Verlauf trotz Schreibfehler innerhalb der Hook-Instanz', () => {\n    vi.spyOn(localStorage, 'setItem').mockImplementation(() => {\n      throw new Error('Storage voll')\n    })\n    const { result } = renderHook(() => useBoardHistory())\n\n    expect(() =>\n      act(() => {\n        result.current.recordVisit(entry(1))\n        result.current.recordVisit(entry(2))\n      }),\n    ).not.toThrow()\n    expect(result.current.history).toEqual([entry(2), entry(1)])\n\n    expect(() => act(() => result.current.remove(2))).not.toThrow()\n    expect(result.current.history).toEqual([entry(1)])\n  })\n})\n\ndescribe('lastBoardOfProject', () => {\n  it('liefert den vordersten — also zuletzt besuchten — Eintrag des Projekts', () => {\n    const history = [\n      entry(9, 'B9', 'P2', 2),\n      entry(8, 'B8', 'P1', 1),\n      entry(7, 'B7', 'P1', 1),\n    ]\n\n    expect(lastBoardOfProject(history, 1)).toEqual(entry(8, 'B8', 'P1', 1))\n  })\n\n  it('liefert undefined, wenn das Projekt im Verlauf nicht vorkommt', () => {\n    expect(lastBoardOfProject([entry(9, 'B9', 'P2', 2)], 1)).toBeUndefined()\n    expect(lastBoardOfProject([], 1)).toBeUndefined()\n  })\n})\n"},"src/lib/epicTiles.test.ts":{"tests":[{"id":"345","name":"countKinds zählt fachliche Anforderungen, Pläne und Arbeitspakete getrennt"},{"id":"346","name":"countKinds zählt eine [Idee] als Arbeitspaket"},{"id":"347","name":"countKinds zählt ein Präfix mitten im Titel als Arbeitspaket"},{"id":"348","name":"countKinds liefert für ein leeres Vorhaben überall null"},{"id":"349","name":"countKinds ignoriert eine Mitgliedsnummer ohne zugehörige Karte"},{"id":"350","name":"aggregateMarks zählt eine Karte bei jedem ihrer gezählten Labels"},{"id":"351","name":"aggregateMarks lässt ein Label mit countOnEpicTile === false weg"},{"id":"352","name":"aggregateMarks summiert über mehrere Karten und lässt ungenutzte Labels weg"},{"id":"353","name":"aggregateMarks ignoriert eine Mitgliedsnummer ohne zugehörige Karte"},{"id":"354","name":"sortEpics sortiert absteigend nach Karten mit mindestens einer gezählten Marke"},{"id":
