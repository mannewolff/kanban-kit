REY: 'grau',\n}\n\n/**\n * Die Farbe einer Fehlerklasse (Entwurf Z. 632–634, 1612–1651): Rot heißt „die Arbeit ist\n * gescheitert\", Bernstein „sie wartet auf etwas\", Grau „ein Werkzeug der Prüfung fiel aus\".\n */\nexport const MELDER_JE_FEHLERKLASSE: Record<"+"NightRunErrorClass, Melder> = {\n  CHECKS_RED: 'zinnob',\n  CHECKS_NOT_STARTED: 'zinnob',\n  UNEXPECTED_STATE: 'zinnob',\n  HARD_ABORT: 'zinnob',\n  TIME_BUDGET_EXCEEDED: 'zinnob',\n  AWAITING_DECISION: 'bernst',\n  DEPENDENCY_UNMET: 'bernst',\n  REVIEWER_FAILED: 'grau',\n}\n\n/**\n * Ein `Record` über `NightRunServerMode` — ein neuer Modus ohne Eintrag bricht `tsc`. `INTERACTIVE`\n * steht seit Issue #1016 dabei, damit der Typ vollständig gepflegt ist; die Platte „Letzter Lauf\"\n * des Leitstands liest ihre Läufe weiterhin aus der serverseitig auf Nachtläufe beschränkten\n * Laufliste (`NightRunService.list`, Issue #1012) und zeigt das Wort deshalb heute nicht.\n */\nconst MODUS: Record<"+"NightRunServerMode, string> = {\n  CHAIN: 'Kette',\n  IMPLEMENTATION: 'Umsetzung',\n  REVIEW: 'Review',\n  INTERACTIVE: 'Sitzung',\n}\n\n/** Der Name der Betriebsart eines Laufs. */\nexport function modusName(mode: NightRunServerMode): string {\n  return MODUS[mode]\n}\n\n/** „1 Vorgang\" bzw. „n Vorgänge\". */\nexport function vorgaenge(anzahl: number): string {\n  return anzahl === 1 ? '1 Vorgang' : `${anzahl} Vorgänge`\n}\n\n/** Der jüngste Lauf nach Startzeit; `null` ohne Lauf. Die Reihenfolge der Antwort ist nicht zugesichert. */\nexport function juengsterLauf(laeufe: readonly NightRunView[]): NightRunView | null {\n  if (laeufe.length === 0) {\n    return null\n  }\n  return laeufe.reduce((a, b) => (b.startedAt > a.startedAt ? b : a))\n}\n\n/**\n * Der Melder eines ganzen Laufs: läuft er noch, stahl; sonst der schlechteste Zustand seiner Pakete.\n *\n * <"+"p>Die Form ist absichtlich schmal — `complete` und die Zustände. Die Server-Sicht erfüllt sie,\n * und das Anzeigemodell der Nachtlauf-Seite (#988) ebenso; eine zweite Rechenstelle für dieselbe\n * Frage liefe beim nächsten Zustand auseinander.\n */\nexport function laufMelder(lauf: {\n  complete: boolean\n  items: readonly { state: NightRunState }[]\n}): Melder {\n  if (!lauf.complete) {\n    return 'stahl'\n  }\n  if (lauf.items.some((item) => item.state === 'RED')) {\n    return 'zinnob'\n  }\n  return lauf.items.some((item) => item.state === 'YELLOW') ? 'bernst' : 'gruen'\n}\n\n/** Die Aussage des Laufbands (Entwurf Z. 1203–1230). */\nexport interface Laufband {\n  titel: string\n  melder: Melder\n  laeuft: boolean\n  /** Der jüngste Vorgang; `null`, solange der Lauf keinen gemeldet hat. */\n  vorgang: { nummer: number; titel: string } | null\n  zeitpunkt: string\n  minuten: number\n  /** Kosten in Dollar ohne Einheit; `null`, wenn der Verbrauch nicht gemessen wurde. */\n  kosten: string | null\n}\n\nexport function laufband(lauf: NightRunView): Laufband {\n  const modus = modusName(lauf.mode)\n  const gesamt = lauf.items.length\n  const letzter = lauf.items.at(-1)\n  const beginn = new Date(lauf.startedAt)\n  let titel: string\n  if (lauf.complete) {\n    titel = `${modus} abgeschlossen — ${vorgaenge(gesamt)}`\n  } else if (gesamt === 0) {\n    titel = `${modus} läuft`\n  } else {\n    const bearbeitet = lauf.items.filter((item) => item.state !== 'GREY').length\n    titel = `${modus} läuft — Vorgang ${bearbeitet} von ${gesamt}`\n  }\n  return {\n    titel,\n    melder: laufMelder(lauf),\n    laeuft: !lauf.complete,\n    vorgang: letzter ? { nummer: letzter.cardNumber, titel: letzter.title } : null,\n    zeitpunkt: lauf.complete ? `Beginn ${TAG_ZEIT.format(beginn)}` : `seit ${ZEIT.format(beginn)}`,\n    minuten: Math.round(lauf.durationMs / 60_000),\n    kosten: lauf.usage?.costUsd == null ? null : dollar(lauf.usage.costUsd),\n  }\n}\n\n/** Ein Dollarbetrag mit zwei Nachkommastellen, ohne Einheit. */\nexport function dollar(usd: number): string {\n  return ZAHL_2.format(usd)\n}\n\n/** Dollar mit zwei Nachkommastellen und Einheit; `null` bleibt `null` — nicht gemessen ist nicht 0. */\nexport function kostenText(usd: number | null): string | null {\n  return usd === null ? null : `${dollar(usd)} $`\n}\n\n/** Dauer eines Arbeitspakets wie im Entwurf: `mm:ss`, ab einer Stunde `h:mm:ss`; ohne Messung `—`. */\nexport function paketDauer(ms: number | null): string {\n  if (ms === null) {\n    return '—'\n  }\n  const sekunden = Math.round(ms / 1000)\n  const h = Math.floor(sekunden / 3600)\n  const m = Math.floor((sekunden % 3600) / 60)\n  const s = String(sekunden % 60).padStart(2, '0')\n  return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${String(m).padStart(2, '0')}:${s}`\n}\n\n/** Dauer eines Laufs als „4 h 12 min\" bzw. „12 min\". */\nexport function laufDauer(ms: number): string {\n  const minuten = Math.round(ms / 60_000)\n  const h = Math.floor(minuten / 60)\n  return h > 0 ? `${h} h ${minuten % 60} min` : `${minuten} min`\n}\n\n/**\n * Dieselbe Dauer in Wert und Einheit getrennt, für das Instrument „Dauer\" der Laufplatte (#988,\n * Mockup `docs/mockup-nachtlauf-lauf.html` Z. 397: „4:12 h\"). Nicht {@link laufDauer}: Ein\n * Instrument setzt die Einheit klein hinter den Wert, und „4 h 12 min\" ließe sich dafür nicht\n * teilen. Nicht {@link paketDauer}: Die zählt Sekunden mit, und über vier Stunden sagt „4:12:00\"\n * nichts, was „4:12 h\" nicht kürzer sagte.\n */\nexport function laufDauerGeteilt(ms: number): { wert: string; einheit: string } {\n  const minuten = Math.round(ms / 60_000)\n  const h = Math.floor(minuten / 60)\n  return h > 0\n    ? { wert: `${h}:${String(minuten % 60).padStart(2, '0')}`, einheit: 'h' }\n    : { wert: String(minuten), einheit: 'min' }\n}\n\n/** Ein Zeitpunkt als Tag und Uhrzeit („14.09. 23:10\") — Beginn eines Laufs in Notiz und Metazeile. */\nexport function tagZeit(iso: string): string {\n  return TAG_ZEIT.format(new Date(iso))\n}\n\n/** Die Notiz im Kopf der Platte „Letzter Lauf\": Beginn, Dauer, Zahl der Pakete. */\nexport function laufNotiz(lauf: NightRunView): string {\n  const pakete = lauf.items.length === 1 ? '1 Paket' : `${lauf.items.length} Pakete`\n  return `${tagZeit(lauf.startedAt)} · ${laufDauer(lauf.durationMs)} · ${pakete}`\n}\n\n/**\n * Der Anteil des Zwischenspeichers an der Eingabe in Prozent (#988, Instrument „Cache-Quote\");\n * `null`, wo eine der beiden Zahlen fehlt oder die Eingabe null ist.\n *\n * <"+"p><"+"b>Dieselbe Formel wie am Server<"+"/b> (`NightRunUsage#cachedInputSharePercent`): Zwischenspeicher\n * mal hundert geteilt durch Eingabe, `null` ohne eine der beiden Zahlen oder bei Eingabe null. Die\n * Sicht eines Laufs (`api/nightRuns.ts`) führt den fertigen Anteil nicht — nur die Verbrauchs-Sicht\n * tut das. Gerechnet wird hier deshalb, aber nicht anders.\n *\n * <"+"p><"+"b>Ohne Bezugsgröße kein Prozentwert.<"+"/b> „0 %\" behauptete eine gemessene Quote von null,\n * „100 %\" eine vollständige Wiederverwendung — beides sind Aussagen über eine Division, die es\n * nicht gibt. Eine gemessene Null im Zwischenspeicher ist dagegen ein Wert: Dort lief die Messung\n * und ergab nichts.\n */\nexport function cacheQuote(zwischenspeicher: number | null, eingabe: number | null): number | null {\n  if (zwischenspeicher === null || eingabe === null || eingabe === 0) {\n    return null\n  }\n  return Math.round((zwischenspeicher / eingabe) * 100)\n}\n\n/** Ob ein Arbeitspaket ein Abbruch ist — der Filter „Nur Abbrüche\" (Entwurf Z. 1419). */\nexport function istAbbruch(item: NightRunItemView): boolean {\n  return item.state === 'RED' || item.state === 'YELLOW'\n}\n\n/** Kurzer Commit-Hash wie im Entwurf (sieben Zeichen). */\nexport function kurzHash(hash: string | null): string | null {\n  return hash === null ? null : hash.slice(0, 7)\n}\n\n/** Die erste Zeile eines Auszugs — die Zeile unter dem Titel ist einzeilig. */\nexport function ersteZeile(text: string | null): string | null {\n  const zeile = text?.split('\\n').find((z) => z.trim() !== '')\n  return zeile === undefined ? null : zeile.trim()\n}\n\n// ---------------------------------------------------------------------------------------------\n// Kacheln\n// ---------------------------------------------------------------------------------------------\n\n/** Die Richtung eines Deltas: gut (grün), schlecht (zinnober) oder neutral. */\nexport type DeltaArt = 'gut' | 'schlecht' | 'neutral'\n\nexport interface Delta {\n  text: string\n  art: DeltaArt\n}\n\nexport interface Kachel {\n  /** `null` ohne Datenbasis — die Ansicht zeigt dann einen Leerwert, keine Null. */\n  wert: string | null\n  einheit: string\n  basis: string\n  /** Werte der Sparkline; `null`, wenn es keinen Verlauf gibt. */\n  verlauf: readonly number[] | null\n  delta: Delta | null\n}\n\n/** Durchsatz · Woche (Entwurf Z. 1236–1258): letzte Woche, Verlauf über zwölf, Delta zur Vorwoche. */\nexport function durchsatzKachel(wochen: readonly WeeklyThroughput[]): Kachel {\n  const werte = wochen.map((w) => w.doneCount)\n  if (werte.every((w) => w === 0)) {\n    return { wert: null, einheit: 'Karten', basis: `${werte.length} Wochen`, verlauf: null, delta: null }\n  }\n  const letzte = werte.at(-1)!\n  const vorige = werte.at(-2) ?? 0\n  return {\n    wert: GANZ.format(letzte),\n    einheit: letzte === 1 ? 'Karte' : 'Karten',\n    basis: `${werte.length} Wochen`,\n    verlauf: werte,\n    delta: wochenDelta(letzte, vorige),\n  }\n}\n\nfunction wochenDelta(letzte: number, vorige: number): Delta {\n  if (letzte === vorige) {\n    return { text: '± 0', art: 'neutral' }\n  }\n  const art: DeltaArt = letzte > vorige ? 'gut' : 'schlecht'\n  const pfeil = letzte > vorige ? '▲' : '▼'\n  if (vorige === 0) {\n    return { text: `${pfeil} ${letzte} zur Vorwoche`, art }\n  }\n  return { text: `${pfeil} ${GANZ.format(Math.round((Math.abs(letzte - vorige) / vorige) * 100))} %`, art }\n}\n\n/** Durchlaufzeit in Tagen (Entwurf Z. 1260–1282). Kein Verlauf, kein Delta: Die Antwort trägt nur den Schnitt. */\nexport function durchlaufKachel(sekunden: number | null, stichprobe: number): Kachel {\n  return {\n    wert: sekunden === null ? null : ZAHL_1.format(sekunden / 86_400),\n    einheit: 'Tage',\n    basis: stichprobe === 1 ? '1 Karte' : `${stichprobe} Karten`,\n    verlauf: null,\n    delta: null,\n  }\n}\n\n/**\n * Implementierungszeit (Entwurf Z. 1284–1306): wie lange eine erledigte Karte in In Progress lag.\n * Unter einer Stunde in Minuten — KI-Umsetzungen dauern oft weniger, und „0,3 Stunden\" liest sich\n * schlecht.\n */\nexport function implementierungKachel(sekunden: number | null, stichprobe: number): Kachel {\n  const basis = stichprobe === 1 ? '1 Karte' : `${stichprobe} Karten`\n  if (sekunden === null || stichprobe === 0) {\n    return { wert: null, einheit: 'Stunden', basis, verlauf: null, delta: null }\n  }\n  // Die Grenze liegt bei den gerundeten Minuten: 3570 s wären sonst „60 Minuten\" statt „1,0 Stunden\".\n  const minuten = Math.round(sekunden / 60)\n  const inMinuten = minuten <"+" 60\n  return {\n    wert: inMinuten ? GANZ.format(minuten) : ZAHL_1.format(sekunden / 3600),\n    einheit: inMinuten ? 'Minuten' : 'Stunden',\n    basis,\n    verlauf: null,\n    delta: null,\n  }\n}\n\n/** Anteil grüner Pakete über die aufbewahrten Läufe (Entwurf Z. 1308–1323); graue zählen nicht. */\nexport interface GruenAnteil {\n  prozent: number | null\n  gruen: number\n  gelb: number\n  rot: number\n  gesamt: number\n}\n\nexport function gruenAnteil(laeufe: readonly NightRunView[]): GruenAnteil {\n  const gezaehlt = paketZaehlung(laeufe.flatMap((lauf) => lauf.items))\n  return {\n    prozent: gezaehlt.gesamt === 0 ? null : Math.round((gezaehlt.gruen / gezaehlt.gesamt) * 100),\n    ...gezaehlt,\n  }\n}\n\n/**\n * Die Pakete einer Menge nach Zustand gezählt — grün, gelb, rot und ihre Summe. **Graue zählen\n * nicht mit**: Ein übergangener Vorgang lief nie, und ihn in die Summe zu nehmen machte aus der\n * Auswahlregel eines Laufs einen Mangel. Dieselbe Grenze, die `processedCount` zieht.\n *\n * <"+"p>Sie nimmt nur den Zustand und nicht die ganze Server-Sicht: Der Anteil des Leitstands\n * ({@link gruenAnteil}) und das Instrument „Pakete\" der Laufplatte (#988) reichen verschiedene\n * Formen herein, zählen aber dasselbe.\n */\nexport function paketZaehlung(\n  pakete: readonly { state: NightRunState }[],\n): { gruen: number; gelb: number; rot: number; gesamt: number } {\n  const gruen = pakete.filter((p) => p.state === 'GREEN').length\n  const gelb = pakete.filter((p) => p.state === 'YELLOW').length\n  const rot = pakete.filter((p) => p.state === 'RED').length\n  return { gruen, gelb, rot, gesamt: gruen + gelb + rot }\n}\n\n/**\n * Punkte einer Sparkline im Rahmen 124 × 36 des Entwurfs: links 2, rechts 122, oben 4, unten 30.\n * Ein einzelner Wert oder lauter gleiche Werte liegen auf halber Höhe.\n */\nexport function funkenPunkte(werte: readonly number[]): Array<"+"{ x: number; y: number }> {\n  const min = Math.min(...werte)\n  const max = Math.max(...werte)\n  const schritt = werte.length > 1 ? 120 / (werte.length - 1) : 0\n  return werte.map((wert, i) => ({\n    x: Math.round((2 + i * schritt) * 10) / 10,\n    y: max === min ? 17 : Math.round((30 - ((wert - min) / (max - min)) * 26) * 10) / 10,\n  }))\n}\n\n/** Die Kalenderwoche nach ISO 8601 eines Wochenbeginns — Beschriftung unter dem Balkenwerk. */\nexport function kalenderwoche(iso: string): number {\n  const datum = new Date(iso)\n  const tag = new Date(Date.UTC(datum.getUTCFullYear(), datum.getUTCMonth(), datum.getUTCDate()))\n  const wochentag = tag.getUTCDay() || 7\n  tag.setUTCDate(tag.getUTCDate() + 4 - wochentag)\n  const jahresbeginn = new Date(Date.UTC(tag.getUTCFullYear(), 0, 1))\n  return Math.ceil(((tag.getTime() - jahresbeginn.getTime()) / 86_400_000 + 1) / 7)\n}\n\n/** Höhen der Balken in Prozent des höchsten Werts; ohne Wert über null steht jeder Balken bei 0. */\nexport function balkenHoehen(werte: readonly number[]): number[] {\n  const max = Math.max(0, ...werte)\n  return werte.map((wert) => (max === 0 ? 0 : Math.round((wert / max) * 100)))\n}\n\n/** Eine Zeile der Abbruchgründe (Entwurf Z. 1606–1653): Klasse, Zahl, Breite relativ zur häufigsten. */\nexport interface Klassenzeile {\n  klasse: NightRunErrorClass\n  zahl: number\n  breite: number\n  melder: Melder\n}\n\nexport function abbruchgruende(zaehler: NightRunErrorClassCounts): Klassenzeile[] {\n  const eintraege = (Object.entries(zaehler) as Array<"+"[NightRunErrorClass, number]>).filter(([, zahl]) => zahl > 0)\n  const max = Math.max(0, ...eintraege.map(([, zahl]) => zahl))\n  return eintraege\n    .toSorted((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))\n    .map(([klasse, zahl]) => ({\n      klasse,\n      zahl,\n      breite: Math.round((zahl / max) * 100),\n      melder: MELDER_JE_FEHLERKLASSE[klasse],\n    }))\n}\n\n/** Eine Token-Menge in der Einheit des Entwurfs: „4,82 Mio\", „186 Tsd\" oder die Zahl selbst. */\nexport function tokenMenge(anzahl: number | null): { wert: string; einheit: string } | null {\n  if (anzahl === null) {\n    return null\n  }\n  if (anzahl >= 1_000_000) {\n    return { wert: ZAHL_2.format(anzahl / 1_000_000), einheit: 'Mio' }\n  }\n  if (anzahl >= 1000) {\n    return { wert: GANZ.format(Math.round(anzahl / 1000)), einheit: 'Tsd' }\n  }\n  return { wert: GANZ.format(anzahl), einheit: 'Token' }\n}\n\n/** Eine Token-Menge als Fließtext („3,66 Mio\", „710 Tsd\"). */\nexport function tokenText(anzahl: number): string {\n  const menge = tokenMenge(anzahl)!\n  return `${menge.wert} ${menge.einheit}`\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":100,"low":90,"break":null},"testFiles":{"src/lib/nightRunErgebnisstand.test.ts":{"tests":[{"id":"0","name":"parseNightRunErgebnisstand — Ablehnungen lehnt eine Datei ab, die kein JSON ist"},{"id":"1","name":"parseNightRunErgebnisstand — Ablehnungen lehnt `null` ab — gueltiges JSON, aber kein Objekt"},{"id":"2","name":"parseNightRunErgebnisstand — Ablehnungen lehnt ein Array ab"},{"id":"3","name":"parseNig ue #865) laesst `kennzahlen` ungesetzt, wenn die Einheit sie als null fuehrt"},{"id":"180","name":"parseNightRunErgebnisstand — Angaben des Ergebnisstands (Issue #865) laesst `kettenStufen` ungesetzt, wenn der Vorgang keinen Arbeitsschritt erreicht hat"},{"id":"181","name":"parseNightRunErgebnisstand — Angaben des Ergebnisstands (Issue #865) nennt eine begonnene Plan-Stufe ohne Dokument mit leerer Dokumentenliste"},{"id":"182","name":"parseNightRunErgebnisstand — Angaben des Ergebnisstands (Issue #865) traegt an einem Arbeitsschritt ohne Kennzahlen weder Kosten noch Zuege"},{"id":"183","name":"parseNightRunErgebnisstand — Kennzahlen aller Lauf-Arten (Issue #870) traegt an jedem der fuenf Vorgaenge des Umsetzungs-Laufs Kosten und Zuege"},{"id":"184","name":"parseNightRunErgebnisstand — Kennzahlen aller Lauf-Arten (Issue #870) traegt am bearbeiteten Vorgang des Pruef-Laufs Kosten, Zuege und Arbeitszeit"},{"id":"185","name":"parseNightRunErgebnisstand — Kennzahlen aller Lauf-Arten (Issue #870) nennt am Vorgang eines Erzeugungs-Laufs die Zahl der dort entstandenen Dokumente"},{"id":"186","name":"parseNightRunErgebnisstand — Kennzahlen aller Lauf-Arten (Issue #870) nennt die Dokumentenzahl auch an einem Vorgang, dessen Sitzung nichts gemeldet hat"},{"id":"187","name":"parseNightRunErgebnisstand — Kennzahlen aller Lauf-Arten (Issue #870) laesst die Dokumentenzahl an einem uebergangenen Vorgang ungesetzt"},{"id":"188","name":"parseNightRunErgebnisstand — Kennzahlen aller Lauf-Arten (Issue #870) reicht den Kennzahlen-Hinweis des Lauf-Kopfs durch"},{"id":"189","name":"parseNightRunErgebnisstand — Kennzahlen aller Lauf-Arten (Issue #870) laesst den Kennzahlen-Hinweis weg, wenn der Lauf-Kopf ihn nicht fuehrt"},{"id":"190","name":"parseNightRunErgebnisstand — Kennzahlen aller Lauf-Arten (Issue #870) laesst an einer Einheit ohne Kennzahlen und ohne Dokumente beide Felder ungesetzt"},{"id":"191","name":"parseNightRunErgebnisstand — Arbeitszeit des Modells (Issue #872) traegt an jedem der fuenf Vorgaenge des Umsetzungs-Laufs die Arbeitszeit"},{"id":"192","name":"parseNightRunErgebnisstand — Arbeitszeit des Modells (Issue #872) traegt sie auch am Vorgang eines Erzeugungs-Laufs"},{"id":"193","name":"parseNightRunErgebnisstand — Arbeitszeit des Modells (Issue #872) laesst sie weg, wo die Kennzahlen sie nicht fuehren"},{"id":"194","name":"parseNightRunErgebnisstand gegen parseNightRunLog deutet 'ohneBefund' im Pruef-Lauf aus beiden Quellen gleich"},{"id":"195","name":"parseNightRunErgebnisstand gegen parseNightRunLog deutet 'mitBefund' im Pruef-Lauf aus beiden Quellen gleich"},{"id":"196","name":"parseNightRunErgebnisstand gegen parseNightRunLog deutet 'schaerfungFehlt' im Pruef-Lauf aus beiden Quellen gleich"},{"id":"197","name":"parseNightRunErgebnisstand gegen parseNightRunLog deutet 'syntheseOhneBeleg' im Pruef-Lauf aus beiden Quellen gleich"},{"id":"198","name":"parseNightRunErgebnisstand gegen parseNightRunLog deutet 'ohneErgebnis' im Pruef-Lauf aus beiden Quellen gleich"},{"id":"199","name":"parseNightRunErgebnisstand gegen parseNightRunLog deutet 'unerfuellte Abhaengigkeit' aus beiden Quellen gleich"},{"id":"200","name":"parseNightRunErgebnisstand gegen parseNightRunLog deutet 'kit:klaeren' aus beiden Quellen gleich"},{"id":"201","name":"parseNightRunErgebnisstand gegen parseNightRunLog deutet 'Session ohne In-review-Ergebnis' aus beiden Quellen gleich"},{"id":"202","name":"parseNightRunErgebnisstand gegen parseNightRunLog deutet 'Praefix-Gate' aus beiden Quellen gleich"},{"id":"203","name":"parseNightRunErgebnisstand gegen parseNightRunLog deutet 'Nachtplan ohne Label' aus beiden Quellen gleich"}],"source":"import { describe, expect, it } from 'vitest'\nimport { NIGHT_RUN_EXCERPT_MAX, parseNightRunLog } from './nightRunLog'\nimport type { NightRun, NightRunItem } from './nightRunLog'\nimport { parseNightRunErgebnisstand } from './nightRunErgebnisstand'\nimport type { NightRunErgebnisstandResult } from './nightRunErgebnisstand'\nimport echterLauf from './__fixtures__/night-run-2026-09-07-085229.json'\nimport echterNachtplanHarterStopp from './__fixtures__/night-run-2026-09-09-141506.json'\nimport echterNachtplanRegulaer from './__fixtures__/night-run-2026-09-09-125621.json'\nimport echterPrueflauf from './__fixtures__/night-run-2026-09-11-103116.json'\nimport echteKette from './__fixtures__/night-run-2026-09-14-131200.json'\n\n/**\n * Die Fixtures dieser Datei sind — anders als in `nightRunLog.test.ts` — nicht\n * anonymisiert: Der Ergebnisstand traegt keine Pfade, keine Sitzungs-IDs und keinen\n * Quelltext, sondern Kartennummern, Titel und Kennzahlen des eigenen Projekts. Der\n * echte Lauf vom 2026-09-07 liegt deshalb unveraendert unter `__fixtures__/` (Issue\n * #773): Ein Test gegen selbstgebaute Daten prueft die eigene Annahme, nicht das\n * Format.\n */\n\n/** Ein Ergebnisstand der Fassung 1; jedes Feld ist einzeln ueberschreibbar. */\nconst stand = (felder: Record<"+"string, unknown> = {}): string =>\n  JSON.stringify({\n    schemaFassung: 1,\n    erzeugtVon: '1.47.0',\n    start: '2026-09-07T08:52:29.532Z',\n    art: 'implementierung',\n    modell: 'claude-opus-5',\n    max: 10,\n    label: null,\n    einheiten: [],\n    abschluss: 'regulaer',\n    ...felder,\n  })\n\n/** Eine Einheit, wie `einheitAnlegen` in `night.mjs` sie schreibt. */\nconst einheit = (felder: Record<"+"string, unknown>): Record<"+"string, unknown> => ({\n  id: '100',\n  titel: 'Paket 1',\n  ...felder,\n})\n\n/** Ein Ergebnisstand mit genau einer Einheit — der Regelfall dieser Tests. */\nconst mitEinheit = (felder: Record<"+"string, unknown>, laufFelder: Record<"+"string, unknown> = {}): string =>\n  stand({ einheiten: [einheit(felder)], ...laufFelder })\n\n/** Dieselbe Einheit in einem Pruef-Lauf — `art`/`stufe`, wie `night.mjs --review` sie schreibt. */\nconst imPrueflauf = (felder: Record<"+"string, unknown>, laufFelder: Record<"+"string, unknown> = {}): string =>\n  mitEinheit(felder, { art: 'review', stufe: 'plan', ...laufFelder })\n\n/**\n * Dieselbe Einheit in einem Ketten-Lauf. `stufe: null` schreibt `night.mjs --kette` in jeden\n * Ketten-Stand — die Stufen liegen dort innerhalb der Einheit, nicht am Lauf.\n */\nconst inKette = (felder: Record<"+"string, unknown>, laufFelder: Record<"+"string, unknown> = {}): string =>\n  mitEinheit(felder, { art: 'kette', stufe: null, ...laufFelder })\n\n/** Den Lauf holen und dabei sicherstellen, dass die Deutung ueberhaupt gelang. */\nfunction lauf(text: string): NightRun {\n  const ergebnis = parseNightRunErgebnisstand(text)\n  if (!ergebnis.ok) throw new Error(`unerwartet nicht deutbar: ${ergebnis.grund}`)\n  return ergebnis.run\n}\n\n/** Das einzige Arbeitspaket eines Laufs. */\nconst einziges = (text: string): NightRunItem => lauf(text).items[0]\n\n/**\n * Die Ablehnung eines Stands — wirft, wenn er wider Erwarten deutbar war.\n *\n * <"+"p>Seit Issue #857 traegt eine Ablehnung neben dem Grund auch das nicht gedeutete Wort\n * und die erzeugende Ausgabe des Nachtlaufs. Die Bestandsfaelle pruefen deshalb `.grund`\n * statt der vollstaendigen Form mit `toEqual`: Ihre Aussage ist unveraendert die, welcher\n * der drei Gruende zutrifft.\n */\nfunction ablehnung(text: string): Extract<"+"NightRunErgebnisstandResult, { ok: false }> {\n  const ergebnis = parseNightRunErgebnisstand(text)\n  if (ergebnis.ok) throw new Error('unerwartet deutbar')\n  return ergebnis\n}\n\ndescribe('parseNightRunErgebnisstand — Ablehnungen', () => {\n  it('lehnt eine Datei ab, die kein JSON ist', () => {\n    expect(ablehnung('[2026-09-07T08:52:29.532Z] Nacht-Runner startet').grund).toBe('kein-json')\n  })\n\n  it('lehnt `null` ab — gueltiges JSON, aber kein Objekt', () => {\n    expect(ablehnung('null').grund).toBe('kein-json')\n  })\n\n  it('lehnt ein Array ab', () => {\n    expect(ablehnung('[]').grund).toBe('kein-json')\n  })\n\n  it('lehnt eine blosse Zahl ab', () => {\n    expect(ablehnung('42').grund).toBe('kein-json')\n  })\n\n  it('lehnt ein Objekt ohne schemaFassung ab — es ist kein Ergebnisstand', () => {\n    expect(ablehnung('{\"art\":\"implementierung\"}').grund).toBe('kein-json')\n  })\n\n  it('meldet eine unbekannte Fassung getrennt vom Formfehler', () => {\n    expect(ablehnung(stand({ schemaFassung: 2 })).grund).toBe('unbekannte-fassung')\n  })\n\n  it('lehnt einen Pruef-Lauf mit unbekannter Stufe ab', () => {\n    expect(ablehnung(stand({ art: 'review', stufe: 'sonstwas' })).grund).toBe('nicht-unterstuetzt')\n  })\n\n  it.each([\n    ['mitBefund'],\n    ['ohneBefund'],\n    ['schaerfungFehlt'],\n    ['syntheseOhneBeleg'],\n  ])('lehnt den Pruef-Ausgang %s in einem Implementierungs-Lauf ab', (ausgang) => {\n    expect(ablehnung(mitEinheit({ ausgang })).grund).toBe('nicht-unterstuetzt')\n  })\n\n  it('lehnt einen Pruef-Ausgang in einem Nachtplan-Lauf ab', () => {\n    const text = mitEinheit({ ausgang: 'mitBefund' }, { art: 'erzeugung', stufe: 'plan' })\n    expect(ablehnung(text).grund).toBe('nicht-unterstuetzt')\n  })\n\n  // Die Einheiten tragen jeweils genau das, was den Ausgang in seinem eigenen Modus\n  // deutbar machte — sonst schluege schon die alte Pruefung zu und die Ablehnung waere\n  // nicht belegt.\n  it.each([\n    ['verbraucht', {}],\n    ['offen', {}],\n    ['erfolg', { pruefung: { id: '100', zustand: 'geprueft' } }],\n    ['fehlschlag', { pruefung: { id: '100', zustand: 'rot', rotesKommando: 'mvn verify', rotesErgebnis: 'rot' } }],\n    ['zurueckgestellt', { grund: 'Nachtlauf: Idee ([Idee]).' }],\n  ] as const)('lehnt den Ausgang %s eines anderen Modus in einem Pruef-Lauf ab', (ausgang, felder) => {\n    // Ein Pruef-Lauf schreibt sie nie; eine geratene Farbe waere fuer eine kaputte\n    // oder fremde Datei die falsche Aussage.\n    expect(ablehnung(imPrueflauf({ ausgang, ...felder })).grund).toBe('nicht-unterstuetzt')\n  })\n\n  // Wie bei den Pruef-Lagen tragen die Einheiten genau das, was ihren Ausgang im eigenen\n  // Modus deutbar machte — sonst schluege schon die alte Pruefung zu.\n  it.each([\n    ['verbraucht', {}],\n    ['offen', {}],\n    ['ohneErgebnis', {}],\n    ['ohneBefund', {}],\n    ['mitBefund', {}],\n    ['schaerfungFehlt', {}],\n    ['syntheseOhneBeleg', { grund: 'sonnet: „Der Abschnitt fehlt\" — steht nicht im Body-Vorschlag.' }],\n    ['erfolg', { pruefung: { id: '100', zustand: 'geprueft' } }],\n    ['fehlschlag', { pruefung: { id: '100', zustand: 'rot', rotesKommando: 'mvn verify', rotesErgebnis: 'rot' } }],\n    ['zurueckgestellt', { grund: 'Nachtlauf: Idee ([Idee]).' }],\n    ['harterStopp', {}],\n  ] as const)('lehnt den Ausgang %s eines anderen Modus in einem Ketten-Lauf ab', (ausgang, felder) => {\n    // `erfolg` steht hier ausdruecklich mit drin: Er fiele sonst auf das modus-unabhaengige\n    // Vokabular durch und bekaeme in einer Kette eine geratene Farbe.\n    expect(ablehnung(inKette({ ausgang, ...felder })).grund).toBe('nicht-unterstuetzt')\n  })\n\n  it.each([['fertig'], ['angehalten'], ['abgebrochen']])(\n    'lehnt den Ketten-Ausgang %s in einem Implementierungs-Lauf ab',\n    (ausgang) => {\n      expect(ablehnung(mitEinheit({ ausgang, grund: 'Kostenbudget: 55.00 $' })).grund).toBe('nicht-unterstuetzt')\n    },\n  )\n\n  it('lehnt einen Ketten-Stand mit gesetzter Stufe ab — der Runner schreibt dort immer null', () => {\n    expect(ablehnung(stand({ art: 'kette', stufe: 'plan' })).grund).toBe('nicht-unterstuetzt')\n  })\n\n  it.each([\n    ['erzeugung', undefined],\n    ['erzeugung', null],\n    ['erzeugung', 'issue'],\n    [undefined, 'plan'],\n    ['implementierung', 'plan'],\n  ] as const)('lehnt die Kombination art=%s/stufe=%s ab — nur (erzeugung,plan) ist Nachtplan', (art, stufe) => {\n    expect(ablehnung(stand({ art, stufe })).grund).toBe('nicht-unterstuetzt')\n  })\n\n  it('lehnt einen Stand ohne Feld `einheiten` ab', () => {\n    const ohne = JSON.parse(stand()) as Record<"+"string, unknown>\n    delete ohne.einheiten\n    expect(ablehnung(JSON.stringify(ohne)).grund).toBe('nicht-unterstuetzt')\n  })\n\n  it('lehnt `einheiten` ab, wenn es kein Array ist', () => {\n    expect(ablehnung(stand({ einheiten: {} })).grund).toBe('nicht-unterstuetzt')\n  })\n\n  it('lehnt einen `abschluss` ab, der weder null noch ein String ist', () => {\n    expect(ablehnung(stand({ abschluss: 7 })).grund).toBe('nicht-unterstuetzt')\n  })\n\n  it('lehnt einen unbekannten `ausgang` ab', () => {\n    expect(ablehnung(mitEinheit({ ausgang: 'halbfertig' })).grund).toBe('nicht-unterstuetzt')\n  })\n\n  it('lehnt `erfolg` ohne Pruefblock ab — das Paar ist unvollstaendig', () => {\n    expect(ablehnung(mitEinheit({ ausgang: 'erfolg' })).grund).toBe('nicht-unterstuetzt')\n  })\n\n  it('lehnt `erfolg` mit unbekanntem Pruefzustand ab', () => {\n    const text = mitEinheit({ ausgang: 'erfolg', pruefung: { id: '100', zustand: 'grau' } })\n    expect(ablehnung(text).grund).toBe('nicht-unterstuetzt')\n  })\n\n  it('lehnt `fehlschlag` mit einem Pruefzustand ab, den die Tabelle dort nicht kennt', () => {\n    // `geprueft` ist bei einem Fehlschlag kein Widerspruch, den dieser Parser aufloest —\n    // der Runner erzeugt das Paar nicht, und raten waere schlimmer als ablehnen.\n    const text = mitEinheit({ ausgang: 'fehlschlag', pruefung: { id: '100', zustand: 'geprueft' } })\n    expect(ablehnung(text).grund).toBe('nicht-unterstuetzt')\n  })\n})\n\n/**\n * AK 10 aus Issue #842: Wer entscheiden will, ob er ein neueres Werkzeug braucht, soll das\n * aus der Meldung erfahren — welches Wort nicht gedeutet werden konnte und welche Ausgabe\n * des Nachtlaufs die Datei geschrieben hat. Beides steht an der Ablehnung selbst; den Satz\n * daraus baut die Seite.\n */\ndescribe('parseNightRunErgebnisstand — Wort und Herkunft einer Ablehnung (Issue #857)', () => {\n  it('nennt bei unbekannter Lauf-Art das Paar art/stufe und die erzeugende Ausgabe', () => {\n    const ergebnis = ablehnung(stand({ art: 'erfindung', stufe: 'plan' }))\n    expect(ergebnis.grund).toBe('nicht-unterstuetzt')\n    expect(ergebnis.wort).toBe('art=erfindung/stufe=plan')\n    expect(ergebnis.erzeugtVon).toBe('1.47.0')\n  })\n\n  it('nennt eine fehlende Stufe im Wort ausdruecklich als „ohne\"', () => {\n    expect(ablehnung(stand({ art: 'erfindung' })).wort).toBe('art=erfindung/stufe=ohne')\n  })\n\n  it('nennt bei einem Ausgang, den eine Kette nie schreibt, genau diesen Ausgang', () => {\n    const ergebnis = ablehnung(inKette({ ausgang: 'verbraucht' }))\n    expect(ergebnis.grund).toBe('nicht-unterstuetzt')\n    expect(ergebnis.wort).toBe('verbraucht')\n    expect(ergebnis.erzeugtVon).toBe('1.47.0')\n  })\n\n  it('nennt auch den unbekannten Ausgang eines Implementierungs-Laufs', () => {\n    expect(ablehnung(mitEinheit({ ausgang: 'halbfertig' })).wort).toBe('halbfertig')\n  })\n\n  it('laesst `wort` leer, wo es keines gibt — `einheiten` ist kein Array', () => {\n    const ergebnis = ablehnung(stand({ einheiten: {} }))\n    expect(ergebnis).not.toHaveProperty('wort')\n    expect(ergebnis.erzeugtVon).toBe('1.47.0')\n  })\n\n  it('laesst `wort` auch bei falsch getyptem `abschluss` leer', () => {\n    expect(ablehnung(stand({ abschluss: 7 }))).not.toHaveProperty('wort')\n  })\n\n  it('laesst Wort und Herkunft leer, wenn die Datei gar kein JSON ist', () => {\n    const ergebnis = ablehnung('[2026-09-07T08:52:29.532Z] Nacht-Runner startet')\n    expect(ergebnis).not.toHaveProperty('wort')\n    expect(ergebnis).not.toHaveProperty('erzeugtVon')\n  })\n\n  it('laesst die Herkunft leer, wenn der Stand sie nicht als Zeichenkette fuehrt', () => {\n    expect(ablehnung(stand({ art: 'erfindung', erzeugtVon: 7 }))).not.toHaveProperty('erzeugtVon')\n  })\n\n  /**\n   * E11 des Plans #849: AK 10 verlangt die Herkunft woertlich nur fuer „Art oder Vokabular\n   * unbekannt\". Gerade bei unbekanntem **Aufbau** ist die Frage nach dem neueren Werkzeug\n   * aber am dringendsten — sie dort als einzige auszulassen waere der eine Fall, in dem der\n   * Betreiber doch in die Datei sehen muesste.\n   */\n  it('nennt die Herkunft auch bei unbekannter Aufbaufassung', () => {\n    const ergebnis = ablehnung(stand({ schemaFassung: 2, erzeugtVon: '2.0.0' }))\n    expect(ergebnis.grund).toBe('unbekannte-fassung')\n    expect(ergebnis.erzeugtVon).toBe('2.0.0')\n    expect(ergebnis).not.toHaveProperty('wort')\n  })\n})\n\ndescribe('parseNightRunErgebnisstand — Zustand je Arbeitspaket', () => {\n  it('macht `erfolg` mit gepruefter Runde gruen', () => {\n    const item = einziges(mitEinheit({ ausgang: 'erfolg', pruefung: { id: '100', zustand: 'geprueft' } }))\n    expect(item.state).toBe('GREEN')\n    expect(item.errorClass).toBeUndefined()\n    expect(item.excerpt).toBe('geprüft')\n  })\n\n  it('macht `erfolg` mit leerem Paket gruen', () => {\n    const item = einziges(mitEinheit({ ausgang: 'erfolg', pruefung: { id: '100', zustand: 'leeresPaket' } }))\n    expect(item.state).toBe('GREEN')\n    expect(item.errorClass).toBeUndefined()\n    expect(item.excerpt).toBe('leeres Paket')\n  })\n\n  it('macht `erfolg` ohne gefahrene Pruefung gelb mit CHECKS_NOT_STARTED', () => {\n    const item = einziges(mitEinheit({ ausgang: 'erfolg', pruefung: { id: '100', zustand: 'ungeprueft' } }))\n    expect(item.state).toBe('YELLOW')\n    expect(item.errorClass).toBe('CHECKS_NOT_STARTED')\n    expect(item.excerpt).toBe('Nachweis fehlt — die Session hat keine Prüfung gefahren')\n  })\n\n  it('macht `erfolg` mit unlesbarem Nachweis gelb mit CHECKS_NOT_STARTED', () => {\n    const text = mitEinheit({\n      ausgang: 'erfolg',\n      pruefung: { id: '100', zustand: 'unlesbar', fehler: 'Unexpected token }' },\n    })\n    const item = einziges(text)\n    expect(item.state).toBe('YELLOW')\n    expect(item.errorClass).toBe('CHECKS_NOT_STARTED')\n    expect(item.excerpt).toBe('Nachweis unlesbar (Unexpected token })')\n  })\n\n  it('macht `erfolg` mit rotem Nachweis gelb mit CHECKS_RED', () => {\n    const text = mitEinheit({\n      ausgang: 'erfolg',\n      pruefung: { id: '100', zustand: 'rot', rotesKommando: 'mvn verify', rotesErgebnis: 'rot' },\n    })\n    const item = einziges(text)\n    expect(item.state).toBe('YELLOW')\n    expect(item.errorClass).toBe('CHECKS_RED')\n    expect(item.excerpt).toBe('Nachweis rot — mvn verify endete rot')\n  })\n\n  it('macht `fehlschlag` mit rotem Nachweis rot mit CHECKS_RED', () => {\n    const text = mitEinheit({\n      ausgang: 'fehlschlag',\n      pruefung: { id: '100', zustand: 'rot', rotesKommando: 'mvn verify', rotesErgebnis: 'rot' },\n    })\n    const item = einziges(text)\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBe('CHECKS_RED')\n    expect(item.excerpt).toBe('Nachweis rot — mvn verify endete rot')\n  })\n\n  it('macht `fehlschlag` ohne gefahrene Pruefung rot mit CHECKS_NOT_STARTED', () => {\n    const item = einziges(mitEinheit({ ausgang: 'fehlschlag', pruefung: { id: '100', zustand: 'ungeprueft' } }))\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBe('CHECKS_NOT_STARTED')\n  })\n\n  it('macht `fehlschlag` mit unlesbarem Nachweis rot mit CHECKS_NOT_STARTED', () => {\n    const text = mitEinheit({\n      ausgang: 'fehlschlag',\n      pruefung: { id: '100', zustand: 'unlesbar', fehler: 'ENOENT' },\n    })\n    const item = einziges(text)\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBe('CHECKS_NOT_STARTED')\n    expect(item.excerpt).toBe('Nachweis unlesbar (ENOENT)')\n  })\n\n  it('macht ein wegen unerfuellter Abhaengigkeit zurueckgestelltes Paket grau mit DEPENDENCY_UNMET', () => {\n    const grund = 'Nachtlauf: Abhaengigkeit #99 nicht erfuellt (nicht in In review/Done) — Issue zurueckgestellt.'\n    const item = einziges(mitEinheit({ ausgang: 'zurueckgestellt', grund }))\n    expect(item.state).toBe('GREY')\n    expect(item.errorClass).toBe('DEPENDENCY_UNMET')\n    expect(item.excerpt).toBe(grund)\n  })\n\n  it('macht ein wegen kit:klaeren zurueckgestelltes Paket rot mit AWAITING_DECISION', () => {\n    const grund = 'Nachtlauf: Traegt kit:klaeren — eine offene Entscheidung wartet auf einen Menschen, wird nicht implementiert.'\n    const item = einziges(mitEinheit({ ausgang: 'zurueckgestellt', grund }))\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBe('AWAITING_DECISION')\n    expect(item.excerpt).toBe(grund)\n  })\n\n  it('macht eine Session ohne In-review-Ergebnis rot mit UNEXPECTED_STATE', () => {\n    const grund =\n      'Session ohne In-review-Ergebnis beendet — Issue zurueckgestellt, Lauf ging mit dem naechsten Issue weiter.'\n    const item = einziges(mitEinheit({ ausgang: 'zurueckgestellt', grund }))\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBe('UNEXPECTED_STATE')\n  })\n\n  it('macht jedes andere zurueckgestellte Paket grau ohne Fehlerklasse', () => {\n    const grund = 'Nachtlauf: Plan-Dokument — wird nicht implementiert, bitte per /issues #100 in Arbeitspakete ueberfuehren.'\n    const item = einziges(mitEinheit({ ausgang: 'zurueckgestellt', grund }))\n    expect(item.state).toBe('GREY')\n    expect(item.errorClass).toBeUndefined()\n    expect(item.excerpt).toBe(grund)\n  })\n\n  it('behandelt ein zurueckgestelltes Paket ohne Grund als den generischen Fall', () => {\n    const item = einziges(mitEinheit({ ausgang: 'zurueckgestellt' }))\n    expect(item.state).toBe('GREY')\n    expect(item.errorClass).toBeUndefined()\n    expect(item.excerpt).toBe('')\n  })\n\n  it('haelt die Reihenfolge der Sonderfaelle ein — der Grundtext ist nicht exklusiv', () => {\n    // Eine Abhaengigkeit auf ein Ticket, dessen Titel `kit:klaeren` nennt: Die erste\n    // Zeile der Tabelle gewinnt, sonst kippte ein grauer Fall auf rot.\n    const grund = 'Nachtlauf: Abhaengigkeit #99 nicht erfuellt — dort haengt kit:klaeren.'\n    const item = einziges(mitEinheit({ ausgang: 'zurueckgestellt', grund }))\n    expect(item.state).toBe('GREY')\n    expect(item.errorClass).toBe('DEPENDENCY_UNMET')\n  })\n\n  it('macht ein Paket mit unbekanntem Ausgang rot mit HARD_ABORT', () => {\n    const item = einziges(mitEinheit({ ausgang: 'unbekannt' }))\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBe('HARD_ABORT')\n    expect(item.excerpt).toBe('Lauf mitten in der Runde abgebrochen — kein Ausgang')\n  })\n\n  it('macht ein Paket mit hartem Stopp rot mit HARD_ABORT', () => {\n    const item = einziges(mitEinheit({ ausgang: 'harterStopp' }))\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBe('HARD_ABORT')\n    expect(item.excerpt).toBe('Harter Stopp')\n  })\n\n  // Die vier Ausgaenge eines Erzeugungs-Laufs: gleicher Aufbau, nur Farbe und Auszug\n  // unterscheiden sich; keiner traegt eine Fehlerklasse. Als Tabelle statt viermal\n  // ausgeschrieben (Sonar S5976, Issue #813).\n  it.each([\n    ['verbraucht', 'GREEN', 'Dokument(e) erzeugt und geprüft — Label entfernt'],\n    ['liegengeblieben', 'GREY', 'Über die Obergrenze (--max) hinaus — bleibt liegen'],\n    // `offen` kommt in keinem der beiden echten Fixtures vor (Plan #803, #805) — diese\n    // Zeile ist bewusst synthetisch, nicht gegen echte Daten belegt.\n    ['offen', 'GREY', 'Noch nicht jedes erzeugte Dokument hat einen Endzustand — Label bleibt stehen'],\n    ['ohneErgebnis', 'RED', 'Keine verwertbare Erzeugung — Session ohne Dokument oder Prüfrunde ohne Anker'],\n  ])('macht `%s` %s ohne Fehlerklasse', (ausgang, state, excerpt) => {\n    const item = einziges(mitEinheit({ ausgang }, { art: 'erzeugung', stufe: 'plan' }))\n    expect(item.state).toBe(state)\n    expect(item.errorClass).toBeUndefined()\n    expect(item.excerpt).toBe(excerpt)\n  })\n\n  it('macht `uebersprungen` grau mit Freitext aus grund, unabhaengig vom Lauf-Modus', () => {\n    const item = einziges(mitEinheit({ ausgang: 'uebersprungen', grund: \"kein Label 'kit:nightplan'\" }))\n    expect(item.state).toBe('GREY')\n    expect(item.errorClass).toBeUndefined()\n    expect(item.excerpt).toBe(\"kein Label 'kit:nightplan'\")\n  })\n\n  it('macht `uebersprungen` ohne grund grau mit leerem Auszug', () => {\n    const item = einziges(mitEinheit({ ausgang: 'uebersprungen' }))\n    expect(item.state).toBe('GREY')\n    expect(item.errorClass).toBeUndefined()\n    expect(item.excerpt).toBe('')\n  })\n\n  it('macht `uebersprungen` mit nicht-string grund grau mit leerem Auszug', () => {\n    const item = einziges(mitEinheit({ ausgang: 'uebersprungen', grund: 7 }))\n    expect(item.state).toBe('GREY')\n    expect(item.excerpt).toBe('')\n  })\n\n  it('kuerzt einen ueberlangen Auszug auf die gemeinsame Obergrenze', () => {\n    const grund = 'x'.repeat(NIGHT_RUN_EXCERPT_MAX + 100)\n    expect(einziges(mitEinheit({ ausgang: 'zurueckgestellt', grund })).excerpt).toHaveLength(\n      NIGHT_RUN_EXCERPT_MAX,\n    )\n  })\n})\n\ndescribe('parseNightRunErgebnisstand — Pruef-Lauf (Issue #816)', () => {\n  it.each([['fachlich'], ['plan'], ['issue']])('deutet art=review/stufe=%s als REVIEW', (stufe) => {\n    const r = lauf(imPrueflauf({ ausgang: 'ohneBefund' }, { stufe }))\n    expect(r.mode).toBe('REVIEW')\n    expect(r.stage).toBe(stufe)\n  })\n\n  it.each([\n    ['stufe: null', { stufe: null }],\n    ['fehlende Stufe (Bestand vor 1.51.0)', { stufe: undefined }],\n  ])('setzt bei %s die wirksame Stufe \"issue\" — so laeuft runReviewLoop', (_name, laufFelder) => {\n    const r = lauf(imPrueflauf({ ausgang: 'ohneBefund' }, laufFelder))\n    expect(r.mode).toBe('REVIEW')\n    expect(r.stage).toBe('issue')\n  })\n\n  it('laesst die Stufe in den uebrigen Modi unbesetzt — wie der Text-Parser', () => {\n    expect(lauf(stand())).not.toHaveProperty('stage')\n    expect(lauf(mitEinheit({ ausgang: 'verbraucht' }, { art: 'erzeugung', stufe: 'plan' }))).not.toHaveProperty('stage')\n  })\n\n  it('macht `ohneBefund` gruen ohne Fehlerklasse', () => {\n    const item = einziges(imPrueflauf({ ausgang: 'ohneBefund' }))\n    expect(item.state).toBe('GREEN')\n    expect(item.errorClass).toBeUndefined()\n    expect(item.excerpt).toBe('geprüft ohne Befund — Marker gesetzt')\n  })\n\n  it('macht `mitBefund` gruen ohne Fehlerklasse — der Review hat sich gelohnt', () => {\n    const item = einziges(imPrueflauf({ ausgang: 'mitBefund' }))\n    expect(item.state).toBe('GREEN')\n    expect(item.errorClass).toBeUndefined()\n    expect(item.excerpt).toBe('geprüft mit Befund — kein Marker, wartet auf dich')\n  })\n\n  it('macht `schaerfungFehlt` gelb mit CHECKS_NOT_STARTED', () => {\n    const item = einziges(imPrueflauf({ ausgang: 'schaerfungFehlt' }))\n    expect(item.state).toBe('YELLOW')\n    expect(item.errorClass).toBe('CHECKS_NOT_STARTED')\n    expect(item.excerpt).toBe('Befunde vorhanden, aber kein Body-Vorschlag — Schärfung fehlt')\n  })\n\n  it('macht `syntheseOhneBeleg` rot mit AWAITING_DECISION und uebernimmt den grund', () => {\n    const grund = 'sonnet: „Der Abschnitt fehlt\" — steht nicht im Body-Vorschlag.'\n    const item = einziges(imPrueflauf({ ausgang: 'syntheseOhneBeleg', grund }))\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBe('AWAITING_DECISION')\n    expect(item.excerpt).toBe(grund)\n  })\n\n  it('kuerzt einen ueberlangen syntheseOhneBeleg-Grund auf die gemeinsame Obergrenze', () => {\n    const grund = 'x'.repeat(NIGHT_RUN_EXCERPT_MAX + 100)\n    expect(einziges(imPrueflauf({ ausgang: 'syntheseOhneBeleg', grund })).excerpt).toHaveLength(\n      NIGHT_RUN_EXCERPT_MAX,\n    )\n  })\n\n  it.each([\n    ['ohne grund', {}],\n    ['mit nicht-string grund', { grund: 7 }],\n  ])('laesst den Auszug von `syntheseOhneBeleg` %s leer', (_name, felder) => {\n    const item = einziges(imPrueflauf({ ausgang: 'syntheseOhneBeleg', ...felder }))\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBe('AWAITING_DECISION')\n    expect(item.excerpt).toBe('')\n  })\n\n  // Derselbe Ausgang, zwei Bedeutungen: Im Pruef-Lauf hat die Session nichts\n  // hinterlassen, im Nachtplan-Lauf ist nichts Verwertbares entstanden.\n  it('macht `ohneErgebnis` im Pruef-Lauf rot mit CHECKS_NOT_STARTED', () => {\n    const item = einziges(imPrueflauf({ ausgang: 'ohneErgebnis' }))\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBe('CHECKS_NOT_STARTED')\n    expect(item.excerpt).toBe('Die Review-Session hat nichts hinterlassen — weder Marker noch Befunde')\n  })\n\n  it('laesst `ohneErgebnis` im Nachtplan-Lauf unveraendert rot ohne Fehlerklasse', () => {\n    const item = einziges(mitEinheit({ ausgang: 'ohneErgebnis' }, { art: 'erzeugung', stufe: 'plan' }))\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBeUndefined()\n    expect(item.excerpt).toBe('Keine verwertbare Erzeugung — Session ohne Dokument oder Prüfrunde ohne Anker')\n  })\n\n  it.each([\n    ['uebersprungen', 'GREY' as const, \"kein Label 'review:offen'\"],\n    ['liegengeblieben', 'GREY' as const, 'Über die Obergrenze (--max) hinaus — bleibt liegen'],\n    ['unbekannt', 'RED' as const, 'Lauf mitten in der Runde abgebrochen — kein Ausgang'],\n  ])('deutet den modus-unabhaengigen Ausgang %s auch im Pruef-Lauf', (ausgang, state, auszug) => {\n    const item = einziges(imPrueflauf({ ausgang, grund: auszug }))\n    expect(item.state).toBe(state)\n    expect(item.excerpt).toBe(auszug)\n  })\n})\n\ndescribe('parseNightRunErgebnisstand — Ketten-Lauf (Issue #854)', () => {\n  /** Der Grund eines Zeitbudget-Abbruchs, wie `ketteSession` ihn schreibt. */\n  const ZEITBUDGET = 'Zeitbudget review: die Session wurde nach 15.0 min am Limit beendet'\n\n  it('deutet art=kette/stufe=null als CHAIN und laesst die Stufe unbesetzt', () => {\n    const r = lauf(inKette({ ausgang: 'fertig' }))\n    expect(r.mode).toBe('CHAIN')\n    expect(r).not.toHaveProperty('stage')\n  })\n\n  it('macht `fertig` gruen ohne Fehlerklasse', () => {\n    const item = einziges(inKette({ ausgang: 'fertig' }))\n    expect(item.state).toBe('GREEN')\n    expect(item.errorClass).toBeUndefined()\n    expect(item.excerpt).toBe('Kette vollständig durchlaufen — Plan, Prüfung, Pakete, Abdeckung')\n  })\n\n  it('macht `angehalten` rot mit AWAITING_DECISION — eine Stopp-Frage war n    ['kein Plan entstanden — die Session hat kein [Plan]-Dokument mit der Herkunftszeile angelegt'],\n  ])('macht den Abbruch \"%s\" rot mit HARD_ABORT, auch mit erzeugtem Dokument', (grund) => {\n    const item = einziges(\n      inKette({ ausgang: 'abgebrochen', grund, stufen: { plan: { id: '849' } } }),\n    )\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBe('HARD_ABORT')\n    // Erste Zeile: Seit Issue #855 folgt dem Ausgang der Stufenblock der Einheit.\n    expect(item.excerpt.split('\\n')[0]).toBe(grund)\n  })\n\n  it.each([\n    ['ohne grund', {}],\n    ['mit nicht-string grund', { grund: 7 }],\n  ])('behandelt einen Abbruch %s als harten Abbruch mit leerem Auszug', (_name, felder) => {\n    const item = einziges(inKette({ ausgang: 'abgebrochen', ...felder }))\n    expect(item.state).toBe('RED')\n    expect(item.errorClass).toBe('HARD_ABORT')\n    expect(item.excerpt).toBe('')\n  })\n\n  it('kuerzt einen ueberlangen Abbruch-Grund auf die gemeinsame Obergrenze', () => {\n    const grund = 'x'.repeat(NIGHT_RUN_EXCERPT_MAX + 100)\n    expect(einziges(inKette({ ausgang: 'abgebrochen', grund })).excerpt).toHaveLength(\n      NIGHT_RUN_EXCERPT_MAX,\n    )\n  })\n\n  it.each([\n    ['uebersprungen', 'GREY' as const, \"kein Label 'kit:night'\"],\n    ['liegengeblieben', 'GREY' as const, 'Über die Obergrenze (--max) hinaus — bleibt liegen'],\n    ['unbekannt', 'RED' as const, 'Lauf mitten in der Runde abgebrochen — kein Ausgang'],\n  ])('deutet den modus-unabhaengigen Ausgang %s auch im Ketten-Lauf', (ausgang, state, auszug) => {\n    const item = einziges(inKette({ ausgang, grund: auszug }))\n    expect(item.state).toBe(state)\n    expect(item.excerpt).toBe(auszug)\n  })\n})\n\ndescribe('parseNightRunErgebnisstand — Stufen und Dauer eines Ketten-Vorgangs (Issue #855)', () => {\n  /**\n   * Die Ausnahme aus E3: `stufeAbdeckung` laesst die Kette auch bei Zeitbudget, Fehlstart\n   * oder fehlendem Text `fertig` enden und legt den Grund an der Stufe  = einziges(inKette({ ausgang: 'fertig', stufen: { plan: { id: null } } }))\n    expect(item.excerpt.split('\\n')[1]).toBe('plan: gelungen')\n  })\n\n  it('nennt jede Paketnummer der Paket-Stufe', () => {\n    const item = einziges(\n      inKette({ ausgang: 'fertig', stufen: { pakete: { ids: ['847', '848'] } } }),\n    )\n    expect(item.excerpt.split('\\n')[1]).toBe('pakete #847, #848: gelungen')\n  })\n\n  it('laesst den Auszug einer Einheit ohne Stufen-Block unveraendert', () => {\n    expect(einziges(inKette({ ausgang: 'fertig' })).excerpt).toBe(\n      'Kette vollständig durchlaufen — Plan, Prüfung, Pakete, Abdeckung',\n    )\n  })\n\n  it('kuerzt auch den Stufen-Text auf die gemeinsame Obergrenze', () => {\n    const grund = 'x'.repeat(NIGHT_RUN_EXCERPT_MAX)\n    const item = einziges(\n      inKette({ ausgang: 'fertig', stufen: { abdeckung: { grund } } }),\n    )\n    expect(item.excerpt).toHaveLength(NIGHT_RUN_EXCERPT_MAX)\n  })\n\n  it('summiert die Dauer eines Ketten-Vorgangs aus seinen Stufen', () => {\n    const item = einziges(\n      inKette({\n        ausgang: 'fertig',\n        stufen: { plan: { id: '849', dauerMs: 1000 }, review: { dauerMs: 2000 } },\n      }),\n    )\n    expect(item.durationMs).toBe(3000)\n  })\n\n  it('bevorzugt ein vorhandenes dauerMs der Einheit vor der Summe ihrer Stufen', () => {\n    const item = einziges(\n      inKette({ ausgang: 'fertig', dauerMs: 42, stufen: { plan: { id: '849', dauerMs: 1000 } } }),\n    )\n    expect(item.durationMs).toBe(42)\n  })\n\n  /**\n   * AK 9 aus #842: Ein zurueckgestelltes oder uebersprungenes Paket ohne `dauerMs` und ohne\n   * Stufen zeigt heute **keine** Dauer — eine leere Summe duerfte daraus kein „0s\" machen.\n   */\n  it('erzeugt ohne dauerMs und ohne Stufen-Block keine Dauer am Arbeitspaket', () => {\n    const item = einziges(inKette({ ausgang: 'uebersprungen', grund: \"kein Label 'kit:night'\" }))\n    expect(item).not.toHaveProperty('durationMs')\n  })\n})\n\ndescribe('parseNightRunErgebnisstand — uebernommene Felder', () => {\n  const vollstaendig = mitEinheit({\n    id: '767',\n    titel: 'Sammelzugriff fuer Zustaendige',\n    ausgang: 'erfolg',\n    dauerMs: 244427,\n    commit: '917b6a3',\n    endStatus: 'in_review',\n    pruefung: { id: '767', zustand: 'geprueft' },\n    kennzahlen: { kostenUsd: 2.13, apiDauerMs: 180563, zuege: 38 },\n  })\n\n  it('uebernimmt Startzeit, Kartennummer, Titel, Dauer und Commit', () => {\n    const item = einziges(vollstaendig)\n    expect(lauf(vollstaendig).startedAt).toBe('2026-09-07T08:52:29.532Z')\n    expect(item.cardNumber).toBe(767)\n    expect(item.title).toBe('Sammelzugriff fuer Zustaendige')\n    expect(item.durationMs).toBe(244427)\n    expect(item.commit).toBe('917b6a3')\n  })\n\n  it('laesst den Commit weg, wenn der Stand ihn als null fuehrt', () => {\n    const item = einziges(mitEinheit({ ausgang: 'unbekannt', commit: null }))\n    expect(item).not.toHaveProperty('commit')\n  })\n\n  it('laesst die Dauer weg, wenn die Einheit keine traegt', () => {\n    const item = einziges(mitEinheit({ ausgang: 'zurueckgestellt', grund: 'Nachtlauf: Idee ([Idee]).' }))\n    expect(item).not.toHaveProperty('durationMs')\n  })\n\n  it('haelt kein Rohprotokoll vor — der Ergebnisstand traegt keines', () => {\n    expect(einziges(vollstaendig).rawLines).toEqual([])\n  })\n\n  it('nummeriert die Arbeitspakete in der Reihenfolge der Einheiten', () => {\n    const text = stand({\n      einheiten: [\n        einheit({ id: '100', ausgang: 'unbekannt' }),\n        einheit({ id: '101', ausgang: 'unbekannt' }),\n      ],\n    })\n    expect(lauf(text).items.map((i) => [i.cardNumber, i.position])).toEqual([\n      [100, 0],\n      [101, 1],\n    ])\n  })\n\n  it('deutet einen Implementierungs-Lauf als IMPLEMENTATION', () => {\n    expect(lauf(stand()).mode).toBe('IMPLEMENTATION')\n  })\n\n  it('deutet einen Implementierungs-Lauf mit stufe:null (Kit ab 1.51.0) weiterhin als IMPLEMENTATION', () => {\n    expect(lauf(stand({ stufe: null })).mode).toBe('IMPLEMENTATION')\n  })\n\n  it('deutet einen Bestand ganz ohne art-Feld (aelter als 1.47.0) als IMPLEMENTATION', () => {\n    expect(lauf(stand({ art: undefined })).mode).toBe('IMPLEMENTATION')\n  })\n\n  it('deutet art=erzeugung/stufe=plan als NIGHTPLAN', () => {\n    const text = mitEinheit(\n      { ausgang: 'uebersprungen', grund: \"kein Label 'kit:nightplan'\" },\n      { art: 'erzeugung', stufe: 'plan' },\n    )\n    expect(lauf(text).mode).toBe('NIGHTPLAN')\n  })\n\n  it('zaehlt bearbeitete und uebergangene Pakete getrennt', () => {\n    const text = stand({\n      einheiten: [\n        einheit({ id: '100', ausgang: 'unbekannt' }),\n        einheit({ id: '101', ausgang: 'zurueckgestellt', grund: 'Nachtlauf: Idee ([Idee]).' }),\n      ],\n    })\n    const r = lauf(text)\n    expect(r.processedCount).toBe(1)\n    expect(r.skippedCount).toBe(1)\n  })\n\n  it('kennt keine ungedeuteten Zeilen — der Stand ist strukturiert', () => {\n    const r = lauf(stand())\n    expect(r.unparsedCount).toBe(0)\n    expect(r.unparsedSample).toEqual([])\n  })\n\n  it('summiert die Laufdauer aus den Einheiten und zaehlt fehlende Dauern als null', () => {\n    const text = stand({\n      einheiten: [\n        einheit({ id: '100', ausgang: 'unbekannt', dauerMs: 1000 }),\n        einheit({ id: '101', ausgang: 'unbekannt', dauerMs: 2000 }),\n        einheit({ id: '102', ausgang: 'zurueckgestellt', grund: 'Nachtlauf: Idee ([Idee]).' }),\n      ],\n    })\n    expect(lauf(text).durationMs).toBe(3000)\n  })\n\n  it('meldet einen Lauf ohne Abschluss als unvollstaendig', () => {\n    expect(lauf(stand({ abschluss: null })).incomplete).toBe(true)\n  })\n\n  it('meldet einen regulaer beendeten Lauf als vollstaendig', () => {\n    expect(lauf(stand()).incomplete).toBe(false)\n  })\n})\n\ndescribe('parseNightRunErgebnisstand — harter Stopp auf Lauf-Ebene', () => {\n  it('setzt Zustand und Fehlerklasse des Laufs und uebernimmt den Fehlertext', () => {\n    const r = lauf(\n      stand({\n        abschluss: 'harterStopp',\n        fehlerklasse: 'zustand',\n        fehlerText: 'Working Tree ist nicht sauber. Bitte committen oder aufraeumen, dann neu starten.',\n      }),\n    )\n    expect(r.runState).toBe('RED')\n    expect(r.runErrorClass).toBe('HARD_ABORT')\n    expect(r.runExcerpt).toBe(\n      'Working Tree ist nicht sauber. Bitte committen oder aufraeumen, dann neu starten.',\n    )\n  })\n\n  it('nennt ohne Fehlertext wenigstens die Fehlerklasse', () => {\n    const r = lauf(stand({ abschluss: 'harterStopp', fehlerklasse: 'umgebung' }))\n    expect(r.runExcerpt).toBe('Harter Stopp (umgebung)')\n  })\n\n  it('meldet ohne Fehlertext und ohne Fehlerklasse den blossen harten Stopp', () => {\n    expect(lauf(stand({ abschluss: 'harterStopp' })).runExcerpt).toBe('Harter Stopp')\n  })\n\n  it('laesst den Lauf-Zustand bei regulaerem Abschluss unbesetzt', () => {\n    const r = lauf(stand())\n    expect(r).not.toHaveProperty('runState')\n    expect(r).not.toHaveProperty('runErrorClass')\n    expect(r).not.toHaveProperty('runExcerpt')\n  })\n})\n\ndescribe('parseNightRunErgebnisstand — echter Lauf vom 2026-09-07', () => {\n  const r = lauf(JSON.stringify(echterLauf))\n  const nach = (nummer: number) => r.items.find((i) => i.cardNumber === nummer)\n\n  it('deutet die beiden erfolgreichen, aber ungeprueften Pakete als gelb', () => {\n    for (const nummer of [767, 770]) {\n      expect(nach(nummer)?.state).toBe('YELLOW')\n      expect(nach(nummer)?.errorClass).toBe('CHECKS_NOT_STARTED')\n    }\n  })\n\n  it('deutet die drei Pakete mit rotem Nachweis als rot', () => {\n    for (const nummer of [768, 769, 771]) {\n      expect(nach(nummer)?.state).toBe('RED')\n      expect(nach(nummer)?.errorClass).toBe('CHECKS_RED')\n    }\n  })\n\n  it('summiert die Laufdauer aus den fuenf Einheiten', () => {\n    expect(r.durationMs).toBe(244427 + 769668 + 980483 + 167015 + 926467)\n  })\n\n  it('zaehlt fuenf bearbeitete Pakete, keines uebergangen, und #535 gruen ohne Fehlerklasse', () => {\n    for (const nummer of [533, 535]) {\n      expect(nach(nummer)?.state).toBe('GREEN')\n      expect(nach(nummer)?.errorClass).toBeUndefined()\n    }\n  })\n\n  it('deutet das `ohneErgebnis`-Paket #479 rot ohne Fehlerklasse', () => {\n    expect(nach(479)?.state).toBe('RED')\n    expect(nach(479)?.errorClass).toBeUndefined()\n  })\n\n  it('deutet die `liegengeblieben`-Pakete #541/#549/#551 grau ohne Fehlerklasse', () => {\n    for (const nummer of [541, 549, 551]) {\n      expect(nach(nummer)?.state).toBe('GREY')\n      expect(nach(nummer)?.errorClass).toBeUndefined()\n    }\n  })\n})\n\ndescribe('parseNightRunErgebnisstand — echter Pruef-Lauf (2026-09-11-103116)', () => {\n  const r = lauf(JSON.stringify(echterPrueflauf))\n  const nach = (nummer: number) => r.items.find((i) => i.cardNumber === nummer)\n\n  it('deutet den Lauf als REVIEW auf Stufe plan, vollstaendig, ohne Lauf-Zustand', () => {\n    expect(r.mode).toBe('REVIEW')\n    expect(r.stage).toBe('plan')\n    expect(r.incomplete).toBe(false)\n    expect(r).not.toHaveProperty('runState')\n  })\n\n  it('zaehlt ein bearbeitetes und 34 uebergangene Pakete, nichts ungedeutet', () => {\n    expect(r.processedCount).toBe(1)\n    expect(r.skippedCount).toBe(34)\n    expect(r.unparsedCount).toBe(0)\n  })\n\n  it('summiert die Laufdauer aus der einzigen Einheit mit dauerMs', () => {\n    expect(r.durationMs).toBe(879763)\n  })\n\n  it('deutet das `mitBefund`-Paket #782 gruen ohne Fehlerklasse', () => {\n    expect(nach(782)?.state).toBe('GREEN')\n    expect(nach(782)?.errorClass).toBeUndefined()\n  })\n})\n\n/**\n * Der erste echte Ketten-Lauf (Issue #854). Er traegt genau die drei Lagen, um die es geht:\n * zwei vollstaendig durchlaufene Ketten und einen Zeitbudget-Abbruch, bei dem trotzdem ein\n * Plan-Dokument entstanden ist — der Gelb-Fall. Ein Test gegen selbstgebaute Daten prueft\n * die eigene Annahme, nicht das Format.\n */\ndescribe('parseNightRunErgebnisstand — echter Ketten-Lauf (2026-09-14-131200)', () => {\n  const r = lauf(JSON.stringify(echteKette))\n  const nach = (nummer: number) => r.items.find((i) => i.cardNumber === nummer)\n\n  it('deutet den Lauf als CHAIN, vollstaendig, ohne Lauf-Zustand und ohne Stufe', () => {\n    expect(r.mode).toBe('CHAIN')\n    expect(r.incomplete).toBe(false)\n    expect(r).not.toHaveProperty('runState')\n    expect(r).not.toHaveProperty('stage')\n  })\n\n  it('zaehlt drei bearbeitete Vorgaenge, keinen uebergangen, nichts ungedeutet', () => {\n    expect(r.processedCount).toBe(3)\n    expect(r.skippedCount).toBe(0)\n    expect(r.unparsedCount).toBe(0)\n  })\n\n  it('deutet die beiden fertigen Ketten #791 und #814 gruen ohne Fehlerklasse', () => {\n    for (const nummer of [791, 814]) {\n      expect(nach(nummer)?.state).toBe('GREEN')\n      expect(nach(nummer)?.errorClass).toBeUndefined()\n    }\n  })\n\n  it('deutet den Zeitbudget-Abbruch #842 gelb — der Plan #849 ist trotzdem entstanden', () => {\n    expect(nach(842)?.state).toBe('YELLOW')\n    expect(nach(842)?.errorClass).toBe('TIME_BUDGET_EXCEEDED')\n    expect(nach(842)?.excerpt.split('\\n')[0]).toBe(\n      'Zeitbudget review: die Session wurde nach 15.0 min am Limit beendet',\n    )\n  })\n\n  it('nennt im Auszug der fertigen Kette #791 alle vier Stufen mit ihren Dokumenten (AK 2)', () => {\n    expect(nach(791)?.excerpt.split('\\n')).toEqual([\n      'Kette vollständig durchlaufen — Plan, Prüfung, Pakete, Abdeckung',\n      'plan #844: gelungen',\n      'review: gelungen',\n      'pakete #845: gelungen',\n      'abdeckung: gelungen',\n    ])\n  })\n\n  it('nennt im Auszug des Abbruchs #842 nur die erreichten Stufen — Plan gelungen, Review am Limit (AK 2)', () => {\n    expect(nach(842)?.excerpt.split('\\n')).toEqual([\n      'Zeitbudget review: die Session wurde nach 15.0 min am Limit beendet',\n      'plan #849: gelungen',\n      'review: abgebrochen — Zeitbudget review: die Session wurde nach 15.0 min am Limit beendet',\n    ])\n  })\n\n  it('summiert die Dauer des Vorgangs #842 aus seinen beiden Stufen (AK 6)', () => {\n    expect(nach(842)?.durationMs).toBe(439741 + 900484)\n  })\n\n  it('summiert die Laufdauer ueber alle drei Vorgaenge (AK 6)', () => {\n    expect(r.durationMs).toBe(1533322 + 1274784 + 1340225)\n  })\n})\n\n/**\n * Die Angaben, die der Stand seit je fuehrt und der Parser bis Issue #865 verworfen hat:\n * am Lauf die Zeitvorgaben je Arbeitsschritt, das Kostenbudget und die Lauf-Identitaet,\n * am Vorgang seine Kennzahlen und die Werte je Arbeitsschritt.\n *\n * <"+"p>Geprueft ueberwiegend gegen die echten Fixtures — an der Kette die vollen Angaben,\n * am Implementierungs-Lauf die Lage ohne Budget und ohne Stufen. Die konstruierten\n * Staende decken nur, was kein echter Lauf hergibt: das durchgehende Fehlen.\n */\ndescribe('parseNightRunErgebnisstand — Angaben des Ergebnisstands (Issue #865)', () => {\n  const kette = lauf(JSON.stringify(echteKette))\n  const vorgang = (nummer: number) => kette.items.find((i) => i.cardNumber === nummer)\n  const implementierung = lauf(JSON.stringify(echterLauf))\n\n  /** Ein Stand ohne jede der uebernommenen Kopfangaben — `label: null` wie im Bestand. */\n  const ohneKopfangaben = (felder: Record<"+"string, unknown> = {}): string =>\n    stand({ modell: undefined, label: null, abschluss: null, ...felder })\n\n  it('uebernimmt die Zeitvorgaben je Arbeitsschritt aus dem Budget des Laufs', () => {\n    expect(kette.stand?.vorgabenMin).toEqual({ plan: 20, review: 15, pakete: 15, abdeckung: 10 })\n  })\n\n  it('uebernimmt Kostenbudget, Modell, Label, Abschlussart, Kostensumme und fehlende Kostenmeldungen', () => {\n    expect(kette.stand).toMatchObject({\n      kostenBudgetUsd: 50,\n      modell: 'claude-opus-5',\n      label: 'kit:night',\n      abschluss: 'regulaer',\n      kostenSumme: 25.983292999999996,\n      kostenUnbekannt: 1,\n    })\n  })\n\n  it('traegt am Vorgang #842 seine Kosten, die Summe seiner Zuege und die eine fehlende Kostenmeldung', () => {\n    expect(vorgang(842)?.kennzahlen).toEqual({\n      kostenUsd: 4.093616499999999,\n      zuege: 37,\n      kostenUnbekannt: 1,\n    })\n  })\n\n  it('traegt je erreichtem Arbeitsschritt des Vorgangs #842 Dauer, Kosten, Zuege und Dokumente', () => {\n    expect(vorgang(842)?.kettenStufen).toEqual({\n      plan: { dauerMs: 439741, kostenUsd: 4.093616499999999, zuege: 37, dokumente: ['849'] },\n      // `kennzahlen: null` an der Pruefstufe — die Session endete am Zeitbudget, ohne zu melden.\n      review: { dauerMs: 900484, dokumente: [] },\n    })\n  })\n\n  it('fuehrt am vollstaendig durchlaufenen Vorgang #791 alle vier Arbeitsschritte', () => {\n    expect(Object.keys(vorgang(791)?.kettenStufen ?? {})).toEqual([\n      'plan',\n      'review',\n      'pakete',\n      'abdeckung',\n    ])\n  })\n\n  it('nennt an der Paket-Stufe des Vorgangs #791 jedes dort entstandene Paket', () => {\n    expect(vorgang(791)?.kettenStufen?.pakete?.dokumente).toEqual(['845'])\n  })\n\n  it('traegt am Arbeitspaket eines Implementierungs-Laufs die Kennzahlen, aber keine Stufen', () => {\n    // Die Arbeitszeit kam mit Issue #872 dazu; sie stand schon immer im Stand.\n    expect(implementierung.items[0].kennzahlen).toEqual({\n      kostenUsd: 2.1366104999999997,\n      zuege: 38,\n      arbeitszeitMs: 180563,\n    })\n    expect(implementierung.items[0]).not.toHaveProperty('kettenStufen')\n  })\n\n  it('laesst am Lauf ohne Budget die Zeitvorgaben und das Kostenbudget weg', () => {\n    expect(implementierung.stand).toEqual({ modell: 'claude-opus-5', abschluss: 'regulaer' })\n  })\n\n  it('laesst `stand` ganz ungesetzt, wenn der Lauf keine dieser Angaben fuehrt', () => {\n    expect(lauf(ohneKopfangaben())).not.toHaveProperty('stand')\n  })\n\n  it('laesst `stand` auch bei einem Budget ohne jede Vorgabe ungesetzt — kein Feld traegt null', () => {\n    expect(lauf(ohneKopfangaben({ budget: {} }))).not.toHaveProperty('stand')\n  })\n\n  it('laesst `kennzahlen` und `kettenStufen` an einer Einheit ohne diese Angaben ungesetzt', () => {\n    const item = einziges(mitEinheit({ ausgang: 'unbekannt' }))\n    expect(item).not.toHaveProperty('kennzahlen')\n    expect(item).not.toHaveProperty('kettenStufen')\n  })\n\n  it('laesst `kennzahlen` ungesetzt, wenn die Einheit sie als null fuehrt', () => {\n    expect(einziges(mitEinheit({ ausgang: 'unbekannt', kennzahlen: null }))).not.toHaveProperty(\n      'kennzahlen',\n    )\n  })\n\n  it('laesst `kettenStufen` ungesetzt, wenn der Vorgang keinen Arbeitsschritt erreicht hat', () => {\n    expect(einziges(inKette({ ausgang: 'fertig', stufen: {} }))).not.toHaveProperty('kettenStufen')\n  })\n\n  it('nennt eine begonnene Plan-Stufe ohne Dokument mit leerer Dokumentenliste', () => {\n    const item = einziges(inKette({ ausgang: 'fertig', stufen: { plan: { id: null } } }))\n    expect(item.kettenStufen?.plan).toEqual({ dokumente: [] })\n  })\n\n  it('traegt an einem Arbeitsschritt ohne Kennzahlen weder Kosten noch Zuege', () => {\n    const item = einziges(inKette({ ausgang: 'fertig', stufen: { review: { dauerMs: 1000 } } }))\n    expect(item.kettenStufen?.review).toEqual({ dauerMs: 1000, dokumente: [] })\n    expect(item).not.toHaveProperty('kennzahlen')\n  })\n})\n\n/**\n * Der Hinweis, den `ergebnisstandAnlegen` in `night.mjs` genau dann an den Lauf-Kopf\n * schreibt, wenn weder `--verbose` noch `--kette` gesetzt war — woertlich wie dort.\n */\nconst KENNZAHLEN_HINWEIS =\n  'Ohne --verbose fordert der Runner die Stream-Ausgabe der Session nicht an; die Session-Kennzahlen fehlen darum in allen Einheiten.'\n\n/**\n * Die Kennzahlen aus Issue #865 gelten fuer **jede** Lauf-Art, nicht nur fuer die Kette\n * (Issue #870). Dazu kommen zwei Angaben, die der Stand seit je fuehrt und der Parser\n * bislang verwarf: die Zahl der in einem Vorgang erzeugten Dokumente und der Hinweis am\n * Lauf-Kopf, wenn der Runner die Session-Kennzahlen gar nicht erst angefordert hat.\n *\n * <"+"p>Der Hinweis ist als einziger konstruiert geprueft: Keine der fuenf Fixtures traegt\n * ihn — sie stammen alle aus Laeufen mit `--verbose` oder `--kette`, und genau dort laesst\n * `ergebnisstandAnlegen` das Feld weg.\n */\ndescribe('parseNightRunErgebnisstand — Kennzahlen aller Lauf-Arten (Issue #870)', () => {\n  const umsetzung = lauf(JSON.stringify(echterLauf))\n  const pruefung = lauf(JSON.stringify(echterPrueflauf))\n  const erzeugung = lauf(JSON.stringify(echterNachtplanRegulaer))\n  const nach = (r: NightRun, nummer: number) => r.items.find((i) => i.cardNumber === nummer)\n\n  it('traegt an jedem der fuenf Vorgaenge des Umsetzungs-Laufs Kosten und Zuege', () => {\n    const werte = umsetzung.items.map((i) => [i.cardNumber, i.kennzahlen?.kostenUsd, i.kennzahlen?.zuege])\n    expect(werte).toEqual([\n      [767, 2.1366104999999997, 38],\n      [768, 5.134166000000001, 63],\n      [769, 10.86053, 123],\n      [770, 1.6051234999999997, 33],\n      [771, 8.1324195, 121],\n    ])\n  })\n\n  it('traegt am bearbeiteten Vorgang des Pruef-Laufs Kosten, Zuege und Arbeitszeit', () => {\n    expect(nach(pruefung, 782)?.kennzahlen).toEqual({\n      kostenUsd: 21.94563399999999,\n      zuege: 252,\n      arbeitszeitMs: 1084627,\n    })\n  })\n\n  it('nennt am Vorgang eines Erzeugungs-Laufs die Zahl der dort entstandenen Dokumente', () => {\n    expect(nach(erzeugung, 479)?.dokumenteAnzahl).toBe(1)\n  })\n\n  it('nennt die Dokumentenzahl auch an einem Vorgang, dessen Sitzung nichts gemeldet hat', () => {\n    expect(nach(erzeugung, 535)?.dokumenteAnzahl).toBe(1)\n    expect(nach(erzeugung, 535)).not.toHaveProperty('kennzahlen')\n  })\n\n  it('laesst die Dokumentenzahl an einem uebergangenen Vorgang ungesetzt', () => {\n    expect(nach(erzeugung, 164)).not.toHaveProperty('dokumenteAnzahl')\n  })\n\n  it('reicht den Kennzahlen-Hinweis des Lauf-Kopfs durch', () => {\n    expect(lauf(stand({ kennzahlenHinweis: KENNZAHLEN_HINWEIS })).stand?.kennzahlenHinweis).toBe(\n      KENNZAHLEN_HINWEIS,\n    )\n  })\n\n  it('laesst den Kennzahlen-Hinweis weg, wenn der Lauf-Kopf ihn nicht fuehrt', () => {\n    expect(lauf(stand()).stand).not.toHaveProperty('kennzahlenHinweis')\n  })\n\n  it('laesst an einer Einheit ohne Kennzahlen und ohne Dokumente beide Felder ungesetzt', () => {\n    const item = einziges(mitEinheit({ ausgang: 'unbekannt', kennzahlen: null }))\n    expect(item).not.toHaveProperty('kennzahlen')\n    expect(item).not.toHaveProperty('dokumenteAnzahl')\n  })\n})\n\n/**\n * Die Zeit, die das Modell selbst gearbeitet hat (Issue #872). Der Stand fuehrt sie je\n * Sitzung als `apiDauerMs`; der Parser reichte sie bislang als einzige der drei\n * Sitzungs-Kennzahlen nicht durch.\n *\n * <"+"p>Gelesen wird **nur** das Feld der Einheit, nicht die Summe ueber die Arbeitsschritte\n * einer Kette — anders als bei den Zuegen ({@link zuegeDerEinheit}). Die Anzeige, fuer die\n * sie entsteht, gilt den drei Nicht-Ketten-Arten; eine summierte Ketten-Arbeitszeit haette\n * heute keinen Leser und waere unbelegt.\n */\ndescribe('parseNightRunErgebnisstand — Arbeitszeit des Modells (Issue #872)', () => {\n  const umsetzung = lauf(JSON.stringify(echterLauf))\n  const erzeugung = lauf(JSON.stringify(echterNachtplanRegulaer))\n  const nach = (r: NightRun, nummer: number) => r.items.find((i) => i.cardNumber === nummer)\n\n  it('traegt an jedem der fuenf Vorgaenge des Umsetzungs-Laufs die Arbeitszeit', () => {\n    expect(umsetzung.items.map((i) => i.kennzahlen?.arbeitszeitMs)).toEqual([\n      180563, 380034, 567294, 138818, 592769,\n    ])\n  })\n\n  it('traegt sie auch am Vorgang eines Erzeugungs-Laufs', () => {\n    expect(nach(erzeugung, 479)?.kennzahlen?.arbeitszeitMs).toBe(949907)\n  })\n\n  it('laesst sie weg, wo die Kennzahlen sie nicht fuehren', () => {\n    const item = einziges(\n      mitEinheit({ ausgang: 'unbekannt', kennzahlen: { kostenUsd: 1.5, zuege: 7 } }),\n    )\n    expect(item.kennzahlen).toEqual({ kostenUsd: 1.5, zuege: 7 })\n  })\n})\n\n/**\n * Beide Wege muessen dieselbe Lage gleich benennen — sonst hiesse derselbe Lauf im\n * Leitstand je nach Quelle anders. Verglichen wird nur, was der Ergebnisstand\n * tatsaechlich erzeugen kann.\n *\n * <"+"p>Der `kit:klaeren`-Fall haengt an der **Dry-Run-Zeile**: Die Echtlauf-Zeile\n * (`#100 uebersprungen: traegt kit:klaeren …`) faellt im Textparser auf das generische\n * `uebersprungen`-Muster und damit auf GREY ohne Fehlerklasse. Der Unterschied ist\n * bekannt und nicht Gegenstand von Issue #773.\n */\ndescribe('parseNightRunErgebnisstand gegen parseNightRunLog', () => {\n  const z = (minute: number, text: string) =>\n    `[2026-09-01T22:${String(minute).padStart(2, '0')}:00.000Z] ${text}`\n\n  const protokoll = (zeile: string) =>\n    [\n      z(0, 'Nacht-Runner startet (Modus Implementierung, max 5 Sessions, Modell claude-opus-5, Label none)'),\n      z(1, zeile),\n      z(9, 'Nacht-Runner beendet: 0 erfolgreich, 1 zurueckgestellt, 1 Session(s) gestartet.'),\n    ].join('\\n')\n\n  const lagen: ReadonlyArray<"+"{ name: string; zeile: string; einheit: Record<"+"string, unknown> }> = [\n    {\n      name: 'unerfuellte Abhaengigkeit',\n      zeile: '#100 zurueckgestellt: Abhaengigkeit #99 nicht erfuellt.',\n      einheit: {\n        ausgang: 'zurueckgestellt',\n        grund: 'Nachtlauf: Abhaengigkeit #99 nicht erfuellt (nicht in In review/Done) — Issue zurueckgestellt.',\n      },\n    },\n    {\n      name: 'kit:klaeren',\n      zeile: '  #100 Paket 1 -> uebersprungen (kit:klaeren, offene Entscheidung)',\n      einheit: {\n        ausgang: 'zurueckgestellt',\n        grund:\n          'Nachtlauf: Traegt kit:klaeren — eine offene Entscheidung wartet auf einen Menschen, wird nicht implementiert.',\n      },\n    },\n    {\n      name: 'Session ohne In-review-Ergebnis',\n      zeile: '  Fehlschlag nach 5 min: Issue #100 nicht in In review, Tree sauber — Issue ins Backlog, weiter.',\n      einheit: {\n        ausgang: 'zurueckgestellt',\n        grund:\n          'Session ohne In-review-Ergebnis beendet — Issue zurueckgestellt, Lauf ging mit dem naechsten Issue weiter.',\n      },\n    },\n    {\n      name: 'Praefix-Gate',\n      zeile: '#100 uebersprungen: fachliches Issue ([Fachlich]), wird nicht implementiert.',\n      einheit: {\n        ausgang: 'zurueckgestellt',\n        grund:\n          'Nachtlauf: Fachliches Issue — wird nicht implementiert, bitte per /plan #100 in technische Issues ueberfuehren.',\n      },\n    },\n    {\n      name: 'Nachtplan ohne Label',\n      zeile: \"#100 uebersprungen: kein Label 'kit:nightplan'.\",\n      einheit: {\n        ausgang: 'uebersprungen',\n        grund: \"kein Label 'kit:nightplan'\",\n      },\n    },\n  ]\n\n  /**\n   * Derselbe Vergleich fuer den Pruef-Lauf (Issue #816). Eigener Kopf und eigener\n   * Abschluss, weil der Text-Parser Modus und Stufe genau aus diesen beiden Zeilen\n   * liest; die Ausgangszeilen stehen woertlich wie in `werteReviewSession`.\n   */\n  const pruefProtokoll = (zeile: string) =>\n    [\n      z(0, 'Nacht-Runner startet (Modus Review, Stufe plan, max 5 Sessions, Modell claude-opus-5, Label review:offen)'),\n      z(1, 'Review-Session 1/5: Issue #100 — Paket 1'),\n      z(4, zeile),\n      z(\n        9,\n        'Nacht-Review beendet (Stufe plan): 1 ohne Befund, 0 mit Befund, 0 Schaerfung fehlt, '\n          + '0 Synthese ohne Beleg, 0 uebersprungen, 0 ohne Ergebnis, 1 Session(s) gestartet.',\n      ),\n    ].join('\\n')\n\n  const prueflagen: ReadonlyArray<"+"{ name: string; zeile: string; einheit: Record<"+"string, unknown> }> = [\n    {\n      name: 'ohneBefund',\n      zeile: '  Erfolg nach 3 min: Issue #100 geprueft ohne Befund, Marker gesetzt.',\n      einheit: { ausgang: 'ohneBefund' },\n    },\n    {\n      name: 'mitBefund',\n      zeile: '  Erfolg nach 3 min: Issue #100 geprueft mit Befund — kein Marker, wartet auf dich.',\n      einheit: { ausgang: 'mitBefund' },\n    },\n    {\n      name: 'schaerfungFehlt',\n      zeile: '  Nach 3 min: Issue #100 — Befunde vorhanden, aber kein Body-Vorschlag — Schaerfung fehlt.',\n      einheit: { ausgang: 'schaerfungFehlt' },\n    },\n    {\n      name: 'syntheseOhneBeleg',\n      zeile:\n        '  Nach 3 min: Issue #100 — Synthese ohne Beleg: 2 als uebernommen bezeichnete Funde stehen nicht im Body-Vorschlag.',\n      einheit: {\n        ausgang: 'syntheseOhneBeleg',\n        grund: 'sonnet: „Der Abschnitt fehlt\" — steht nicht im Body-Vorschlag.',\n      },\n    },\n    {\n      name: 'ohneErgebnis',\n      zeile: '  Fehlschlag nach 3 min: Issue #100 — die Session hat nichts hinterlassen, weiter mit dem naechsten.',\n      einheit: { ausgang: 'ohneErgebnis' },\n    },\n  ]\n\n  it.each(prueflagen)('deutet $name im Pruef-Lauf aus beiden Quellen gleich', ({ zeile, einheit: felder }) => {\n    const protokollLauf = parseNightRunLog(pruefProtokoll(zeile)).runs[0]\n    const standLauf = lauf(imPrueflauf(felder))\n    expect([standLauf.mode, standLauf.stage]).toEqual([protokollLauf.mode, protokollLauf.stage])\n    const ausProtokoll = protokollLauf.items[0]\n    const ausStand = standLauf.items[0]\n    expect([ausStand.state, ausStand.errorClass]).toEqual([\n      ausProtokoll.state,\n      ausProtokoll.errorClass,\n    ])\n  })\n\n  it.each(lagen)('deutet $name aus beiden Quellen gleich', ({ zeile, einheit: felder }) => {\n    const ausProtokoll = parseNightRunLog(protokoll(zeile)).runs[0].items[0]\n    const ausStand = einziges(mitEinheit(felder))\n    expect([ausStand.state, ausStand.errorClass]).toEqual([\n      ausProtokoll.state,\n      ausProtokoll.errorClass,\n    ])\n  })\n})\n"},"src/lib/nightRunLog.test.ts":{"tests":[{"id":"204","name":"NIGHT_RUN_ERROR_CLASSES ist zur Laufzeit ein Array mit genau acht Eintraegen"},{"id":"205","name":"NIGHT_RUN_ERROR_CLASSES nennt die sieben Klassen aus Plan #718 und die achte aus #842"},{"id":"206","name":"parseNightRunLog — Zerlegung in Laeufe liefert bei leerem Text keine Laeufe"},{"id":"207","name":"parseNightRunLog — Zerlegung in Laeufe ignoriert Text vor der ersten Startzeile"},{"id":"208","name":"parseNightRunLog — Zerlegung in Laeufe ignoriert auch eine Runner-Zeile mit Praefix vor dem ersten Start"},{"id":"209","name":"parseNightRunLog — Zerlegung in Laeufe trennt mehrere Laeufe einer Datei am jeweiligen Start"},{"id":"210","name":"parseNightRunLog — Zerlegung in Laeufe rechnet die Laufdauer aus Start- und Abschlusszeitstempel"},{"id":"211","name":"parseNightRunLog — Zerlegung in Laeufe erkennt einen Start nur am Zeilenanfang, nicht als Teilzeichenkette"},{"id":"212","name":"parseNightRunLog — Probelaeufe und Laeufe ohne Session verwirft einen Probelauf und zaehlt ihn"},{"id":"213","name":"parseNightRunLog — Probelaeufe und Laeufe ohne Session bewahrt einen echten Lauf ohne Session bei leerem Ready"},{"id":"214","name":"parseNightRunLog — Probelaeufe und Laeufe ohne Session bewahrt einen echten Lauf nach einem Label-Tippfehler"},{"id":"215","name":"parseNightRunLog — unvollstaendige Laeufe und harter Abbruch markiert einen Lauf ohne Abschlusszeile als incomplete"},{"id":"216","name":"parseNightRunLog — unvollstaendige Laeufe und harter Abbruch macht ein angefangenes Arbeitspaket ohne Ausgang rot mit HARD_ABORT"},{"id":"217","name":"parseNightRunLog — unvollstaendige Laeufe und harter Abbruch deutet eine praefixlose Fehler-Zeile als harten Abbruch auf Lauf-Ebene, ohne sie als ungedeutet zu zaehlen"},{"id":"218","name":"parseNightRunLog — Zustandszuordnung je Arbeitspaket macht Erfolg mit gruenen Pruefungen gruen"},{"id":"219","name":"parseNightRunLog — Zustandszuordnung je Arbeitspaket macht Erfolg mit roter Pruefung gelb, nicht gruen"},{"id":"220","name":"parseNightRunLog — Zustandszuordnung je Arbeitspaket macht Erfolg ohne gefahrene Pruefung gelb mit CHECKS_NOT_STARTED"},{"id":"221","name":"parseNightRunLog — Zustandszuordnung je Arbeitspaket behandelt ein leeres Paket als geprueft und damit gruen"},{"id":"222","name":"parseNightRunLog — Zustandszuordnung je Arbeitspaket macht einen Fehlschlag bei sauberem Tree rot"},{"id":"223","name":"parseNightRunLog — Zustandszuordnung je Arbeitspaket macht einen Infrastruktur-Fehlschlag rot mit HARD_ABORT"},{"id":"224","name":"parseNightRunLog — Zustandszuordnung je Arbeitspaket macht einen Fehlschlag mit dirtyem Tree rot mit HARD_ABORT"},{"id":"225","name":"parseNightRunLog — Zustandszuordnung je Arbeitspaket macht unkommittete Reste nach einer erfolgreichen Runde rot mit HARD_ABORT"},{"id":"226","name":"parseNightRunLog — Zustandszuordnung je Arbeitspaket macht einen gescheiterten Salvage-Versuch rot mit HARD_ABORT"},{"id":"227","name":"parseNightRunLog — Zustandszuordnung je Arbeitspaket macht ein uebersprungenes Arbeitspaket grau und haelt den Grund fest"},{"id":"228","name":"parseNightRunLog — Zustandszuordnung je Arbeitspaket macht ein wegen unerfuellter Abhaengigkeit zurueckgestelltes Paket grau mit DEPENDENCY_UNMET"},{"id":"229","name":"parseNightRunLog — Zustandszuordnung je Arbeitspaket macht ein Paket mit kit:klaeren rot mit AWAITING_DECISION"},{"id":"230","name":"parseNightRunLog — Pruef-Lauf erkennt den Modus und die Stufe"},{"id":"231","name":"parseNightRunLog — Pruef-Lauf macht \"geprueft ohne Befund\" gruen"},{"id":"232","name":"parseNightRunLog — Pruef-Lauf macht \"geprueft mit Befund\" gruen"},{"id":"233","name":"parseNightRunLog — Pruef-Lauf macht \"Schaerfung fehlt\" gelb"},{"id":"234","name":"parseNightRunLog — Pruef-Lauf macht \"Synthese ohne Beleg\" rot mit AWAITING_DECISION"},{"id":"235","name":"parseNightRunLog — Pruef-Lauf macht \"die Session hat nichts hinterlassen\" rot mit CHECKS_NOT_STARTED"},{"id":"236","name":"parseNightRunLog — Pruef-Lauf macht einen Infrastruktur-Fehlschlag im Pruef-Lauf rot mit HARD_ABORT"},{"id":"237","name":"parseNightRunLog — Pruef-Lauf macht ein Paket mit bereits gesetztem Marker grau"},{"id":"238","name":"parseNightRunLog — an echten Protokollen gefundene Muster versteht Minutenangaben mit Nachkommastelle"},{"id":"239","name":"parseNightRunLog —
