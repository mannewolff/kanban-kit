<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Kupferwarte">
  <!--
    Das Mal der Schiene (AppShell.tsx: MARKE_MAL_SX + MarkenSymbol), auf 32 x 32 gebracht:
    Radius 9/30, Verlauf 155 Grad, drei Balken. Die Kupfertoene stehen fest im hellen Wert
    (#C2743C -> #A85F2C bei 62 % -> #7B421C) — ein Favicon liest keine CSS-Variablen, und das
    Kupfer traegt auf hellem wie dunklem Tab.
    Verlaufsachse: 155 Grad nach CSS, umgerechnet auf die Bildflaeche (Laenge 42.53).
  -->
  <linearGradient id="kupfer" gradientUnits="userSpaceOnUse" x1="7.014" y1="-3.271" x2="24.986" y2="35.271">
    <stop offset="0" stop-color="#C2743C" />
    <stop offset=".62" stop-color="#A85F2C" />
    <stop offset="1" stop-color="#7B421C" />
  </linearGradient>
  <rect width="32" height="32" rx="9.6" fill="url(#kupfer)" />
  <rect x="9.067" y="9.6" width="3.84" height="12.8" rx="1.28" fill="#fff" fill-opacity=".92" />
  <rect x="14.08" y="9.6" width="3.84" height="8.533" rx="1.28" fill="#fff" fill-opacity=".72" />
  <rect x="19.093" y="9.6" width="3.84" height="5.333" rx="1.28" fill="#fff" fill-opacity=".5" />
</svg>
