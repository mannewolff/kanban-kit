name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build & test (inkl. gebündeltem Frontend)
        run: mvn -B verify

  # Mutationsprüfung (CLAUDE-java.md §5, Issue #1567): Der Treiber fährt den Backend-Vollauf mit PIT
  # gegen die Surefire-Unit-Tests (kein Docker/Testcontainers nötig) und urteilt wie `push main` —
  # Sperrschwelle 80 %, Altlast-Vermerk, keine Überlebenden-Karte älter als 7 Tage (Ausnahme von W3
  # in CLAUDE.md). Die Vorgabe pit.marke=100 aus der pom.xml gilt hier nicht. Eigener Job parallel
  # zum verify-Job; das Board-Token braucht der Treiber für Liegezeit und Überlebenden-Karten.
  mutation:
    name: Backend (PIT Mutation, Sperrschwelle 80 %)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mutationsprüfung (Sperrschwelle 80 %, Liegezeit 7 Tage)
        env:
          TBX_TOKEN: ${{ secrets.KANBAN_KIT_TOKEN }}
        run: node scripts/mutationspruefung.mjs vollauf backend

  frontend:
    name: Frontend (npm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:coverage

  # Bezugspruefung (Issue #1229, Plan #1222, E11): eigener Job NEBEN den Code-Jobs, nicht in ihnen.
  # Ein weggefallener Bezug — wie `quay.io/minio/minio`, das anonym nicht mehr beziehbar ist — soll
  # an eigener Stelle rot werden und keinen Code-Job faerben. Der woechentliche Lauf haengt an
  # .github/workflows/bezug.yml und nicht hier: Ein `schedule` an dieser Datei zoege Backend-,
  # Mutations- und Frontend-Job jede Woche mit, ohne dass sich Code geaendert hat.
  bezug:
    name: Bezugsquellen (anonym beziehbar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Die Skript-Tests halten scripts/bausteine.json und den Bestand samt Digest im Gleichklang.
      # Ohne sie saehe ein Aktualisierungs-PR, der nur Compose oder ein Dockerfile anhebt, nicht,
      # dass der Pflichtcheck `scripts` auf `main` danach rot waere (Plan #1295, E24).
      - name: Skript-Tests
        run: node --test scripts/*.test.mjs
      - name: Bezugspruefung
        run: node scripts/bezugspruefung.mjs

  # Ohne diesen Job lief der Docker-Bau erst nach dem Merge nach `production` — beim Deploy auf dem
  # Server und in release-images.yml beim Tag-Push. Der Deploy von v2.15.0 scheiterte genau dort
  # (Issue #1320), obwohl alle Pruefungen gruen waren. Hier bauen beide Abbilder bei jedem Push und
  # Pull Request, ohne Veroeffentlichung und nur fuer amd64: Fehler im Dockerfile oder im
  # Bau-Kontext sind plattformunabhaengig. Matrix und Action-Fassungen folgen release-images.yml,
  # damit derselbe Bauweg geprueft wird (Issue #1321).
  abbilder:
    name: Abbild bauen (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Anwendungs-Abbild
            kontext: .
            datei: ./Dockerfile
          - name: Sicherungs-Abbild
            kontext: ./backup
            datei: ./backup/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4.4.1
      - name: Bauen ohne Veroeffentlichung
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.kontext }}
          file: ${{ matrix.datei }}
          platforms: linux/amd64
          push: false

  # Sicherheitspruefung (Issue #1334, Plan #1295, E15): eigener Job NEBEN den Code-Jobs, nach dem
  # Muster von `bezug` und `abbilder`. Ein Befund soll an eigener Stelle rot werden und keinen
  # Code-Job faerben; einen Zeitplan braucht es nicht, weil die woechentlichen Aktualisierungs-PRs
  # die Pruefung ohnehin regelmaessig fahren. Trivy findet nur, das Urteil faellt
  # scripts/sicherheitspruefung.mjs (Issue #1333) und landet in der Zusammenfassung des Laufs.
  # Die eigenen Abbilder baut der Job selbst aus dem Commit (E13): Eine Uebergabe aus `abbilder`
  # koppelte beide Jobs. Die Backend-Abhaengigkeiten kommen als CycloneDX-Stueckliste (E5, E6).
  sicherheit:
    name: Sicherheit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stueckliste der Backend-Abhaengigkeiten
        run: mvn -B -Psbom -Dskip.frontend=true cyclonedx:makeBom
      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4.4.1
      - name: Anwendungs-Abbild bauen
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: kanban-kit:pruefung
      - name: Sicherungs-Abbild bauen
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backup
          file: ./backup/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: kanban-kit-backup:pruefung
      - name: Trivy bereitstellen
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      # Tagesschluessel: Die Datenbank-Registry drosselt Abrufe, ein Neuladen je Lauf liesse den Job
      # sporadisch rot werden. Ein gerissener Abruf bleibt im Treiber ein benannter Befund.
      - name: Datum fuer den Datenbank-Cache
        id: datum
        run: echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Trivy-Datenbank zwischenspeichern
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.datum.outputs.tag }}
          restore-keys: trivy-db-
      - name: Sicherheitspruefung
        run: >
          node scripts/sicherheitspruefung.mjs
          --abbild kanban-kit:pruefung
          --abbild kanban-kit-backup:pruefung
          --sbom target/bom.json
