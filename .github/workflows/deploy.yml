name: Deploy

# Automatisches Deployment auf den Hostinger-VPS bei jedem Push auf `production`
# (Ergebnis von `merge production` + Merge des Release-PRs).
#
# SICHERHEIT: bewusst NUR `push` auf `production`, NIEMALS `pull_request`. Ein self-hosted Runner
# an einem öffentlichen Repo ist eine scharfe Kante (fremder Fork-Code könnte sonst auf dem VPS
# laufen). Ein Push auf `production` kann nur, wer Schreibrechte hat; ein Fork-PR löst nichts aus.
# Zusätzlich in den Repo-Actions-Settings Fork-Runs auf „Approval" stellen. Siehe deployment-spec.md.
on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # Variante B: kein actions/checkout — wir arbeiten im bestehenden Server-Verzeichnis, das die
      # .env und beide Compose-Files (mit relativen Pfaden) enthält. `reset --hard` macht den Stand
      # deterministisch gleich origin/production; die gitignorete .env bleibt unberührt.
      - name: Pull production und Container neu bauen
        run: |
          cd /root/opt/kanban-kit
          git fetch origin production
          git reset --hard origin/production
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

      # `up -d --build` ist grün, sobald die Container laufen — auch wenn die Anwendung
      # danach beim Hochfahren scheitert (Flyway, fehlende Umgebungsvariable). Erst dieser
      # Schritt macht den Job vom wirklichen Zustand abhängig: Geprüft wird über die
      # öffentliche Adresse, also der Weg, den auch Nutzer nehmen (Traefik, TLS, Anwendung).
      # Das eigene `cd` ist nötig, weil jeder `run:`-Block eine eigene Shell bekommt.
      - name: Auf Bereitschaft der Anwendung warten
        run: |
          cd /root/opt/kanban-kit
          scripts/warte-auf-bereitschaft.sh https://kanban.mwolff.org/login 180

      # Nur bei Fehlschlag: Zustand und Log ins Job-Protokoll, damit der Grund ohne SSH
      # auf den Server zu sehen ist.
      - name: Diagnose bei Fehlschlag
        if: failure()
        run: |
          cd /root/opt/kanban-kit
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 100 manban-api
