# Veroeffentlichung der eigenen Abbilder (Issue #1267, Plan #1262, fachliche Quelle #675).
#
# Warum der Ausloeser der Tag ist und nicht ein Push: Der annotated Tag `vX.Y.Z` wird genau einmal
# je Release gesetzt (siehe RELEASING.md, `merge production`) — er ist der einzige Punkt, an dem
# eine Version endgueltig ist. An ci.yml angehaengt liefe der Bau bei jedem Push und jedem Pull
# Request; an deploy.yml haengt er am self-hosted Runner und am Branch `production`, und die
# Registry-Umstellung des eigenen Deployments ist ausdruecklich Nicht-Ziel.
#
# Der Nachweisschritt am Ende ist der Beleg fuer die Zusage "ohne Registry-Anmeldung abrufbar":
# scripts/bezugspruefung.mjs --eigen fragt beide Abbilder anonym auf HTTP-Ebene ab. Schlaegt er
# fehl, steht ein ghcr-Paket typischerweise noch auf "Private" — der einmalige Handgriff dazu steht
# in RELEASING.md.
#
# Welle 2 (Issue #1337, Plan #1295, E19, E20): Jedes Abbild bekommt eine CycloneDX-Stueckliste, per
# GitHub Artifact Attestation (`actions/attest-sbom`) an den Digest des Bau-Schritts gebunden und in
# die Registry geschrieben. Die Anwendung beschreibt die Stueckliste aus dem Maven-Profil `sbom`
# (E5, E6), das Sicherungs-Abbild — ohne Maven-Projekt — eine Trivy-Stueckliste des gebauten
# Abbilds. Pruefen: `gh attestation verify oci://<abbild>:<fassung> --repo mannewolff/kanban-kit
# --predicate-type https://cyclonedx.org/bom` (docs/betrieb.md). Zusaetzlich liegt die Stueckliste
# als Workflow-Artefakt `stueckliste-<abbild>` bereit; ans Release haengt sie scripts/gh-release.mjs,
# denn das Release legt Manne erst nach dem Tag an, und Schreibrecht auf den Repository-Inhalt braucht
# der Workflow so nicht. Die neuen Rechte `id-token` und `attestations` traegt nur der Job `abbilder`.
#
# Alle Actions sind auf eine volle Version gebunden. In einem Workflow, dessen Zweck
# Versionsbindung ist, waere ein gleitendes `@v7` ein Widerspruch in sich.
name: Release-Abbilder

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  abbilder:
    # Ein Job je Abbild: Anwendung aus dem Dockerfile der Repo-Wurzel, Sicherungsdienst aus
    # backup/Dockerfile. Dieselben Schritte auf zwei Datenzeilen statt zweimal derselbe Block.
    name: ${{ matrix.name }} (amd64/arm64)
    runs-on: ubuntu-latest
    # Job-Rechte ersetzen die Top-Level-Rechte vollstaendig, darum stehen beide hier noch einmal.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Anwendungs-Abbild
            abbild: ghcr.io/mannewolff/kanban-kit
            kurzname: kanban-kit
            stueckliste: maven
            kontext: .
            datei: ./Dockerfile
          - name: Sicherungs-Abbild
            abbild: ghcr.io/mannewolff/kanban-kit-backup
            kurzname: kanban-kit-backup
            stueckliste: trivy
            kontext: ./backup
            datei: ./backup/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1

      # Der Tag heisst `vX.Y.Z`, der Abbild-Tag `X.Y.Z`. Ausdruecke in GitHub Actions koennen kein
      # Praefix abschneiden, darum dieser eine Schritt statt einer Zeile in `tags:`.
      - name: Version aus dem Tag lesen
        id: version
        run: echo "wert=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v4.4.0
      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4.4.1
      - name: An ghcr.io anmelden
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und veroeffentlichen
        id: bau
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.kontext }}
          file: ${{ matrix.datei }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.abbild }}:${{ steps.version.outputs.wert }}
            ${{ matrix.abbild }}:latest

      # Stueckliste des Anwendungs-Abbilds: dieselbe Profil-Stueckliste, die der CI-Job `sicherheit`
      # prueft (nur Scopes compile und runtime, E6).
      - name: JDK 25 einrichten
        if: matrix.stueckliste == 'maven'
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Stueckliste aus dem Profil sbom
        if: matrix.stueckliste == 'maven'
        run: |
          mvn -B -Psbom -Dskip.frontend=true cyclonedx:makeBom
          cp target/bom.json "stueckliste-${{ matrix.kurzname }}.cdx.json"

      # Stueckliste des Sicherungs-Abbilds: Trivy liest das veroeffentlichte Abbild genau ueber den
      # Digest, den die Attestation bindet. Trivy gepinnt wie im CI-Job `sicherheit`.
      - name: Trivy bereitstellen
        if: matrix.stueckliste == 'trivy'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - name: Stueckliste des Abbilds ueber Trivy
        if: matrix.stueckliste == 'trivy'
        run: >
          trivy image --format cyclonedx
          --output "stueckliste-${{ matrix.kurzname }}.cdx.json"
          "${{ matrix.abbild }}@${{ steps.bau.outputs.digest }}"

      - name: Stueckliste an den Digest binden
        uses: actions/attest-sbom@v4.1.0
        with:
          subject-name: ${{ matrix.abbild }}
          subject-digest: ${{ steps.bau.outputs.digest }}
          sbom-path: stueckliste-${{ matrix.kurzname }}.cdx.json
          push-to-registry: true
      - name: Stueckliste fuer das Release ablegen
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stueckliste-${{ matrix.kurzname }}
          path: stueckliste-${{ matrix.kurzname }}.cdx.json
          if-no-files-found: error

  nachweis:
    # Erst nach beiden Abbildern: Die Pruefart `eigen` fragt genau die Bezugsstellen ab, die dieser
    # Lauf gerade angelegt hat. Ein roter Schritt hier heisst, dass ein Abbild nicht anonym
    # beziehbar ist — nicht, dass der Bau fehlschlug.
    name: Anonym beziehbar (bezugspruefung --eigen)
    needs: [abbilder]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Node 22 einrichten
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Eigene Abbilder anonym abrufen
        run: node scripts/bezugspruefung.mjs --eigen
